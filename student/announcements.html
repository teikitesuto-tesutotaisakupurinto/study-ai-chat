<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>お知らせ | 学習AIチャット</title>

<link rel="stylesheet" href="../assets/css/common.css">
<link rel="stylesheet" href="../assets/css/student.css">

</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="sidebar-header">
<strong>学習AIチャット</strong>
</div>

<nav>

<a class="nav-link" href="index.html">ホーム</a>
<a class="nav-link" href="question.html">AI学習チャット</a>
<a class="nav-link" href="history.html">学習履歴</a>
<a class="nav-link" href="announcements.html">お知らせ</a>
<a class="nav-link" href="settings.html">設定</a>

</nav>

<button class="logout-button" data-logout>
ログアウト
</button>

</aside>

<main class="main-content">

<header class="topbar">
<button class="sidebar-toggle">☰</button>
<div>
<strong>お知らせ</strong>
<small>学習AIチャット</small>
</div>
</header>

<section class="page">

<h1>お知らせ</h1>

<div id="announcement-list">
読み込み中...
</div>

</section>

</main>

</div>

<script type="module">

import {
  auth,
  db,
  collection,
  query,
  where,
  orderBy,
  limit,
  getDocs,
  signOut
} from "../assets/js/firebase.js";

import { protectPage }
from "../assets/js/auth.js";

import {
  setupSidebar,
  setupLogout
} from "../assets/js/layout.js";

setupSidebar();
setupLogout(auth, signOut);

await protectPage("student");

const list =
  document.getElementById("announcement-list");

try {

  const q =
    query(
      collection(
        db,
        "announcements"
      ),
      where(
        "visible",
        "==",
        true
      ),
      orderBy(
        "publishedAt",
        "desc"
      ),
      limit(30)
    );

  const snap =
    await getDocs(q);

  list.innerHTML = "";

  if (snap.empty) {

    list.textContent =
      "現在、お知らせはありません。";

  } else {

    snap.forEach((item) => {

      const data =
        item.data();

      const article =
        document.createElement("article");

      article.className =
        "announcement-card";

      article.innerHTML = `
        <h2></h2>
        <p></p>
      `;

      article.querySelector("h2")
        .textContent = data.title || "";

      article.querySelector("p")
        .textContent = data.body || "";

      list.appendChild(article);

    });

  }

} catch (error) {

  console.error(error);

  list.textContent =
    "お知らせを取得できませんでした。";

}

</script>

</body>
</html>
