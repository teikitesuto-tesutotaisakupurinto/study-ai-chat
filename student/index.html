<script type="module">
  import {
    auth,
    db,
    doc,
    getDoc,
    collection,
    query,
    where,
    orderBy,
    limit,
    getDocs,
    signOut
  } from "../assets/js/firebase-module.js";

  import { protectPage } from "../assets/js/auth.js";
  import {
    setupSidebar,
    setupLogout
  } from "../assets/js/layout.js";

  const $ = selector =>
    document.querySelector(selector);

  function formatDate(value) {
    if (!value) {
      return "日時未設定";
    }

    const date =
      typeof value?.toDate === "function"
        ? value.toDate()
        : new Date(value);

    if (Number.isNaN(date.getTime())) {
      return "日時未設定";
    }

    return new Intl.DateTimeFormat("ja-JP", {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }).format(date);
  }

  function showHistoryError(message) {
    const error =
      $("#history-error");

    if (!error) {
      return;
    }

    error.textContent =
      message;

    error.hidden = false;
  }

  async function loadRecentConversations(uid) {
    const container =
      $("#recent-history");

    if (!container) {
      return;
    }

    container.replaceChildren();

    try {
      /*
       * Firestoreの複合インデックスがない場合でも、
       * ホーム全体をエラーにしない。
       *
       * まず userId だけで取得し、
       * JavaScript側で updatedAt 順に並べる。
       */

      const historyQuery =
        query(
          collection(
            db,
            "chatHistories"
          ),
          where(
            "userId",
            "==",
            uid
          ),
          limit(30)
        );

      const snapshot =
        await getDocs(
          historyQuery
        );

      if (snapshot.empty) {
        container.textContent =
          "まだ会話履歴はありません。";

        return;
      }

      const conversations =
        snapshot.docs
          .map(docSnapshot => ({
            id:
              docSnapshot.id,

            data:
              docSnapshot.data()
          }))
          .sort((a, b) => {
            const aTime =
              a.data.updatedAt
                ?.toMillis?.() || 0;

            const bTime =
              b.data.updatedAt
                ?.toMillis?.() || 0;

            return bTime - aTime;
          })
          .slice(0, 10);

      for (
        const item of conversations
      ) {
        const data =
          item.data;

        const link =
          document.createElement(
            "a"
          );

        link.className =
          "history-item";

        link.href =
          `question.html?conversationId=${encodeURIComponent(
            item.id
          )}`;

        const title =
          document.createElement(
            "div"
          );

        title.className =
          "history-title";

        title.textContent =
          data.title ||
          data.lastQuestion ||
          "新しい会話";

        const date =
          document.createElement(
            "div"
          );

        date.className =
          "history-date";

        date.textContent =
          `最終更新：${formatDate(
            data.updatedAt
          )}`;

        link.append(
          title,
          date
        );

        container.append(
          link
        );
      }

    } catch (error) {
      console.error(
        "会話履歴の取得に失敗しました:",
        error
      );

      container.textContent =
        "履歴を読み込めませんでした。";

      showHistoryError(
        `${error?.code || "error"}: ${
          error?.message ||
          String(error)
        }`
      );
    }
  }

  async function initialize() {
    try {
      /*
       * =====================================================
       * ① Firebase認証
       * =====================================================
       */

      const result =
        await protectPage(
          "student"
        );

      if (
        !result ||
        !result.user
      ) {
        return;
      }

      const user =
        result.user;

      /*
       * =====================================================
       * ② 認証成功した瞬間にサイドバーを表示
       *
       * 履歴取得より先。
       * 履歴取得失敗でもサイドバーは消えない。
       * =====================================================
       */

      try {
        setupSidebar();
      } catch (sidebarError) {
        console.error(
          "サイドバー初期化エラー:",
          sidebarError
        );
      }

      /*
       * ログアウトも認証成功直後に設定
       */

      try {
        setupLogout(
          auth,
          signOut
        );
      } catch (logoutError) {
        console.error(
          "ログアウト初期化エラー:",
          logoutError
        );
      }

      /*
       * =====================================================
       * ③ ユーザープロフィール
       * =====================================================
       */

      let profileSnapshot;

      try {
        profileSnapshot =
          await getDoc(
            doc(
              db,
              "users",
              user.uid
            )
          );
      } catch (error) {
        console.error(
          "プロフィール取得エラー:",
          error
        );

        showHistoryError(
          "ユーザー情報を取得できませんでした。"
        );

        return;
      }

      if (
        !profileSnapshot.exists()
      ) {
        await signOut(auth);

        location.replace(
          "../login.html"
        );

        return;
      }

      const profile =
        profileSnapshot.data();

      if (
        profile.status !==
        "active"
      ) {
        await signOut(auth);

        location.replace(
          "../login.html"
        );

        return;
      }

      const displayName =
        profile.displayName ||
        profile.name ||
        user.displayName ||
        "学習者";

      const welcome =
        $("#welcome");

      if (welcome) {
        welcome.textContent =
          `${displayName}さん、学習を始めましょう。`;
      }

      /*
       * =====================================================
       * ④ 履歴
       *
       * ここで失敗してもサイドバーには影響しない。
       * =====================================================
       */

      await loadRecentConversations(
        user.uid
      );

    } catch (error) {
      console.error(
        "ホーム画面の初期化に失敗しました:",
        error
      );

      /*
       * protectPage後に発生したエラーでも、
       * サイドバーだけは再度表示を試みる。
       */

      try {
        setupSidebar();
      } catch (sidebarError) {
        console.error(
          "サイドバー再初期化エラー:",
          sidebarError
        );
      }

      const welcome =
        $("#welcome");

      if (welcome) {
        welcome.textContent =
          "ホーム画面を読み込めませんでした。";
      }

      showHistoryError(
        `${error?.code || "error"}: ${
          error?.message ||
          String(error)
        }`
      );
    }
  }

  initialize();
</script>
