<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">

  <title>ホーム | 学習AIチャット</title>

  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="../assets/css/student.css">

  <style>
    .home-section {
      margin: 24px 0;
    }

    .home-card {
      display: block;
      padding: 22px;
      border: 1px solid #dbe3ef;
      border-radius: 14px;
      background: #fff;
      color: inherit;
      text-decoration: none;
      transition:
        border-color .15s,
        box-shadow .15s;
    }

    .home-card:hover {
      border-color: #2563eb;
      box-shadow: 0 5px 18px rgb(15 23 42 / 8%);
    }

    .home-card h2 {
      margin-top: 0;
    }

    .home-card p {
      margin-bottom: 0;
      color: #475569;
    }

    .history-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .history-item {
      display: block;
      padding: 14px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      color: inherit;
      text-decoration: none;
      overflow-wrap: anywhere;
      background: #fff;
    }

    .history-item:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }

    .history-title {
      font-weight: 600;
      margin-bottom: 5px;
    }

    .history-date {
      font-size: .85rem;
      color: #64748b;
    }

    .home-error {
      color: #b91c1c;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .empty-history {
      padding: 18px;
      color: #64748b;
      background: #f8fafc;
      border-radius: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="app-layout">

    <!--
      ログイン認証後、JavaScriptで必ずここにサイドバーを生成する。
    -->
    <aside
      id="appSidebar"
      class="sidebar"
      aria-label="メインメニュー">
    </aside>

    <main
      id="appMain"
      class="app-main">

      <header class="page-header">
        <h1 class="page-title">学習ホーム</h1>

        <p id="welcome">
          学習を始めましょう。
        </p>
      </header>

      <section class="home-section">

        <a
          class="home-card"
          href="./question.html">

          <h2>AI学習チャット</h2>

          <p>
            中学生向けの学習AIに質問できます。
            過去の会話を続けることもできます。
          </p>

        </a>

      </section>

      <section class="home-section">

        <div class="card">

          <h2>最近の学習</h2>

          <p>
            過去の会話を選択すると、
            その会話の続きから質問できます。
          </p>

          <div
            id="recent-history"
            class="history-list"
            aria-live="polite">

            履歴を読み込んでいます...

          </div>

          <p
            id="history-error"
            class="home-error"
            hidden>
          </p>

        </div>

      </section>

      <footer class="page-footer">
        © 2026 定期テスト対策プリント運営事務局. All Rights Reserved.
      </footer>

    </main>

  </div>


  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


  <!-- Firebase設定 -->
  <script src="../assets/js/firebase.js"></script>


  <script type="module">

    import {
      auth,
      db,
      doc,
      getDoc,
      collection,
      query,
      where,
      getDocs,
      signOut
    } from "../assets/js/firebase-module.js";


    import {
      protectPage
    } from "../assets/js/auth.js";


    import {
      setupSidebar,
      setupLogout
    } from "../assets/js/layout.js";


    const $ = selector =>
      document.querySelector(selector);


    /* =====================================================
       日付表示
       ===================================================== */

    function formatDate(value) {

      if (!value) {
        return "日時未設定";
      }

      let date;

      try {

        if (
          typeof value.toDate === "function"
        ) {

          date = value.toDate();

        } else {

          date = new Date(value);

        }

      } catch {

        return "日時未設定";

      }


      if (
        Number.isNaN(date.getTime())
      ) {

        return "日時未設定";

      }


      return new Intl.DateTimeFormat(
        "ja-JP",
        {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }
      ).format(date);

    }


    /* =====================================================
       エラー表示
       ===================================================== */

    function showHistoryError(
      message
    ) {

      const error =
        $("#history-error");

      error.textContent =
        message;

      error.hidden = false;

    }


    /* =====================================================
       最近の会話
       
       重要：
       where + orderBy を使わない。
       
       これにより
       「The query requires an index」
       を回避する。
       ===================================================== */

    async function loadRecentConversations(
      uid
    ) {

      const container =
        $("#recent-history");


      container.replaceChildren();


      try {

        const historyQuery =
          query(
            collection(
              db,
              "chatHistories"
            ),

            where(
              "userId",
              "==",
              uid
            )
          );


        const snapshot =
          await getDocs(
            historyQuery
          );


        if (
          snapshot.empty
        ) {

          const empty =
            document.createElement(
              "div"
            );

          empty.className =
            "empty-history";

          empty.textContent =
            "まだ会話履歴はありません。";

          container.append(
            empty
          );

          return;

        }


        /*
          FirestoreのorderByを使わず、
          JavaScript側で更新日時順に並べる。
        */

        const conversations =
          snapshot.docs
            .map(docSnapshot => ({
              id:
                docSnapshot.id,

              data:
                docSnapshot.data()
            }))


            .sort(
              (a, b) => {

                const aTime =
                  getTimestamp(
                    a.data.updatedAt
                  );

                const bTime =
                  getTimestamp(
                    b.data.updatedAt
                  );

                return bTime - aTime;

              }
            )


            .slice(
              0,
              10
            );


        for (
          const item of conversations
        ) {

          const data =
            item.data;


          const link =
            document.createElement(
              "a"
            );


          link.className =
            "history-item";


          link.href =
            `./question.html?conversationId=${encodeURIComponent(
              item.id
            )}`;


          const title =
            document.createElement(
              "div"
            );


          title.className =
            "history-title";


          title.textContent =
            data.title ||
            data.lastQuestion ||
            "新しい会話";


          const date =
            document.createElement(
              "div"
            );


          date.className =
            "history-date";


          date.textContent =
            `最終更新：${formatDate(
              data.updatedAt
            )}`;


          link.append(
            title,
            date
          );


          container.append(
            link
          );

        }


      } catch (error) {

        console.error(
          "会話履歴の取得に失敗しました:",
          error
        );


        container.textContent =
          "履歴を読み込めませんでした。";


        showHistoryError(
          `${error?.code || "error"}: ${
            error?.message ||
            String(error)
          }`
        );

      }

    }


    /* =====================================================
       Firestore Timestamp → number
       ===================================================== */

    function getTimestamp(
      value
    ) {

      if (!value) {
        return 0;
      }


      try {

        if (
          typeof value.toMillis ===
          "function"
        ) {

          return value.toMillis();

        }


        if (
          typeof value.toDate ===
          "function"
        ) {

          return value
            .toDate()
            .getTime();

        }


        const time =
          new Date(value)
            .getTime();


        return Number.isNaN(time)
          ? 0
          : time;


      } catch {

        return 0;

      }

    }


    /* =====================================================
       初期化
       ===================================================== */

    async function initialize() {

      try {

        /*
          ==================================================
          ① 最初に認証・権限を確認
          ==================================================
        */

        const result =
          await protectPage(
            "student"
          );


        if (
          !result ||
          !result.user
        ) {

          return;

        }


        /*
          ==================================================
          ② ログイン確認後、即サイドバー表示
          
          Firestore履歴取得より先に実行する。
          
          これが重要。
          ==================================================
        */

        setupSidebar();


        /*
          ==================================================
          ③ ログアウト処理
          ==================================================
        */

        setupLogout(
          auth,
          signOut
        );


        /*
          ==================================================
          ④ ユーザー情報
          ==================================================
        */

        const user =
          result.user;


        /*
          ==================================================
          ⑤ users/{uid}
          ==================================================
        */

        const profileSnapshot =
          await getDoc(
            doc(
              db,
              "users",
              user.uid
            )
          );


        if (
          !profileSnapshot.exists()
        ) {

          throw new Error(
            "利用者プロフィールが見つかりません。"
          );

        }


        const profile =
          profileSnapshot.data();


        /*
          ==================================================
          ⑥ status確認
          ==================================================
        */

        if (
          profile.status !==
          "active"
        ) {

          await signOut(
            auth
          );


          location.replace(
            "../login.html"
          );


          return;

        }


        /*
          ==================================================
          ⑦ 表示名
          ==================================================
        */

        const displayName =
          profile.displayName ||
          profile.name ||
          user.displayName ||
          "学習者";


        $("#welcome").textContent =
          `${displayName}さん、学習を始めましょう。`;


        /*
          ==================================================
          ⑧ 最近の会話
          ==================================================
        */

        await loadRecentConversations(
          user.uid
        );


      } catch (error) {

        console.error(
          "ホーム画面の初期化に失敗しました:",
          error
        );


        /*
          サイドバーは先に表示しているので、
          履歴取得失敗時でも画面全体を消さない。
        */

        $("#welcome").textContent =
          "ホーム画面を読み込めませんでした。";


        showHistoryError(
          `${error?.code || "error"}: ${
            error?.message ||
            String(error)
          }`
        );

      }

    }


    /*
      実行
    */

    initialize();

  </script>

</body>
</html>
