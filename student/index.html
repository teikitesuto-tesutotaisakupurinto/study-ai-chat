<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#f4f7fb"
  >

  <title>学習ホーム | 学習AIチャット</title>

  <link
    rel="stylesheet"
    href="../assets/css/common.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/student.css"
  >

  <!-- サイドバー専用CSS -->
  <link
    rel="stylesheet"
    href="../assets/css/sidebar.css"
  >
</head>

<body>

  <!--
    サイドバーはJavaScriptで生成。
    Firebaseとは完全独立。
  -->

  <script
    src="../assets/js/sidebar.js"
  ></script>

  <main id="appMain">

    <header class="page-header">
      <h1 class="page-title">
        学習ホーム
      </h1>

      <p id="welcome">
        学習を始めましょう。
      </p>
    </header>

    <section class="home-section">

      <a
        class="home-card"
        href="question.html"
      >

        <h2>
          AI学習チャット
        </h2>

        <p>
          中学生向けの学習AIに質問できます。
        </p>

      </a>

    </section>

    <section class="home-section">

      <div class="card">

        <h2>
          最近の学習
        </h2>

        <p>
          過去の会話を選択すると、
          その会話の続きから質問できます。
        </p>

        <div
          id="recent-history"
          class="history-list"
        >
          履歴を読み込んでいます...
        </div>

        <p
          id="history-error"
          class="home-error"
          hidden
        ></p>

      </div>

    </section>

    <footer class="page-footer">
      © 2026 定期テスト対策プリント運営事務局. All Rights Reserved.
    </footer>

  </main>

  <!-- Firebase -->
  <script type="module">
    /*
      ここから下はFirebase関連。

      サイドバーとは完全に別処理。
    */

    import {
      auth,
      db,
      doc,
      getDoc,
      collection,
      query,
      where,
      orderBy,
      limit,
      getDocs
    } from "../assets/js/firebase-module.js";

    import {
      protectPage
    } from "../assets/js/auth.js";

    const $ =
      selector =>
        document.querySelector(
          selector
        );

    function formatDate(value) {

      if (!value) {
        return "日時未設定";
      }

      const date =
        typeof value.toDate ===
        "function"
          ? value.toDate()
          : new Date(value);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return "日時未設定";
      }

      return new Intl.DateTimeFormat(
        "ja-JP",
        {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }
      ).format(date);
    }

    async function loadRecentConversations(
      uid
    ) {

      const container =
        $("#recent-history");

      try {

        const historyQuery =
          query(
            collection(
              db,
              "chatHistories"
            ),

            where(
              "userId",
              "==",
              uid
            ),

            orderBy(
              "updatedAt",
              "desc"
            ),

            limit(10)
          );

        const snapshot =
          await getDocs(
            historyQuery
          );

        container.replaceChildren();

        if (
          snapshot.empty
        ) {

          container.textContent =
            "まだ会話履歴はありません。";

          return;
        }

        for (
          const item of
          snapshot.docs
        ) {

          const data =
            item.data();

          const link =
            document.createElement(
              "a"
            );

          link.className =
            "history-item";

          link.href =
            `question.html?conversationId=${encodeURIComponent(item.id)}`;

          const title =
            document.createElement(
              "div"
            );

          title.className =
            "history-title";

          title.textContent =
            data.title ||
            data.lastQuestion ||
            "新しい会話";

          const date =
            document.createElement(
              "div"
            );

          date.className =
            "history-date";

          date.textContent =
            `最終更新：${formatDate(
              data.updatedAt
            )}`;

          link.append(
            title,
            date
          );

          container.appendChild(
            link
          );
        }

      } catch (error) {

        console.error(
          "履歴取得エラー:",
          error
        );

        container.textContent =
          "履歴を読み込めませんでした。";

        const errorBox =
          $("#history-error");

        errorBox.textContent =
          `${error?.code || "error"}: ${
            error?.message ||
            String(error)
          }`;

        errorBox.hidden =
          false;
      }
    }

    async function initialize() {

      try {

        const result =
          await protectPage(
            "student"
          );

        if (
          !result ||
          !result.user
        ) {
          return;
        }

        const user =
          result.user;

        const profile =
          await getDoc(
            doc(
              db,
              "users",
              user.uid
            )
          );

        if (
          !profile.exists()
        ) {
          throw new Error(
            "利用者プロフィールが見つかりません。"
          );
        }

        const data =
          profile.data();

        const displayName =
          data.displayName ||
          data.name ||
          user.displayName ||
          "学習者";

        $("#welcome").textContent =
          `${displayName}さん、学習を始めましょう。`;

        /*
          ここでFirestoreエラーが起きても
          サイドバーには影響しない。
        */

        await loadRecentConversations(
          user.uid
        );

      } catch (error) {

        console.error(
          "ホーム初期化エラー:",
          error
        );

        $("#welcome").textContent =
          "ホーム画面を読み込めませんでした。";

      }
    }

    initialize();

  </script>

</body>
</html>
