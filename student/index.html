<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#f4f7fb"
  >

  <title>学習ホーム | 学習AIチャット</title>

  <link
    rel="stylesheet"
    href="../assets/css/common.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/student.css"
  >

  <style>

    .home-section {
      margin: 24px 0;
    }

    .home-card {
      display: block;
      padding: 24px;

      border: 1px solid #dbe3ef;
      border-radius: 14px;

      background: #fff;
      color: inherit;

      text-decoration: none;

      transition:
        border-color .15s,
        box-shadow .15s,
        transform .15s;
    }

    .home-card:hover {
      border-color: #2563eb;
      box-shadow:
        0 8px 24px
        rgb(15 23 42 / 8%);

      transform: translateY(-1px);
    }

    .home-card h2 {
      margin-top: 0;
    }

    .home-card p {
      margin-bottom: 0;
      color: #475569;
      line-height: 1.8;
    }

    .history-list {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .history-item {
      display: block;

      padding: 15px 16px;

      border: 1px solid #e2e8f0;
      border-radius: 10px;

      color: inherit;
      text-decoration: none;

      overflow-wrap: anywhere;

      transition:
        background .15s,
        border-color .15s;
    }

    .history-item:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }

    .history-title {
      font-weight: 700;
      margin-bottom: 5px;
    }

    .history-date {
      color: #64748b;
      font-size: .85rem;
    }

    .home-error {
      color: #b91c1c;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

  </style>
</head>

<body>

  <div class="app-layout">

    <!-- サイドバー専用コンテナ -->
    <div id="appSidebar"></div>

    <main
      id="appMain"
      class="app-main"
    >

      <header class="page-header">

        <h1 class="page-title">
          学習ホーム
        </h1>

        <p id="welcome">
          学習を始めましょう。
        </p>

      </header>

      <section class="home-section">

        <a
          class="home-card"
          href="question.html"
        >

          <h2>
            AI学習チャット
          </h2>

          <p>
            中学生向けの学習AIに質問できます。
            過去の会話を続けることもできます。
          </p>

        </a>

      </section>

      <section
        id="history"
        class="home-section"
      >

        <div class="card">

          <h2>
            最近の学習
          </h2>

          <p>
            過去の会話を選択すると、
            その会話の続きから質問できます。
          </p>

          <div
            id="recent-history"
            class="history-list"
          >
            履歴を読み込んでいます...
          </div>

          <p
            id="history-error"
            class="home-error"
            hidden
          ></p>

        </div>

      </section>

      <footer class="page-footer">
        © 2026 定期テスト対策プリント運営事務局.
        All Rights Reserved.
      </footer>

    </main>

  </div>

  <!-- Firebase -->
  <script
    type="module"
    src="../assets/js/firebase.js"
  ></script>

  <!-- 認証 -->
  <script
    type="module"
    src="../assets/js/auth.js"
  ></script>

  <!-- サイドバー -->
  <script
    src="../assets/js/sidebar.js"
  ></script>

</body>
</html>
