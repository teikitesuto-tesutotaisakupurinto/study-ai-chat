<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#f4f7fb"
  >

  <title>ホーム | 学習AIチャット</title>

  <link
    rel="stylesheet"
    href="../assets/css/common.css"
  >

  <style>
    .home-container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .welcome-card {
      padding: 28px;
      border-radius: 16px;
      background:
        linear-gradient(
          135deg,
          #2563eb,
          #3b82f6
        );
      color: #fff;
      box-shadow:
        0 8px 24px
        rgba(37,99,235,.16);
    }

    .welcome-card h2 {
      margin: 0;
      font-size: 25px;
    }

    .welcome-card p {
      margin: 9px 0 0;
      opacity: .9;
      line-height: 1.7;
    }

    .question-card {
      display: block;
      margin-top: 18px;
      padding: 22px;

      border: 1px solid #dbe4f1;
      border-radius: 14px;

      background: #fff;
      text-decoration: none;

      transition:
        transform .15s ease,
        box-shadow .15s ease,
        border-color .15s ease;
    }

    .question-card:hover {
      transform: translateY(-2px);
      border-color: #8fb5f5;
      box-shadow:
        0 8px 22px
        rgba(15,23,42,.07);
    }

    .question-card h2 {
      margin: 0;
      font-size: 18px;
    }

    .question-card p {
      margin: 8px 0 0;
      color: #64748b;
      line-height: 1.7;
    }

    .section {
      margin-top: 30px;
    }

    .section h2 {
      margin: 0 0 5px;
      font-size: 20px;
    }

    .section-description {
      margin: 0 0 15px;
      color: #64748b;
      font-size: 13px;
    }

    .history-list {
      display: grid;
      gap: 10px;
    }

    .history-item {
      display: block;
      padding: 16px;

      border: 1px solid #e1e7ef;
      border-radius: 11px;

      background: #fff;
      text-decoration: none;
    }

    .history-item:hover {
      border-color: #a7bde0;
      background: #fafcff;
    }

    .history-title {
      font-weight: 700;
      line-height: 1.5;
    }

    .history-date {
      margin-top: 5px;
      color: #7b8798;
      font-size: 12px;
    }

    .empty {
      padding: 25px;
      border: 1px dashed #ccd5e2;
      border-radius: 12px;
      color: #718096;
      background: #fff;
      text-align: center;
      font-size: 14px;
    }

    .error {
      padding: 14px;
      border-radius: 9px;
      background: #fff2f2;
      color: #b42318;
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

<div class="app-layout">

  <aside
    id="appSidebar"
    aria-label="メインメニュー"
  ></aside>

  <main class="app-main">

    <div class="home-container">

      <header class="page-header">
        <h1 class="page-title">
          学習ホーム
        </h1>

        <p id="welcome">
          学習を始めましょう。
        </p>
      </header>

      <section
        class="welcome-card"
      >
        <h2>
          <span id="welcomeName">
            学習者
          </span>
          さん、今日も勉強しよう
        </h2>

        <p>
          分からない問題や、授業で気になったことをAIに質問できます。
        </p>
      </section>

      <a
        class="question-card"
        href="./question.html"
      >
        <h2>
          AIに質問する
        </h2>

        <p>
          数学・英語・国語・理科・社会などの学習について質問できます。
        </p>
      </a>

      <section class="section">

        <h2>
          最近の学習
        </h2>

        <p class="section-description">
          過去の会話を選択すると、その会話の続きから質問できます。
        </p>

        <div
          id="recent-history"
          class="history-list"
        >
          <div class="empty">
            履歴を読み込んでいます...
          </div>
        </div>

        <div
          id="history-error"
          class="error"
          hidden
        ></div>

      </section>

      <footer class="page-footer">
        © 2026 定期テスト対策プリント運営事務局. All Rights Reserved.
      </footer>

    </div>

  </main>

</div>

<script type="module">

import {
  auth,
  db,
  collection,
  getDocs,
  query,
  where,
  signOut
} from "../assets/js/firebase-module.js";

import {
  protectPage
} from "../assets/js/auth.js";

import {
  setupSidebar,
  setupLogout
} from "../assets/js/layout.js";

const $ = id =>
  document.getElementById(id);

function formatDate(value) {

  if (!value) {
    return "日時未設定";
  }

  let date;

  if (
    typeof value.toDate ===
    "function"
  ) {
    date = value.toDate();
  } else {
    date = new Date(value);
  }

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return "日時未設定";
  }

  return new Intl.DateTimeFormat(
    "ja-JP",
    {
      year: "numeric",
      month: "numeric",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }
  ).format(date);
}

async function loadRecentConversations(
  uid
) {

  const container =
    $("recent-history");

  const errorBox =
    $("history-error");

  container.replaceChildren();

  errorBox.hidden = true;

  try {

    /*
      composite indexを要求する
      orderByは使用しない。

      本人のデータだけ取得し、
      JavaScript側で並び替える。
    */

    const q =
      query(
        collection(
          db,
          "chatHistories"
        ),
        where(
          "userId",
          "==",
          uid
        )
      );

    const snapshot =
      await getDocs(q);

    if (snapshot.empty) {

      const empty =
        document.createElement("div");

      empty.className =
        "empty";

      empty.textContent =
        "まだ学習履歴はありません。";

      container.append(
        empty
      );

      return;
    }

    const items =
      snapshot.docs
        .map(doc => ({
          id: doc.id,
          ...doc.data()
        }))
        .sort((a, b) => {

          const aTime =
            a.updatedAt?.toMillis
              ? a.updatedAt.toMillis()
              : new Date(
                  a.updatedAt || 0
                ).getTime();

          const bTime =
            b.updatedAt?.toMillis
              ? b.updatedAt.toMillis()
              : new Date(
                  b.updatedAt || 0
                ).getTime();

          return bTime - aTime;
        })
        .slice(0, 10);

    for (
      const item of items
    ) {

      const link =
        document.createElement("a");

      link.className =
        "history-item";

      link.href =
        `./question.html?conversationId=${
          encodeURIComponent(item.id)
        }`;

      const title =
        document.createElement("div");

      title.className =
        "history-title";

      title.textContent =
        item.title ||
        item.lastQuestion ||
        "新しい会話";

      const date =
        document.createElement("div");

      date.className =
        "history-date";

      date.textContent =
        `最終更新：${
          formatDate(
            item.updatedAt
          )
        }`;

      link.append(
        title,
        date
      );

      container.append(
        link
      );
    }

  } catch (error) {

    console.error(
      "履歴取得エラー:",
      error
    );

    container.replaceChildren();

    const errorText =
      document.createElement("div");

    errorText.className =
      "error";

    errorText.textContent =
      "履歴を読み込めませんでした。";

    container.append(
      errorText
    );

    errorBox.textContent =
      `${error.code || "error"}: ${
        error.message ||
        String(error)
      }`;

    errorBox.hidden = false;
  }
}

async function initialize() {

  try {

    const result =
      await protectPage(
        "student"
      );

    if (!result) {
      return;
    }

    /*
      認証成功後に必ずサイドバーを生成
    */

    setupSidebar();

    setupLogout(
      auth,
      signOut
    );

    const user =
      result.user;

    const profile =
      result.profile;

    const name =
      profile.displayName ||
      profile.name ||
      user.displayName ||
      "学習者";

    $("welcome").textContent =
      `${name}さん、学習を始めましょう。`;

    $("welcomeName").textContent =
      name;

    await loadRecentConversations(
      user.uid
    );

  } catch (error) {

    console.error(
      "ホーム初期化エラー:",
      error
    );

    $("welcome").textContent =
      "ホーム画面を読み込めませんでした。";

    const errorBox =
      $("history-error");

    errorBox.textContent =
      `${error.code || "error"}: ${
        error.message ||
        String(error)
      }`;

    errorBox.hidden = false;
  }
}

initialize();

</script>

</body>
</html>
