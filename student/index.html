<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>TestLink - 生徒</title>

<link
    rel="stylesheet"
    href="../assets/css/style.css"
>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;

    background:#f4f6fb;

    color:#202938;

    font-family:
        Arial,
        "Noto Sans JP",
        sans-serif;
}

.layout{
    min-height:100vh;

    display:flex;
}

.sidebar{
    width:250px;

    flex-shrink:0;

    background:#ffffff;

    border-right:1px solid #e1e6ef;

    padding:22px;
}

.logo{
    font-size:20px;

    font-weight:800;

    color:#2857d9;

    margin-bottom:25px;
}

.user-area{
    padding:14px;

    background:#f4f6fb;

    border-radius:10px;

    margin-bottom:20px;

    font-size:14px;

    line-height:1.6;
}

.nav{
    display:flex;

    flex-direction:column;

    gap:7px;
}

.nav button{
    width:100%;

    padding:11px 12px;

    border:0;

    border-radius:8px;

    background:#ffffff;

    color:#344054;

    text-align:left;

    font:inherit;

    cursor:pointer;
}

.nav button:hover{
    background:#eef4ff;
}

.nav button.active{
    background:#2857d9;

    color:#ffffff;
}

.logout-button{
    margin-top:20px;

    border-top:1px solid #e1e6ef !important;

    padding-top:18px !important;

    color:#b42318 !important;
}

.content{
    flex:1;

    padding:35px;

    min-width:0;
}

.content-section{
    display:none;
}

.content-section.active{
    display:block;
}

.page-title{
    margin-top:0;

    font-size:28px;
}

.card{
    background:#ffffff;

    border:1px solid #e1e6ef;

    border-radius:12px;

    padding:22px;

    margin-bottom:18px;
}

.notice{
    padding:15px;

    border:1px solid #e1e6ef;

    border-radius:9px;

    margin-bottom:10px;
}

.loading{
    color:#667085;
}

.error{
    padding:15px;

    background:#fff0f0;

    color:#a11b1b;

    border-radius:9px;
}

@media(max-width:800px){

    .layout{
        display:block;
    }

    .sidebar{
        width:100%;

        border-right:0;

        border-bottom:1px solid #e1e6ef;
    }

    .content{
        padding:22px;
    }

}

</style>

</head>


<body>

<div class="layout">


    <aside class="sidebar">

        <div class="logo">
            TestLink
        </div>


        <div
            class="user-area"
            id="userInfo"
        >
            読み込み中...
        </div>


        <nav class="nav">

            <button
                type="button"
                class="active"
                data-page="home"
            >
                ホーム
            </button>

            <button
                type="button"
                data-page="notice"
            >
                お知らせ
            </button>

            <button
                type="button"
                data-page="documents"
            >
                配布文書
            </button>

            <button
                type="button"
                data-page="calendar"
            >
                カレンダー
            </button>

            <button
                type="button"
                data-page="scores"
            >
                テスト成績
            </button>

            <button
                type="button"
                data-page="settings"
            >
                各種設定
            </button>

            <button
                type="button"
                id="logoutButton"
                class="logout-button"
            >
                ログアウト
            </button>

        </nav>

    </aside>


    <main class="content">


        <section
            id="page-home"
            class="content-section active"
        >

            <h1 class="page-title">
                ホーム
            </h1>

            <div class="card">

                <h2>
                    お知らせ
                </h2>

                <div id="dashboardNotices">
                    読み込み中...
                </div>

            </div>

        </section>


        <section
            id="page-notice"
            class="content-section"
        >

            <h1 class="page-title">
                お知らせ
            </h1>

            <div class="card">

                <div id="noticeList">
                    読み込み中...
                </div>

            </div>

        </section>


        <section
            id="page-documents"
            class="content-section"
        >

            <h1 class="page-title">
                配布文書
            </h1>

            <div class="card">

                <div id="documentList">
                    読み込み中...
                </div>

            </div>

        </section>


        <section
            id="page-calendar"
            class="content-section"
        >

            <h1 class="page-title">
                カレンダー
            </h1>

            <div class="card">

                <div id="calendarArea">
                    読み込み中...
                </div>

            </div>

        </section>


        <section
            id="page-scores"
            class="content-section"
        >

            <h1 class="page-title">
                テスト成績
            </h1>

            <div class="card">

                <div id="scoreArea">
                    読み込み中...
                </div>

            </div>

        </section>


        <section
            id="page-settings"
            class="content-section"
        >

            <h1 class="page-title">
                各種設定
            </h1>

            <div class="card">

                <h2>
                    アカウント
                </h2>

                <div id="settingsArea">
                    読み込み中...
                </div>

            </div>

        </section>


    </main>

</div>


<script type="module">

import {
    auth,
    db
} from "../assets/js/firebase.js";


import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";


import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";


/*
 * ============================================
 * 共通関数
 * ============================================
 */

function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/*
 * ============================================
 * ページ切り替え
 * ============================================
 */

document
    .querySelectorAll("[data-page]")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const page =
                    button.dataset.page;


                document
                    .querySelectorAll(
                        ".content-section"
                    )
                    .forEach(section => {

                        section.classList.remove(
                            "active"
                        );

                    });


                document
                    .getElementById(
                        "page-" + page
                    )
                    ?.classList.add(
                        "active"
                    );


                document
                    .querySelectorAll(
                        ".nav button"
                    )
                    .forEach(item => {

                        item.classList.remove(
                            "active"
                        );

                    });


                button.classList.add(
                    "active"
                );

            }
        );

    });


/*
 * ============================================
 * 生徒画面の認証
 * ============================================
 *
 * ここが重要。
 *
 * 未ログイン
 *     ↓
 * login.html
 *
 * student
 *     ↓
 * このページに残る
 *
 * admin
 *     ↓
 * admin/index.html
 *
 * 「studentだから別ページへ飛ばす」
 * という処理はしない。
 */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            window.location.replace(
                "../login.html"
            );

            return;
        }


        try{

            const reference =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const snapshot =
                await getDoc(reference);


            if(!snapshot.exists()){

                await signOut(auth);

                window.location.replace(
                    "../login.html"
                );

                return;
            }


            const data =
                snapshot.data();


            if(data.status !== "active"){

                await signOut(auth);

                window.location.replace(
                    "../login.html"
                );

                return;
            }


            /*
             * 管理者が生徒画面を直接開いた場合のみ
             * 管理者画面へ移動。
             */

            if(data.role === "admin"){

                window.location.replace(
                    "../admin/index.html"
                );

                return;
            }


            /*
             * 生徒ならこのページに残す。
             */

            if(data.role !== "student"){

                await signOut(auth);

                window.location.replace(
                    "../login.html"
                );

                return;
            }


            /*
             * ここまで来たら正式な生徒。
             */

            loadUser(data);

            loadDashboard(data);

            loadSettings(
                user,
                data
            );


        }catch(error){

            console.error(
                "Student authentication error:",
                error
            );


            document.body.innerHTML = `

                <div style="
                    padding:40px;
                    font-family:Arial,sans-serif;
                ">

                    <h1>
                        画面を表示できませんでした
                    </h1>

                    <p>
                        アカウント情報の取得に失敗しました。
                    </p>

                </div>

            `;

        }

    }
);


/*
 * ============================================
 * ユーザー情報
 * ============================================
 */

function loadUser(data){

    const area =
        document.getElementById(
            "userInfo"
        );


    area.innerHTML = `

        <strong>
            ${escapeHTML(
                data.displayName ||
                data.name ||
                "利用者"
            )}
        </strong>

        <br>

        ${escapeHTML(
            data.grade || ""
        )}

    `;

}


/*
 * ============================================
 * ホーム
 * ============================================
 */

function loadDashboard(data){

    const area =
        document.getElementById(
            "dashboardNotices"
        );


    area.innerHTML = `

        <div class="notice">

            ログインしました。

            <br><br>

            お知らせ・配布文書・カレンダー・
            テスト成績を確認できます。

        </div>

    `;

}


/*
 * ============================================
 * 設定
 * ============================================
 */

function loadSettings(user,data){

    const area =
        document.getElementById(
            "settingsArea"
        );


    area.innerHTML = `

        <p>
            <strong>表示名</strong><br>
            ${escapeHTML(
                data.displayName ||
                data.name ||
                ""
            )}
        </p>

        <p>
            <strong>メールアドレス</strong><br>
            ${escapeHTML(
                user.email || ""
            )}
        </p>

        <p>
            <strong>学年</strong><br>
            ${escapeHTML(
                data.grade || ""
            )}
        </p>

    `;

}


/*
 * ============================================
 * 仮コンテンツ
 * ============================================
 */

document.getElementById(
    "noticeList"
).innerHTML = `

    <div class="notice">
        現在表示できるお知らせはありません。
    </div>

`;


document.getElementById(
    "documentList"
).innerHTML = `

    <div class="notice">
        現在表示できる配布文書はありません。
    </div>

`;


document.getElementById(
    "calendarArea"
).innerHTML = `

    <div class="notice">
        現在登録されている予定はありません。
    </div>

`;


document.getElementById(
    "scoreArea"
).innerHTML = `

    <div class="notice">
        現在表示できる成績情報はありません。
    </div>

`;


/*
 * ============================================
 * ログアウト
 * ============================================
 */

document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        async () => {

            try{

                await signOut(auth);

                window.location.replace(
                    "../login.html"
                );

            }catch(error){

                console.error(
                    "Logout error:",
                    error
                );

            }

        }
    );

</script>

</body>

</html>
