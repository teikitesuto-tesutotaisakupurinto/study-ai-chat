  <script
    type="module"
  >

    import {
      auth,
      db,
      persistenceReady,
      onAuthStateChanged,
      signOut,
      doc,
      getDoc,
      collection,
      query,
      where,
      getDocs
    } from "../assets/js/firebase.js";


    /* =====================================================
       DOM
       ===================================================== */

    const $ =
      (selector) =>
        document.querySelector(selector);


    /* =====================================================
       サイドバー
       完全ローカル生成
       ===================================================== */

    function createSidebar() {

      const sidebar =
        $("#appSidebar");

      if (!sidebar) {
        return false;
      }


      const currentPage =
        location.pathname
          .split("/")
          .pop() ||
        "index.html";


      sidebar.innerHTML = `

        <div class="sidebar-inner">

          <div class="sidebar-brand">

            <a
              class="sidebar-brand-link"
              href="index.html"
            >

              <span class="sidebar-brand-title">

            </a>

          <nav
            class="sidebar-nav"
            aria-label="メインメニュー"
          >

            <a
              class="sidebar-link ${
                currentPage === "index.html"
                  ? "active"
                  : ""
              }"
              href="index.html"
              ${
                currentPage === "index.html"
                  ? 'aria-current="page"'
                  : ""
              }
            >
              <span>
                ホーム
              </span>
            </a>


            <a
              class="sidebar-link ${

                  ? "active"

              }"

              ${
                currentPage === "question.html"
                  ? 'aria-current="page"'
                  : ""
              }
            >
              <span>
                AIに質問
              </span>
            </a>


            <a
              class="sidebar-link ${
                currentPage === "history.html"
                  ? "active"
                  : ""
              }"
              href="history.html"
              ${
                currentPage === "history.html"
                  ? 'aria-current="page"'
                  : ""
              }
            >
              <span>
                学習履歴
              </span>
            </a>


            <a
              class="sidebar-link ${
                currentPage === "announcements.html"
                  ? "active"
                  : ""
              }"
              href="announcements.html"
              ${
                currentPage === "announcements.html"
                  ? 'aria-current="page"'
                  : ""
              }
            >
              <span>
                お知らせ
              </span>
            </a>


            <a
              class="sidebar-link ${
                currentPage === "settings.html"
                  ? "active"
                  : ""
              }"
              href="settings.html"
              ${
                currentPage === "settings.html"
                  ? 'aria-current="page"'
                  : ""
              }
            >
              <span>
                設定
              </span>
            </a>

          </nav>


          <div class="sidebar-bottom">

            <button
              id="sidebarLogoutButton"
              class="sidebar-logout"
              type="button"
            >
              ログアウト
            </button>

          </div>

        </div>
      `;


      /*
        ここまで完全にローカル処理。

        Firestore:
        使用しない

        Supabase:
        使用しない

        AI:
        使用しない
      */

      return true;
    }


    /* =====================================================
       ログアウト
       ===================================================== */

    function setupLogout() {

      const button =
        $("#sidebarLogoutButton");

      if (!button) {
        return;
      }


      button.addEventListener(
        "click",
        async () => {

          if (
            button.disabled
          ) {
            return;
          }


          button.disabled = true;

          button.textContent =
            "ログアウト中...";


          try {

            await signOut(auth);

            location.replace(
              "../login.html"
            );

          } catch (error) {

            console.error(
              "ログアウトエラー:",
              error
            );


            button.disabled = false;

            button.textContent =
              "ログアウト";


            alert(
              "ログアウトできませんでした。\n" +
              (
                error?.message ||
                String(error)
              )
            );
          }

        }
      );
    }


    /* =====================================================
       エラー表示
       ===================================================== */

    function showSystemError(
      message
    ) {

      const box =
        $("#system-error");

      const text =
        $("#system-error-message");


      if (!box || !text) {
        return;
      }


      text.textContent =
        message;

      box.hidden = false;
    }


    /* =====================================================
       Firestoreプロフィール
       ===================================================== */

    async function getProfile(
      uid
    ) {

      const snapshot =
        await getDoc(
          doc(
            db,
            "users",
            uid
          )
        );


      if (
        !snapshot.exists()
      ) {

        throw new Error(
          `ユーザープロフィールが見つかりません。users/${uid}`
        );
      }


      return snapshot.data();
    }


    /* =====================================================
       Firestoreシステム設定
       ===================================================== */

    async function getSystemSettings() {

      const snapshot =
        await getDoc(
          doc(
            db,
            "settings",
            "system"
          )
        );


      if (
        !snapshot.exists()
      ) {

        throw new Error(
          "Firestoreの settings/system が見つかりません。"
        );
      }


      return snapshot.data();
    }


    /* =====================================================
       日付
       ===================================================== */

    function formatDate(
      value
    ) {

      if (!value) {
        return "日時未設定";
      }


      let date;


      try {

        if (
          typeof value.toDate ===
          "function"
        ) {

          date =
            value.toDate();

        } else {

          date =
            new Date(value);
        }

      } catch {

        return "日時未設定";
      }


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return "日時未設定";
      }


      return new Intl.DateTimeFormat(
        "ja-JP",
        {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }
      ).format(date);
    }


    /* =====================================================
       timestamp比較
       ===================================================== */

    function getTimestampNumber(
      value
    ) {

      if (!value) {
        return 0;
      }


      try {

        if (
          typeof value.toMillis ===
          "function"
        ) {

          return value.toMillis();
        }


        if (
          typeof value.toDate ===
          "function"
        ) {

          return value
            .toDate()
            .getTime();
        }


        const number =
          new Date(value).getTime();


        return Number.isNaN(number)
          ? 0
          : number;

      } catch {

        return 0;
      }
    }


    /* =====================================================
       最近の会話
       ===================================================== */

    async function loadRecentConversations(
      uid
    ) {

      const container =
        $("#recent-history");


      const errorBox =
        $("#history-error");


      if (!container) {
        return;
      }


      /*
        最初にローディング表示
      */

      container.innerHTML = `
        <div class="history-loading">
          履歴を読み込んでいます...
        </div>
      `;


      if (errorBox) {
        errorBox.hidden = true;
        errorBox.textContent = "";
      }


      try {

        /*
          重要：

          以前の

          where("userId", "==", uid)
          orderBy("updatedAt", "desc")

          という複合クエリは使用しない。

          これにより
          「The query requires an index」
          を避ける。

          取得後にJavaScript側で並べ替える。
        */

        const historyQuery =
          query(
            collection(
              db,
              "chatHistories"
            ),

            where(
              "userId",
              "==",
              uid
            )
          );


        const snapshot =
          await getDocs(
            historyQuery
          );


        const conversations =
          snapshot.docs
            .map(
              item => ({
                id: item.id,
                ...item.data()
              })
            )
            .sort(
              (a, b) =>
                getTimestampNumber(
                  b.updatedAt
                ) -
                getTimestampNumber(
                  a.updatedAt
                )
            )
            .slice(
              0,
              10
            );


        container.replaceChildren();


        if (
          conversations.length === 0
        ) {

          const empty =
            document.createElement(
              "div"
            );

          empty.className =
            "history-empty";

          empty.textContent =
            "まだ会話履歴はありません。";

          container.appendChild(
            empty
          );

          return;
        }


        for (
          const item of conversations
        ) {

          const link =
            document.createElement(
              "a"
            );


          link.className =
            "history-item";


          link.href =
            `question.html?conversationId=${
              encodeURIComponent(
                item.id
              )
            }`;


          const title =
            document.createElement(
              "div"
            );


          title.className =
            "history-title";


          title.textContent =
            item.title ||
            item.lastQuestion ||
            "新しい会話";


          const date =
            document.createElement(
              "div"
            );


          date.className =
            "history-date";


          date.textContent =
            `最終更新：${
              formatDate(
                item.updatedAt
              )
            }`;


          link.append(
            title,
            date
          );


          container.appendChild(
            link
          );
        }


      } catch (error) {

        console.error(
          "会話履歴の取得に失敗しました:",
          error
        );


        /*
          サイドバーには触らない。
          ホームの履歴だけエラー表示。
        */

        container.innerHTML = "";


        const empty =
          document.createElement(
            "div"
          );


        empty.className =
          "history-empty";


        empty.textContent =
          "現在、学習履歴を読み込めません。";


        container.appendChild(
          empty
        );


        if (errorBox) {

          errorBox.textContent =
            `学習履歴：${
              error?.code ||
              "error"
            }\n${
              error?.message ||
              String(error)
            }`;

          errorBox.hidden =
            false;
        }
      }
    }


    /* =====================================================
       メイン初期化
       ===================================================== */

    async function initialize(
      user
    ) {

      /*
        ====================================================
        最重要

        ログイン済みユーザーを確認したら、
        Firestoreを触る前にサイドバーを生成する。

        ここでは

        Firestore → 使用しない
        Supabase  → 使用しない
        AI        → 使用しない

        ====================================================
      */

      const sidebarReady =
        createSidebar();


      if (sidebarReady) {
        setupLogout();
      }


      /*
        ====================================================
        ここから先はFirestore。

        失敗してもサイドバーは残す。
        ====================================================
      */

      $("#welcome").textContent =
        "アカウントを確認しています...";


      let profile;


      try {

        profile =
          await getProfile(
            user.uid
          );

      } catch (error) {

        console.error(
          "プロフィール取得エラー:",
          error
        );


        /*
          サイドバーはそのまま。
        */

        $("#welcome").textContent =
          "学習ホーム";


        showSystemError(
          `ユーザー情報を取得できませんでした。\n${
            error?.code ||
            "error"
          }: ${
            error?.message ||
            String(error)
          }`
        );


        return;
      }


      /*
        ====================================================
        アカウント状態
        ====================================================
      */

      if (
        profile.status !==
        "active"
      ) {

        try {
          await signOut(auth);
        } catch (error) {
          console.error(
            "無効アカウントのログアウト失敗:",
            error
          );
        }


        location.replace(
          "../login.html"
        );


        return;
      }


      /*
        ====================================================
        権限
        ====================================================
      */

      if (
        profile.role !==
          "student" &&
        profile.role !==
          "admin"
      ) {

        try {
          await signOut(auth);
        } catch (error) {
          console.error(
            "権限不正アカウントのログアウト失敗:",
            error
          );
        }


        location.replace(
          "../login.html"
        );


        return;
      }


      /*
        ====================================================
        管理者
        ====================================================
      */

      if (
        profile.role ===
        "admin"
      ) {

        location.replace(
          "../admin/index.html"
        );


        return;
      }


      /*
        ====================================================
        名前
        ====================================================
      */

      const displayName =
        profile.displayName ||
        profile.name ||
        user.displayName ||
        "学習者";


      $("#welcome").textContent =
        `${displayName}さん、学習を始めましょう。`;


      /*
        ====================================================
        メンテナンス

        ログイン後に取得する。
        ====================================================
      */

      let settings;


      try {

        settings =
          await getSystemSettings();

      } catch (error) {

        console.error(
          "システム設定取得エラー:",
          error
        );


        /*
          サイドバーは残す。
        */

        showSystemError(
          `システム設定を取得できませんでした。\n${
            error?.code ||
            "error"
          }: ${
            error?.message ||
            String(error)
          }`
        );


        /*
          設定取得不能時は勝手に
          メンテナンス画面へ送らない。
        */

      }


      if (
        settings &&
        settings.maintenance === true
      ) {

        location.replace(
          "../maintenance.html"
        );


        return;
      }


      /*
        ====================================================
        最近の学習

        AI通信とは完全に独立。
        ====================================================
      */

      await loadRecentConversations(
        user.uid
      );

    }


    /* =====================================================
       Firebase Auth監視
       ===================================================== */

    async function start() {

      try {

        await persistenceReady;


        onAuthStateChanged(
          auth,
          async user => {

            /*
              ログインしていない
            */

            if (!user) {

              location.replace(
                "../login.html"
              );

              return;
            }


            /*
              ログイン済み
              ↓
              ここで即サイドバー生成
              ↓
              Firestoreへ進む
            */

            try {

              await initialize(
                user
              );

            } catch (error) {

              console.error(
                "ホーム初期化エラー:",
                error
              );


              /*
                ここでもサイドバーを
                消さない。
              */

              const sidebar =
                $("#appSidebar");


              if (
                sidebar &&
                !sidebar.innerHTML.trim()
              ) {

                createSidebar();
                setupLogout();
              }


              $("#welcome").textContent =
                "学習ホーム";


              showSystemError(
                `ホームの一部を読み込めませんでした。\n${
                  error?.code ||
                  "error"
                }: ${
                  error?.message ||
                  String(error)
                }`
              );
            }

          }
        );


      } catch (error) {

        console.error(
          "Firebase認証初期化エラー:",
          error
        );


        /*
          Authそのものが初期化できない
          場合だけログイン画面へ戻す。
        */

        location.replace(
          "../login.html"
        );
      }
    }


    /* =====================================================
       開始
       ===================================================== */

    start();

  </script>

</body>
</html>
