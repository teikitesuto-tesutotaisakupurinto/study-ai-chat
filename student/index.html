<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>
    ホーム | 学習AIチャット
  </title>

  <link
    rel="stylesheet"
    href="../assets/css/common.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f8fafc;
      color: #0f172a;
      font-family:
        Arial,
        "Noto Sans JP",
        sans-serif;
    }

    [hidden] {
      display: none !important;
    }

    .home-content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 34px 42px 0;
    }

    .hero {
      padding: 28px;
      border: 1px solid #dbe3ef;
      border-radius: 16px;
      background: #ffffff;
      box-shadow:
        0 3px 12px
        rgb(15 23 42 / 4%);
    }

    .hero-label {
      margin: 0 0 8px;
      color: #2563eb;
      font-size: 13px;
      font-weight: 700;
    }

    .hero h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.45;
    }

    .hero p {
      margin: 12px 0 0;
      color: #64748b;
      line-height: 1.8;
    }

    .question-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      margin-top: 20px;
      padding: 0 22px;
      border-radius: 9px;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    .question-button:hover {
      background: #1d4ed8;
    }

    .home-section {
      margin-top: 26px;
    }

    .section-card {
      padding: 24px;
      border: 1px solid #dbe3ef;
      border-radius: 14px;
      background: #ffffff;
    }

    .section-card h2 {
      margin: 0;
      font-size: 18px;
    }

    .section-description {
      margin: 8px 0 0;
      color: #64748b;
      font-size: 13px;
      line-height: 1.7;
    }

    .history-list {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .history-item {
      display: block;
      padding: 16px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      background: #ffffff;
      color: inherit;
      text-decoration: none;
    }

    .history-item:hover {
      border-color: #93c5fd;
      background: #f8fbff;
    }

    .history-title {
      color: #0f172a;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.6;
    }

    .history-date {
      margin-top: 6px;
      color: #64748b;
      font-size: 12px;
    }

    .empty-history {
      padding: 18px;
      border-radius: 9px;
      background: #f8fafc;
      color: #64748b;
      font-size: 13px;
      text-align: center;
    }

    .home-error {
      margin-top: 14px;
      padding: 12px;
      border: 1px solid #fecaca;
      border-radius: 8px;
      background: #fef2f2;
      color: #b91c1c;
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .loading {
      color: #64748b;
      font-size: 13px;
    }

    @media (max-width: 760px) {
      .home-content {
        padding: 24px 16px 0;
      }

      .hero {
        padding: 22px;
      }

      .hero h2 {
        font-size: 21px;
      }

      .section-card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="app-layout">

    <aside
      id="appSidebar"
      class="sidebar"
    ></aside>

    <main
      id="appMain"
      class="app-main"
    >

      <header class="page-header">
        <h1 class="page-title">
          学習ホーム
        </h1>

        <p id="welcome">
          学習を始めましょう。
        </p>
      </header>

      <div class="home-content">

        <section class="hero">

          <p class="hero-label">
            学習AIチャット
          </p>

          <h2>
            分からないところを、
            AIに質問してみよう。
          </h2>

          <p>
            中学生の学習をサポートする
            学習専用AIです。
            数学・英語・国語・理科・社会などの
            学習について質問できます。
          </p>

          <a
            class="question-button"
            href="question.html"
          >
            AIに質問する
          </a>

        </section>

        <section class="home-section">

          <div class="section-card">

            <h2>
              最近の学習
            </h2>

            <p class="section-description">
              過去の会話を選択すると、
              その会話の続きから質問できます。
            </p>

            <div
              id="recent-history"
              class="history-list"
              aria-live="polite"
            >
              <div class="loading">
                履歴を読み込んでいます...
              </div>
            </div>

            <p
              id="history-error"
              class="home-error"
              hidden
            ></p>

          </div>

        </section>

      </div>

      <footer class="page-footer">
        © 2026 定期テスト対策プリント運営事務局.
        All Rights Reserved.
      </footer>

    </main>

  </div>

  <script type="module">

    import {
      auth,
      persistenceReady,
      signOut
    } from "../assets/js/firebase-module.js";

    import {
      protectPage,
      getRecentConversations
    } from "../assets/js/auth.js";

    import {
      setupSidebar,
      setupLogout,
      setSidebarUser
    } from "../assets/js/layout.js";

    const $ =
      id =>
        document.getElementById(id);

    function formatDate(value) {

      if (!value) {
        return "日時未設定";
      }

      const date =
        new Date(value);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return "日時未設定";
      }

      return new Intl.DateTimeFormat(
        "ja-JP",
        {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }
      ).format(date);
    }

    function showHistoryError(
      message
    ) {

      const error =
        $("history-error");

      error.textContent =
        message;

      error.hidden = false;
    }

    function renderHistory(
      conversations
    ) {

      const container =
        $("recent-history");

      container.replaceChildren();

      if (
        !Array.isArray(
          conversations
        ) ||
        conversations.length === 0
      ) {

        const empty =
          document.createElement(
            "div"
          );

        empty.className =
          "empty-history";

        empty.textContent =
          "まだ学習履歴はありません。";

        container.appendChild(
          empty
        );

        return;
      }

      conversations.forEach(
        item => {

          const link =
            document.createElement(
              "a"
            );

          link.className =
            "history-item";

          link.href =
            `question.html?conversationId=${
              encodeURIComponent(
                item.id
              )
            }`;

          const title =
            document.createElement(
              "div"
            );

          title.className =
            "history-title";

          title.textContent =
            item.title ||
            item.lastQuestion ||
            "新しい会話";

          const date =
            document.createElement(
              "div"
            );

          date.className =
            "history-date";

          date.textContent =
            `最終更新：${
              formatDate(
                item.updatedAt
              )
            }`;

          link.append(
            title,
            date
          );

          container.appendChild(
            link
          );
        }
      );
    }

    async function initialize() {

      try {

        await persistenceReady;

        const result =
          await protectPage(
            "student"
          );

        if (
          !result ||
          !result.user
        ) {
          return;
        }

        const profile =
          result.profile;

        /*
         * サイドバーは認証成功直後に必ず生成
         */
        setupSidebar(
          profile
        );

        setupLogout(
          auth,
          signOut
        );

        setSidebarUser(
          profile
        );

        const displayName =
          profile.displayName ||
          profile.name ||
          result.user.displayName ||
          "学習者";

        $("welcome").textContent =
          `${displayName}さん、学習を始めましょう。`;

        try {

          const result =
            await getRecentConversations(
              10
            );

          renderHistory(
            result.conversations || []
          );

        } catch (error) {

          console.error(
            "最近の学習取得エラー:",
            error
          );

          $("recent-history")
            .textContent =
              "履歴を読み込めませんでした。";

          showHistoryError(
            `${error.code || "error"}: ${
              error.message ||
              String(error)
            }`
          );
        }

      } catch (error) {

        console.error(
          "ホーム画面初期化エラー:",
          error
        );

        $("welcome").textContent =
          "ホーム画面を読み込めませんでした。";

        showHistoryError(
          `${error.code || "error"}: ${
            error.message ||
            String(error)
          }`
        );
      }
    }

    initialize();

  </script>

</body>
</html>
