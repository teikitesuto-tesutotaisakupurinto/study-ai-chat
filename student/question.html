
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="中学生向け学習AIチャット">
  <title>AIに質問 | 学習AIチャット</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;
      color: #172033;
      background: #f7f9fc;
    }

    body {
      min-height: 100vh;
    }

    button,
    textarea {
      font: inherit;
    }

    [hidden] {
      display: none !important;
    }

    /* =====================================================
       アプリ全体
       ===================================================== */

    .app-shell {
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 250px;
      flex: 0 0 250px;
      min-height: 100vh;
      background: #ffffff;
      border-right: 1px solid #e5eaf1;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 50;
    }

    .main-area {
      min-width: 0;
      flex: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =====================================================
       ヘッダー
       ===================================================== */

    .topbar {
      height: 64px;
      flex: 0 0 64px;
      display: flex;
      align-items: center;
      padding: 0 28px;
      background: rgba(255, 255, 255, .96);
      border-bottom: 1px solid #e5eaf1;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .topbar-title {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -.02em;
    }

    /* =====================================================
       コンテンツ
       ===================================================== */

    .content {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 30px 24px 100px;
      flex: 1;
    }

    .conversation-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .conversation-header h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.45;
      letter-spacing: -.03em;
    }

    .conversation-meta {
      margin-top: 7px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .new-conversation {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 0 15px;
      border: 1px solid #d6dde8;
      border-radius: 9px;
      background: #ffffff;
      color: #334155;
      font-weight: 600;
      cursor: pointer;
      transition:
        background .15s,
        border-color .15s;
    }

    .new-conversation:hover {
      background: #f8fafc;
      border-color: #b8c2d1;
    }

    /* =====================================================
       チャット
       ===================================================== */

    .chat-card {
      background: #ffffff;
      border: 1px solid #e3e8f0;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 3px 18px rgba(15, 23, 42, .04);
    }

    .messages {
      min-height: 460px;
      max-height: calc(100vh - 260px);
      overflow-y: auto;
      padding: 30px 28px 24px;
      scroll-behavior: smooth;
    }

    .empty-message {
      min-height: 390px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      color: #64748b;
      font-size: 14px;
      line-height: 1.9;
    }

    /* =====================================================
       メッセージ
       ===================================================== */

    .message {
      display: flex;
      width: 100%;
      margin-bottom: 24px;
      animation: messageIn .18s ease-out;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.assistant {
      justify-content: flex-start;
    }

    .message-inner {
      min-width: 0;
      max-width: 82%;
    }

    .message.user .message-inner {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .message.assistant .message-inner {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .message-bubble {
      padding: 13px 17px;
      border-radius: 17px;
      font-size: 15px;
      line-height: 1.85;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    /* 自分の発言は右 */
    .message.user .message-bubble {
      background: #2563eb;
      color: #ffffff;
      border-bottom-right-radius: 5px;
    }

    /* AIは左 */
    .message.assistant .message-bubble {
      background: #f1f5f9;
      color: #172033;
      border-bottom-left-radius: 5px;
    }

    .message-info {
      margin-top: 5px;
      color: #94a3b8;
      font-size: 10px;
      line-height: 1.4;
    }

    .message.user .message-info {
      text-align: right;
    }

    .answer-id {
      margin-top: 4px;
      color: #94a3b8;
      font-size: 9px;
      word-break: break-all;
    }

    /* =====================================================
       AI回答待ち
       ===================================================== */

    .typing {
      display: flex;
      justify-content: flex-start;
      width: 100%;
      margin-bottom: 24px;
      animation: messageIn .18s ease-out;
    }

    .typing-inner {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .typing-bubble {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 62px;
      padding: 15px 17px;
      background: #f1f5f9;
      border-radius: 17px;
      border-bottom-left-radius: 5px;
    }

    .typing-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #64748b;
      animation: typingPulse 1.35s infinite ease-in-out;
    }

    .typing-dot:nth-child(2) {
      animation-delay: .16s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: .32s;
    }

    @keyframes typingPulse {
      0%,
      60%,
      100% {
        opacity: .25;
        transform: translateY(0) scale(.85);
      }

      30% {
        opacity: 1;
        transform: translateY(-4px) scale(1);
      }
    }

    /* =====================================================
       エラー
       ===================================================== */

    .error-box {
      margin-bottom: 18px;
      padding: 13px 15px;
      border: 1px solid #fecaca;
      border-radius: 10px;
      background: #fff1f2;
      color: #b91c1c;
      font-size: 13px;
      line-height: 1.75;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    /* =====================================================
       入力エリア
       ===================================================== */

    .composer {
      padding: 18px 20px 20px;
      border-top: 1px solid #e5eaf1;
      background: #ffffff;
    }

    .composer textarea {
      display: block;
      width: 100%;
      min-height: 92px;
      max-height: 220px;
      resize: vertical;
      padding: 14px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      background: #ffffff;
      color: #172033;
      outline: none;
      line-height: 1.75;
      font-size: 15px;
      transition:
        border-color .15s,
        box-shadow .15s;
    }

    .composer textarea::placeholder {
      color: #94a3b8;
    }

    .composer textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
    }

    .composer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-top: 11px;
    }

    .composer-help {
      color: #64748b;
      font-size: 11px;
      line-height: 1.65;
    }

    .send-button {
      flex: 0 0 auto;
      min-width: 128px;
      min-height: 44px;
      padding: 0 18px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition:
        background .15s,
        opacity .15s,
        transform .1s;
    }

    .send-button:hover {
      background: #1d4ed8;
    }

    .send-button:active {
      transform: scale(.98);
    }

    .send-button:disabled {
      opacity: .55;
      cursor: wait;
      transform: none;
    }

    /* =====================================================
       ローディング
       ===================================================== */

    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f9fc;
    }

    .loading-card {
      width: min(420px, calc(100% - 32px));
      padding: 32px;
      background: #ffffff;
      border: 1px solid #e3e8f0;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(15, 23, 42, .07);
    }

    .loading-card p {
      margin: 0;
      color: #64748b;
      line-height: 1.8;
      font-size: 14px;
    }

    /* =====================================================
       フッター
       ===================================================== */

    .app-footer {
      padding: 18px 20px 25px;
      color: #94a3b8;
      text-align: center;
      font-size: 10px;
      line-height: 1.7;
    }

    /* =====================================================
       認証エラー
       ===================================================== */

    .auth-error {
      width: min(620px, calc(100% - 32px));
      margin: 70px auto;
      padding: 28px;
      background: #ffffff;
      border: 1px solid #e3e8f0;
      border-radius: 14px;
    }

    .auth-error h1 {
      margin-top: 0;
      font-size: 22px;
    }

    .auth-error p {
      line-height: 1.8;
    }

    .auth-error pre {
      padding: 12px;
      background: #f1f5f9;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
    }

    /* =====================================================
       スマートフォン
       ===================================================== */

    @media (max-width: 700px) {
      .app-shell {
        display: block;
      }

      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        width: 250px;
        transform: translateX(-100%);
        transition: transform .2s ease;
        box-shadow: 8px 0 25px rgba(15, 23, 42, .12);
      }

      body.sidebar-expanded .sidebar {
        transform: translateX(0);
      }

      .topbar {
        height: 58px;
        padding: 0 16px;
      }

      .topbar-title {
        font-size: 17px;
      }

      .content {
        padding: 20px 10px 80px;
      }

      .conversation-header {
        flex-direction: column;
        margin-bottom: 15px;
      }

      .conversation-header h1 {
        font-size: 22px;
      }

      .new-conversation {
        width: 100%;
      }

      .chat-card {
        border-radius: 13px;
      }

      .messages {
        min-height: 360px;
        max-height: none;
        padding: 22px 14px 18px;
      }

      .empty-message {
        min-height: 300px;
      }

      .message-inner {
        max-width: 88%;
      }

      .message-bubble {
        font-size: 14px;
        padding: 12px 14px;
      }

      .composer {
        padding: 14px;
      }

      .composer-bottom {
        align-items: stretch;
        flex-direction: column;
      }

      .send-button {
        width: 100%;
      }
    }

    /* =====================================================
       デスクトップ サイドバー折りたたみ
       ===================================================== */

    @media (min-width: 701px) {
      body.sidebar-collapsed .sidebar {
        width: 68px;
        flex-basis: 68px;
      }

      body.sidebar-collapsed .sidebar-label,
      body.sidebar-collapsed .sidebar-user,
      body.sidebar-collapsed .sidebar-history,
      body.sidebar-collapsed .sidebar-header strong {
        display: none;
      }

      body.sidebar-collapsed .sidebar-link {
        justify-content: center;
      }
    }
  </style>
</head>

<body
  data-role="student"
  class="auth-pending"
>

  <!-- =====================================================
       認証・初期化中
       ===================================================== -->

  <div
    id="loadingScreen"
    class="loading-screen"
  >
    <div class="loading-card">
      <p id="loadingText">
        ログイン状態を確認しています。
      </p>
    </div>
  </div>

  <!-- =====================================================
       アプリ
       ===================================================== -->

  <div
    id="appShell"
    class="app-shell"
    hidden
  >

    <aside
      id="appSidebar"
      class="sidebar"
      aria-label="メインメニュー"
    ></aside>

    <div class="main-area">

      <header class="topbar">
        <h1 class="topbar-title">
          学習AIチャット
        </h1>
      </header>

      <main class="content">

        <div
          id="errorBox"
          class="error-box"
          hidden
          role="alert"
        ></div>

        <section class="conversation-header">

          <div>
            <h1 id="conversationTitle">
              AIに質問
            </h1>

            <div
              id="conversationMeta"
              class="conversation-meta"
            >
              新しい会話
            </div>
          </div>

          <button
            id="newConversationButton"
            class="new-conversation"
            type="button"
          >
            新しい会話
          </button>

        </section>

        <!-- =================================================
             チャット本体
             ================================================= -->

        <section class="chat-card">

          <div
            id="messages"
            class="messages"
            aria-live="polite"
            aria-label="会話"
          >

            <div
              id="emptyMessage"
              class="empty-message"
            >
              学習について質問してください。
            </div>

          </div>

          <!-- =================================================
               入力
               ================================================= -->

          <form
            id="questionForm"
            class="composer"
          >

            <textarea
              id="questionInput"
              maxlength="4000"
              placeholder="学習について質問してください。"
              autocomplete="off"
              aria-label="質問"
            ></textarea>

            <div class="composer-bottom">

              <div class="composer-help">
                Enterでは送信されません。<br>
                「質問を送信」を押してください。
              </div>

              <button
                id="sendButton"
                class="send-button"
                type="submit"
              >
                質問を送信
              </button>

            </div>

          </form>

        </section>

      </main>

      <footer class="app-footer">
        © 2026 Regular Test Preparation Worksheet Administration Office. All Rights Reserved.
      </footer>

    </div>
  </div>

  <!-- =====================================================
       レイアウト
       ===================================================== -->

  <script
    type="module"
    src="../assets/js/layout.js"
  ></script>

  <!-- =====================================================
       ページ処理
       ===================================================== -->

  <script type="module">

    import {
      requireRole,
      sendStudyQuestion,
      getConversation,
      getConversationByAnswerId
    } from "../assets/js/page.js";


    /* =====================================================
       DOM
       ===================================================== */

    const loadingScreen =
      document.getElementById(
        "loadingScreen"
      );

    const loadingText =
      document.getElementById(
        "loadingText"
      );

    const appShell =
      document.getElementById(
        "appShell"
      );

    const messagesElement =
      document.getElementById(
        "messages"
      );

    const emptyMessage =
      document.getElementById(
        "emptyMessage"
      );

    const form =
      document.getElementById(
        "questionForm"
      );

    const input =
      document.getElementById(
        "questionInput"
      );

    const sendButton =
      document.getElementById(
        "sendButton"
      );

    const errorBox =
      document.getElementById(
        "errorBox"
      );

    const titleElement =
      document.getElementById(
        "conversationTitle"
      );

    const metaElement =
      document.getElementById(
        "conversationMeta"
      );

    const newConversationButton =
      document.getElementById(
        "newConversationButton"
      );


    /* =====================================================
       状態
       ===================================================== */

    let currentConversationId = null;
    let currentAnswerId = null;
    let sending = false;


    /* =====================================================
       画面
       ===================================================== */

    function hideLoading() {

      loadingScreen.hidden = true;
      appShell.hidden = false;

      document.documentElement
        .classList
        .remove("auth-pending");
    }


    function showLoading(message) {

      loadingText.textContent = message;

      loadingScreen.hidden = false;
    }


    function showError(message) {

      errorBox.textContent = message;
      errorBox.hidden = false;
    }


    function clearError() {

      errorBox.textContent = "";
      errorBox.hidden = true;
    }


    /* =====================================================
       日付
       ===================================================== */

    function formatDate(value) {

      if (!value) {
        return "";
      }

      let date;

      if (
        value &&
        typeof value.toDate === "function"
      ) {
        date = value.toDate();
      } else {
        date = new Date(value);
      }

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return "";
      }

      return new Intl.DateTimeFormat(
        "ja-JP",
        {
          year: "numeric",
          month: "numeric",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      ).format(date);
    }


    /* =====================================================
       スクロール
       ===================================================== */

    function scrollToBottom() {

      requestAnimationFrame(() => {

        messagesElement.scrollTop =
          messagesElement.scrollHeight;

      });
    }


    /* =====================================================
       メッセージクリア
       ===================================================== */

    function clearMessages() {

      messagesElement.replaceChildren();
    }


    /* =====================================================
       メッセージ生成
       ===================================================== */

    function createMessageElement(
      role,
      content,
      createdAt = null,
      answerId = null
    ) {

      const wrapper =
        document.createElement(
          "article"
        );

      wrapper.className =
        `message ${role}`;


      const inner =
        document.createElement(
          "div"
        );

      inner.className =
        "message-inner";


      const bubble =
        document.createElement(
          "div"
        );

      bubble.className =
        "message-bubble";


      /*
        textContentを使用しているため、
        AI回答にHTMLが入っていても
       そのまま文字として表示されます。
      */

      bubble.textContent =
        content;


      inner.appendChild(
        bubble
      );


      if (createdAt) {

        const info =
          document.createElement(
            "div"
          );

        info.className =
          "message-info";

        info.textContent =
          formatDate(
            createdAt
          );

        inner.appendChild(
          info
        );
      }


      if (
        role === "assistant" &&
        answerId
      ) {

        const idElement =
          document.createElement(
            "div"
          );

        idElement.className =
          "answer-id";

        idElement.textContent =
          `回答ID: ${answerId}`;

        inner.appendChild(
          idElement
        );
      }


      wrapper.appendChild(
        inner
      );

      return wrapper;
    }


    /* =====================================================
       メッセージ表示
       ===================================================== */

    function renderMessages(messages) {

      clearMessages();


      if (
        !Array.isArray(messages) ||
        messages.length === 0
      ) {

        messagesElement.appendChild(
          emptyMessage
        );

        emptyMessage.hidden = false;

        return;
      }


      emptyMessage.hidden = true;


      for (
        const message of messages
      ) {

        messagesElement.appendChild(
          createMessageElement(
            message.role,
            message.content,
            message.created_at ??
              message.createdAt ??
              null,
            message.role === "assistant"
              ? message.id ??
                message.answerId ??
                null
              : null
          )
        );
      }


      scrollToBottom();
    }


    /* =====================================================
       メッセージ追加
       ===================================================== */

    function addMessage(
      role,
      content,
      createdAt = null,
      answerId = null
    ) {

      if (
        emptyMessage.parentElement ===
        messagesElement
      ) {

        emptyMessage.remove();
      }


      messagesElement.appendChild(
        createMessageElement(
          role,
          content,
          createdAt,
          answerId
        )
      );


      scrollToBottom();
    }


    /* =====================================================
       AI回答待ち
       ===================================================== */

    function addTyping() {

      removeTyping();


      const wrapper =
        document.createElement(
          "article"
        );

      wrapper.className =
        "typing";

      wrapper.id =
        "typingMessage";


      const inner =
        document.createElement(
          "div"
        );

      inner.className =
        "typing-inner";


      const bubble =
        document.createElement(
          "div"
        );

      bubble.className =
        "typing-bubble";

      bubble.setAttribute(
        "aria-label",
        "AIが回答を作成しています"
      );


      for (
        let i = 0;
        i < 3;
        i++
      ) {

        const dot =
          document.createElement(
            "span"
          );

        dot.className =
          "typing-dot";

        dot.setAttribute(
          "aria-hidden",
          "true"
        );

        bubble.appendChild(
          dot
        );
      }


      inner.appendChild(
        bubble
      );

      wrapper.appendChild(
        inner
      );

      messagesElement.appendChild(
        wrapper
      );


      scrollToBottom();
    }


    function removeTyping() {

      const typing =
        document.getElementById(
          "typingMessage"
        );

      if (typing) {
        typing.remove();
      }
    }


    /* =====================================================
       会話ヘッダー
       ===================================================== */

    function updateConversationHeader(
      conversation
    ) {

      if (!conversation) {

        titleElement.textContent =
          "AIに質問";

        metaElement.textContent =
          "新しい会話";

        return;
      }


      titleElement.textContent =
        conversation.title ||
        "AIに質問";


      const parts = [];


      const updatedAt =
        conversation.updated_at ??
        conversation.updatedAt ??
        null;


      if (updatedAt) {

        parts.push(
          `最終更新: ${formatDate(
            updatedAt
          )}`
        );
      }


      if (conversation.id) {

        parts.push(
          `会話ID: ${conversation.id}`
        );
      }


      metaElement.textContent =
        parts.join(" / ");
    }


    /* =====================================================
       会話読み込み
       ===================================================== */

    async function loadConversation(
      conversationId
    ) {

      showLoading(
        "会話を読み込んでいます。"
      );


      const result =
        await getConversation(
          conversationId
        );


      currentConversationId =
        result.conversation.id;


      updateConversationHeader(
        result.conversation
      );


      renderMessages(
        result.messages
      );


      hideLoading();
    }


    /* =====================================================
       回答IDから読み込み
       ===================================================== */

    async function loadAnswer(
      answerId
    ) {

      showLoading(
        "回答を読み込んでいます。"
      );


      const result =
        await getConversationByAnswerId(
          answerId
        );


      currentConversationId =
        result.conversation.id;


      currentAnswerId =
        result.answerId ??
        result.answer?.answerId ??
        result.answer?.id ??
        null;


      updateConversationHeader(
        result.conversation
      );


      renderMessages(
        result.messages
      );


      hideLoading();

      scrollToBottom();
    }


    /* =====================================================
       初期化
       ===================================================== */

    async function initialize() {

      try {

        showLoading(
          "ログイン状態を確認しています。"
        );


        const result =
          await requireRole(
            "student"
          );


        if (!result) {
          return;
        }


        /*
          認証が完了した時点で、
          サイドバーを表示する。
        */

        appShell.hidden = false;


        const params =
          new URLSearchParams(
            location.search
          );


        const conversationId =
          params.get(
            "conversationId"
          );


        const answerId =
          params.get(
            "answerId"
          );


        if (answerId) {

          await loadAnswer(
            answerId
          );

          return;
        }


        if (conversationId) {

          await loadConversation(
            conversationId
          );

          return;
        }


        currentConversationId =
          null;

        currentAnswerId =
          null;


        updateConversationHeader(
          null
        );


        renderMessages([]);


        hideLoading();

      } catch (error) {

        console.error(
          "質問画面初期化エラー:",
          error
        );


        loadingScreen.hidden =
          true;

        appShell.hidden =
          false;


        showError(
          error?.message ||
          "質問画面の初期化に失敗しました。"
        );
      }
    }


    /* =====================================================
       質問送信
       ===================================================== */

    async function submitQuestion(
      event
    ) {

      event.preventDefault();


      if (sending) {
        return;
      }


      const question =
        input.value.trim();


      if (!question) {

        showError(
          "質問を入力してください。"
        );

        input.focus();

        return;
      }


      clearError();


      sending = true;


      sendButton.disabled =
        true;


      sendButton.textContent =
        "回答中";


      const questionText =
        question;


      input.value =
        "";


      /*
        先にユーザーの質問を右側へ表示
      */

      addMessage(
        "user",
        questionText,
        new Date().toISOString()
      );


      /*
        AI回答待ち
      */

      addTyping();


      try {

        const result =
          await sendStudyQuestion(
            questionText,
            currentConversationId
          );


        removeTyping();


        currentConversationId =
          result.conversationId;


        currentAnswerId =
          result.answerId;


        /*
          AI回答を左側へ表示
        */

        addMessage(
          "assistant",
          result.answer,
          result.createdAt,
          result.answerId
        );


        updateConversationHeader({

          id:
            result.conversationId,

          title:
            questionText.length > 50
              ? questionText.slice(
                  0,
                  50
                ) + "…"
              : questionText,

          updated_at:
            result.createdAt
        });


        /*
          会話IDをURLへ反映。
          ページ遷移はしない。
        */

        const newUrl =
          `question.html?conversationId=${
            encodeURIComponent(
              result.conversationId
            )
          }`;


        history.replaceState(
          null,
          "",
          newUrl
        );


      } catch (error) {

        console.error(
          "質問送信エラー:",
          error
        );


        removeTyping();


        showError(
          error?.message ||
          "AIへの質問に失敗しました。"
        );


        /*
          失敗した場合は入力内容を戻す
        */

        input.value =
          questionText;

      } finally {

        sending =
          false;


        sendButton.disabled =
          false;


        sendButton.textContent =
          "質問を送信";


        input.focus();
      }
    }


    /* =====================================================
       新しい会話
       ===================================================== */

    function startNewConversation() {

      if (sending) {
        return;
      }


      currentConversationId =
        null;


      currentAnswerId =
        null;


      clearError();


      input.value =
        "";


      updateConversationHeader(
        null
      );


      renderMessages([]);


      history.replaceState(
        null,
        "",
        "question.html"
      );


      input.focus();
    }


    /* =====================================================
       イベント
       ===================================================== */

    form.addEventListener(
      "submit",
      submitQuestion
    );


    newConversationButton.addEventListener(
      "click",
      startNewConversation
    );


    input.addEventListener(
      "input",
      clearError
    );


    /*
      Ctrl + Enter / Command + Enter
      でも送信可能。
      通常のEnterでは送信しない。
    */

    input.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          (event.ctrlKey ||
            event.metaKey)
        ) {

          event.preventDefault();

          if (
            !sending &&
            input.value.trim()
          ) {

            form.requestSubmit();
          }
        }
      }
    );


    /* =====================================================
       開始
       ===================================================== */

    initialize();

  </script>

</body>
</html>
