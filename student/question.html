
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#f4f7fb"
  >

  <meta
    name="description"
    content="中学生向け学習AIチャット"
  >

  <title>AI学習チャット | 学習AIチャット</title>

  <link
    rel="stylesheet"
    href="../assets/css/common.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/student.css"
  >

  <!-- 独立サイドバー -->
  <link
    rel="stylesheet"
    href="../assets/css/sidebar.css"
  >

  <style>
    :root {
      --chat-bg: #f4f7fb;
      --chat-card: #ffffff;
      --chat-border: #e2e8f0;
      --chat-text: #172033;
      --chat-muted: #64748b;
      --chat-blue: #2563eb;
      --chat-blue-dark: #1d4ed8;
      --chat-user-bg: #2563eb;
      --chat-user-text: #ffffff;
      --chat-ai-bg: #ffffff;
      --chat-error-bg: #fff1f2;
      --chat-error-border: #fecdd3;
      --chat-error-text: #9f1239;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--chat-bg);
      color: var(--chat-text);
    }

    [hidden] {
      display: none !important;
    }

    .chat-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      position: sticky;
      top: 0;
      z-index: 100;

      min-height: 72px;

      display: flex;
      align-items: center;

      background: rgb(255 255 255 / 94%);
      border-bottom: 1px solid var(--chat-border);

      backdrop-filter: blur(12px);
    }

    .chat-header-inner {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: 14px 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 16px;
    }

    .chat-header-title {
      min-width: 0;
    }

    .chat-header-title h1 {
      margin: 0;

      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .chat-header-title p {
      margin: 4px 0 0;

      color: var(--chat-muted);

      font-size: 12px;
    }

    .new-chat-button {
      flex-shrink: 0;

      min-height: 40px;
      padding: 0 14px;

      border: 1px solid var(--chat-border);
      border-radius: 9px;

      background: #ffffff;
      color: var(--chat-text);

      font-weight: 700;

      cursor: pointer;
    }

    .new-chat-button:hover {
      background: #f8fafc;
    }

    .chat-main {
      width: min(100%, 980px);
      flex: 1;

      margin: 0 auto;

      padding: 28px 24px 170px;
    }

    .chat-intro {
      max-width: 700px;

      margin: 0 auto 30px;

      padding: 28px;

      border: 1px solid var(--chat-border);
      border-radius: 16px;

      background: #ffffff;

      box-shadow:
        0 4px 18px rgb(15 23 42 / 4%);
    }

    .chat-intro h2 {
      margin: 0 0 10px;

      font-size: 21px;
    }

    .chat-intro p {
      margin: 0;

      color: var(--chat-muted);

      line-height: 1.8;
    }

    .conversation {
      display: flex;
      flex-direction: column;

      gap: 22px;

      width: 100%;
    }

    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.assistant {
      justify-content: flex-start;
    }

    .message {
      width: fit-content;
      max-width: min(760px, 88%);

      padding: 14px 17px;

      border-radius: 16px;

      line-height: 1.8;
      font-size: 15px;

      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .message.user {
      background: var(--chat-user-bg);
      color: var(--chat-user-text);

      border-bottom-right-radius: 5px;
    }

    .message.assistant {
      background: var(--chat-ai-bg);
      color: var(--chat-text);

      border: 1px solid var(--chat-border);

      border-bottom-left-radius: 5px;

      box-shadow:
        0 3px 12px rgb(15 23 42 / 4%);
    }

    .message.error {
      background: var(--chat-error-bg);
      border-color: var(--chat-error-border);
      color: var(--chat-error-text);
    }

    .message-content {
      white-space: pre-wrap;
    }

    .message-time {
      margin-top: 6px;

      font-size: 10px;

      opacity: .65;

      text-align: right;
    }

    .assistant-label {
      margin-bottom: 5px;

      color: var(--chat-muted);

      font-size: 11px;
      font-weight: 800;
    }

    .typing-row {
      display: flex;
      justify-content: flex-start;
      width: 100%;
    }

    .typing-message {
      display: inline-flex;
      align-items: center;
      gap: 5px;

      min-height: 48px;
      padding: 0 17px;

      border: 1px solid var(--chat-border);
      border-radius: 16px;
      border-bottom-left-radius: 5px;

      background: #ffffff;

      box-shadow:
        0 3px 12px rgb(15 23 42 / 4%);
    }

    .typing-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #94a3b8;

      animation:
        typingPulse 1.2s infinite ease-in-out;
    }

    .typing-dot:nth-child(2) {
      animation-delay: .15s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes typingPulse {
      0%,
      60%,
      100% {
        opacity: .3;
        transform: translateY(0) scale(.85);
      }

      30% {
        opacity: 1;
        transform: translateY(-3px) scale(1);
      }
    }

    .chat-bottom {
      position: fixed;

      left: var(--sidebar-width, 250px);
      right: 0;
      bottom: 0;

      z-index: 90;

      padding: 14px 20px 18px;

      background:
        linear-gradient(
          to top,
          rgb(244 247 251 / 100%),
          rgb(244 247 251 / 94%),
          rgb(244 247 251 / 0%)
        );
    }

    .chat-input-wrap {
      width: min(100%, 900px);

      margin: 0 auto;

      display: flex;
      align-items: flex-end;

      gap: 9px;

      padding: 8px;

      background: #ffffff;

      border: 1px solid #cbd5e1;
      border-radius: 14px;

      box-shadow:
        0 5px 22px rgb(15 23 42 / 10%);
    }

    .chat-input {
      flex: 1;

      min-width: 0;

      min-height: 44px;
      max-height: 180px;

      resize: none;

      padding: 11px 12px;

      border: 0;
      outline: 0;

      background: transparent;

      color: var(--chat-text);

      font: inherit;
      line-height: 1.6;
    }

    .chat-input::placeholder {
      color: #94a3b8;
    }

    .send-button {
      flex-shrink: 0;

      width: 46px;
      height: 46px;

      border: 0;
      border-radius: 10px;

      background: var(--chat-blue);
      color: #ffffff;

      cursor: pointer;

      font-size: 18px;
      font-weight: 900;
    }

    .send-button:hover {
      background: var(--chat-blue-dark);
    }

    .send-button:disabled {
      cursor: wait;
      opacity: .55;
    }

    .input-help {
      width: min(100%, 900px);

      margin: 7px auto 0;

      color: #94a3b8;

      font-size: 10px;

      text-align: right;
    }

    .system-error {
      width: min(100%, 760px);

      margin: 20px auto;

      padding: 14px 16px;

      border: 1px solid var(--chat-error-border);
      border-radius: 10px;

      background: var(--chat-error-bg);
      color: var(--chat-error-text);

      line-height: 1.7;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .system-error-title {
      margin-bottom: 5px;

      font-weight: 800;
    }

    .page-footer {
      margin: 30px 0;

      color: #94a3b8;

      font-size: 10px;
      text-align: center;
    }

    @media (max-width: 760px) {

      .chat-header-inner {
        padding-left: 70px;
      }

      .chat-main {
        padding:
          20px
          14px
          160px;
      }

      .message {
        max-width: 92%;
      }

      .chat-bottom {
        left: 0;

        padding:
          10px
          10px
          14px;
      }

      .chat-input-wrap {
        border-radius: 12px;
      }

      .input-help {
        display: none;
      }

      .chat-intro {
        padding: 22px 18px;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       独立サイドバー
       ===================================================== -->

  <script
    src="../assets/js/sidebar.js"
  ></script>


  <!-- =====================================================
       チャット本体
       ===================================================== -->

  <div class="chat-page">

    <header class="chat-header">

      <div class="chat-header-inner">

        <div class="chat-header-title">

          <h1>
            AI学習チャット
          </h1>

          <p id="chatStatus">
            学習に関する質問を入力してください。
          </p>

        </div>

        <button
          id="newChatButton"
          class="new-chat-button"
          type="button"
        >
          新しい会話
        </button>

      </div>

    </header>


    <main
      class="chat-main"
      id="chatMain"
    >

      <section
        id="chatIntro"
        class="chat-intro"
      >

        <h2>
          学習AIチャット
        </h2>

        <p>
          数学・英語・国語・理科・社会など、
          学校の勉強について質問できます。
        </p>

      </section>


      <section
        id="conversation"
        class="conversation"
        aria-live="polite"
        aria-label="会話"
      >
      </section>


      <div
        id="systemError"
        class="system-error"
        hidden
      >

        <div class="system-error-title">
          エラーが発生しました
        </div>

        <div id="systemErrorText"></div>

      </div>


      <footer class="page-footer">

        © 2026 定期テスト対策プリント運営事務局.
        All Rights Reserved.

      </footer>

    </main>


    <!-- ===================================================
         入力欄
         =================================================== -->

    <div class="chat-bottom">

      <form
        id="chatForm"
        class="chat-input-wrap"
      >

        <textarea
          id="chatInput"
          class="chat-input"
          rows="1"
          maxlength="4000"
          placeholder="学習について質問してください"
          aria-label="質問入力"
        ></textarea>

        <button
          id="sendButton"
          class="send-button"
          type="submit"
          aria-label="送信"
        >
          ↑
        </button>

      </form>

      <div class="input-help">
        Enterで送信・Shift + Enterで改行
      </div>

    </div>

  </div>


  <!-- =====================================================
       Firebase / 認証 / AI
       サイドバーとは完全分離
       ===================================================== -->

  <script type="module">

    import {
      auth,
      getConversation,
      sendStudyQuestion
    } from "../assets/js/auth.js";

    import {
      persistenceReady
    } from "../assets/js/firebase.js";


    const $ =
      selector =>
        document.querySelector(
          selector
        );


    const conversation =
      $("#conversation");

    const input =
      $("#chatInput");

    const form =
      $("#chatForm");

    const sendButton =
      $("#sendButton");

    const statusText =
      $("#chatStatus");

    const intro =
      $("#chatIntro");

    const errorBox =
      $("#systemError");

    const errorText =
      $("#systemErrorText");

    const newChatButton =
      $("#newChatButton");


    let conversationId =
      null;

    let sending =
      false;


    /* =====================================================
       URL
       ===================================================== */

    function getConversationIdFromUrl() {

      const params =
        new URLSearchParams(
          location.search
        );

      return (
        params.get(
          "conversationId"
        ) || ""
      ).trim() || null;
    }


    /* =====================================================
       エラー表示
       ===================================================== */

    function getErrorText(
      error
    ) {

      if (!error) {
        return "不明なエラーが発生しました。";
      }

      const code =
        error.code || "";

      const message =
        error.message ||
        String(error);


      if (
        code.includes(
          "unavailable"
        ) ||
        message.includes(
          "UNAVAILABLE"
        )
      ) {

        return (
          "サーバーへの接続を確立できませんでした。\n" +
          "インターネット接続を確認して、もう一度お試しください。\n\n" +
          `${code || "UNAVAILABLE"}: ${message}`
        );
      }


      if (
        code.includes(
          "permission-denied"
        ) ||
        message.includes(
          "Missing or insufficient permissions"
        )
      ) {

        return (
          "会話データへのアクセスが拒否されました。\n" +
          "Firestore Rules またはアカウント権限を確認してください。\n\n" +
          `${code || "permission-denied"}: ${message}`
        );
      }


      if (
        code.includes(
          "401"
        ) ||
        message.includes(
          "401"
        )
      ) {

        return (
          "AIサーバーの認証に失敗しました。\n" +
          "Firebaseログイン情報またはAIサーバー側の認証設定を確認してください。\n\n" +
          message
        );
      }


      return (
        message
      );
    }


    function showError(
      error
    ) {

      console.error(
        "Chat error:",
        error
      );

      errorText.textContent =
        getErrorText(error);

      errorBox.hidden =
        false;
    }


    function clearError() {

      errorText.textContent =
        "";

      errorBox.hidden =
        true;
    }


    /* =====================================================
       日時
       ===================================================== */

    function formatDate(
      value
    ) {

      if (!value) {
        return "";
      }

      try {

        const date =
          typeof value.toDate ===
          "function"
            ? value.toDate()
            : new Date(value);

        if (
          Number.isNaN(
            date.getTime()
          )
        ) {
          return "";
        }

        return new Intl.DateTimeFormat(
          "ja-JP",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        ).format(date);

      } catch {

        return "";
      }
    }


    /* =====================================================
       メッセージ表示
       ===================================================== */

    function addMessage(
      role,
      content,
      options = {}
    ) {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        `message-row ${role}`;


      const message =
        document.createElement(
          "article"
        );

      message.className =
        `message ${role}`;


      if (
        options.error === true
      ) {

        message.classList.add(
          "error"
        );
      }


      if (
        role ===
        "assistant"
      ) {

        const label =
          document.createElement(
            "div"
          );

        label.className =
          "assistant-label";

        label.textContent =
          "学習AI";

        message.appendChild(
          label
        );
      }


      const contentElement =
        document.createElement(
          "div"
        );

      contentElement.className =
        "message-content";

      contentElement.textContent =
        String(
          content || ""
        );


      message.appendChild(
        contentElement
      );


      if (
        options.time
      ) {

        const time =
          document.createElement(
            "div"
          );

        time.className =
          "message-time";

        time.textContent =
          options.time;

        message.appendChild(
          time
        );
      }


      row.appendChild(
        message
      );

      conversation.appendChild(
        row
      );


      scrollToBottom();

      return row;
    }


    /* =====================================================
       タイピング表示
       ===================================================== */

    function showTyping() {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "typing-row";

      row.id =
        "typingIndicator";


      const message =
        document.createElement(
          "div"
        );

      message.className =
        "typing-message";

      for (
        let i = 0;
        i < 3;
        i++
      ) {

        const dot =
          document.createElement(
            "span"
          );

        dot.className =
          "typing-dot";

        dot.setAttribute(
          "aria-hidden",
          "true"
        );

        message.appendChild(
          dot
        );
      }


      row.appendChild(
        message
      );

      conversation.appendChild(
        row
      );

      scrollToBottom();

      return row;
    }


    function hideTyping() {

      const indicator =
        document.getElementById(
          "typingIndicator"
        );

      if (indicator) {
        indicator.remove();
      }
    }


    /* =====================================================
       スクロール
       ===================================================== */

    function scrollToBottom() {

      requestAnimationFrame(
        () => {

          window.scrollTo(
            {
              top:
                document.documentElement
                  .scrollHeight,

              behavior:
                "smooth"
            }
          );

        }
      );
    }


    /* =====================================================
       入力欄
       ===================================================== */

    function resizeInput() {

      input.style.height =
        "auto";

      input.style.height =
        Math.min(
          input.scrollHeight,
          180
        ) + "px";
    }


    input.addEventListener(
      "input",
      resizeInput
    );


    input.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          form.requestSubmit();
        }

      }
    );


    /* =====================================================
       会話描画
       ===================================================== */

    function clearConversation() {

      conversation.replaceChildren();

      intro.hidden =
        false;

      clearError();
    }


    function renderConversation(
      data
    ) {

      conversation.replaceChildren();

      intro.hidden =
        true;


      const conversationData =
        data?.conversation ||
        data;


      const messages =
        Array.isArray(
          conversationData?.messages
        )
          ? conversationData.messages
          : [];


      for (
        const item of messages
      ) {

        if (
          !item ||
          typeof item.content !==
            "string"
        ) {
          continue;
        }


        if (
          item.role !==
            "user" &&
          item.role !==
            "assistant"
        ) {
          continue;
        }


        addMessage(
          item.role,
          item.content
        );
      }


      scrollToBottom();
    }


    /* =====================================================
       会話読み込み
       ===================================================== */

    async function loadConversation() {

      const id =
        getConversationIdFromUrl();

      if (!id) {
        return;
      }


      conversationId =
        id;


      statusText.textContent =
        "会話を読み込んでいます...";


      try {

        await persistenceReady;


        const data =
          await getConversation(
            id
          );


        renderConversation(
          data
        );


        statusText.textContent =
          "会話を続けられます。";


      } catch (error) {

        /*
          会話取得失敗でも
          ページそのものは壊さない。
        */

        console.error(
          "会話取得エラー:",
          error
        );


        statusText.textContent =
          "新しい質問を入力できます。";


        showError(
          error
        );
      }
    }


    /* =====================================================
       新しい会話
       ===================================================== */

    newChatButton.addEventListener(
      "click",
      () => {

        conversationId =
          null;

        history.replaceState(
          {},
          "",
          "question.html"
        );

        clearConversation();

        statusText.textContent =
          "新しい学習を始めましょう。";

        input.focus();
      }
    );


    /* =====================================================
       送信
       ===================================================== */

    form.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        if (sending) {
          return;
        }


        const question =
          input.value.trim();


        if (!question) {

          input.focus();

          return;
        }


        clearError();


        sending =
          true;


        sendButton.disabled =
          true;


        input.disabled =
          true;


        intro.hidden =
          true;


        /*
          ユーザーの質問を即座に右側へ表示
        */

        addMessage(
          "user",
          question,
          {
            time:
              new Intl.DateTimeFormat(
                "ja-JP",
                {
                  hour:
                    "2-digit",

                  minute:
                    "2-digit"
                }
              ).format(
                new Date()
              )
          }
        );


        input.value =
          "";

        resizeInput();


        /*
          AI回答待ち
        */

        const typing =
          showTyping();


        statusText.textContent =
          "AIが回答を作成しています...";


        try {

          await persistenceReady;


          const result =
            await sendStudyQuestion(
              question,
              conversationId
            );


          /*
            会話IDを必ず保持
          */

          if (
            result?.conversationId
          ) {

            conversationId =
              result.conversationId;


            history.replaceState(
              {},
              "",
              `question.html?conversationId=${encodeURIComponent(
                conversationId
              )}`
            );
          }


          hideTyping();


          /*
            AI回答
          */

          addMessage(
            "assistant",
            result?.answer ||
              "回答を取得できませんでした。"
          );


          statusText.textContent =
            "質問を入力してください。";


        } catch (error) {

          hideTyping();


          console.error(
            "AI回答エラー:",
            error
          );


          /*
            送信済みの質問は残す。
            エラーだけ左側に表示。
          */

          addMessage(
            "assistant",
            getErrorText(
              error
            ),
            {
              error:
                true
            }
          );


          statusText.textContent =
            "回答を取得できませんでした。";


          showError(
            error
          );

        } finally {

          sending =
            false;

          sendButton.disabled =
            false;

          input.disabled =
            false;

          input.focus();

        }

      }
    );


    /* =====================================================
       初期化
       ===================================================== */

    async function initialize() {

      /*
        サイドバーはここでは触らない。

        Firebaseが失敗しても
        sidebar.jsによって既に表示済み。
      */

      try {

        await persistenceReady;

        await loadConversation();

      } catch (error) {

        /*
          Firebase初期化エラーでも
          チャット画面は残す。
        */

        console.error(
          "Chat initialization error:",
          error
        );


        statusText.textContent =
          "接続を確認できませんでした。";


        showError(
          error
        );
      }


      /*
        最初から入力欄にフォーカス
      */

      input.focus();

    }


    initialize();

  </script>

</body>
</html>
