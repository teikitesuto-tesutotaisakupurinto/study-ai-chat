<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#f5f7fb"
  >

  <title>AIに質問 | 学習AIチャット</title>

  <link
    rel="stylesheet"
    href="../assets/css/student.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family:
        Arial,
        "Noto Sans JP",
        sans-serif;

      background: #f5f7fb;
      color: #202124;
    }

    [hidden] {
      display: none !important;
    }

    .app-shell {
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;

      width: 270px;

      background: #ffffff;

      border-right:
        1px solid #e1e5ec;

      overflow-y: auto;

      z-index: 1000;
    }

    .main-area {
      margin-left: 270px;

      min-height: 100vh;

      display: flex;
      flex-direction: column;
    }

    .content {
      width: 100%;
      max-width: 1000px;

      margin: 0 auto;

      padding: 32px 24px;

      flex: 1;
    }

    .page-header {
      margin-bottom: 20px;
    }

    .page-header h1 {
      margin: 0 0 6px;
      font-size: 26px;
    }

    .page-header p {
      margin: 0;
      color: #667085;
    }

    .chat-card {
      background: #fff;

      border:
        1px solid #e0e5ed;

      border-radius: 14px;

      overflow: hidden;

      box-shadow:
        0 4px 18px
        rgba(0, 0, 0, .04);
    }

    .chat-status {
      min-height: 42px;

      padding: 12px 18px;

      border-bottom:
        1px solid #edf0f4;

      color: #667085;

      font-size: 13px;
    }

    .chat-status[data-type="error"] {
      color: #b42318;
      background: #fff6f5;
    }

    .chat-status[data-type="success"] {
      color: #067647;
      background: #f0fdf4;
    }

    .chat-messages {
      min-height: 440px;
      max-height: 62vh;

      overflow-y: auto;

      padding: 24px;
    }

    .chat-empty {
      padding: 80px 20px;

      text-align: center;

      color: #98a2b3;
    }

    .chat-message {
      max-width: 82%;

      margin-bottom: 20px;

      padding: 15px 17px;

      border-radius: 12px;

      line-height: 1.8;

      white-space: pre-wrap;

      overflow-wrap: anywhere;
    }

    .chat-message.user {
      margin-left: auto;

      background: #e8f0fe;
    }

    .chat-message.assistant {
      margin-right: auto;

      background: #f5f7fa;

      border:
        1px solid #e4e7ec;
    }

    .chat-message-role {
      margin-bottom: 7px;

      font-size: 12px;

      font-weight: 700;

      color: #667085;
    }

    .chat-message-content {
      font-size: 15px;
    }

    .chat-message-time {
      display: block;

      margin-top: 8px;

      font-size: 11px;

      color: #98a2b3;
    }

    .question-form {
      padding: 18px;

      border-top:
        1px solid #e7eaf0;

      background: #fff;
    }

    .question-input {
      width: 100%;

      min-height: 110px;

      resize: vertical;

      padding: 13px 14px;

      border:
        1px solid #cbd2dc;

      border-radius: 9px;

      font:
        inherit;

      line-height: 1.7;
    }

    .question-input:focus {
      outline: 2px solid #1a73e8;
      outline-offset: 1px;
      border-color: #1a73e8;
    }

    .question-actions {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

      margin-top: 12px;
    }

    .question-help {
      margin: 0;

      color: #667085;

      font-size: 12px;
    }

    .send-button {
      min-width: 150px;

      padding: 12px 18px;

      border: 0;

      border-radius: 8px;

      background: #1a73e8;

      color: #fff;

      font-size: 14px;

      font-weight: 600;

      cursor: pointer;
    }

    .send-button:hover {
      background: #155fc0;
    }

    .send-button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .app-footer {
      padding: 18px;

      color: #777;

      text-align: center;

      font-size: 11px;
    }

    .sidebar-header {
      padding: 22px 20px 12px;
    }

    .sidebar-brand-title {
      font-size: 18px;
    }

    .sidebar-toggle-row {
      padding: 0 14px 12px;
    }

    .sidebar-toggle {
      width: 100%;

      padding: 8px;

      border: 1px solid #dfe3ea;

      border-radius: 7px;

      background: #fff;

      cursor: pointer;
    }

    .sidebar-user {
      margin: 0 14px 12px;

      padding: 11px 12px;

      border-radius: 8px;

      background: #f5f7fb;

      font-size: 13px;

      overflow-wrap: anywhere;
    }

    .sidebar-nav {
      display: flex;

      flex-direction: column;

      padding: 0 10px;
    }

    .sidebar-link {
      display: flex;

      align-items: center;

      gap: 10px;

      width: 100%;

      padding: 11px 12px;

      margin-bottom: 3px;

      border: 0;

      border-radius: 7px;

      background: transparent;

      color: #344054;

      text-decoration: none;

      text-align: left;

      cursor: pointer;

      font-size: 14px;
    }

    .sidebar-link:hover {
      background: #f2f4f7;
    }

    .sidebar-link.active {
      background: #e8f0fe;

      color: #174ea6;

      font-weight: 600;
    }

    .sidebar-icon {
      width: 20px;

      text-align: center;

      flex: 0 0 20px;
    }

    .sidebar-history {
      margin-top: 15px;

      padding: 0 14px;
    }

    .sidebar-history-heading {
      margin: 0 0 8px;

      font-size: 12px;

      color: #667085;
    }

    .sidebar-history-list {
      display: flex;

      flex-direction: column;

      gap: 3px;
    }

    .sidebar-history-link {
      display: block;

      padding: 8px;

      border-radius: 6px;

      color: #344054;

      text-decoration: none;
    }

    .sidebar-history-link:hover {
      background: #f5f7fb;
    }

    .sidebar-history-title {
      display: block;

      font-size: 12px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .sidebar-history-date {
      display: block;

      margin-top: 3px;

      color: #98a2b3;

      font-size: 10px;
    }

    .layout-error {
      margin: 20px;

      padding: 14px;

      background: #fff6f5;

      border: 1px solid #f1b8b2;

      border-radius: 8px;

      color: #b42318;
    }

    @media (max-width: 700px) {
      .sidebar {
        width: 270px;

        transform:
          translateX(-100%);

        transition:
          transform .2s ease;
      }

      body.sidebar-expanded
      .sidebar {
        transform:
          translateX(0);
      }

      .main-area {
        margin-left: 0;
      }

      .content {
        padding: 22px 14px;
      }

      .chat-messages {
        min-height: 420px;

        max-height: none;
      }

      .chat-message {
        max-width: 94%;
      }

      .question-actions {
        flex-direction: column;

        align-items: stretch;
      }

      .send-button {
        width: 100%;
      }
    }

    @media (min-width: 701px) {
      body.sidebar-collapsed
      .sidebar {
        width: 72px;
      }

      body.sidebar-collapsed
      .main-area {
        margin-left: 72px;
      }

      body.sidebar-collapsed
      .sidebar-label,
      body.sidebar-collapsed
      .sidebar-history,
      body.sidebar-collapsed
      .sidebar-user,
      body.sidebar-collapsed
      .sidebar-brand-title {
        display: none;
      }
    }
  </style>
</head>

<body data-role="student">

  <div class="app-shell">

    <aside
      id="appSidebar"
      class="sidebar"
      aria-label="サイドメニュー"
    ></aside>

    <div class="main-area">

      <main class="content">

        <header class="page-header">

          <h1>
            AIに質問
          </h1>

          <p>
            学習について質問してください。
          </p>

        </header>

        <section
          class="chat-card"
          aria-label="学習AIチャット"
        >

          <div
            id="chatStatus"
            class="chat-status"
          >
            会話を準備しています。
          </div>

          <div
            id="chatMessages"
            class="chat-messages"
          >
            <div class="chat-empty">
              会話を準備しています。
            </div>
          </div>

          <form
            id="questionForm"
            class="question-form"
          >

            <textarea
              id="questionInput"
              class="question-input"
              maxlength="4000"
              placeholder="学習について質問してください。"
              aria-label="質問"
            ></textarea>

            <div
              class="question-actions"
            >

              <p
                class="question-help"
              >
                Enterで送信・Shift + Enterで改行
              </p>

              <button
                id="sendButton"
                class="send-button"
                type="submit"
              >
                質問する
              </button>

            </div>

          </form>

        </section>

      </main>

      <footer
        class="app-footer"
      >
        © 2026 Regular Test Preparation Worksheet Administration Office. All Rights Reserved.
      </footer>

    </div>

  </div>

  <script
    type="module"
    src="../assets/js/layout.js"
  ></script>

  <script type="module">
    import {
      initializeStudentPage
    } from "../assets/js/page.js";

    initializeStudentPage()
      .catch(error => {
        console.error(
          "質問画面初期化エラー:",
          error
        );
      });
  </script>

</body>
</html>
