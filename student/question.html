<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="theme-color"
    content="#f5f7fb"
  >

  <title>AIに質問 | 学習AIチャット</title>

  <link
    rel="stylesheet"
    href="../assets/css/student.css"
  >

  <style>
    html.auth-pending body {
      overflow: hidden;
    }

    #pageLoading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fb;
    }

    #pageLoading[hidden] {
      display: none;
    }

    .page-loading-box {
      width: min(420px, calc(100vw - 32px));
      padding: 32px;
      background: #fff;
      border: 1px solid #e2e6ee;
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .06);
      text-align: center;
    }

    .page-loading-title {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 700;
    }

    .page-loading-message {
      margin: 0;
      color: #5f6368;
      font-size: 14px;
      line-height: 1.8;
    }

    .question-page {
      display: flex;
      min-height: 100vh;
    }

    .question-main {
      flex: 1;
      min-width: 0;
      padding: 32px;
    }

    .question-container {
      width: min(100%, 900px);
      margin: 0 auto;
    }

    .question-header {
      margin-bottom: 20px;
    }

    .question-header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .question-header p {
      margin: 0;
      color: #5f6368;
      line-height: 1.7;
    }

    .conversation-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding: 12px 16px;
      background: #fff;
      border: 1px solid #e2e6ee;
      border-radius: 10px;
    }

    .conversation-info {
      min-width: 0;
    }

    .conversation-title {
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .conversation-id {
      margin-top: 3px;
      color: #777;
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .new-conversation-button {
      flex: 0 0 auto;
      padding: 9px 14px;
      border: 1px solid #c8ced8;
      border-radius: 7px;
      background: #fff;
      color: #202124;
      cursor: pointer;
    }

    .new-conversation-button:hover {
      background: #f5f7fb;
    }

    .chat-card {
      display: flex;
      flex-direction: column;
      min-height: 620px;
      background: #fff;
      border: 1px solid #e2e6ee;
      border-radius: 14px;
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }

    .empty-chat {
      display: flex;
      min-height: 420px;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #5f6368;
    }

    .empty-chat-inner {
      width: min(600px, 100%);
    }

    .empty-chat h2 {
      margin: 0 0 12px;
      color: #202124;
      font-size: 22px;
    }

    .empty-chat p {
      margin: 0;
      line-height: 1.8;
    }

    .message-row {
      display: flex;
      margin-bottom: 22px;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.assistant {
      justify-content: flex-start;
    }

    .message-bubble {
      width: min(85%, 760px);
      padding: 14px 16px;
      border-radius: 12px;
      line-height: 1.8;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .message-row.user .message-bubble {
      background: #1a73e8;
      color: #fff;
    }

    .message-row.assistant .message-bubble {
      background: #f1f3f4;
      color: #202124;
    }

    .message-meta {
      margin-top: 6px;
      color: #777;
      font-size: 10px;
    }

    .message-row.user .message-meta {
      text-align: right;
    }

    .response-id {
      display: block;
      margin-top: 3px;
      color: #8a8a8a;
      font-size: 9px;
      word-break: break-all;
    }

    .chat-form {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid #e2e6ee;
      background: #fff;
    }

    .chat-input {
      flex: 1;
      min-height: 52px;
      max-height: 180px;
      resize: vertical;
      padding: 13px 14px;
      border: 1px solid #c8ced8;
      border-radius: 9px;
      font: inherit;
      line-height: 1.6;
    }

    .chat-input:focus {
      outline: 2px solid #1a73e8;
      outline-offset: 1px;
      border-color: #1a73e8;
    }

    .send-button {
      flex: 0 0 auto;
      min-width: 100px;
      height: 52px;
      padding: 0 18px;
      border: 0;
      border-radius: 9px;
      background: #1a73e8;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .send-button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .chat-error {
      margin: 0 16px 16px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #fff2f0;
      color: #b3261e;
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .chat-error[hidden] {
      display: none;
    }

    @media (max-width: 700px) {
      .question-main {
        padding: 16px;
      }

      .question-header h1 {
        font-size: 23px;
      }

      .chat-card {
        min-height: calc(100vh - 170px);
      }

      .message-bubble {
        width: 92%;
      }

      .chat-form {
        flex-direction: column;
        align-items: stretch;
      }

      .send-button {
        width: 100%;
      }

      .conversation-bar {
        align-items: stretch;
        flex-direction: column;
      }
    }
  </style>
</head>

<body
  data-role="student"
  class="student-page"
>

  <div id="pageLoading">
    <div class="page-loading-box">
      <p class="page-loading-title">
        学習AIチャット
      </p>

      <p
        id="pageLoadingMessage"
        class="page-loading-message"
      >
        ログイン状態を確認しています。
      </p>
    </div>
  </div>

  <div class="app-shell">

    <aside
      id="appSidebar"
      class="sidebar"
      aria-label="サイドメニュー"
    ></aside>

    <main class="question-main">
      <div class="question-container">

        <header class="question-header">
          <h1>AIに質問</h1>
          <p>
            学習に関する質問を入力してください。
            この画面から会話を続けることができます。
          </p>
        </header>

        <section class="conversation-bar">
          <div class="conversation-info">
            <div
              id="conversationTitle"
              class="conversation-title"
            >
              新しい会話
            </div>

            <div
              id="conversationId"
              class="conversation-id"
            ></div>
          </div>

          <button
            id="newConversationButton"
            class="new-conversation-button"
            type="button"
          >
            新しい会話
          </button>
        </section>

        <section class="chat-card">

          <div
            id="chatMessages"
            class="chat-messages"
          >
            <div
              id="emptyChat"
              class="empty-chat"
            >
              <div class="empty-chat-inner">
                <h2>何を勉強しますか？</h2>
                <p>
                  数学、英語、国語、理科、社会など、
                  学習に関する質問を入力してください。
                </p>
              </div>
            </div>
          </div>

          <div
            id="chatError"
            class="chat-error"
            role="alert"
            hidden
          ></div>

          <form
            id="chatForm"
            class="chat-form"
          >
            <textarea
              id="chatInput"
              class="chat-input"
              maxlength="4000"
              placeholder="学習について質問してください"
              aria-label="質問内容"
              required
            ></textarea>

            <button
              id="sendButton"
              class="send-button"
              type="submit"
            >
              送信
            </button>
          </form>

        </section>

        <footer class="app-footer">
          © 2026 Regular Test Preparation Worksheet Administration Office. All Rights Reserved.
        </footer>

      </div>
    </main>

  </div>

  <script type="module">
    import {
      protectPage
    } from "../assets/js/auth.js";

    import {
      startLayout
    } from "../assets/js/layout.js";

    import {
      initializeQuestionPage
    } from "../assets/js/page.js";

    const loading = document.getElementById("pageLoading");
    const loadingMessage =
      document.getElementById("pageLoadingMessage");

    function hideLoading() {
      loading.hidden = true;
      document.documentElement.classList.remove("auth-pending");
    }

    function showLoadingMessage(message) {
      loading.hidden = false;
      loadingMessage.textContent = message;
    }

    async function start() {
      try {
        showLoadingMessage(
          "ログイン状態を確認しています。"
        );

        const result = await protectPage("student");

        if (!result) {
          return;
        }

        showLoadingMessage(
          "画面を準備しています。"
        );

        await startLayout();

        await initializeQuestionPage({
          user: result.user,
          profile: result.profile,
          settings: result.settings
        });

        hideLoading();

      } catch (error) {
        console.error(
          "質問ページ初期化エラー:",
          error
        );

        showLoadingMessage(
          "画面の初期化に失敗しました。"
        );

        const message =
          error?.message ||
          String(error);

        const errorBox =
          document.getElementById("chatError");

        if (errorBox) {
          errorBox.hidden = false;
          errorBox.textContent =
            "質問画面を初期化できませんでした。\n" +
            message;
        }

        hideLoading();
      }
    }

    start();
  </script>

</body>
</html>
