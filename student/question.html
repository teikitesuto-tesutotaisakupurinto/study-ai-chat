
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>AIに質問 | 学習AIチャット</title>
  <link rel="stylesheet" href="../assets/css/common.css">

  <style>
    :root {
      --ai-primary: #2563eb;
      --ai-border: #e5e7eb;
      --ai-muted: #64748b;
    }

    body {
      background: #f7f8fa;
    }

    [hidden] {
      display: none !important;
    }

    .app-main {
      padding: 0;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 24px;
      background: #fff;
      border-bottom: 1px solid var(--ai-border);
    }

    .chat-header h1 {
      margin: 0;
      font-size: 21px;
    }

    .chat-header p {
      margin: 5px 0 0;
      color: var(--ai-muted);
      font-size: 13px;
    }

    .new-chat-button {
      flex-shrink: 0;
    }

    .chat-content {
      display: flex;
      flex: 1;
      flex-direction: column;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px;
    }

    .subject-panel {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .subject-panel label {
      flex-shrink: 0;
      font-size: 14px;
      font-weight: 600;
    }

    .subject-panel select {
      width: 220px;
      max-width: 100%;
      padding: 11px 12px;
      background: #fff;
      font-size: 15px;
    }

    .conversation {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 18px;
      min-height: 280px;
      padding-bottom: 24px;
    }

    .welcome {
      max-width: 550px;
      margin: auto;
      padding: 30px 10px;
      text-align: center;
    }

    .welcome h2 {
      margin: 0 0 12px;
      font-size: 25px;
      font-weight: 600;
    }

    .welcome p {
      margin: 0;
      color: var(--ai-muted);
      line-height: 1.8;
    }

    .message {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 85%;
    }

    .message.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message.assistant {
      align-self: flex-start;
      align-items: flex-start;
    }

    .message-role {
      color: var(--ai-muted);
      font-size: 12px;
    }

    .message-content {
      padding: 14px 16px;
      border: 1px solid var(--ai-border);
      border-radius: 12px;
      background: #fff;
      line-height: 1.85;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .message.user .message-content {
      background: #eaf2ff;
      border-color: #d7e5ff;
    }

    .message.error .message-content {
      background: #fff4f2;
      border-color: #f3c8c3;
      color: #a12b22;
    }

    .typing {
      align-self: flex-start;
      padding: 12px 14px;
      border: 1px solid var(--ai-border);
      border-radius: 10px;
      background: white;
      color: var(--ai-muted);
      font-size: 13px;
    }

    .composer {
      position: sticky;
      bottom: 0;
      padding: 14px 0 18px;
      background: #f7f8fa;
    }

    .composer-box {
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      background: white;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .04);
    }

    #questionInput {
      display: block;
      width: 100%;
      min-height: 90px;
      max-height: 260px;
      padding: 8px;
      resize: vertical;
      border: 0;
      outline: none;
      background: transparent;
      color: #202124;
      line-height: 1.7;
    }

    #questionInput:focus-visible {
      outline: 2px solid rgba(37, 99, 235, .35);
      outline-offset: 2px;
    }

    .composer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px;
    }

    .composer-hint {
      color: var(--ai-muted);
      font-size: 12px;
    }

    #sendButton {
      min-width: 100px;
      border-color: var(--ai-primary);
      background: var(--ai-primary);
      color: #fff;
      font-weight: 600;
    }

    #sendButton:hover:not(:disabled) {
      background: #1d4ed8;
    }

    .notice {
      margin: 12px 0 0;
      color: var(--ai-muted);
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
    }

    .status-message {
      margin: 8px 0;
      color: #b42318;
      font-size: 13px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .app-footer {
      padding: 18px;
      text-align: center;
      color: var(--ai-muted);
      font-size: 11px;
    }

    @media (max-width: 700px) {
      .chat-header {
        padding: 14px;
      }

      .chat-header h1 {
        font-size: 18px;
      }

      .chat-content {
        padding: 14px;
      }

      .subject-panel {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }

      .subject-panel select {
        width: 100%;
      }

      .message {
        max-width: 95%;
      }

      .composer-hint {
        max-width: 60%;
      }
    }
  </style>
</head>

<body data-role="student">
  <div class="app-layout">
    <aside id="appSidebar" class="sidebar"></aside>

    <main id="appMain" class="app-main">
      <header class="chat-header">
        <div>
          <h1>学習AIチャット</h1>
          <p>中学校の学習をサポートします</p>
        </div>
        <button id="newChatButton" class="new-chat-button" type="button">
          新しい質問
        </button>
      </header>

      <section class="chat-content">
        <div class="subject-panel">
          <label for="subjectSelect">質問する教科</label>
          <select id="subjectSelect">
            <option value="国語">国語</option>
            <option value="数学" selected>数学</option>
            <option value="英語">英語</option>
            <option value="理科">理科</option>
            <option value="社会">社会</option>
            <option value="音楽">音楽</option>
            <option value="美術">美術</option>
            <option value="保健体育">保健体育</option>
            <option value="技術家庭">技術家庭</option>
          </select>
        </div>

        <div id="conversation" class="conversation" aria-live="polite">
          <div id="welcomeMessage" class="welcome">
            <h2>何を勉強していますか？</h2>
            <p>わからない問題や授業で習った内容を入力してください。中学生にもわかりやすく説明します。</p>
          </div>
        </div>

        <p id="statusMessage" class="status-message" role="alert" hidden></p>

        <form id="questionForm" class="composer">
          <div class="composer-box">
            <textarea
              id="questionInput"
              maxlength="5000"
              placeholder="学習について質問してください..."
              aria-label="質問内容"
              required
            ></textarea>

            <div class="composer-bottom">
              <span class="composer-hint">Enterで送信・Shift+Enterで改行</span>
              <button id="sendButton" class="primary-button" type="submit">
                質問する
              </button>
            </div>
          </div>

          <p class="notice">このAIは学習専用です。学習以外の質問には対応していません。</p>
        </form>
      </section>

      <footer class="app-footer">
        © 2026 Regular Test Preparation Worksheet Administration Office. All Rights Reserved.
      </footer>
    </main>
  </div>

  <script type="module">
    import {
      auth,
      db,
      persistenceReady,
      doc,
      collection,
      getDoc,
      setDoc,
      updateDoc,
      serverTimestamp
    } from "../assets/js/firebase.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    const SUPABASE_FUNCTION_URL =
      "https://fjqobjcvejhkevyfsoxt.supabase.co/functions/v1/study-chat";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_j6QpWj-1v86qkWHmXM8F3Q_Ieipaa3q";

    const $ = id => document.getElementById(id);

    const conversation = $("conversation");
    const welcomeMessage = $("welcomeMessage");
    const questionForm = $("questionForm");
    const questionInput = $("questionInput");
    const subjectSelect = $("subjectSelect");
    const sendButton = $("sendButton");
    const statusMessage = $("statusMessage");

    const ALLOWED_SUBJECTS = [
      "国語", "数学", "英語", "理科", "社会",
      "音楽", "美術", "保健体育", "技術家庭"
    ];

    const NON_STUDY_RESPONSE =
      "このAIは学習専用です。学習以外の質問はできません。";

    let currentUser = null;
    let currentProfile = null;
    let currentHistoryId = null;
    let messages = [];
    let sending = false;

    function waitForFirstAuthState() {
      return new Promise((resolve, reject) => {
        let unsubscribe = () => {};

        unsubscribe = onAuthStateChanged(
          auth,
          user => {
            unsubscribe();
            resolve(user);
          },
          error => {
            unsubscribe();
            reject(error);
          }
        );
      });
    }

    function showFatalError(title, message, detail = "") {
      document.documentElement.classList.remove("auth-pending");
      document.body.replaceChildren();

      const main = document.createElement("main");
      main.className = "auth-error";

      const heading = document.createElement("h1");
      heading.textContent = title;

      const description = document.createElement("p");
      description.textContent = message;

      main.append(heading, description);

      if (detail) {
        const pre = document.createElement("pre");
        pre.textContent = detail;
        main.append(pre);
      }

      const retry = document.createElement("button");
      retry.type = "button";
      retry.textContent = "再読み込み";
      retry.addEventListener("click", () => location.reload());
      main.append(retry);

      const link = document.createElement("a");
      link.href = "../login.html";
      link.className = "button";
      link.textContent = "ログイン画面へ";
      main.append(link);

      document.body.append(main);
    }

    async function checkAccess() {
      await persistenceReady;
      currentUser = await waitForFirstAuthState();

      if (!currentUser) {
        location.replace("../login.html");
        return false;
      }

      const userSnapshot = await getDoc(
        doc(db, "users", currentUser.uid)
      );

      if (!userSnapshot.exists()) {
        showFatalError(
          "ユーザープロフィールがありません",
          "ログインはできていますが、users/{uid} にプロフィールがありません。管理者に確認してください。"
        );
        return false;
      }

      currentProfile = userSnapshot.data();

      if (currentProfile.status !== "active") {
        showFatalError(
          "アカウント利用不可",
          "このアカウントは無効化されています。管理者にお問い合わせください。"
        );
        return false;
      }

      if (currentProfile.role !== "student") {
        location.replace("../403.html");
        return false;
      }

      const settingsSnapshot = await getDoc(
        doc(db, "settings", "system")
      );

      if (!settingsSnapshot.exists()) {
        throw new Error(
          "Firestore の settings/system がありません。必要なデータを作成してください。"
        );
      }

      if (settingsSnapshot.data().maintenance === true) {
        location.replace("../maintenance.html");
        return false;
      }

      return true;
    }

    function showStatus(message) {
      statusMessage.textContent = message;
      statusMessage.hidden = !message;
    }

    function renderMessage(role, content, isError = false) {
      welcomeMessage.hidden = true;

      const wrapper = document.createElement("div");
      wrapper.className = `message ${role}`;

      if (isError) wrapper.classList.add("error");

      const roleLabel = document.createElement("div");
      roleLabel.className = "message-role";
      roleLabel.textContent = role === "user" ? "あなた" : "学習AI";

      const body = document.createElement("div");
      body.className = "message-content";
      body.textContent = content;

      wrapper.append(roleLabel, body);
      conversation.append(wrapper);
      wrapper.scrollIntoView({ behavior: "smooth", block: "nearest" });

      return wrapper;
    }

    function showTyping() {
      const element = document.createElement("div");
      element.className = "typing";
      element.id = "typingIndicator";
      element.textContent = "回答を作成しています...";
      conversation.append(element);
      element.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function hideTyping() {
      $("typingIndicator")?.remove();
    }

    function setSending(value) {
      sending = value;
      sendButton.disabled = value;
      subjectSelect.disabled = value;
      questionInput.disabled = value;
      $("newChatButton").disabled = value;
      sendButton.textContent = value ? "回答中..." : "質問する";
    }

    function normalizeAnswer(data) {
      if (typeof data === "string") return data;
      if (typeof data?.answer === "string") return data.answer;
      if (typeof data?.response === "string") return data.response;
      if (typeof data?.message === "string") return data.message;
      return "";
    }

    function looksLikeNonStudyRequest(text) {
      const value = text.trim();

      const nonStudyTerms =
        /恋愛相談|占って|雑談しよう|今日の天気|株価|投資|おすすめの店|レストラン|旅行プラン|買い物|商品を買いたい|動画を探して|音楽を流して|パスワードを教えて|ハッキング|ウイルスを作って|勉強と関係ない/;

      const studyTerms =
        /勉強|学習|問題|宿題|テスト|試験|解説|説明|教えて|計算|方程式|関数|図形|英文|文法|単語|漢字|歴史|地理|公民|化学|物理|生物|地学|作文|読解|公式|用語|添削|翻訳|和訳|英訳|要約|古文|漢文|電流|地層|植物|人体|実験|観察|発音|リスニング|記述問題/;

      return nonStudyTerms.test(value) && !studyTerms.test(value);
    }

    async function callAI(message, subject) {
      const token = await currentUser.getIdToken();

      const response = await fetch(SUPABASE_FUNCTION_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_PUBLISHABLE_KEY,
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({
          message,
          grade: currentProfile.grade || "中学生",
          subject,
          history: messages.slice(-12).map(item => ({
            role: item.role,
            content: item.content
          }))
        })
      });

      const raw = await response.text();
      let data;

      try {
        data = JSON.parse(raw);
      } catch {
        data = { message: raw };
      }

      if (!response.ok) {
        throw new Error(
          `${data.message || data.error || `HTTP ${response.status}`}\nAIサーバーの認証設定とログを確認してください。`
        );
      }

      const answer = normalizeAnswer(data);

      if (!answer) {
        throw new Error(
          "AIサーバーの応答に answer / response / message がありません。Edge Function の返却形式を確認してください。"
        );
      }

      return answer;
    }

    async function saveConversation() {
      if (!currentUser || !currentHistoryId) return;

      const historyRef = doc(db, "chatHistories", currentHistoryId);
      const snapshot = await getDoc(historyRef);

      const payload = {
        userId: currentUser.uid,
        subject: subjectSelect.value,
        grade: currentProfile.grade || "中学生",
        messages,
        updatedAt: serverTimestamp()
      };

      if (snapshot.exists()) {
        if (snapshot.data().userId !== currentUser.uid) {
          throw new Error("この会話履歴を変更する権限がありません。");
        }

        await updateDoc(historyRef, payload);
      } else {
        await setDoc(historyRef, {
          ...payload,
          createdAt: serverTimestamp()
        });
      }
    }

    async function createConversation() {
      const historyRef = doc(collection(db, "chatHistories"));

      await setDoc(historyRef, {
        userId: currentUser.uid,
        subject: subjectSelect.value,
        grade: currentProfile.grade || "中学生",
        messages: [],
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });

      currentHistoryId = historyRef.id;
      messages = [];

      localStorage.setItem(
        `studyAIConversation:${currentUser.uid}`,
        currentHistoryId
      );
    }

    async function restoreConversation() {
      const storageKey =
        `studyAIConversation:${currentUser.uid}`;

      const storedId = localStorage.getItem(storageKey);

      if (!storedId) {
        await createConversation();
        return;
      }

      const historyRef = doc(db, "chatHistories", storedId);
      const snapshot = await getDoc(historyRef);

      if (
        !snapshot.exists() ||
        snapshot.data().userId !== currentUser.uid
      ) {
        await createConversation();
        return;
      }

      currentHistoryId = storedId;
      const data = snapshot.data();

      messages = Array.isArray(data.messages)
        ? data.messages.filter(item =>
            item &&
            ["user", "assistant"].includes(item.role) &&
            typeof item.content === "string"
          )
        : [];

      if (ALLOWED_SUBJECTS.includes(data.subject)) {
        subjectSelect.value = data.subject;
      }

      conversation.replaceChildren();
      conversation.append(welcomeMessage);
      welcomeMessage.hidden = messages.length > 0;

      for (const item of messages) {
        renderMessage(item.role, item.content);
      }
    }

    async function submitQuestion(event) {
      event.preventDefault();
      if (sending) return;

      showStatus("");

      const question = questionInput.value.trim();
      const subject = subjectSelect.value;

      if (!question) {
        showStatus("質問内容を入力してください。");
        return;
      }

      if (!ALLOWED_SUBJECTS.includes(subject)) {
        showStatus("正しい教科を選択してください。");
        return;
      }

      setSending(true);

      try {
        renderMessage("user", question);
        messages.push({ role: "user", content: question });
        questionInput.value = "";

        let answer;

        if (looksLikeNonStudyRequest(question)) {
          answer = NON_STUDY_RESPONSE;
        } else {
          showTyping();
          answer = await callAI(question, subject);
          hideTyping();
        }

        renderMessage("assistant", answer);
        messages.push({ role: "assistant", content: answer });

        await saveConversation();
      } catch (error) {
        hideTyping();
        console.error("AI質問エラー:", error);

        renderMessage(
          "assistant",
          error?.message || "回答を取得できませんでした。時間をおいて再度お試しください。",
          true
        );

        try {
          await saveConversation();
        } catch (saveError) {
          console.error("会話履歴保存エラー:", saveError);
          showStatus(
            `会話履歴を保存できませんでした。\n${saveError?.code || ""} ${saveError?.message || String(saveError)}`
          );
        }
      } finally {
        hideTyping();
        setSending(false);
        questionInput.focus();
      }
    }

    $("newChatButton").addEventListener("click", async () => {
      if (sending) return;

      showStatus("");

      try {
        await createConversation();
        conversation.replaceChildren();
        conversation.append(welcomeMessage);
        welcomeMessage.hidden = false;
        questionInput.value = "";
        questionInput.focus();
      } catch (error) {
        console.error("新しい会話の作成エラー:", error);
        showStatus(
          `新しい会話を作成できませんでした。\n${error?.code || ""} ${error?.message || String(error)}`
        );
      }
    });

    questionInput.addEventListener("keydown", event => {
      if (
        event.key === "Enter" &&
        !event.shiftKey &&
        !event.isComposing
      ) {
        event.preventDefault();
        questionForm.requestSubmit();
      }
    });

    questionForm.addEventListener("submit", submitQuestion);

    async function initializePage() {
      document.documentElement.classList.add("auth-pending");

      try {
        const allowed = await checkAccess();

        if (!allowed) return;

        await restoreConversation();

        document.documentElement.classList.remove("auth-pending");
      } catch (error) {
        console.error("AI画面初期化エラー:", error);

        showFatalError(
          error?.code === "permission-denied"
            ? "403 Forbidden"
            : "AI画面を開けません",
          "認証、Firestore の設定、または会話履歴のアクセス権限を確認してください。",
          `${error?.code || "error"}: ${error?.message || String(error)}`
        );
      }
    }

    await initializePage();
  </script>

  <script type="module" src="../assets/js/layout.js"></script>
</body>
</html>
