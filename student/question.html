<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>AIに質問 | 学習AIチャット</title>

  <link rel="stylesheet" href="../assets/css/student.css">

  <style>
    html.auth-pending body {
      visibility: hidden;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #202124;
      font-family:
        Arial,
        "Noto Sans JP",
        sans-serif;
    }

    .question-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px;
    }

    .question-header {
      margin-bottom: 20px;
    }

    .question-header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .question-header p {
      margin: 0;
      color: #5f6368;
      line-height: 1.7;
    }

    .conversation-info {
      margin-bottom: 16px;
      padding: 10px 14px;
      border: 1px solid #e1e5ec;
      border-radius: 8px;
      background: #fff;
      color: #6b7280;
      font-size: 12px;
    }

    .chat-card {
      background: #fff;
      border: 1px solid #e1e5ec;
      border-radius: 12px;
      overflow: hidden;
    }

    .chat-messages {
      min-height: 420px;
      max-height: 62vh;
      overflow-y: auto;
      padding: 24px;
    }

    .empty-chat {
      min-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #6b7280;
      line-height: 1.8;
    }

    .message {
      margin-bottom: 18px;
      display: flex;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.ai {
      justify-content: flex-start;
    }

    .message-box {
      max-width: 78%;
      padding: 14px 16px;
      border-radius: 12px;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.user .message-box {
      background: #1a73e8;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.ai .message-box {
      background: #f1f3f4;
      color: #202124;
      border-bottom-left-radius: 4px;
    }

    .answer-meta {
      margin-top: 7px;
      font-size: 10px;
      color: #777;
    }

    .message.user .answer-meta {
      text-align: right;
      color: #789;
    }

    .question-form {
      border-top: 1px solid #e1e5ec;
      padding: 16px;
      background: #fff;
    }

    .question-input {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      box-sizing: border-box;
      padding: 14px;
      border: 1px solid #c8ced8;
      border-radius: 8px;
      font-size: 16px;
      line-height: 1.7;
      font-family: inherit;
    }

    .question-input:focus {
      outline: 2px solid #1a73e8;
      outline-offset: 1px;
      border-color: #1a73e8;
    }

    .question-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
      gap: 8px;
    }

    .send-button {
      border: 0;
      border-radius: 7px;
      padding: 11px 22px;
      background: #1a73e8;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    .send-button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .new-conversation-button {
      border: 1px solid #c8ced8;
      border-radius: 7px;
      padding: 11px 16px;
      background: #fff;
      color: #202124;
      cursor: pointer;
    }

    .system-message {
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #fff8e1;
      color: #6d5600;
      line-height: 1.7;
      display: none;
    }

    .system-message.error {
      display: block;
      background: #fff2f0;
      color: #b3261e;
    }

    @media (max-width: 700px) {
      .question-page {
        padding: 16px;
      }

      .message-box {
        max-width: 90%;
      }

      .question-actions {
        flex-direction: column;
      }

      .send-button,
      .new-conversation-button {
        width: 100%;
      }
    }
  </style>
</head>

<body
  class="student-page"
  data-role="student"
>

  <aside id="appSidebar" class="sidebar"></aside>

  <div class="app-main">

    <main class="question-page">

      <header class="question-header">
        <h1>AIに質問</h1>
        <p>
          学習について分からないことをAIに質問できます。
        </p>
      </header>

      <div
        id="conversationInfo"
        class="conversation-info"
      >
        会話を準備しています。
      </div>

      <div
        id="systemMessage"
        class="system-message"
        role="alert"
      ></div>

      <section class="chat-card">

        <div
          id="chatMessages"
          class="chat-messages"
          aria-live="polite"
        >
          <div id="emptyChat" class="empty-chat">
            <div>
              <strong>学習AIチャット</strong><br>
              学習について質問してください。
            </div>
          </div>
        </div>

        <form
          id="questionForm"
          class="question-form"
        >

          <textarea
            id="questionInput"
            class="question-input"
            placeholder="学習について質問してください"
            maxlength="5000"
            required
          ></textarea>

          <div class="question-actions">

            <button
              id="newConversationButton"
              class="new-conversation-button"
              type="button"
            >
              新しい会話
            </button>

            <button
              id="sendButton"
              class="send-button"
              type="submit"
            >
              質問する
            </button>

          </div>

        </form>

      </section>

    </main>

    <footer class="app-footer">
      © 2026 Regular Test Preparation Worksheet Administration Office. All Rights Reserved.
    </footer>

  </div>

  <script type="module">

    import {
      protectPage
    } from "../assets/js/auth.js";

    import {
      initPage
    } from "../assets/js/page.js";

    const state = {
      user: null,
      profile: null,
      conversationId: null,
      messages: [],
      sending: false
    };

    const conversationInfo =
      document.getElementById("conversationInfo");

    const chatMessages =
      document.getElementById("chatMessages");

    const emptyChat =
      document.getElementById("emptyChat");

    const questionForm =
      document.getElementById("questionForm");

    const questionInput =
      document.getElementById("questionInput");

    const sendButton =
      document.getElementById("sendButton");

    const newConversationButton =
      document.getElementById("newConversationButton");

    const systemMessage =
      document.getElementById("systemMessage");

    function showSystemMessage(message) {
      systemMessage.textContent = message;
      systemMessage.classList.add("error");
    }

    function clearSystemMessage() {
      systemMessage.textContent = "";
      systemMessage.classList.remove("error");
    }

    function generateConversationId() {
      if (window.crypto && crypto.randomUUID) {
        return crypto.randomUUID();
      }

      return (
        "conv_" +
        Date.now().toString(36) +
        "_" +
        Math.random()
          .toString(36)
          .slice(2)
      );
    }

    function getConversationId() {

      const params =
        new URLSearchParams(location.search);

      return (
        params.get("conversationId") ||
        generateConversationId()
      );
    }

    function updateConversationUrl() {

      const url =
        new URL(location.href);

      url.searchParams.set(
        "conversationId",
        state.conversationId
      );

      history.replaceState(
        {},
        "",
        url
      );
    }

    function scrollToBottom() {

      chatMessages.scrollTop =
        chatMessages.scrollHeight;
    }

    function renderMessage(message) {

      if (emptyChat) {
        emptyChat.remove();
      }

      const wrapper =
        document.createElement("div");

      wrapper.className =
        `message ${message.role === "user" ? "user" : "ai"}`;

      const box =
        document.createElement("div");

      box.className =
        "message-box";

      box.textContent =
        message.content || "";

      const meta =
        document.createElement("div");

      meta.className =
        "answer-meta";

      if (message.answerId) {
        meta.textContent =
          `回答ID: ${message.answerId}`;
      }

      box.appendChild(meta);
      wrapper.appendChild(box);
      chatMessages.appendChild(wrapper);
    }

    function renderAllMessages() {

      chatMessages.replaceChildren();

      if (!state.messages.length) {

        const empty =
          document.createElement("div");

        empty.id = "emptyChat";
        empty.className = "empty-chat";

        empty.innerHTML =
          "<div><strong>学習AIチャット</strong><br>" +
          "学習について質問してください。</div>";

        chatMessages.appendChild(empty);

        return;
      }

      for (const message of state.messages) {
        renderMessage(message);
      }

      scrollToBottom();
    }

    function createAnswerId() {

      if (crypto.randomUUID) {
        return crypto.randomUUID();
      }

      return (
        "answer_" +
        Date.now().toString(36) +
        "_" +
        Math.random()
          .toString(36)
          .slice(2)
      );
    }

    async function loadConversation() {

      state.conversationId =
        getConversationId();

      updateConversationUrl();

      conversationInfo.textContent =
        `会話ID: ${state.conversationId}`;

      const loaded =
        await window.loadConversationHistory(
          state.user.uid,
          state.conversationId
        );

      state.messages =
        loaded.messages || [];

      renderAllMessages();
    }

    async function sendQuestion() {

      if (state.sending) {
        return;
      }

      const text =
        questionInput.value.trim();

      if (!text) {
        return;
      }

      state.sending = true;

      clearSystemMessage();

      sendButton.disabled = true;
      newConversationButton.disabled = true;
      questionInput.disabled = true;

      const answerId =
        createAnswerId();

      const questionMessage = {
        answerId,
        conversationId:
          state.conversationId,
        role: "user",
        content: text,
        createdAt: new Date().toISOString()
      };

      state.messages.push(
        questionMessage
      );

      renderAllMessages();

      questionInput.value = "";

      try {

        await window.saveConversationMessage(
          state.user.uid,
          state.conversationId,
          questionMessage
        );

        const result =
          await window.askStudyAI({
            userId: state.user.uid,
            conversationId:
              state.conversationId,
            answerId,
            question: text,
            messages:
              state.messages
          });

        const answerMessage = {
          answerId,
          conversationId:
            state.conversationId,
          role: "assistant",
          content:
            result.answer || "回答を取得できませんでした。",
          createdAt:
            new Date().toISOString()
        };

        state.messages.push(
          answerMessage
        );

        renderAllMessages();

        await window.saveConversationMessage(
          state.user.uid,
          state.conversationId,
          answerMessage
        );

      } catch (error) {

        console.error(
          "AI質問処理エラー:",
          error
        );

        showSystemMessage(
          error.message ||
          "回答の取得または履歴の保存に失敗しました。"
        );

      } finally {

        state.sending = false;

        sendButton.disabled = false;
        newConversationButton.disabled = false;
        questionInput.disabled = false;

        questionInput.focus();
      }
    }

    function createNewConversation() {

      state.conversationId =
        generateConversationId();

      state.messages = [];

      updateConversationUrl();

      conversationInfo.textContent =
        `会話ID: ${state.conversationId}`;

      renderAllMessages();

      clearSystemMessage();

      questionInput.focus();
    }

    questionForm.addEventListener(
      "submit",
      async event => {
        event.preventDefault();
        await sendQuestion();
      }
    );

    newConversationButton.addEventListener(
      "click",
      createNewConversation
    );

    try {

      const result =
        await protectPage("student");

      state.user =
        result.user;

      state.profile =
        result.profile;

      await initPage({
        role: "student",
        user: result.user,
        profile: result.profile
      });

      await loadConversation();

      questionInput.focus();

    } catch (error) {

      console.error(
        "question.html 初期化エラー:",
        error
      );

      showSystemMessage(
        "質問画面を初期化できませんでした。"
      );
    }

  </script>

</body>
</html>
