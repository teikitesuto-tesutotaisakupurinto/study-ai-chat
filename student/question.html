<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta
    name="description"
    content="中学生向け学習AIチャット"
  >

  <title>AI学習チャット | 学習AIチャット</title>

  <style>
    :root {
      --sidebar-width: 250px;

      --bg: #f7f8fa;
      --surface: #ffffff;
      --surface-soft: #f8fafc;

      --text: #172033;
      --muted: #64748b;

      --border: #e2e8f0;

      --primary: #2563eb;
      --primary-hover: #1d4ed8;

      --user-bg: #2563eb;
      --user-text: #ffffff;

      --assistant-bg: #ffffff;

      --danger-bg: #fff1f2;
      --danger-border: #fecdd3;
      --danger-text: #9f1239;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;

      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    [hidden] {
      display: none !important;
    }

    /* =====================================================
       全体
       ===================================================== */

    .app {
      min-height: 100vh;
      display: flex;
    }

    /* =====================================================
       サイドバー
       Firestore / Supabase / AI通信とは完全独立
       ===================================================== */

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--sidebar-width);

      display: flex;
      flex-direction: column;

      background: #ffffff;
      border-right: 1px solid var(--border);

      z-index: 1000;
    }

    .sidebar-header {
      height: 68px;

      display: flex;
      align-items: center;

      padding: 0 20px;

      border-bottom: 1px solid var(--border);
    }

    .sidebar-brand {
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    .sidebar-nav {
      flex: 1;

      padding: 18px 12px;

      overflow-y: auto;
    }

    .sidebar-section-title {
      padding: 0 10px;
      margin: 0 0 8px;

      font-size: 11px;
      font-weight: 800;

      color: #94a3b8;
      letter-spacing: 0.06em;
    }

    .sidebar-link {
      width: 100%;

      display: flex;
      align-items: center;

      min-height: 46px;

      padding: 0 12px;
      margin-bottom: 4px;

      border-radius: 10px;

      color: #475569;
      text-decoration: none;

      font-size: 14px;
      font-weight: 600;

      transition:
        background .15s,
        color .15s;
    }

    .sidebar-link:hover {
      background: #f1f5f9;
      color: #172033;
    }

    .sidebar-link.active {
      background: #eff6ff;
      color: #2563eb;
    }

    .sidebar-link-icon {
      width: 22px;
      flex: 0 0 22px;

      margin-right: 9px;

      text-align: center;

      font-size: 15px;
      font-weight: 800;
    }

    .sidebar-footer {
      padding: 14px 16px;

      border-top: 1px solid var(--border);

      font-size: 11px;
      line-height: 1.7;
      color: #94a3b8;
    }

    /* =====================================================
       メイン
       ===================================================== */

    .main {
      min-width: 0;
      flex: 1;

      margin-left: var(--sidebar-width);

      display: flex;
      flex-direction: column;

      min-height: 100vh;
    }

    /* =====================================================
       ヘッダー
       ===================================================== */

    .topbar {
      position: sticky;
      top: 0;

      height: 64px;

      display: flex;
      align-items: center;

      padding: 0 24px;

      background: rgba(255,255,255,.94);
      backdrop-filter: blur(12px);

      border-bottom: 1px solid var(--border);

      z-index: 100;
    }

    .topbar-inner {
      width: 100%;
      max-width: 1000px;

      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .topbar-title {
      margin: 0;

      font-size: 17px;
      font-weight: 800;

      letter-spacing: -0.02em;
    }

    .back-button {
      border: 1px solid var(--border);
      background: #ffffff;

      color: #475569;

      min-height: 38px;

      padding: 0 13px;

      border-radius: 9px;

      font-size: 13px;
      font-weight: 700;
    }

    .back-button:hover {
      background: #f8fafc;
    }

    /* =====================================================
       チャット
       ===================================================== */

    .chat-shell {
      width: 100%;
      max-width: 1000px;

      margin: 0 auto;

      flex: 1;

      display: flex;
      flex-direction: column;

      min-height: calc(100vh - 64px);
    }

    .chat-content {
      flex: 1;

      padding: 30px 24px 160px;
    }

    .conversation {
      width: 100%;

      display: flex;
      flex-direction: column;

      gap: 22px;
    }

    /* =====================================================
       初期画面
       ===================================================== */

    .empty-state {
      min-height: 55vh;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .empty-title {
      margin: 0;

      font-size: 30px;
      font-weight: 800;

      letter-spacing: -0.04em;
    }

    .empty-description {
      margin: 13px 0 0;

      max-width: 560px;

      color: var(--muted);

      line-height: 1.8;
      font-size: 14px;
    }

    /* =====================================================
       メッセージ
       ===================================================== */

    .message-row {
      width: 100%;

      display: flex;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.assistant {
      justify-content: flex-start;
    }

    .message {
      max-width: min(760px, 82%);

      display: flex;
      flex-direction: column;
    }

    .message-row.user .message {
      align-items: flex-end;
    }

    .message-row.assistant .message {
      align-items: flex-start;
    }

    .message-role {
      margin-bottom: 6px;

      font-size: 11px;
      font-weight: 800;

      color: #94a3b8;
    }

    .message-bubble {
      padding: 13px 16px;

      border-radius: 17px;

      font-size: 15px;
      line-height: 1.85;

      overflow-wrap: anywhere;
      word-break: break-word;

      white-space: pre-wrap;
    }

    .message-row.user .message-bubble {
      background: var(--user-bg);
      color: var(--user-text);

      border-bottom-right-radius: 5px;
    }

    .message-row.assistant .message-bubble {
      background: var(--assistant-bg);
      color: var(--text);

      border: 1px solid var(--border);

      border-bottom-left-radius: 5px;

      box-shadow:
        0 2px 8px rgba(15,23,42,.035);
    }

    /* =====================================================
       AI回答の文章
       ===================================================== */

    .assistant-content {
      white-space: normal;
    }

    .assistant-content p {
      margin: 0 0 12px;
    }

    .assistant-content p:last-child {
      margin-bottom: 0;
    }

    .assistant-content ul,
    .assistant-content ol {
      margin: 8px 0 12px;
      padding-left: 24px;
    }

    .assistant-content li {
      margin: 4px 0;
    }

    .assistant-content strong {
      font-weight: 800;
    }

    .assistant-content code {
      padding: 2px 5px;

      border-radius: 5px;

      background: #f1f5f9;

      font-size: .92em;
    }

    .assistant-content pre {
      margin: 12px 0;

      padding: 13px;

      overflow-x: auto;

      border-radius: 9px;

      background: #0f172a;
      color: #e2e8f0;

      font-size: 13px;
      line-height: 1.7;
    }

    /* =====================================================
       タイピング
       ===================================================== */

    .typing-bubble {
      min-width: 72px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 5px;

      padding: 15px 17px;
    }

    .typing-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #94a3b8;

      animation:
        typing 1.25s infinite ease-in-out;
    }

    .typing-dot:nth-child(2) {
      animation-delay: .16s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: .32s;
    }

    @keyframes typing {
      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: .4;
      }

      30% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    /* =====================================================
       エラー
       ===================================================== */

    .chat-error {
      width: 100%;

      padding: 14px 16px;

      border: 1px solid var(--danger-border);
      border-radius: 12px;

      background: var(--danger-bg);
      color: var(--danger-text);

      font-size: 13px;
      line-height: 1.7;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .chat-error-title {
      margin-bottom: 5px;

      font-weight: 800;
    }

    /* =====================================================
       入力エリア
       ===================================================== */

    .composer-wrap {
      position: fixed;

      left: var(--sidebar-width);
      right: 0;
      bottom: 0;

      z-index: 200;

      padding:
        14px
        24px
        calc(14px + env(safe-area-inset-bottom));

      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          transparent,
          rgba(247,248,250,.96) 22%
        );
    }

    .composer {
      width: 100%;
      max-width: 900px;

      margin: 0 auto;

      display: flex;
      align-items: flex-end;
      gap: 10px;

      padding: 8px 8px 8px 14px;

      background: #ffffff;

      border: 1px solid #cbd5e1;
      border-radius: 17px;

      box-shadow:
        0 8px 30px rgba(15,23,42,.10);

      pointer-events: auto;
    }

    .composer textarea {
      flex: 1;

      min-width: 0;

      max-height: 180px;
      min-height: 42px;

      resize: none;

      padding: 10px 2px;

      border: 0;
      outline: 0;

      background: transparent;

      color: var(--text);

      font-size: 15px;
      line-height: 1.6;
    }

    .composer textarea::placeholder {
      color: #94a3b8;
    }

    .send-button {
      flex: 0 0 auto;

      width: 44px;
      height: 44px;

      border: 0;
      border-radius: 12px;

      background: var(--primary);
      color: #ffffff;

      font-weight: 900;
      font-size: 17px;

      transition:
        background .15s,
        opacity .15s;
    }

    .send-button:hover {
      background: var(--primary-hover);
    }

    .send-button:disabled {
      cursor: wait;
      opacity: .45;
    }

    .composer-hint {
      width: 100%;
      max-width: 900px;

      margin: 6px auto 0;

      text-align: center;

      color: #94a3b8;

      font-size: 10px;
    }

    /* =====================================================
       ローディング画面
       ===================================================== */

    .page-loading {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;

      background: var(--bg);
    }

    .page-loading-box {
      text-align: center;
      color: var(--muted);
    }

    .page-spinner {
      width: 28px;
      height: 28px;

      margin: 0 auto 14px;

      border: 3px solid #dbeafe;
      border-top-color: #2563eb;

      border-radius: 50%;

      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =====================================================
       スマートフォン
       ===================================================== */

    @media (max-width: 760px) {
      :root {
        --sidebar-width: 0px;
      }

      .sidebar {
        display: none;
      }

      .main {
        margin-left: 0;
      }

      .topbar {
        padding: 0 14px;
      }

      .chat-content {
        padding:
          22px
          14px
          150px;
      }

      .message {
        max-width: 90%;
      }

      .composer-wrap {
        left: 0;
        padding-left: 10px;
        padding-right: 10px;
      }

      .empty-title {
        font-size: 25px;
      }
    }

    @media (max-width: 480px) {
      .message-bubble {
        font-size: 14px;
        line-height: 1.8;
      }

      .back-button {
        padding: 0 10px;
      }

      .topbar-title {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       認証前ローディング
       ===================================================== -->

  <div id="pageLoading" class="page-loading">
    <div class="page-loading-box">
      <div class="page-spinner"></div>
      <div>学習AIチャットを準備しています。</div>
    </div>
  </div>


  <!-- =====================================================
       アプリ本体
       ===================================================== -->

  <div id="app" class="app" hidden>

    <!-- ===================================================
         サイドバー
         ここにはFirestore / Supabase / AI通信を置かない
         =================================================== -->

    <aside class="sidebar">

      <div class="sidebar-header">
        <a
          class="sidebar-brand"
          href="./index.html"
        >
          学習AIチャット
        </a>
      </div>

      <nav class="sidebar-nav">

        <div class="sidebar-section-title">
          学習
        </div>

        <a
          class="sidebar-link"
          href="./index.html"
        >
          <span class="sidebar-link-icon">⌂</span>
          <span>学習ホーム</span>
        </a>

        <a
          class="sidebar-link active"

        >
          <span class="sidebar-link-icon">＋</span>

      </nav>

      <div class="sidebar-footer">
        中学生向け学習専用システム<br>
        © 2026 定期テスト対策プリント運営事務局
      </div>

    </aside>


    <!-- ===================================================
         メイン
         =================================================== -->

    <main class="main">

      <header class="topbar">

        <div class="topbar-inner">

          <h1 class="topbar-title">
            AI学習チャット
          </h1>

          <button
            id="backButton"
            class="back-button"
            type="button"
          >
            学習ホームへ
          </button>

        </div>

      </header>


      <section class="chat-shell">

        <div class="chat-content">

          <div
            id="emptyState"
            class="empty-state"
          >
            <h2 class="empty-title">
              何を勉強しますか？
            </h2>

            <p class="empty-description">
              数学・英語・国語・理科・社会など、
              学校の勉強について質問してください。
              <br>
              「答え」だけでなく「なぜそうなるのか」も説明します。

          <div

      <!-- =================================================

           ================================================= -->

      <div class="composer-wrap">

        <form
          id="composer"

        >

          <textarea
            id="questionInput"

            maxlength="4000"

        </div>

      </div>

    </main>

  </div>


  <!-- =====================================================
       Firebase / アプリ
       ===================================================== -->

  <script type="module">

    import {
      auth,
      persistenceReady,
      onAuthStateChanged,
      signOut
    } from "../assets/js/firebase.js";

    import {
      protectPage,
      sendStudyQuestion,
      getConversation
    } from "../assets/js/auth.js";


    /* =====================================================
       DOM
       ===================================================== */

    const $ = (selector) =>
      document.querySelector(selector);

    const pageLoading =
      $("#pageLoading");

    const app =
      $("#app");

    const emptyState =
      $("#emptyState");

    const conversation =
      $("#conversation");

    const composer =
      $("#composer");

    const questionInput =
      $("#questionInput");

    const sendButton =
      $("#sendButton");

    const backButton =
      $("#backButton");

    const logoutLink =
      $("#sidebarLogoutLink");


    /* =====================================================
       状態
       ===================================================== */

    let currentConversationId = null;

    let sending = false;

    let currentUser = null;


    /* =====================================================
       エラー表示
       ===================================================== */

    function getErrorText(error) {

      if (!error) {
        return "不明なエラーが発生しました。";
      }

      const code =
        error.code
        ? String(error.code)
        : "";

      const message =
        error.message
        ? String(error.message)
        : String(error);


      if (
        message.includes(
          "14 UNAVAILABLE"
        )
      ) {
        return [
          "AIサーバーとの接続に失敗しました。",
          "",
          "サーバー側で一時的に接続できない状態になっています。",
          "少し待ってから、もう一度送信してください。",
          "",
          code
            ? `エラーコード: ${code}`
            : ""
        ]
          .filter(Boolean)
          .join("\n");
      }


      if (
        code ===
        "auth/network-request-failed"
      ) {
        return [
          "通信に失敗しました。",
          "インターネット接続を確認して、もう一度お試しください。"
        ].join("\n");
      }


      if (
        code ===
        "auth/user-not-found"
      ) {
        return "ログイン情報を確認してください。";
      }


      if (
        code ===
        "permission-denied"
      ) {
        return [
          "データへのアクセスが拒否されました。",
          "管理者側のFirestore Rulesを確認してください。"
        ].join("\n");
      }


      if (
        code ===
        "failed-precondition"
      ) {
        return [
          "Firestoreの設定を確認できませんでした。",
          "必要なインデックスが設定されていない可能性があります。"
        ].join("\n");
      }


      return [
        message,
        code
          ? `エラーコード: ${code}`
          : ""
      ]
        .filter(Boolean)
        .join("\n");
    }


    /* =====================================================
       メッセージ追加
       ===================================================== */

    function addUserMessage(text) {

      emptyState.hidden = true;

      const row =
        document.createElement("div");

      row.className =
        "message-row user";


      const message =
        document.createElement("div");

      message.className =
        "message";


      const role =
        document.createElement("div");

      role.className =
        "message-role";

      role.textContent =
        "あなた";


      const bubble =
        document.createElement("div");

      bubble.className =
        "message-bubble";

      bubble.textContent =
        text;


      message.append(
        role,
        bubble
      );

      row.append(
        message
      );

      conversation.append(
        row
      );

      scrollToBottom();

      return row;
    }


    /* =====================================================
       AIメッセージ
       ===================================================== */

    function addAssistantMessage(
      answer
    ) {

      emptyState.hidden = true;

      const row =
        document.createElement("div");

      row.className =
        "message-row assistant";


      const message =
        document.createElement("div");

      message.className =
        "message";


      const role =
        document.createElement("div");

      role.className =
        "message-role";

      role.textContent =
        "学習AI";


      const bubble =
        document.createElement("div");

      bubble.className =
        "message-bubble assistant-content";


      bubble.innerHTML =
        formatAssistantAnswer(
          answer
        );


      message.append(
        role,
        bubble
      );

      row.append(
        message
      );

      conversation.append(
        row
      );

      scrollToBottom();

      return row;
    }


    /* =====================================================
       タイピング表示
       ===================================================== */

    function addTypingMessage() {

      emptyState.hidden = true;

      const row =
        document.createElement("div");

      row.className =
        "message-row assistant";

      row.dataset.typing =
        "true";


      const message =
        document.createElement("div");

      message.className =
        "message";


      const role =
        document.createElement("div");

      role.className =
        "message-role";

      role.textContent =
        "学習AI";


      const bubble =
        document.createElement("div");

      bubble.className =
        "message-bubble typing-bubble";


      for (
        let i = 0;
        i < 3;
        i++
      ) {

        const dot =
          document.createElement("span");

        dot.className =
          "typing-dot";

        bubble.append(
          dot
        );
      }


      message.append(
        role,
        bubble
      );

      row.append(
        message
      );

      conversation.append(
        row
      );

      scrollToBottom();

      return row;
    }


    /* =====================================================
       エラーをチャット内に表示
       ===================================================== */

    function addErrorMessage(
      error
    ) {

      emptyState.hidden = true;

      const row =
        document.createElement("div");

      row.className =
        "message-row assistant";


      const message =
        document.createElement("div");

      message.className =
        "message";


      const role =
        document.createElement("div");

      role.className =
        "message-role";

      role.textContent =
        "システム";


      const box =
        document.createElement("div");

      box.className =
        "chat-error";


      const title =
        document.createElement("div");

      title.className =
        "chat-error-title";

      title.textContent =
        "回答を取得できませんでした";


      const detail =
        document.createElement("div");

      detail.textContent =
        getErrorText(error);


      box.append(
        title,
        detail
      );

      message.append(
        role,
        box
      );

      row.append(
        message
      );

      conversation.append(
        row
      );

      scrollToBottom();

      return row;
    }


    /* =====================================================
       AI回答の簡易整形
       ===================================================== */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );
    }


    function formatAssistantAnswer(
      value
    ) {

      let text =
        String(
          value ?? ""
        );


      text =
        escapeHtml(
          text
        );


      /*
        コードブロック
      */

      const codeBlocks = [];

      text =
        text.replace(
          /```([\s\S]*?)```/g,
          (_, code) => {

            const index =
              codeBlocks.length;

            codeBlocks.push(
              `<pre>${code.trim()}</pre>`
            );

            return `@@CODE${index}@@`;
          }
        );


      /*
        太字
      */

      text =
        text.replace(
          /\*\*(.+?)\*\*/g,
          "<strong>$1</strong>"
        );


      /*
        箇条書き
      */

      const lines =
        text.split("\n");


      const result = [];

      let list = null;


      function closeList() {

        if (!list) {
          return;
        }

        const tag =
          list.type === "ordered"
            ? "ol"
            : "ul";

        result.push(
          `<${tag}>${list.items.join("")}</${tag}>`
        );

        list = null;
      }


      for (
        const line of lines
      ) {

        const trimmed =
          line.trim();


        if (
          /^[-*]\s+/.test(
            trimmed
          )
        ) {

          if (
            !list ||
            list.type !== "unordered"
          ) {

            closeList();

            list = {
              type: "unordered",
              items: []
            };
          }

          list.items.push(
            `<li>${trimmed.replace(/^[-*]\s+/, "")}</li>`
          );

          continue;
        }


        if (
          /^\d+\.\s+/.test(
            trimmed
          )
        ) {

          if (
            !list ||
            list.type !== "ordered"
          ) {

            closeList();

            list = {
              type: "ordered",
              items: []
            };
          }

          list.items.push(
            `<li>${trimmed.replace(/^\d+\.\s+/, "")}</li>`
          );

          continue;
        }


        closeList();


        if (!trimmed) {

          result.push(
            "<p></p>"
          );

        } else {

          result.push(
            `<p>${trimmed}</p>`
          );
        }
      }


      closeList();


      text =
        result.join("");


      /*
        コードブロックを戻す
      */

      for (
        let i = 0;
        i < codeBlocks.length;
        i++
      ) {

        text =
          text.replace(
            `@@CODE${i}@@`,
            codeBlocks[i]
          );
      }


      return text;
    }


    /* =====================================================
       下までスクロール
       ===================================================== */

    function scrollToBottom() {

      requestAnimationFrame(
        () => {

          window.scrollTo({
            top:
              document.documentElement
                .scrollHeight,

            behavior:
              "smooth"
          });

        }
      );
    }


    /* =====================================================
       入力欄自動拡張
       ===================================================== */

    function resizeTextarea() {

      questionInput.style.height =
        "auto";

      questionInput.style.height =
        Math.min(
          questionInput.scrollHeight,
          180
        ) + "px";
    }


    questionInput.addEventListener(
      "input",
      resizeTextarea
    );


    /* =====================================================
       Enter送信
       ===================================================== */

    questionInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          composer.requestSubmit();
        }
      }
    );


    /* =====================================================
       送信
       ===================================================== */

    composer.addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        if (sending) {
          return;
        }


        const question =
          questionInput.value.trim();


        if (!question) {
          questionInput.focus();
          return;
        }


        if (
          question.length >
          4000
        ) {

          addErrorMessage(
            new Error(
              "質問は4000文字以内で入力してください。"
            )
          );

          return;
        }


        if (!auth.currentUser) {

          addErrorMessage(
            new Error(
              "ログイン状態を確認できません。"
            )
          );

          return;
        }


        sending = true;

        sendButton.disabled =
          true;

        questionInput.disabled =
          true;


        addUserMessage(
          question
        );


        questionInput.value =
          "";

        resizeTextarea();


        const typing =
          addTypingMessage();


        try {

          const result =
            await sendStudyQuestion(
              question,
              currentConversationId
            );


          /*
            新規会話の場合、
            ここでIDを確定
          */

          if (
            result &&
            result.conversationId
          ) {

            currentConversationId =
              result.conversationId;

            updateConversationUrl(
              currentConversationId
            );
          }


          /*
            タイピング表示を削除
          */

          if (typing) {
            typing.remove();
          }


          /*
            AI回答表示
          */

          if (
            result &&
            typeof result.answer ===
              "string" &&
            result.answer.trim()
          ) {

            addAssistantMessage(
              result.answer
            );

          } else {

            addErrorMessage(
              new Error(
                "AIから回答本文を受信できませんでした。"
              )
            );
          }

        } catch (error) {

          console.error(
            "AI質問送信エラー:",
            error
          );


          if (typing) {
            typing.remove();
          }


          addErrorMessage(
            error
          );

        } finally {

          sending =
            false;

          sendButton.disabled =
            false;

          questionInput.disabled =
            false;

          questionInput.focus();
        }
      }
    );


    /* =====================================================
       URL更新
       ===================================================== */

    function updateConversationUrl(
      conversationId
    ) {

      if (!conversationId) {
        return;
      }


      const url =
        new URL(
          location.href
        );


      url.searchParams.set(
        "conversationId",
        conversationId
      );


      history.replaceState(
        {},
        "",
        url
      );
    }


    /* =====================================================
       過去会話を画面に展開
       ===================================================== */

    function renderConversation(
      data
    ) {

      conversation.replaceChildren();

      emptyState.hidden =
        true;


      const source =
        data?.conversation ??
        data;


      if (!source) {

        emptyState.hidden =
          false;

        return;
      }


      const messages =
        Array.isArray(
          source.messages
        )
          ? source.messages
          : [];


      if (
        messages.length === 0
      ) {

        emptyState.hidden =
          false;

        return;
      }


      for (
        const item of messages
      ) {

        if (!item) {
          continue;
        }


        if (
          item.role ===
          "user"
        ) {

          addUserMessage(
            item.content || ""
          );

        } else if (
          item.role ===
          "assistant"
        ) {

          addAssistantMessage(
            item.content || ""
          );
        }
      }


      scrollToBottom();
    }


    /* =====================================================
       会話ID取得
       ===================================================== */

    function getConversationIdFromUrl() {

      const params =
        new URLSearchParams(
          location.search
        );


      const id =
        params.get(
          "conversationId"
        );


      return id
        ? id.trim()
        : null;
    }


    /* =====================================================
       過去会話読み込み
       ===================================================== */

    async function loadConversationIfNeeded() {

      const conversationId =
        getConversationIdFromUrl();


      if (!conversationId) {

        emptyState.hidden =
          false;

        return;
      }


      currentConversationId =
        conversationId;


      /*
        会話取得はAI通信側の
        getConversationを使用。

        画面のサイドバーとは完全に別。
      */

      try {

        const result =
          await getConversation(
            conversationId
          );


        renderConversation(
          result
        );

      } catch (error) {

        console.error(
          "会話取得エラー:",
          error
        );


        /*
          履歴取得に失敗しても
          チャット画面そのものは
          使用可能にする。
        */

        conversation.replaceChildren();

        emptyState.hidden =
          false;

        const errorBox =
          document.createElement(
            "div"
          );

        errorBox.className =
          "chat-error";

        errorBox.textContent =
          "過去の会話を読み込めませんでした。\n\n" +
          getErrorText(error);

        conversation.append(
          errorBox
        );
      }
    }


    /* =====================================================
       ホームへ
       ===================================================== */

    backButton.addEventListener(
      "click",
      () => {

        location.href =
          "./index.html";
      }
    );


    /* =====================================================
       ログアウト
       ===================================================== */

    logoutLink.addEventListener(
      "click",
      async event => {

        event.preventDefault();


        try {

          await signOut(
            auth
          );

          location.replace(
            "../login.html"
          );

        } catch (error) {

          console.error(
            "ログアウトエラー:",
            error
          );

          alert(
            "ログアウトに失敗しました。\n\n" +
            getErrorText(error)
          );
        }
      }
    );


    /* =====================================================
       アプリ開始
       ===================================================== */

    async function start() {

      try {

        /*
          Firebaseの初期化・永続化完了を待つ
        */

        await persistenceReady;


        /*
          認証状態を確認
        */

        const result =
          await protectPage(
            "student"
          );


        if (
          !result ||
          !result.user
        ) {

          return;
        }


        currentUser =
          result.user;


        /*
          ここまで来たら、
          サイドバーを含む画面を即表示。

          サイドバーには
          Firestore / Supabase / AI通信
          を一切依存させない。
        */

        pageLoading.hidden =
          true;

        app.hidden =
          false;


        /*
          過去会話は画面表示後に読み込む。

          つまり履歴取得で問題が起きても
          画面自体は白紙にならない。
        */

        await loadConversationIfNeeded();


        questionInput.focus();


      } catch (error) {

        console.error(
          "question.html 初期化エラー:",
          error
        );


        pageLoading.hidden =
          true;


        /*
          画面全体を消さず、
          エラー画面を表示する。
        */

        app.hidden =
          false;


        conversation.replaceChildren();

        emptyState.hidden =
          false;


        const errorBox =
          document.createElement(
            "div"
          );

        errorBox.className =
          "chat-error";

        errorBox.innerHTML =
          "<div class=\"chat-error-title\">" +
          "システムを開始できませんでした" +
          "</div>";


        const detail =
          document.createElement(
            "div"
          );

        detail.textContent =
          getErrorText(error);


        errorBox.append(
          detail
        );

        conversation.append(
          errorBox
        );
      }
    }


    /*
      Firebase認証状態変更

      ログイン済みの場合のみ開始。
      未ログインならlogin.htmlへ。
    */

    onAuthStateChanged(
      auth,
      user => {

        if (!user) {

          location.replace(
            "../login.html"
          );

          return;
        }

        /*
          start() は下で一度だけ実行するため、
          ここでは認証状態確認だけ行う。
        */
      }
    );


    start();

  </script>
