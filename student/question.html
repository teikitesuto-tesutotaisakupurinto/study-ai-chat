<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>AIに質問 | 学習AIチャット</title>

  <link rel="stylesheet" href="../assets/css/common.css">

  <style>
    :root {
      --ai-primary: #2563eb;
      --ai-border: #e5e7eb;
      --ai-muted: #64748b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f8fa;
      color: #202124;
      font-family: Arial, "Noto Sans JP", sans-serif;
    }

    [hidden] {
      display: none !important;
    }

    .app-layout {
      min-height: 100vh;
    }

    .app-main {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 0;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 24px;
      background: #fff;
      border-bottom: 1px solid var(--ai-border);
    }

    .chat-header h1 {
      margin: 0;
      font-size: 21px;
    }

    .chat-header p {
      margin: 5px 0 0;
      color: var(--ai-muted);
      font-size: 13px;
    }

    .new-chat-button {
      flex-shrink: 0;
      padding: 10px 14px;
      background: #fff;
      border: 1px solid var(--ai-border);
      border-radius: 8px;
      color: #202124;
      cursor: pointer;
    }

    .new-chat-button:hover {
      background: #f3f4f6;
    }

    .chat-content {
      display: flex;
      flex: 1;
      flex-direction: column;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px;
    }

    .subject-panel {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .subject-panel label {
      flex-shrink: 0;
      font-size: 14px;
      font-weight: 600;
    }

    .subject-panel select {
      width: 220px;
      max-width: 100%;
      padding: 11px 12px;
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    .conversation {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 18px;
      min-height: 280px;
      padding-bottom: 24px;
    }

    .welcome {
      margin: auto;
      max-width: 550px;
      padding: 30px 10px;
      text-align: center;
    }

    .welcome h2 {
      margin: 0 0 12px;
      font-size: 25px;
      font-weight: 600;
    }

    .welcome p {
      margin: 0;
      color: var(--ai-muted);
      line-height: 1.8;
    }

    .message {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 85%;
    }

    .message.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message.assistant {
      align-self: flex-start;
      align-items: flex-start;
    }

    .message-role {
      color: var(--ai-muted);
      font-size: 12px;
    }

    .message-content {
      padding: 14px 16px;
      border: 1px solid var(--ai-border);
      border-radius: 12px;
      background: #fff;
      line-height: 1.85;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .message.user .message-content {
      background: #eaf2ff;
      border-color: #d7e5ff;
    }

    .message.error .message-content {
      background: #fff4f2;
      border-color: #f3c8c3;
      color: #a12b22;
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border: 1px solid var(--ai-border);
      border-radius: 10px;
      background: white;
      color: var(--ai-muted);
      font-size: 13px;
    }

    .composer {
      position: sticky;
      bottom: 0;
      padding: 14px 0 18px;
      background: #f7f8fa;
    }

    .composer-box {
      padding: 12px;
      background: white;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .04);
    }

    #questionInput {
      display: block;
      width: 100%;
      min-height: 90px;
      max-height: 260px;
      padding: 8px;
      resize: vertical;
      border: 0;
      outline: none;
      background: transparent;
      color: #202124;
      font: inherit;
      line-height: 1.7;
    }

    .composer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 4px 0;
    }

    .composer-hint {
      color: var(--ai-muted);
      font-size: 12px;
    }

    #sendButton {
      min-width: 100px;
      padding: 11px 18px;
      background: var(--ai-primary);
      border: 0;
      border-radius: 8px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .notice {
      margin: 12px 0 0;
      color: var(--ai-muted);
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
    }

    .status-message {
      margin: 8px 0;
      color: #b42318;
      font-size: 13px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .app-footer {
      padding: 18px;
      text-align: center;
      color: var(--ai-muted);
      font-size: 11px;
    }

    @media (max-width: 700px) {
      .chat-header {
        padding: 14px;
      }

      .chat-header h1 {
        font-size: 18px;
      }

      .chat-content {
        padding: 14px;
      }

      .subject-panel {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }

      .subject-panel select {
        width: 100%;
      }

      .message {
        max-width: 95%;
      }

      .composer-hint {
        max-width: 60%;
      }
    }
  </style>
</head>

<body data-role="student">

  <div class="app-layout">

    <aside id="appSidebar" class="sidebar"></aside>

    <main id="appMain" class="app-main">

      <header class="chat-header">
        <div>
          <h1>学習AIチャット</h1>
          <p>中学校の学習をサポートします</p>
        </div>

        <button id="newChatButton" class="new-chat-button" type="button">
          新しい質問
        </button>
      </header>

      <section class="chat-content">

        <div class="subject-panel">
          <label for="subjectSelect">質問する教科</label>

          <select id="subjectSelect">
            <option value="国語">国語</option>
            <option value="数学" selected>数学</option>
            <option value="英語">英語</option>
            <option value="理科">理科</option>
            <option value="社会">社会</option>
            <option value="音楽">音楽</option>
            <option value="美術">美術</option>
            <option value="保健体育">保健体育</option>
            <option value="技術家庭">技術家庭</option>
          </select>
        </div>

        <div id="conversation" class="conversation" aria-live="polite">
          <div id="welcomeMessage" class="welcome">
            <h2>何を勉強していますか？</h2>
            <p>
              わからない問題や授業で習った内容を入力してください。<br>
              中学生にもわかりやすく説明します。
            </p>
          </div>
        </div>

        <p id="statusMessage" class="status-message" role="alert" hidden></p>

        <form id="questionForm" class="composer">
          <div class="composer-box">
            <textarea
              id="questionInput"
              maxlength="5000"
              placeholder="学習について質問してください..."
              aria-label="質問内容"
              required
            ></textarea>

            <div class="composer-bottom">
              <span class="composer-hint">
                Enterで改行できます
              </span>

              <button id="sendButton" type="submit">
                質問する
              </button>
            </div>
          </div>

          <p class="notice">
            このAIは学習専用です。学習以外の質問には対応していません。
          </p>
        </form>

      </section>

      <footer class="app-footer">
        © 2026 Regular Test Preparation Worksheet Administration Office. All Rights Reserved.
      </footer>

    </main>
  </div>

  <script type="module">
    import {
      auth,
      db,
      persistenceReady
    } from "../assets/js/firebase.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    import {
      collection,
      doc,
      getDoc,
      setDoc,
      updateDoc,
      query,
      where,
      getDocs,
      limit,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

    /*
     * Supabase Edge Function
     *
     * Groq API キーはブラウザに絶対に置かない。
     * API キーは Supabase の Secrets に保存する。
     */
    const SUPABASE_FUNCTION_URL =
      "https://fjqobjcvejhkevyfsoxt.supabase.co/functions/v1/study-chat";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_j6QpWj-1v86qkWHmXM8F3Q_Ieipaa3q";

    const $ = id => document.getElementById(id);

    const conversation = $("conversation");
    const welcomeMessage = $("welcomeMessage");
    const questionForm = $("questionForm");
    const questionInput = $("questionInput");
    const subjectSelect = $("subjectSelect");
    const sendButton = $("sendButton");
    const statusMessage = $("statusMessage");

    let currentUser = null;
    let currentProfile = null;
    let currentHistoryId = null;
    let messages = [];
    let sending = false;
    let maintenanceActive = false;

    const ALLOWED_SUBJECTS = [
      "国語",
      "数学",
      "英語",
      "理科",
      "社会",
      "音楽",
      "美術",
      "保健体育",
      "技術家庭"
    ];

    /*
     * ログイン状態と生徒権限を確認。
     * ログイン確認が完了する前に質問機能を有効にしない。
     */
    function waitForFirstAuthState() {
      return new Promise((resolve, reject) => {
        let unsubscribe = () => {};

        unsubscribe = onAuthStateChanged(
          auth,
          user => {
            unsubscribe();
            resolve(user);
          },
          error => {
            unsubscribe();
            reject(error);
          }
        );
      });
    }

    async function checkAccess() {
      await persistenceReady;

      currentUser = await waitForFirstAuthState();

      if (!currentUser) {
        location.replace("../login.html");
        return false;
      }

      const userRef = doc(db, "users", currentUser.uid);
      const userSnapshot = await getDoc(userRef);

      if (!userSnapshot.exists()) {
        location.replace("../login.html");
        return false;
      }

      currentProfile = userSnapshot.data();

      if (
        currentProfile.role !== "student" ||
        currentProfile.status !== "active"
      ) {
        location.replace(
          currentProfile.role === "admin"
            ? "../admin/index.html"
            : "../login.html"
        );
        return false;
      }

      const systemSnapshot = await getDoc(
        doc(db, "settings", "system")
      );

      if (!systemSnapshot.exists()) {
        throw new Error(
          "Firestore に settings/system がありません。"
        );
      }

      maintenanceActive =
        systemSnapshot.data().maintenance === true;

      if (maintenanceActive) {
        location.replace("../login.html");
        return false;
      }

      return true;
    }

    function showStatus(message) {
      statusMessage.textContent = message;
      statusMessage.hidden = !message;
    }

    function renderMessage(role, content, isError = false) {
      welcomeMessage.hidden = true;

      const wrapper = document.createElement("div");
      wrapper.className = `message ${role}`;

      if (isError) {
        wrapper.classList.add("error");
      }

      const roleLabel = document.createElement("div");
      roleLabel.className = "message-role";
      roleLabel.textContent =
        role === "user" ? "あなた" : "学習AI";

      const body = document.createElement("div");
      body.className = "message-content";

      // AI の回答は HTML として実行せず、テキストとして表示する。
      body.textContent = content;

      wrapper.append(roleLabel, body);
      conversation.append(wrapper);

      wrapper.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });

      return wrapper;
    }

    function showTyping() {
      const element = document.createElement("div");
      element.className = "typing";
      element.id = "typingIndicator";
      element.textContent = "回答を作成しています...";
      conversation.append(element);
      element.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function hideTyping() {
      $("typingIndicator")?.remove();
    }

    function setSending(value) {
      sending = value;
      sendButton.disabled = value;
      subjectSelect.disabled = value;
      questionInput.disabled = value;
      sendButton.textContent = value ? "回答中..." : "質問する";
    }

    function normalizeAnswer(data) {
      if (typeof data === "string") {
        return data;
      }

      if (data && typeof data.answer === "string") {
        return data.answer;
      }

      if (data && typeof data.response === "string") {
        return data.response;
      }

      if (data && typeof data.message === "string") {
        return data.message;
      }

      return "";
    }

    /*
     * 学習以外の質問を画面側でも確認する。
     * 最終的な制限は必ず Edge Function 側にも実装する。
     */
    const NON_STUDY_RESPONSE =
      "このAIは学習専用です。学習以外の質問はできません。";

    function looksLikeNonStudyRequest(text) {
      const value = text.trim();

      const studyTerms =
        /数学|算数|国語|英語|理科|社会|音楽|美術|保健体育|技術家庭|勉強|学習|問題|宿題|テスト|定期試験|定期テスト|解説|説明して|教えて|計算|方程式|関数|図形|英文|文法|単語|漢字|歴史|地理|公民|化学|物理|生物|地学|レポート|作文|読解|一次関数|連立方程式|比例|反比例|因数分解|平方根|中学|中学生|公式|用語|覚え方|答え合わせ|採点|添削|翻訳|和訳|英訳|要約|文の成分|品詞|古文|漢文|電流|天気|地層|植物|人体|日本国憲法|鎌倉時代|江戸時代|明治時代|世界地理|日本地理|実験|観察|自由研究|発音|リスニング|長文|読解問題|記述問題/;

      const nonStudyTerms =
        /ゲームを作|ゲームして|恋愛相談|占って|雑談し|今日の天気|株価|投資|政治家の支持|おすすめの店|レストラン|旅行プラン|買い物|商品を買|動画を探|音楽を流|パスワードを教|ハッキング|ウイルスを作|勉強と関係ない/;

      if (nonStudyTerms.test(value) && !studyTerms.test(value)) {
        return true;
      }

      return false;
    }

    async function getFirebaseIdToken() {
      if (!currentUser) {
        throw new Error("ログイン状態を確認できません。");
      }

      return await currentUser.getIdToken();
    }

    /*
     * AI 呼び出し。
     * Authorization に Firebase ID トークンを送る。
     *
     * 注意:
     * Supabase 側で Firebase ID トークンを検証する実装が必要。
     * Supabase の通常の JWT 検証だけでは Firebase トークンを
     * そのまま認証できない構成がある。
     */
    async function callAI(message, subject) {
      const firebaseToken = await getFirebaseIdToken();

      const response = await fetch(SUPABASE_FUNCTION_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_PUBLISHABLE_KEY,
          "Authorization": `Bearer ${firebaseToken}`
        },
        body: JSON.stringify({
          message,
          grade: currentProfile.grade || "中学生",
          subject,
          history: messages.slice(-12).map(item => ({
            role: item.role,
            content: item.content
          }))
        })
      });

      const responseText = await response.text();

      let data;

      try {
        data = JSON.parse(responseText);
      } catch {
        data = { message: responseText };
      }

      if (!response.ok) {
        const detail =
          data.message ||
          data.error ||
          data.msg ||
          `HTTP ${response.status}`;

        throw new Error(
          `AI サーバーでエラーが発生しました。\n${detail}`
        );
      }

      const answer = normalizeAnswer(data);

      if (!answer) {
        throw new Error(
          "AI サーバーから回答を取得できませんでした。Edge Function のレスポンス形式を確認してください。"
        );
      }

      return answer;
    }

    /*
     * 会話履歴を Firestore に保存。
     * ドキュメントには必ず userId を含める。
     */
    async function saveConversation() {
      if (!currentUser || !currentHistoryId) return;

      const historyRef = doc(
        db,
        "chatHistories",
        currentHistoryId
      );

      const payload = {
        userId: currentUser.uid,
        subject: subjectSelect.value,
        grade: currentProfile.grade || "中学生",
        messages: messages,
        updatedAt: serverTimestamp()
      };

      const snapshot = await getDoc(historyRef);

      if (snapshot.exists()) {
        await updateDoc(historyRef, payload);
      } else {
        await setDoc(historyRef, {
          ...payload,
          createdAt: serverTimestamp()
        });
      }
    }

    async function createConversation() {
      if (!currentUser) return;

      const historyRef = doc(collection(db, "chatHistories"));

      currentHistoryId = historyRef.id;
      messages = [];

      try {
        await setDoc(historyRef, {
          userId: currentUser.uid,
          subject: subjectSelect.value,
          grade: currentProfile.grade || "中学生",
          messages: [],
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });

        localStorage.setItem(
          `studyAIConversation:${currentUser.uid}`,
          currentHistoryId
        );
      } catch (error) {
        console.error("会話の作成エラー:", error);
        currentHistoryId = null;
        throw error;
      }
    }

    async function restoreConversation() {
      const storedId = localStorage.getItem(
        `studyAIConversation:${currentUser.uid}`
      );

      if (!storedId) {
        await createConversation();
        return;
      }

      const historyRef = doc(db, "chatHistories", storedId);
      const snapshot = await getDoc(historyRef);

      if (
        !snapshot.exists() ||
        snapshot.data().userId !== currentUser.uid
      ) {
        await createConversation();
        return;
      }

      currentHistoryId = storedId;
      const data = snapshot.data();

      messages = Array.isArray(data.messages)
        ? data.messages
        : [];

      if (ALLOWED_SUBJECTS.includes(data.subject)) {
        subjectSelect.value = data.subject;
      }

      conversation.replaceChildren();
      conversation.append(welcomeMessage);
      welcomeMessage.hidden = messages.length > 0;

      for (const item of messages) {
        if (
          item &&
          ["user", "assistant"].includes(item.role) &&
          typeof item.content === "string"
        ) {
          renderMessage(item.role, item.content);
        }
      }
    }

    async function submitQuestion(event) {
      event.preventDefault();

      if (sending) return;

      showStatus("");

      const question = questionInput.value.trim();
      const subject = subjectSelect.value;

      if (!question) {
        showStatus("質問内容を入力してください。");
        return;
      }

      if (!ALLOWED_SUBJECTS.includes(subject)) {
        showStatus("正しい教科を選択してください。");
        return;
      }

      setSending(true);

      try {
        renderMessage("user", question);

        messages.push({
          role: "user",
          content: question
        });

        questionInput.value = "";

        if (looksLikeNonStudyRequest(question)) {
          renderMessage("assistant", NON_STUDY_RESPONSE);

          messages.push({
            role: "assistant",
            content: NON_STUDY_RESPONSE
          });

          await saveConversation();
          return;
        }

        showTyping();

        const answer = await callAI(question, subject);

        hideTyping();
        renderMessage("assistant", answer);

        messages.push({
          role: "assistant",
          content: answer
        });

        await saveConversation();
      } catch (error) {
        hideTyping();

        console.error("AI 質問エラー:", error);

        renderMessage(
          "assistant",
          error.message ||
            "回答を取得できませんでした。時間をおいて再度お試しください。",
          true
        );

        /*
         * エラー時は会話内容を可能な限り保存する。
         * 保存自体が失敗しても、元のエラーを隠さない。
         */
        try {
          await saveConversation();
        } catch (saveError) {
          console.error("会話履歴保存エラー:", saveError);
          showStatus(
            "会話履歴を保存できませんでした。Firestore のルールを確認してください。"
          );
        }
      } finally {
        hideTyping();
        setSending(false);
        questionInput.focus();
      }
    }

    $("newChatButton").addEventListener("click", async () => {
      if (sending) return;

      showStatus("");

      try {
        await createConversation();

        conversation.replaceChildren();
        conversation.append(welcomeMessage);
        welcomeMessage.hidden = false;

        questionInput.value = "";
        questionInput.focus();
      } catch (error) {
        console.error(error);
        showStatus(
          "新しい会話を作成できませんでした。\n" +
          (error.message || String(error))
        );
      }
    });

    questionInput.addEventListener("keydown", event => {
      if (
        event.key === "Enter" &&
        !event.shiftKey &&
        !event.isComposing
      ) {
        event.preventDefault();

        if (questionForm.requestSubmit) {
          questionForm.requestSubmit();
        }
      }
    });

    questionForm.addEventListener("submit", submitQuestion);

    /*
     * 初期化中は認証が確定するまで画面を見せない。
     */
    document.documentElement.classList.add("auth-pending");

    async function initializePage() {
      try {
        const allowed = await checkAccess();

        if (!allowed) return;

        await restoreConversation();

        document.documentElement.classList.remove("auth-pending");
      } catch (error) {
        console.error("AI 画面初期化エラー:", error);

        document.documentElement.classList.remove("auth-pending");

        document.body.innerHTML = `
          <main style="
            max-width:650px;
            margin:60px auto;
            padding:24px;
            font-family:Arial,sans-serif;
            line-height:1.8
          ">
            <h1>AI画面を開けません</h1>
            <p>認証状態、Firestore の設定、会話履歴のアクセス権限を確認してください。</p>
            <pre id="initError" style="
              white-space:pre-wrap;
              overflow-wrap:anywhere;
              color:#b42318
            "></pre>
            <a href="../login.html">ログイン画面へ戻る</a>
          </main>
        `;

        document.getElementById("initError").textContent =
          error.message || String(error);
      }
    }

    initializePage();
  </script>

  <script type="module" src="../assets/js/layout.js"></script>

</body>
