
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>学習AIチャット</title>

  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="../assets/css/student.css">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f7f8fa;
      color: #202124;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    }

    body {
      min-height: 100vh;
    }

    [hidden] {
      display: none !important;
    }

    button,
    textarea,
    select {
      font: inherit;
    }

    /* =========================================
       全体
    ========================================= */

    .app-layout {
      width: 100%;
      min-height: 100vh;
      display: flex;
    }

    .app-main {
      flex: 1;
      min-width: 0;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
    }

    /* =========================================
       ヘッダー
    ========================================= */

    .chat-header {
      width: 100%;
      min-height: 68px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 16px;

      padding: 12px 28px;

      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
    }

    .chat-title-area {
      min-width: 0;
    }

    .chat-title-area h1 {
      margin: 0;

      color: #111827;

      font-size: 21px;
      font-weight: 700;
      line-height: 1.4;
    }

    .chat-title-area p {
      margin: 3px 0 0;

      color: #64748b;

      font-size: 12px;
      line-height: 1.5;
    }

    .new-chat-button {
      flex-shrink: 0;

      min-height: 40px;

      padding: 8px 14px;

      border: 1px solid #d1d5db;
      border-radius: 8px;

      background: #ffffff;
      color: #334155;

      font-size: 13px;
      font-weight: 600;

      cursor: pointer;
    }

    .new-chat-button:hover:not(:disabled) {
      background: #f8fafc;
    }

    .new-chat-button:disabled {
      opacity: .55;
      cursor: default;
    }

    /* =========================================
       メインコンテンツ
    ========================================= */

    .chat-content {
      width: 100%;
      max-width: 1050px;

      flex: 1;

      display: flex;
      flex-direction: column;

      margin: 0 auto;

      padding: 20px 28px 0;
    }

    /* =========================================
       教科
    ========================================= */

    .subject-panel {
      flex-shrink: 0;

      display: flex;
      align-items: center;

      gap: 10px;

      margin-bottom: 6px;
    }

    .subject-panel label {
      color: #475569;

      font-size: 13px;
      font-weight: 600;
    }

    .subject-panel select {
      min-width: 170px;
      height: 39px;

      padding: 5px 10px;

      border: 1px solid #d1d5db;
      border-radius: 8px;

      background: #ffffff;
      color: #202124;

      outline: none;

      cursor: pointer;
    }

    .subject-panel select:focus {
      border-color: #2563eb;
    }

    /* =========================================
       会話
    ========================================= */

    .conversation {
      flex: 1;

      width: 100%;

      display: flex;
      flex-direction: column;

      gap: 18px;

      min-height: 0;

      padding: 14px 2px 18px;
    }

    /* =========================================
       初期メッセージ
    ========================================= */

    .welcome {
      width: 100%;

      margin: auto;

      padding: 40px 20px;

      text-align: center;
    }

    .welcome h2 {
      margin: 0 0 10px;

      color: #1f2937;

      font-size: 25px;
      font-weight: 650;
      letter-spacing: -.02em;
    }

    .welcome p {
      max-width: 580px;

      margin: 0 auto;

      color: #64748b;

      font-size: 14px;
      line-height: 1.9;
    }

    /* =========================================
       メッセージ
    ========================================= */

    .message {
      width: 100%;

      display: flex;
      flex-direction: column;

      gap: 5px;
    }

    .message.user {
      align-items: flex-end;
    }

    .message.assistant {
      align-items: flex-start;
    }

    .message-role {
      padding: 0 5px;

      color: #94a3b8;

      font-size: 11px;
      line-height: 1.4;
    }

    .message-content {
      max-width: min(78%, 760px);

      padding: 12px 15px;

      border: 1px solid #e5e7eb;
      border-radius: 14px;

      background: #ffffff;

      color: #202124;

      font-size: 15px;
      line-height: 1.85;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .message.user .message-content {
      background: #e8f0fe;
      border-color: #d5e3ff;
      border-bottom-right-radius: 5px;
    }

    .message.assistant .message-content {
      background: #ffffff;
      border-color: #e5e7eb;
      border-bottom-left-radius: 5px;
    }

    .message.error .message-content {
      background: #fff5f5;
      border-color: #fecaca;
      color: #991b1b;
    }

    /* =========================================
       AI回答待機
       表示するのは「・・・」だけ
    ========================================= */

    .typing {
      align-self: flex-start;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-width: 52px;
      height: 40px;

      padding: 0 13px;

      border: 1px solid #e5e7eb;
      border-radius: 14px;
      border-bottom-left-radius: 5px;

      background: #ffffff;

      color: #64748b;

      font-size: 19px;
      font-weight: 700;

      letter-spacing: 3px;

      line-height: 1;
    }

    .typing::after {
      content: "・・・";

      animation: typingPulse 1.2s ease-in-out infinite;
    }

    @keyframes typingPulse {
      0% {
        opacity: .25;
        transform: translateY(0);
      }

      25% {
        opacity: .55;
        transform: translateY(-1px);
      }

      50% {
        opacity: 1;
        transform: translateY(0);
      }

      75% {
        opacity: .55;
        transform: translateY(1px);
      }

      100% {
        opacity: .25;
        transform: translateY(0);
      }
    }

    /* =========================================
       ステータス
    ========================================= */

    .status-message {
      flex-shrink: 0;

      margin: 0 0 7px;

      color: #b42318;

      font-size: 13px;
      line-height: 1.7;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .status-message[data-type="success"] {
      color: #166534;
    }

    .status-message[data-type="info"] {
      color: #475569;
    }

    /* =========================================
       入力エリア
    ========================================= */

    .composer {
      flex-shrink: 0;

      width: 100%;

      padding: 8px 0 8px;
    }

    .composer-box {
      width: 100%;

      padding: 10px 12px;

      border: 1px solid #d1d5db;
      border-radius: 15px;

      background: #ffffff;

      box-shadow:
        0 2px 10px rgba(15, 23, 42, .04);
    }

    #questionInput {
      display: block;

      width: 100%;

      min-height: 62px;
      max-height: 180px;

      margin: 0;

      padding: 5px 4px;

      border: 0;
      outline: none;

      resize: none;

      background: transparent;

      color: #202124;

      font-family: inherit;

      font-size: 15px;
      line-height: 1.7;
    }

    #questionInput::placeholder {
      color: #94a3b8;
    }

    #questionInput:disabled {
      opacity: .65;
    }

    .composer-bottom {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      padding-top: 4px;
    }

    .composer-hint {
      color: #94a3b8;

      font-size: 11px;
    }

    #sendButton {
      flex-shrink: 0;

      min-width: 90px;
      min-height: 38px;

      padding: 8px 14px;

      border: 1px solid #2563eb;
      border-radius: 8px;

      background: #2563eb;
      color: #ffffff;

      font-size: 13px;
      font-weight: 650;

      cursor: pointer;
    }

    #sendButton:hover:not(:disabled) {
      background: #1d4ed8;
    }

    #sendButton:disabled {
      opacity: .6;
      cursor: default;
    }

    .notice {
      margin: 6px 0 0;

      color: #94a3b8;

      font-size: 10px;
      line-height: 1.6;

      text-align: center;
    }

    /* =========================================
       エラー
    ========================================= */

    .page-error {
      width: min(650px, calc(100% - 40px));

      margin: 40px auto;

      padding: 26px;

      border: 1px solid #fecaca;
      border-radius: 12px;

      background: #ffffff;
    }

    .page-error h1 {
      margin: 0 0 12px;

      color: #991b1b;

      font-size: 21px;
    }

    .page-error p {
      margin: 8px 0;

      color: #475569;

      font-size: 14px;
      line-height: 1.8;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .page-error pre {
      margin: 16px 0 0;

      padding: 12px;

      overflow: auto;

      border-radius: 8px;

      background: #f8fafc;

      color: #475569;

      font-size: 12px;

      line-height: 1.6;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .page-error button {
      margin-top: 16px;

      min-height: 40px;

      padding: 8px 14px;

      border: 1px solid #cbd5e1;
      border-radius: 8px;

      background: #ffffff;
      color: #334155;

      cursor: pointer;
    }

    /* =========================================
       フッター
    ========================================= */

    .app-footer {
      flex-shrink: 0;

      padding: 10px 20px 13px;

      color: #94a3b8;

      font-size: 10px;
      line-height: 1.5;

      text-align: center;
    }

    /* =========================================
       スマートフォン
    ========================================= */

    @media (max-width: 700px) {

      .chat-header {
        min-height: 62px;
        padding: 11px 14px;
      }

      .chat-title-area h1 {
        font-size: 18px;
      }

      .chat-title-area p {
        font-size: 10px;
      }

      .new-chat-button {
        min-height: 37px;
        padding: 7px 10px;
        font-size: 12px;
      }

      .chat-content {
        padding: 13px 14px 0;
      }

      .subject-panel {
        align-items: flex-start;
        flex-direction: column;
        gap: 5px;
      }

      .subject-panel select {
        width: 100%;
      }

      .message-content {
        max-width: 90%;
        font-size: 14px;
      }

      .composer-hint {
        max-width: 65%;
      }

    }
  </style>
</head>

  <!-- =====================================================
       Firebase
  ===================================================== -->

  <script type="module">

    import {

      auth,
      db,
      persistenceReady,

      doc,
      collection,
      getDoc,
      setDoc,
      updateDoc,
      serverTimestamp,

      onAuthStateChanged

    } from "../assets/js/firebase-module.js";


    /* =========================================
       AI API
    ========================================= */

    const SUPABASE_FUNCTION_URL =
      "https://fjqobjcvejhkevyfsoxt.supabase.co/functions/v1/study-chat";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_j6QpWj-1v86qkWHmXM8F3Q_Ieipaa3q";


    /* =========================================
       DOM
    ========================================= */

    const $ = id =>
      document.getElementById(id);


    const conversation =
      $("conversation");


    const welcomeMessage =
      $("welcomeMessage");


    const questionForm =
      $("questionForm");


    const questionInput =
      $("questionInput");


    const subjectSelect =
      $("subjectSelect");


    const sendButton =
      $("sendButton");


    const newChatButton =
      $("newChatButton");


    const statusMessage =
      $("statusMessage");


    /* =========================================
       設定
    ========================================= */

    const ALLOWED_SUBJECTS = [

      "国語",
      "数学",
      "英語",
      "理科",
      "社会",
      "音楽",
      "美術",
      "保健体育",
      "技術家庭"

    ];


    /* =========================================
       状態
    ========================================= */

    let currentUser = null;

    let currentProfile = null;

    let currentHistoryId = null;

    let messages = [];

    let sending = false;

    let initialized = false;


    /* =========================================
       ステータス
    ========================================= */

    function showStatus(
      message = "",
      type = "error"
    ) {

      statusMessage.textContent =
        message;

      statusMessage.dataset.type =
        type;

      statusMessage.hidden =
        !message;

    }


    /* =========================================
       Auth確認
    ========================================= */

    function waitForAuthState() {

      return new Promise(
        (resolve, reject) => {

          let completed = false;

          let unsubscribe =
            () => {};


          const timeout =
            setTimeout(
              () => {

                if (completed) {
                  return;
                }

                completed = true;

                unsubscribe();

                reject(
                  new Error(
                    "Firebase Authenticationの確認が完了しませんでした。"
                  )
                );

              },
              15000
            );


          unsubscribe =
            onAuthStateChanged(

              auth,

              user => {

                if (completed) {
                  return;
                }

                completed = true;

                clearTimeout(
                  timeout
                );

                unsubscribe();

                resolve(
                  user
                );

              },

              error => {

                if (completed) {
                  return;
                }

                completed = true;

                clearTimeout(
                  timeout
                );

                unsubscribe();

                reject(
                  error
                );

              }

            );

        }
      );

    }


    /* =========================================
       アクセス確認
    ========================================= */

    async function checkAccess() {

      await persistenceReady;


      currentUser =
        await waitForAuthState();


      if (!currentUser) {

        location.replace(
          "../login.html"
        );

        return false;

      }


      const userSnapshot =
        await getDoc(
          doc(
            db,
            "users",
            currentUser.uid
          )
        );


      if (!userSnapshot.exists()) {

        showFatalError(

          "ユーザー情報を確認できません",

          "ログインはできていますが、ユーザー情報がFirestoreに存在しません。"

        );

        return false;

      }


      currentProfile =
        userSnapshot.data();


      if (
        currentProfile.status !==
        "active"
      ) {

        showFatalError(

          "アカウントを利用できません",

          "このアカウントは現在利用できません。管理者にお問い合わせください。"

        );

        return false;

      }


      if (
        currentProfile.role !==
        "student"
      ) {

        location.replace(
          "../403.html"
        );

        return false;

      }


      /* =======================================
         メンテナンス
      ======================================= */

      const systemSnapshot =
        await getDoc(
          doc(
            db,
            "settings",
            "system"
          )
        );


      if (
        systemSnapshot.exists() &&
        systemSnapshot.data().maintenance === true
      ) {

        location.replace(
          "../maintenance.html"
        );

        return false;

      }


      return true;

    }


    /* =========================================
       エラー画面
    ========================================= */

    function showFatalError(
      title,
      message,
      detail = ""
    ) {

      const old =
        document.getElementById(
          "questionFatalError"
        );


      if (old) {
        old.remove();
      }


      const section =
        document.createElement(
          "section"
        );


      section.id =
        "questionFatalError";


      section.className =
        "page-error";


      const heading =
        document.createElement(
          "h1"
        );


      heading.textContent =
        title;


      const description =
        document.createElement(
          "p"
        );


      description.textContent =
        message;


      section.append(
        heading,
        description
      );


      if (detail) {

        const pre =
          document.createElement(
            "pre"
          );


        pre.textContent =
          detail;


        section.append(
          pre
        );

      }


      const retry =
        document.createElement(
          "button"
        );


      retry.type =
        "button";


      retry.textContent =
        "再読み込み";


      retry.addEventListener(
        "click",
        () => location.reload()
      );


      section.append(
        retry
      );


      $("appMain").append(
        section
      );

    }


    /* =========================================
       メッセージ描画
    ========================================= */

    function renderMessage(
      role,
      content,
      isError = false
    ) {

      if (
        welcomeMessage &&
        !welcomeMessage.hidden
      ) {

        welcomeMessage.hidden =
          true;

      }


      const wrapper =
        document.createElement(
          "article"
        );


      wrapper.className =
        `message ${role}`;


      if (isError) {

        wrapper.classList.add(
          "error"
        );

      }


      const roleLabel =
        document.createElement(
          "div"
        );


      roleLabel.className =
        "message-role";


      roleLabel.textContent =
        role === "user"
          ? "あなた"
          : "学習AI";


      const body =
        document.createElement(
          "div"
        );


      body.className =
        "message-content";


      body.textContent =
        content;


      wrapper.append(
        roleLabel,
        body
      );


      conversation.append(
        wrapper
      );


      wrapper.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });


      return wrapper;

    }


    /* =========================================
       「・・・」表示
    ========================================= */

    function showTyping() {

      hideTyping();


      const typing =
        document.createElement(
          "div"
        );


      typing.id =
        "typingIndicator";


      typing.className =
        "typing";


      conversation.append(
        typing
      );


      typing.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });

    }


    function hideTyping() {

      const typing =
        document.getElementById(
          "typingIndicator"
        );


      if (typing) {

        typing.remove();

      }

    }


    /* =========================================
       送信状態
    ========================================= */

    function setSending(
      value
    ) {

      sending =
        value;


      sendButton.disabled =
        value;


      subjectSelect.disabled =
        value;


      questionInput.disabled =
        value;


      newChatButton.disabled =
        value;


      sendButton.textContent =
        value
          ? "回答中..."
          : "質問する";

    }


    /* =========================================
       AI回答解析
    ========================================= */

    function normalizeAnswer(
      data
    ) {

      if (
        typeof data ===
        "string"
      ) {

        return data;

      }


      if (
        typeof data?.answer ===
        "string"
      ) {

        return data.answer;

      }


      if (
        typeof data?.response ===
        "string"
      ) {

        return data.response;

      }


      if (
        typeof data?.reply ===
        "string"
      ) {

        return data.reply;

      }


      if (
        typeof data?.message ===
        "string"
      ) {

        return data.message;

      }


      if (
        typeof data?.output ===
        "string"
      ) {

        return data.output;

      }


      return "";

    }


    /* =========================================
       AI通信
    ========================================= */

    async function callAI(
      message,
      subject
    ) {

      if (!currentUser) {

        throw new Error(
          "ログイン状態を確認できません。"
        );

      }


      const token =
        await currentUser.getIdToken();


      const history =
        messages
          .filter(
            item =>
              item.role === "user" ||
              item.role === "assistant"
          )
          .slice(-12)
          .map(
            item => ({

              role:
                item.role,

              content:
                item.content

            })
          );


      const controller =
        new AbortController();


      const timeout =
        setTimeout(
          () => controller.abort(),
          60000
        );


      try {

        const response =
          await fetch(

            SUPABASE_FUNCTION_URL,

            {

              method: "POST",

              headers: {

                "Content-Type":
                  "application/json",

                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Authorization":
                  `Bearer ${token}`

              },

              body:
                JSON.stringify({

                  message:
                    message,

                  question:
                    message,

                  grade:
                    currentProfile?.grade ||
                    "中学生",

                  subject:
                    subject,

                  userId:
                    currentUser.uid,

                  conversationId:
                    currentHistoryId,

                  history:
                    history

                }),

              signal:
                controller.signal

            }

          );


        const raw =
          await response.text();


        let data = {};


        try {

          data =
            raw
              ? JSON.parse(raw)
              : {};

        } catch {

          data = {

            message:
              raw

          };

        }


        if (!response.ok) {

          throw new Error(

            data?.error ||
            data?.message ||
            `AIサーバーエラー（HTTP ${response.status}）`

          );

        }


        const answer =
          normalizeAnswer(
            data
          );


        if (!answer.trim()) {

          throw new Error(
            "AIから回答が返されませんでした。"
          );

        }


        return answer.trim();

      } finally {

        clearTimeout(
          timeout
        );

      }

    }


    /* =========================================
       新規会話作成
    ========================================= */

    async function createConversation() {

      if (!currentUser) {

        throw new Error(
          "ログイン状態を確認できません。"
        );

      }


      const historyRef =
        doc(
          collection(
            db,
            "chatHistories"
          )
        );


      await setDoc(

        historyRef,

        {

          userId:
            currentUser.uid,

          subject:
            subjectSelect.value,

          grade:
            currentProfile?.grade ||
            "中学生",

          messages: [],

          createdAt:
            serverTimestamp(),

          updatedAt:
            serverTimestamp()

        }

      );


      currentHistoryId =
        historyRef.id;


      messages = [];


      localStorage.setItem(

        `studyAIConversation:${currentUser.uid}`,

        currentHistoryId

      );


      return currentHistoryId;

    }


    /* =========================================
       会話保存
    ========================================= */

    async function saveConversation() {

      if (
        !currentUser ||
        !currentHistoryId
      ) {

        return;

      }


      const historyRef =
        doc(
          db,
          "chatHistories",
          currentHistoryId
        );


      const snapshot =
        await getDoc(
          historyRef
        );


      if (snapshot.exists()) {

        const data =
          snapshot.data();


        if (
          data.userId !==
          currentUser.uid
        ) {

          throw new Error(
            "この会話を変更する権限がありません。"
          );

        }


        await updateDoc(

          historyRef,

          {

            subject:
              subjectSelect.value,

            grade:
              currentProfile?.grade ||
              "中学生",

            messages:
              messages,

            updatedAt:
              serverTimestamp()

          }

        );

      } else {

        await setDoc(

          historyRef,

          {

            userId:
              currentUser.uid,

            subject:
              subjectSelect.value,

            grade:
              currentProfile?.grade ||
              "中学生",

            messages:
              messages,

            createdAt:
              serverTimestamp(),

            updatedAt:
              serverTimestamp()

          }

        );

      }

    }


    /* =========================================
       会話復元
    ========================================= */

    async function restoreConversation() {

      const storageKey =
        `studyAIConversation:${currentUser.uid}`;


      const storedId =
        localStorage.getItem(
          storageKey
        );


      if (!storedId) {

        await createConversation();

        return;

      }


      const historyRef =
        doc(
          db,
          "chatHistories",
          storedId
        );


      const snapshot =
        await getDoc(
          historyRef
        );


      if (
        !snapshot.exists()
      ) {

        await createConversation();

        return;

      }


      const data =
        snapshot.data();


      if (
        data.userId !==
        currentUser.uid
      ) {

        await createConversation();

        return;

      }


      currentHistoryId =
        storedId;


      messages =
        Array.isArray(
          data.messages
        )
          ? data.messages.filter(

              item =>

                item &&

                (
                  item.role === "user" ||
                  item.role === "assistant"
                ) &&

                typeof item.content ===
                  "string"

            )
          : [];


      if (
        ALLOWED_SUBJECTS.includes(
          data.subject
        )
      ) {

        subjectSelect.value =
          data.subject;

      }


      conversation.replaceChildren();


      conversation.append(
        welcomeMessage
      );


      welcomeMessage.hidden =
        messages.length > 0;


      for (
        const item of messages
      ) {

        renderMessage(
          item.role,
          item.content
        );

      }

    }


    /* =========================================
       質問送信
    ========================================= */

    async function submitQuestion(
      event
    ) {

      event.preventDefault();


      if (sending) {
        return;
      }


      showStatus("");


      const question =
        questionInput.value.trim();


      const subject =
        subjectSelect.value;


      if (!question) {

        showStatus(
          "質問内容を入力してください。"
        );

        questionInput.focus();

        return;

      }


      if (
        !ALLOWED_SUBJECTS.includes(
          subject
        )
      ) {

        showStatus(
          "正しい教科を選択してください。"
        );

        return;

      }


      setSending(true);


      try {

        /* 自分の質問 */

        renderMessage(
          "user",
          question
        );


        messages.push({

          role:
            "user",

          content:
            question

        });


        questionInput.value =
          "";


        /* AI待機 */

        showTyping();


        /* AI */

        const answer =
          await callAI(
            question,
            subject
          );


        hideTyping();


        /* AI回答 */

        renderMessage(
          "assistant",
          answer
        );


        messages.push({

          role:
            "assistant",

          content:
            answer

        });


        /* 保存 */

        await saveConversation();


      } catch (error) {

        hideTyping();


        console.error(
          "AI質問エラー:",
          error
        );


        const errorMessage =
          error?.message ||
          "AIから回答を取得できませんでした。";


        renderMessage(
          "assistant",
          errorMessage,
          true
        );


      } finally {

        hideTyping();

        setSending(false);

        questionInput.focus();

      }

    }


    /* =========================================
       新しい質問
    ========================================= */

    async function startNewConversation() {

      if (sending) {
        return;
      }


      try {

        showStatus("");


        await createConversation();


        conversation.replaceChildren();


        conversation.append(
          welcomeMessage
        );


        welcomeMessage.hidden =
          false;


        questionInput.value =
          "";


        questionInput.focus();


      } catch (error) {

        console.error(
          "新規会話エラー:",
          error
        );


        showStatus(

          error?.message ||
          "新しい質問を開始できませんでした。"

        );

      }

    }


    /* =========================================
       Enter送信
    ========================================= */

    questionInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey &&
          !event.isComposing
        ) {

          event.preventDefault();

          questionForm.requestSubmit();

        }

      }
    );


    /* =========================================
       イベント
    ========================================= */

    questionForm.addEventListener(
      "submit",
      submitQuestion
    );


    newChatButton.addEventListener(
      "click",
      startNewConversation
    );


    /* =========================================
       初期化
       
       ローディング画面は存在しない。
       チャット画面を最初から表示する。
    ========================================= */

    async function initializePage() {

      if (initialized) {
        return;
      }


      initialized =
        true;


      try {

        await checkAccess();


        if (
          !currentUser ||
          !currentProfile
        ) {

          return;

        }


        await restoreConversation();


        questionInput.focus();


      } catch (error) {

        console.error(
          "question.html 初期化エラー:",
          error
        );


        showFatalError(

          "AI画面を開けません",

          "認証または会話履歴の確認中にエラーが発生しました。",

          `${
            error?.code ||
            "error"
          }: ${
            error?.message ||
            String(error)
          }`

        );

      }

    }


    /* =========================================
       起動
    ========================================= */

    void initializePage();

  </script>
