
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <title>AIに質問 | 学習AIチャット</title>

  <script>
    document.documentElement.classList.add("auth-pending");
  </script>

  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="../assets/css/student.css">

  <style>
    [hidden] { display: none !important; }

    body { background: #f7f8fa; }

    .app-main {
      min-width: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 24px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
    }

    .chat-header h1 { margin: 0; font-size: 21px; }
    .chat-header p { margin: 5px 0 0; color: #64748b; font-size: 13px; }

    .chat-content {
      display: flex;
      flex: 1;
      flex-direction: column;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px;
    }

    .subject-panel {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .subject-panel label { font-weight: 600; font-size: 14px; }

    .subject-panel select {
      width: 220px;
      max-width: 100%;
      padding: 11px 12px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      background: #fff;
      font: inherit;
    }

    .conversation {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 18px;
      min-height: 280px;
      padding-bottom: 24px;
    }

    .welcome {
      max-width: 550px;
      margin: auto;
      padding: 30px 10px;
      text-align: center;
    }

    .welcome h2 { margin: 0 0 12px; font-size: 25px; font-weight: 600; }
    .welcome p { color: #64748b; line-height: 1.8; }

    .message {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 85%;
    }

    .message.user { align-self: flex-end; align-items: flex-end; }
    .message.assistant { align-self: flex-start; align-items: flex-start; }
    .message-role { color: #64748b; font-size: 12px; }

    .message-content {
      padding: 14px 16px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #fff;
      line-height: 1.85;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .message.user .message-content {
      background: #eaf2ff;
      border-color: #d7e5ff;
    }

    .message.error .message-content {
      color: #a12b22;
      background: #fff4f2;
      border-color: #f3c8c3;
    }

    .typing {
      align-self: flex-start;
      padding: 12px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      background: #fff;
      color: #64748b;
      font-size: 13px;
    }

    .composer {
      position: sticky;
      bottom: 0;
      padding: 14px 0 18px;
      background: #f7f8fa;
    }

    .composer-box {
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,.04);
    }

    #questionInput {
      display: block;
      width: 100%;
      min-height: 90px;
      max-height: 260px;
      padding: 8px;
      resize: vertical;
      border: 0;
      outline: none;
      background: transparent;
      color: #202124;
      font: inherit;
      line-height: 1.7;
    }

    .composer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px;
    }

    .composer-hint, .notice {
      color: #64748b;
      font-size: 12px;
    }

    #sendButton {
      min-width: 100px;
      border-color: #2563eb;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
    }

    #sendButton:disabled, #newChatButton:disabled {
      opacity: .6;
      cursor: wait;
    }

    .status-message {
      margin: 8px 0;
      color: #b42318;
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .status-message[data-type="success"] { color: #067647; }
    .status-message[data-type="info"] { color: #475467; }

    .notice {
      margin: 12px 0 0;
      line-height: 1.7;
      text-align: center;
    }

    .app-footer {
      padding: 18px;
      text-align: center;
      color: #64748b;
      font-size: 11px;
    }

    @media (max-width: 700px) {
      .chat-header { padding: 14px; }
      .chat-header h1 { font-size: 18px; }
      .chat-content { padding: 14px; }
      .subject-panel { align-items: flex-start; flex-direction: column; gap: 8px; }
      .subject-panel select { width: 100%; }
      .message { max-width: 95%; }
      .composer-hint { max-width: 60%; }
    }
  </style>
</head>

<body data-role="student">
  <div class="app-layout">
    <aside id="appSidebar" class="sidebar" aria-label="メインメニュー"></aside>

    <main id="appMain" class="app-main">
      <header class="chat-header">
        <div>
          <h1>学習AIチャット</h1>
          <p>中学校の学習をサポートします</p>
        </div>

        <button id="newChatButton" class="new-chat-button" type="button">
          新しい質問
        </button>
      </header>

      <section class="chat-content">
        <div class="subject-panel">
          <label for="subjectSelect">質問する教科</label>
          <select id="subjectSelect">
            <option value="国語">国語</option>
            <option value="数学" selected>数学</option>
            <option value="英語">英語</option>
            <option value="理科">理科</option>
            <option value="社会">社会</option>
            <option value="音楽">音楽</option>
            <option value="美術">美術</option>
            <option value="保健体育">保健体育</option>
            <option value="技術家庭">技術家庭</option>
          </select>
        </div>

        <div id="conversation" class="conversation" aria-live="polite">
          <div id="welcomeMessage" class="welcome">
            <h2>何を勉強していますか？</h2>
            <p>
              わからない問題や授業で習った内容を入力してください。
              中学生にもわかりやすく説明します。
            </p>
          </div>
        </div>

        <p id="statusMessage" class="status-message" role="status" aria-live="polite" hidden></p>

        <form id="questionForm" class="composer">
          <div class="composer-box">
            <textarea
              id="questionInput"
              maxlength="5000"
              placeholder="学習について質問してください..."
              aria-label="質問内容"
              required
            ></textarea>

            <div class="composer-bottom">
              <span class="composer-hint">Enterで送信・Shift+Enterで改行</span>
              <button id="sendButton" class="primary-button" type="submit">
                質問する
              </button>
            </div>
          </div>

          <p class="notice">
            このAIは学習専用です。学習以外の質問には対応していません。
          </p>
        </form>
      </section>

      <footer class="app-footer">
        © 2026 Regular Test Preparation Worksheet Administration Office. All Rights Reserved.
      </footer>
    </main>
  </div>

  <script type="module" src="../assets/js/page.js"></script>
</body>
</html>
