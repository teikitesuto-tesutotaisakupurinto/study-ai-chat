<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#f5f7fb"
  >

  <title>AIに質問 | 学習AIチャット</title>

  <link
    rel="stylesheet"
    href="../assets/css/student.css"
  >

  <style>
    html.auth-pending body {
      visibility: hidden;
    }

    .chat-page {
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 270px;
      flex: 0 0 270px;
      background: #ffffff;
      border-right: 1px solid #e2e6ee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .chat-main {
      flex: 1;
      min-width: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f5f7fb;
    }

    .chat-header {
      padding: 20px 28px;
      background: #ffffff;
      border-bottom: 1px solid #e2e6ee;
    }

    .chat-header h1 {
      margin: 0;
      font-size: 22px;
    }

    .chat-header p {
      margin: 5px 0 0;
      color: #6b7280;
      font-size: 13px;
    }

    .conversation-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 12px 28px;
      background: #fff;
      border-bottom: 1px solid #e2e6ee;
    }

    .conversation-title {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .new-conversation {
      border: 1px solid #c8ced8;
      background: #fff;
      color: #202124;
      border-radius: 7px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
    }

    .message-row {
      display: flex;
      margin-bottom: 18px;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-bubble {
      max-width: min(760px, 90%);
      padding: 14px 16px;
      border-radius: 12px;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message-row.user .message-bubble {
      background: #1a73e8;
      color: #fff;
    }

    .message-row.assistant .message-bubble {
      background: #fff;
      border: 1px solid #e2e6ee;
      color: #202124;
    }

    .chat-input-area {
      padding: 16px 28px 20px;
      background: #fff;
      border-top: 1px solid #e2e6ee;
    }

    .chat-form {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      resize: vertical;
      min-height: 52px;
      max-height: 180px;
      padding: 14px;
      border: 1px solid #c8ced8;
      border-radius: 9px;
      font: inherit;
    }

    .chat-send {
      align-self: flex-end;
      min-width: 90px;
      padding: 13px 16px;
      border: 0;
      border-radius: 9px;
      background: #1a73e8;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
    }

    .chat-send:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .chat-status {
      max-width: 1000px;
      margin: 7px auto 0;
      color: #6b7280;
      font-size: 12px;
    }

    .empty-chat {
      max-width: 700px;
      margin: 100px auto;
      padding: 30px;
      text-align: center;
      color: #6b7280;
    }

    .empty-chat h2 {
      color: #202124;
      margin-bottom: 8px;
    }

    @media (max-width: 700px) {
      .chat-page {
        display: block;
      }

      .sidebar {
        width: 100%;
        min-height: auto;
        border-right: 0;
        border-bottom: 1px solid #e2e6ee;
      }

      .chat-main {
        min-height: calc(100vh - 60px);
      }

      .chat-header {
        padding: 16px;
      }

      .conversation-bar {
        padding: 10px 16px;
      }

      .chat-messages {
        padding: 16px;
      }

      .chat-input-area {
        padding: 12px;
      }

      .chat-form {
        flex-direction: column;
      }

      .chat-send {
        width: 100%;
      }
    }
  </style>
</head>

<body
  data-role="student"
  class="chat-page"
>

  <aside
    id="appSidebar"
    class="sidebar"
    aria-label="サイドメニュー"
  ></aside>

  <main class="chat-main">

    <header class="chat-header">
      <h1>AIに質問</h1>
      <p>
        学習に関する質問を入力してください。
      </p>
    </header>

    <div class="conversation-bar">
      <div
        id="conversationTitle"
        class="conversation-title"
      >
        新しい会話
      </div>

      <button
        id="newConversationButton"
        class="new-conversation"
        type="button"
      >
        新しい会話
      </button>
    </div>

    <section
      id="chatMessages"
      class="chat-messages"
      aria-live="polite"
    >
      <div class="empty-chat">
        <h2>学習AIチャット</h2>
        <p>
          学習について質問してください。
        </p>
      </div>
    </section>

    <section class="chat-input-area">

      <form
        id="chatForm"
        class="chat-form"
      >
        <textarea
          id="chatInput"
          class="chat-input"
          maxlength="4000"
          placeholder="学習について質問してください"
          required
        ></textarea>

        <button
          id="chatSend"
          class="chat-send"
          type="submit"
        >
          送信
        </button>
      </form>

      <div
        id="chatStatus"
        class="chat-status"
      ></div>

    </section>

    <footer
      class="app-footer"
    >
      © 2026 Regular Test Preparation Worksheet Administration Office. All Rights Reserved.
    </footer>

  </main>

  <script type="module">

    import {
      auth,
      db,
      collection,
      query,
      where,
      orderBy,
      getDocs,
      getDoc,
      doc,
      addDoc,
      setDoc,
      serverTimestamp
    } from "../assets/js/firebase.js";

    import {
      requireRole
    } from "../assets/js/auth.js";

    import {
      setupSidebar,
      setupLogout
    } from "../assets/js/page.js";

    const $ =
      id => document.getElementById(id);

    const chatMessages =
      $("chatMessages");

    const chatForm =
      $("chatForm");

    const chatInput =
      $("chatInput");

    const chatSend =
      $("chatSend");

    const chatStatus =
      $("chatStatus");

    const conversationTitle =
      $("conversationTitle");

    const newConversationButton =
      $("newConversationButton");

    let currentUser =
      null;

    let currentProfile =
      null;

    let conversationId =
      null;

    let messages = [];

    let sending =
      false;

    function escapeText(
      value
    ) {
      return String(
        value ?? ""
      );
    }

    function clearMessages() {
      chatMessages.replaceChildren();
    }

    function renderEmpty() {
      clearMessages();

      const empty =
        document.createElement(
          "div"
        );

      empty.className =
        "empty-chat";

      const heading =
        document.createElement(
          "h2"
        );

      heading.textContent =
        "学習AIチャット";

      const paragraph =
        document.createElement(
          "p"
        );

      paragraph.textContent =
        "学習について質問してください。";

      empty.append(
        heading,
        paragraph
      );

      chatMessages.append(
        empty
      );
    }

    function renderMessages() {
      clearMessages();

      if (
        !messages.length
      ) {
        renderEmpty();
        return;
      }

      for (
        const message of messages
      ) {
        const role =
          message.role ===
          "user"
            ? "user"
            : "assistant";

        const row =
          document.createElement(
            "div"
          );

        row.className =
          `message-row ${role}`;

        const bubble =
          document.createElement(
            "div"
          );

        bubble.className =
          "message-bubble";

        bubble.textContent =
          escapeText(
            message.content
          );

        row.append(
          bubble
        );

        chatMessages.append(
          row
        );
      }

      chatMessages.scrollTop =
        chatMessages.scrollHeight;
    }

    function getConversationFromURL() {
      const params =
        new URLSearchParams(
          location.search
        );

      return params.get(
        "conversationId"
      );
    }

    function updateURL(id) {
      const url =
        new URL(
          location.href
        );

      if (id) {
        url.searchParams.set(
          "conversationId",
          id
        );
      } else {
        url.searchParams.delete(
          "conversationId"
        );
      }

      history.replaceState(
        {},
        "",
        url
      );
    }

    function setStatus(
      text
    ) {
      chatStatus.textContent =
        text || "";
    }

    function setSending(
      value
    ) {
      sending =
        value;

      chatSend.disabled =
        value;

      chatInput.disabled =
        value;

      chatSend.textContent =
        value
          ? "送信中..."
          : "送信";
    }

    function makeTitle(
      text
    ) {
      const cleaned =
        String(
          text || ""
        )
          .replace(
            /\s+/g,
            " "
          )
          .trim();

      if (!cleaned) {
        return "新しい会話";
      }

      return cleaned.length >
        32
        ? `${cleaned.slice(
            0,
            32
          )}…`
        : cleaned;
    }

    async function createConversation(
      firstQuestion
    ) {
      const ref =
        await addDoc(
          collection(
            db,
            "chatHistories"
          ),
          {
            userId:
              currentUser.uid,

            subject:
              "数学",

            grade:
              currentProfile.grade ||
              "",

            title:
              makeTitle(
                firstQuestion
              ),

            lastQuestion:
              firstQuestion,

            messages: [],

            createdAt:
              serverTimestamp(),

            updatedAt:
              serverTimestamp()
          }
        );

      conversationId =
        ref.id;

      updateURL(
        conversationId
      );

      conversationTitle.textContent =
        makeTitle(
          firstQuestion
        );

      return ref.id;
    }

    async function loadConversation(
      id
    ) {
      if (!id) {
        conversationId =
          null;

        messages = [];

        conversationTitle.textContent =
          "新しい会話";

        renderEmpty();

        return;
      }

      const snapshot =
        await getDoc(
          doc(
            db,
            "chatHistories",
            id
          )
        );

      if (
        !snapshot.exists()
      ) {
        throw new Error(
          "指定された会話が見つかりません。"
        );
      }

      const data =
        snapshot.data();

      if (
        data.userId !==
        currentUser.uid
      ) {
        throw new Error(
          "この会話を開く権限がありません。"
        );
      }

      conversationId =
        id;

      messages =
        Array.isArray(
          data.messages
        )
          ? data.messages
          : [];

      conversationTitle.textContent =
        data.title ||
        data.lastQuestion ||
        "会話";

      renderMessages();
    }

    async function saveConversation() {
      if (
        !conversationId
      ) {
        return;
      }

      await setDoc(
        doc(
          db,
          "chatHistories",
          conversationId
        ),
        {
          userId:
            currentUser.uid,

          subject:
            "数学",

          grade:
            currentProfile.grade ||
            "",

          title:
            conversationTitle.textContent ||
            "会話",

          lastQuestion:
            messages
              .filter(
                item =>
                  item.role ===
                  "user"
              )
              .at(-1)
              ?.content ||
            "",

          messages,

          updatedAt:
            serverTimestamp()
        },
        {
          merge: true
        }
      );
    }

    async function askAI(
      question
    ) {
      /*
       * ここは利用するAIバックエンドに接続する部分。
       *
       * study-chat/index.ts 側で
       * Firebase Functions / API 等を用意した場合は
       * この関数から呼び出す。
       *
       * 現在は接続先を勝手に作らず、
       * 画面側が壊れないようにエラーを返す。
       */

      throw new Error(
        "AIバックエンドが未接続です。study-chat/index.ts の公開エンドポイントを接続してください。"
      );
    }

    async function handleSubmit(
      event
    ) {
      event.preventDefault();

      if (
        sending
      ) {
        return;
      }

      const question =
        chatInput.value.trim();

      if (!question) {
        return;
      }

      if (
        !currentUser ||
        !currentProfile
      ) {
        setStatus(
          "ログイン状態を確認できません。"
        );

        return;
      }

      setSending(
        true
      );

      setStatus(
        "AIが回答を作成しています..."
      );

      try {
        if (
          !conversationId
        ) {
          await createConversation(
            question
          );
        }

        messages.push({
          role: "user",
          content: question,
          createdAt:
            new Date().toISOString()
        });

        renderMessages();

        chatInput.value =
          "";

        await saveConversation();

        const answer =
          await askAI(
            question
          );

        messages.push({
          role: "assistant",
          content: answer,
          createdAt:
            new Date().toISOString()
        });

        renderMessages();

        await saveConversation();

        setStatus(
          "保存しました。"
        );

      } catch (error) {
        console.error(
          "AIチャットエラー:",
          error
        );

        setStatus(
          error?.message ||
          "回答の処理に失敗しました。"
        );

      } finally {
        setSending(
          false
        );

        chatInput.focus();
      }
    }

    function createNewConversation() {
      conversationId =
        null;

      messages =
        [];

      updateURL(
        null
      );

      conversationTitle.textContent =
        "新しい会話";

      renderEmpty();

      setStatus(
        ""
      );

      chatInput.focus();
    }

    newConversationButton.addEventListener(
      "click",
      createNewConversation
    );

    chatForm.addEventListener(
      "submit",
      handleSubmit
    );

    chatInput.addEventListener(
      "keydown",
      event => {
        if (
          event.key ===
            "Enter" &&
          !event.shiftKey
        ) {
          event.preventDefault();

          chatForm.requestSubmit();
        }
      }
    );

    async function initialize() {
      try {
        const result =
          await requireRole(
            "student"
          );

        if (!result) {
          return;
        }

        currentUser =
          result.user;

        currentProfile =
          result.profile;

        setupSidebar();
        setupLogout();

        const requestedId =
          getConversationFromURL();

        await loadConversation(
          requestedId
        );

        document.documentElement.classList.remove(
          "auth-pending"
        );

      } catch (error) {
        console.error(
          "質問画面初期化エラー:",
          error
        );

        document.documentElement.classList.remove(
          "auth-pending"
        );

        document.body.innerHTML = `
          <main style="
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
            font-family:Arial,'Noto Sans JP',sans-serif;
          ">
            <section style="
              max-width:600px;
              width:100%;
              padding:32px;
              background:#fff;
              border:1px solid #e2e6ee;
              border-radius:12px;
            ">
              <h1>質問画面を初期化できませんでした。</h1>
              <p>
                ログイン状態、Firestoreの権限、
                または会話データを確認してください。
              </p>
              <pre style="
                white-space:pre-wrap;
                overflow-wrap:anywhere;
              ">${escapeText(
                error?.code ||
                error?.message ||
                error
              )}</pre>
              <a href="../login.html">
                ログイン画面へ
              </a>
            </section>
          </main>
        `;
      }
    }

    initialize();

  </script>

</body>
</html>
