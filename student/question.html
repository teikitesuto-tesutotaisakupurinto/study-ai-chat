<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#f5f7fb"
  >

  <title>AIに質問 | 学習AIチャット</title>

  <link
    rel="stylesheet"
    href="../assets/css/student.css"
  >
</head>

<body
  data-role="student"
  class="question-page"
>

  <aside
    id="appSidebar"
    class="sidebar"
  ></aside>

  <div class="app-shell">

    <header class="app-header">
      <div>
        <h1>AIに質問</h1>
        <p id="currentUserName"></p>
      </div>
    </header>

    <main class="app-main">

      <section
        id="questionLoading"
        class="question-loading"
      >
        <p>学習AIチャットを準備しています。</p>
      </section>

      <section
        id="chatSection"
        class="chat-section"
        hidden
      >

        <div
          id="conversationTitle"
          class="conversation-title"
        >
          新しい学習
        </div>

        <div
          id="messageList"
          class="message-list"
          aria-live="polite"
        ></div>

        <form
          id="questionForm"
          class="question-form"
        >

          <label
            for="questionInput"
            class="sr-only"
          >
            質問
          </label>

          <textarea
            id="questionInput"
            rows="4"
            maxlength="4000"
            placeholder="学習について質問してください。"
            required
          ></textarea>

          <div class="question-actions">

            <span
              id="questionStatus"
              class="question-status"
            ></span>

            <button
              id="sendButton"
              type="submit"
            >
              送信
            </button>

          </div>

        </form>

      </section>

    </main>

    <footer class="app-footer">
      © 2026 Regular Test Preparation Worksheet Administration Office. All Rights Reserved.
    </footer>

  </div>

  <script
    type="module"
    src="../assets/js/layout.js"
  ></script>

  <script
    type="module"
    src="../assets/js/question.js"
  ></script>

</body>
</html>
