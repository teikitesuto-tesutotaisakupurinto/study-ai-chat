<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#f5f7fb"
  >

  <title>AIに質問 | 学習AIチャット</title>

  <link
    rel="stylesheet"
    href="../assets/css/student.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family:
        Arial,
        "Noto Sans JP",
        sans-serif;
      color: #202124;
      background: #f5f7fb;
    }

    [hidden] {
      display: none !important;
    }

    .app-shell {
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 250px;
      min-width: 250px;
      background: #ffffff;
      border-right: 1px solid #e1e5eb;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 20;
    }

    .sidebar-header {
      padding: 22px 20px 12px;
      border-bottom: 1px solid #edf0f4;
    }

    .sidebar-header strong {
      display: block;
      font-size: 17px;
      line-height: 1.5;
    }

    .sidebar-toggle-row {
      padding: 10px 14px;
    }

    .sidebar-toggle {
      width: 100%;
      min-height: 40px;
      border: 1px solid #d7dce3;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-size: 18px;
    }

    .sidebar-user {
      margin: 0 14px 12px;
      padding: 11px 12px;
      border-radius: 8px;
      background: #f5f7fb;
      color: #4b5563;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .sidebar-nav {
      padding: 0 10px;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 44px;
      padding: 9px 12px;
      margin-bottom: 4px;
      border-radius: 8px;
      color: #374151;
      text-decoration: none;
      border: 0;
      background: transparent;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
    }

    .sidebar-link:hover {
      background: #f3f5f8;
    }

    .sidebar-link.active {
      background: #eaf2ff;
      color: #1558b0;
      font-weight: 600;
    }

    .sidebar-icon {
      width: 22px;
      min-width: 22px;
      text-align: center;
      font-size: 16px;
    }

    .sidebar-label {
      flex: 1;
    }

    .sidebar-history {
      margin-top: 10px;
      padding: 0 14px;
    }

    .sidebar-history-heading {
      margin: 12px 4px 8px;
      font-size: 12px;
      color: #6b7280;
      font-weight: 600;
    }

    .sidebar-history-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 260px;
      overflow-y: auto;
    }

    .sidebar-history-link {
      display: block;
      padding: 8px 9px;
      border-radius: 7px;
      color: #4b5563;
      text-decoration: none;
      background: transparent;
    }

    .sidebar-history-link:hover {
      background: #f3f5f8;
    }

    .sidebar-history-title {
      display: block;
      font-size: 12px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .sidebar-history-date {
      display: block;
      margin-top: 2px;
      color: #9ca3af;
      font-size: 10px;
    }

    .logout-button {
      margin-top: auto;
      margin-bottom: 16px;
      width: calc(100% - 20px);
      margin-left: 10px;
      margin-right: 10px;
      justify-content: flex-start;
    }

    .app-main {
      flex: 1;
      min-width: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 28px;
      background: #ffffff;
      border-bottom: 1px solid #e1e5eb;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar-title {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }

    .topbar-user {
      color: #6b7280;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .page-content {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px;
      flex: 1;
    }

    .chat-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
    }

    .chat-card {
      min-height: calc(100vh - 150px);
      background: #ffffff;
      border: 1px solid #e1e5eb;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 18px 20px;
      border-bottom: 1px solid #edf0f4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .chat-header-title {
      margin: 0;
      font-size: 17px;
    }

    .chat-header-subtitle {
      margin: 4px 0 0;
      color: #6b7280;
      font-size: 12px;
    }

    .new-chat-button {
      border: 1px solid #cfd5dd;
      background: #fff;
      color: #374151;
      border-radius: 7px;
      padding: 9px 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .new-chat-button:hover {
      background: #f7f8fa;
    }

    .conversation-info {
      padding: 8px 20px;
      color: #8a919b;
      font-size: 11px;
      border-bottom: 1px solid #f0f2f5;
    }

    .messages {
      flex: 1;
      min-height: 430px;
      padding: 24px;
      overflow-y: auto;
      background: #fafbfc;
    }

    .empty-state {
      max-width: 600px;
      margin: 80px auto;
      text-align: center;
      color: #6b7280;
    }

    .empty-state h2 {
      margin: 0 0 10px;
      color: #374151;
      font-size: 21px;
    }

    .empty-state p {
      margin: 0;
      line-height: 1.8;
      font-size: 14px;
    }

    .message-row {
      display: flex;
      margin-bottom: 18px;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.assistant {
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: min(760px, 86%);
      padding: 14px 16px;
      border-radius: 12px;
      line-height: 1.8;
      font-size: 14px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .message-row.user .message-bubble {
      background: #1a73e8;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message-row.assistant .message-bubble {
      background: #fff;
      color: #202124;
      border: 1px solid #e0e4ea;
      border-bottom-left-radius: 4px;
    }

    .message-meta {
      margin-top: 5px;
      color: #9aa0a6;
      font-size: 10px;
    }

    .message-row.user .message-meta {
      text-align: right;
    }

    .answer-id {
      font-family: Arial, sans-serif;
      color: #9aa0a6;
      font-size: 10px;
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #6b7280;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9ca3af;
      animation: typing 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes typing {
      0%,
      60%,
      100% {
        opacity: .35;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    .composer {
      padding: 16px;
      background: #fff;
      border-top: 1px solid #e5e8ed;
    }

    .composer-form {
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    .composer textarea {
      flex: 1;
      min-height: 52px;
      max-height: 180px;
      resize: vertical;
      padding: 12px 14px;
      border: 1px solid #cbd1da;
      border-radius: 9px;
      font: inherit;
      line-height: 1.6;
      outline: none;
    }

    .composer textarea:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 2px rgba(26, 115, 232, .12);
    }

    .send-button {
      min-width: 92px;
      height: 52px;
      border: 0;
      border-radius: 9px;
      background: #1a73e8;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    .send-button:hover {
      background: #1769d0;
    }

    .send-button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .composer-note {
      margin: 7px 2px 0;
      color: #8a919b;
      font-size: 11px;
    }

    .system-message {
      margin: 12px 0;
      padding: 11px 13px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .system-message.error {
      color: #a61b1b;
      background: #fff1f1;
      border: 1px solid #ffd4d4;
    }

    .system-message.info {
      color: #315c85;
      background: #eef6ff;
      border: 1px solid #d5e8ff;
    }

    .auth-pending .page-content {
      display: none;
    }

    .auth-pending .app-main {
      min-height: 100vh;
    }

    .page-loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fb;
      z-index: 100;
    }

    .page-loading-box {
      width: min(90%, 360px);
      padding: 30px;
      text-align: center;
      background: #fff;
      border: 1px solid #e1e5eb;
      border-radius: 12px;
    }

    .page-loading-box p {
      margin: 0;
      color: #5f6368;
      font-size: 14px;
    }

    .auth-error {
      margin: 40px auto;
      max-width: 700px;
      padding: 30px;
      background: #fff;
      border: 1px solid #e1e5eb;
      border-radius: 12px;
    }

    .auth-error h1 {
      margin-top: 0;
      font-size: 21px;
    }

    .auth-error p {
      line-height: 1.8;
    }

    .auth-error pre {
      padding: 12px;
      background: #f5f6f8;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
    }

    .auth-error button,
    .auth-error a {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 7px;
      border: 1px solid #cbd1da;
      background: #fff;
      color: #374151;
      text-decoration: none;
      cursor: pointer;
      margin-right: 8px;
    }

    .app-footer {
      padding: 18px;
      color: #8a919b;
      text-align: center;
      font-size: 10px;
    }

    @media (max-width: 700px) {
      .app-shell {
        display: block;
      }

      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        height: 100vh;
        transform: translateX(-100%);
        transition: transform .2s ease;
        box-shadow: 8px 0 25px rgba(0, 0, 0, .08);
      }

      body.sidebar-expanded .sidebar {
        transform: translateX(0);
      }

      .app-main {
        width: 100%;
      }

      .topbar {
        padding: 0 16px;
      }

      .page-content {
        padding: 16px;
      }

      .chat-card {
        min-height: calc(100vh - 115px);
      }

      .messages {
        padding: 16px;
      }

      .message-bubble {
        max-width: 92%;
      }

      .composer-form {
        align-items: stretch;
      }

      .send-button {
        min-width: 78px;
      }
    }
  </style>
</head>

<body
  data-role="student"
  class="auth-pending"
>

  <div class="app-shell">

    <!-- サイドバー -->
    <aside
      id="appSidebar"
      class="sidebar"
      aria-label="サイドメニュー"
    >
      <div class="sidebar-header">
        <strong>学習AIチャット</strong>
      </div>
    </aside>

    <!-- メイン -->
    <div class="app-main">

      <header class="topbar">
        <div>
          <h1 class="topbar-title">AIに質問</h1>
        </div>

        <div
          id="currentUserName"
          class="topbar-user"
        >
          -
        </div>
      </header>

      <main class="page-content">

        <section class="chat-layout">

          <article class="chat-card">

            <header class="chat-header">

              <div>
                <h2 class="chat-header-title">
                  学習AIチャット
                </h2>

                <p class="chat-header-subtitle">
                  学習について自由に質問してください。
                </p>
              </div>

              <button
                id="newConversationButton"
                class="new-chat-button"
                type="button"
              >
                新しい会話
              </button>

            </header>

            <div
              id="conversationInfo"
              class="conversation-info"
            >
              新しい会話
            </div>

            <div
              id="systemMessage"
              class="system-message info"
              hidden
            ></div>

            <section
              id="messages"
              class="messages"
              aria-live="polite"
            >

              <div
                id="emptyState"
                class="empty-state"
              >
                <h2>学習について質問してください</h2>

                <p>
                  数学・英語・国語・理科・社会など、
                  学習に関する質問を入力できます。
                </p>
              </div>

            </section>

            <div class="composer">

              <form
                id="composerForm"
                class="composer-form"
              >

                <textarea
                  id="messageInput"
                  maxlength="4000"
                  placeholder="質問を入力してください"
                  aria-label="質問"
                ></textarea>

                <button
                  id="sendButton"
                  class="send-button"
                  type="submit"
                >
                  送信
                </button>

              </form>

              <p class="composer-note">
                学習目的で利用してください。
              </p>

            </div>

          </article>

        </section>

      </main>

      <footer class="app-footer">
        © 2026 Regular Test Preparation Worksheet Administration Office. All Rights Reserved.
      </footer>

    </div>
  </div>

  <!-- 認証・初期化エラー表示 -->
  <div
    id="pageLoading"
    class="page-loading"
  >
    <div class="page-loading-box">
      <p id="pageLoadingText">
        システムを確認しています。
      </p>
    </div>
  </div>

  <script type="module">

    import {
      protectPage,
      db
    } from "../assets/js/auth.js";

    import {
      collection,
      doc,
      getDoc,
      setDoc,
      updateDoc,
      serverTimestamp
    } from "../assets/js/firebase.js";

    /*
     * =========================================
     * 基本状態
     * =========================================
     */

    let authResult = null;

    let currentUser = null;

    let currentProfile = null;

    let conversationId = null;

    let messages = [];

    let sending = false;

    let initialized = false;


    /*
     * =========================================
     * DOM
     * =========================================
     */

    const loading = document.getElementById(
      "pageLoading"
    );

    const loadingText = document.getElementById(
      "pageLoadingText"
    );

    const messagesElement = document.getElementById(
      "messages"
    );

    const emptyState = document.getElementById(
      "emptyState"
    );

    const input = document.getElementById(
      "messageInput"
    );

    const sendButton = document.getElementById(
      "sendButton"
    );

    const composerForm = document.getElementById(
      "composerForm"
    );

    const newConversationButton =
      document.getElementById(
        "newConversationButton"
      );

    const conversationInfo =
      document.getElementById(
        "conversationInfo"
      );

    const systemMessage =
      document.getElementById(
        "systemMessage"
      );


    /*
     * =========================================
     * 共通表示
     * =========================================
     */

    function hideLoading() {

      if (loading) {
        loading.remove();
      }

      document.documentElement.classList.remove(
        "auth-pending"
      );

      document.body.classList.remove(
        "auth-pending"
      );
    }


    function showSystemMessage(
      message,
      type = "info"
    ) {

      systemMessage.textContent = message;

      systemMessage.className =
        `system-message ${type}`;

      systemMessage.hidden = false;
    }


    function hideSystemMessage() {

      systemMessage.textContent = "";

      systemMessage.hidden = true;
    }


    function setSending(value) {

      sending = value;

      sendButton.disabled = value;

      input.disabled = value;

      newConversationButton.disabled = value;

      sendButton.textContent =
        value ? "回答中..." : "送信";
    }


    /*
     * =========================================
     * エラー表示
     * =========================================
     */

    function showPageError(
      title,
      message,
      detail = ""
    ) {

      hideLoading();

      document.body.innerHTML = "";

      const main =
        document.createElement("main");

      main.className = "auth-error";

      const h1 =
        document.createElement("h1");

      h1.textContent = title;

      const p =
        document.createElement("p");

      p.textContent = message;

      main.append(h1, p);

      if (detail) {

        const pre =
          document.createElement("pre");

        pre.textContent = detail;

        main.append(pre);
      }

      const reload =
        document.createElement("button");

      reload.type = "button";

      reload.textContent =
        "再読み込み";

      reload.addEventListener(
        "click",
        () => location.reload()
      );

      const login =
        document.createElement("a");

      login.href =
        "../login.html";

      login.textContent =
        "ログイン画面へ";

      main.append(
        reload,
        login
      );

      document.body.append(main);
    }


    /*
     * =========================================
     * URL
     * =========================================
     */

    function getConversationIdFromUrl() {

      const params =
        new URLSearchParams(
          location.search
        );

      return params.get(
        "conversationId"
      );
    }


    function setConversationUrl(id) {

      if (!id) {

        history.replaceState(
          {},
          "",
          "question.html"
        );

        return;
      }

      const params =
        new URLSearchParams();

      params.set(
        "conversationId",
        id
      );

      history.replaceState(
        {},
        "",
        `question.html?${params.toString()}`
      );
    }


    /*
     * =========================================
     * ID
     * =========================================
     */

    function createConversationId() {

      return (
        "conversation_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .slice(2, 10)
      );
    }


    function createAnswerId() {

      return (
        "answer_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .slice(2, 10)
      );
    }


    /*
     * =========================================
     * 会話タイトル
     * =========================================
     */

    function createTitle(text) {

      const clean =
        String(text || "")
          .replace(/\s+/g, " ")
          .trim();

      if (!clean) {
        return "新しい会話";
      }

      return clean.length > 30
        ? clean.slice(0, 30) + "…"
        : clean;
    }


    /*
     * =========================================
     * 日付
     * =========================================
     */

    function formatDate(value) {

      if (!value) {
        return "";
      }

      let date;

      try {

        if (
          typeof value.toDate ===
          "function"
        ) {
          date = value.toDate();
        } else {
          date = new Date(value);
        }

      } catch {
        return "";
      }

      if (
        !date ||
        Number.isNaN(
          date.getTime()
        )
      ) {
        return "";
      }

      return new Intl.DateTimeFormat(
        "ja-JP",
        {
          year: "numeric",
          month: "numeric",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      ).format(date);
    }


    /*
     * =========================================
     * メッセージ表示
     * =========================================
     */

    function clearMessages() {

      messagesElement
        .querySelectorAll(
          ".message-row"
        )
        .forEach(
          element => element.remove()
        );
    }


    function renderMessages() {

      clearMessages();

      if (!messages.length) {

        emptyState.hidden = false;

        return;
      }

      emptyState.hidden = true;

      for (const message of messages) {

        renderMessage(message);
      }

      scrollToBottom();
    }


    function renderMessage(message) {

      const role =
        message.role === "user"
          ? "user"
          : "assistant";

      const row =
        document.createElement("div");

      row.className =
        `message-row ${role}`;

      if (message.id) {

        row.dataset.messageId =
          message.id;
      }

      const wrapper =
        document.createElement("div");

      const bubble =
        document.createElement("div");

      bubble.className =
        "message-bubble";

      /*
       * innerHTMLは使用しない。
       * AIから返された文字列をそのまま
       * HTMLとして実行させない。
       */

      bubble.textContent =
        message.content || "";

      const meta =
        document.createElement("div");

      meta.className =
        "message-meta";

      if (
        role === "assistant" &&
        message.id
      ) {

        const answerId =
          document.createElement("span");

        answerId.className =
          "answer-id";

        answerId.textContent =
          `回答ID: ${message.id}`;

        meta.append(answerId);
      }

      if (message.createdAt) {

        const date =
          document.createElement("span");

        date.textContent =
          ` ${formatDate(message.createdAt)}`;

        meta.append(date);
      }

      wrapper.append(
        bubble,
        meta
      );

      row.append(wrapper);

      messagesElement.append(row);
    }


    function scrollToBottom() {

      requestAnimationFrame(() => {

        messagesElement.scrollTop =
          messagesElement.scrollHeight;

      });
    }


    /*
     * =========================================
     * Firestore
     * =========================================
     */

    function conversationRef() {

      if (!currentUser) {
        throw new Error(
          "ログインユーザーが確認できません。"
        );
      }

      if (!conversationId) {
        throw new Error(
          "会話IDがありません。"
        );
      }

      return doc(
        db,
        "chatHistories",
        conversationId
      );
    }


    async function createConversation() {

      if (!currentUser) {
        throw new Error(
          "ログインユーザーが確認できません。"
        );
      }

      conversationId =
        createConversationId();

      messages = [];

      const ref =
        conversationRef();

      await setDoc(
        ref,
        {
          userId: currentUser.uid,

          subject:
            currentProfile?.subject ||
            "学習",

          grade:
            currentProfile?.grade ||
            "",

          title: "新しい会話",

          messages: [],

          createdAt:
            serverTimestamp(),

          updatedAt:
            serverTimestamp()
        }
      );

      setConversationUrl(
        conversationId
      );

      conversationInfo.textContent =
        "新しい会話";

      renderMessages();
    }


    async function loadConversation(id) {

      if (!id) {
        return false;
      }

      const ref =
        doc(
          db,
          "chatHistories",
          id
        );

      const snapshot =
        await getDoc(ref);

      if (!snapshot.exists()) {

        showSystemMessage(
          "指定された会話は見つかりませんでした。新しい会話を開始します。",
          "error"
        );

        return false;
      }

      const data =
        snapshot.data();

      if (
        data.userId !==
        currentUser.uid
      ) {

        showSystemMessage(
          "この会話を開く権限がありません。",
          "error"
        );

        return false;
      }

      conversationId = id;

      messages =
        Array.isArray(data.messages)
          ? normalizeMessages(
              data.messages
            )
          : [];

      conversationInfo.textContent =
        data.title ||
        "会話";

      renderMessages();

      return true;
    }


    function normalizeMessages(
      source
    ) {

      if (!Array.isArray(source)) {
        return [];
      }

      return source
        .map(
          item => {

            if (
              !item ||
              typeof item !==
                "object"
            ) {
              return null;
            }

            const role =
              item.role === "user"
                ? "user"
                : "assistant";

            const content =
              typeof item.content ===
              "string"
                ? item.content
                : "";

            if (!content) {
              return null;
            }

            return {
              id:
                item.id ||
                (
                  role === "assistant"
                    ? createAnswerId()
                    : `message_${Date.now()}_${Math.random().toString(36).slice(2,8)}`
                ),

              role,

              content,

              createdAt:
                item.createdAt ||
                null
            };
          }
        )
        .filter(Boolean);
    }


    async function saveConversation() {

      if (
        !currentUser ||
        !conversationId
      ) {
        return;
      }

      const ref =
        conversationRef();

      const firstUserMessage =
        messages.find(
          item =>
            item.role === "user"
        );

      const title =
        firstUserMessage
          ? createTitle(
              firstUserMessage.content
            )
          : "新しい会話";

      await updateDoc(
        ref,
        {
          messages,
          title,
          updatedAt:
            serverTimestamp()
        }
      );

      conversationInfo.textContent =
        title;
    }


    /*
     * =========================================
     * AI
     * =========================================
     *
     * ここでは「JSON形式のAI回答」を
     * 前提にしない。
     *
     * study-chat/index.ts のAPIを
     * fetchして文字列として受け取る。
     */

    async function askAI(
      conversationMessages
    ) {

      /*
       * GitHub Pagesから直接AI APIを
       * 呼ぶ場合は、実際の公開API URLを
       * ここに設定する。
       *
       * APIキーをHTMLへ直接書かない。
       */

      const endpoint =
        window.STUDY_AI_ENDPOINT ||
        "";

      if (!endpoint) {

        /*
         * API未設定でも白画面にはしない。
         * システムとして明確なエラーを返す。
         */

        throw new Error(
          "AI回答APIが設定されていません。STUDY_AI_ENDPOINT を確認してください。"
        );
      }

      const response =
        await fetch(
          endpoint,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              subject:
                currentProfile?.subject ||
                "学習",

              grade:
                currentProfile?.grade ||
                "",

              messages:
                conversationMessages.map(
                  item => ({
                    role:
                      item.role,

                    content:
                      item.content
                  })
                )
            })
          }
        );

      if (!response.ok) {

        const text =
          await response.text()
            .catch(() => "");

        throw new Error(
          `AIサーバーエラー (${response.status})${text ? `\n${text}` : ""}`
        );
      }

      /*
       * JSONでもプレーンテキストでも
       * 受け取れるようにする。
       */

      const raw =
        await response.text();

      let answer = raw;

      try {

        const parsed =
          JSON.parse(raw);

        if (
          typeof parsed ===
          "string"
        ) {

          answer = parsed;

        } else if (
          typeof parsed.answer ===
          "string"
        ) {

          answer =
            parsed.answer;

        } else if (
          typeof parsed.response ===
          "string"
        ) {

          answer =
            parsed.response;

        } else if (
          typeof parsed.message ===
          "string"
        ) {

          answer =
            parsed.message;

        } else if (
          typeof parsed.text ===
          "string"
        ) {

          answer =
            parsed.text;
        }

      } catch {
        /*
         * JSONでない場合は
         * raw文字列をそのまま回答として使用。
         */
      }

      answer =
        String(answer || "")
          .trim();

      if (!answer) {

        throw new Error(
          "AIから空の回答が返されました。"
        );
      }

      return answer;
    }


    /*
     * =========================================
     * 送信
     * =========================================
     */

    async function handleSubmit(
      event
    ) {

      event.preventDefault();

      if (
        sending ||
        !currentUser
      ) {
        return;
      }

      const text =
        input.value.trim();

      if (!text) {
        input.focus();
        return;
      }

      hideSystemMessage();

      setSending(true);

      try {

        /*
         * 会話IDがなければ先に作成。
         */

        if (!conversationId) {

          await createConversation();
        }

        const userMessage = {

          id:
            `message_${Date.now()}_${Math.random().toString(36).slice(2,8)}`,

          role:
            "user",

          content:
            text,

          createdAt:
            new Date().toISOString()
        };

        messages.push(
          userMessage
        );

        renderMessages();

        input.value = "";

        /*
         * 一旦ユーザー質問を保存。
         */

        try {

          await saveConversation();

        } catch (saveError) {

          console.error(
            "質問保存エラー:",
            saveError
          );

          /*
           * Firestore保存失敗でも
           * AI回答そのものは続行する。
           */

          showSystemMessage(
            "質問は表示されていますが、会話履歴の保存に失敗しました。",
            "error"
          );
        }

        /*
         * AIへ送信。
         */

        const answer =
          await askAI(
            messages
          );

        const assistantMessage = {

          id:
            createAnswerId(),

          role:
            "assistant",

          content:
            answer,

          createdAt:
            new Date().toISOString()
        };

        messages.push(
          assistantMessage
        );

        renderMessages();

        /*
         * AI回答を保存。
         */

        try {

          await saveConversation();

          hideSystemMessage();

        } catch (saveError) {

          console.error(
            "回答保存エラー:",
            saveError
          );

          showSystemMessage(
            "回答は表示されましたが、履歴を保存できませんでした。",
            "error"
          );
        }

      } catch (error) {

        console.error(
          "AI質問処理エラー:",
          error
        );

        showSystemMessage(
          error?.message ||
          "AIへの質問中にエラーが発生しました。",
          "error"
        );

      } finally {

        setSending(false);

        input.focus();
      }
    }


    /*
     * =========================================
     * 新しい会話
     * =========================================
     */

    async function handleNewConversation() {

      if (
        sending ||
        !currentUser
      ) {
        return;
      }

      hideSystemMessage();

      conversationId = null;

      messages = [];

      setConversationUrl(
        null
      );

      conversationInfo.textContent =
        "新しい会話";

      renderMessages();

      input.value = "";

      input.focus();
    }


    /*
     * =========================================
     * Enter送信
     * =========================================
     */

    input.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          composerForm.requestSubmit();
        }
      }
    );


    /*
     * =========================================
     * イベント
     * =========================================
     */

    composerForm.addEventListener(
      "submit",
      handleSubmit
    );

    newConversationButton.addEventListener(
      "click",
      handleNewConversation
    );


    /*
     * =========================================
     * 初期化
     * =========================================
     */

    async function initialize() {

      if (initialized) {
        return;
      }

      initialized = true;

      try {

        /*
         * ここで認証と権限を確認。
         *
         * auth.js側で
         * student以外を弾く。
         */

        authResult =
          await protectPage(
            "student"
          );

        if (!authResult) {
          return;
        }

        currentUser =
          authResult.user;

        currentProfile =
          authResult.profile;

        /*
         * conversationIdをURLから取得。
         */

        const requestedId =
          getConversationIdFromUrl();

        let loaded = false;

        if (requestedId) {

          try {

            loaded =
              await loadConversation(
                requestedId
              );

          } catch (error) {

            console.error(
              "会話読み込みエラー:",
              error
            );

            showSystemMessage(
              "会話履歴を読み込めませんでした。新しい会話を開始できます。",
              "error"
            );
          }
        }

        /*
         * URLに会話IDがない場合は
         * 新規会話状態。
         */

        if (!loaded) {

          conversationId = null;

          messages = [];

          conversationInfo.textContent =
            "新しい会話";

          renderMessages();
        }

        /*
         * ユーザー名。
         */

        const userName =
          document.getElementById(
            "currentUserName"
          );

        if (userName) {

          userName.textContent =
            currentProfile?.displayName ||
            currentUser?.displayName ||
            currentUser?.email ||
            "ユーザー";
        }

        hideLoading();

        input.focus();

      } catch (error) {

        console.error(
          "question.html 初期化エラー:",
          error
        );

        showPageError(
          "画面を初期化できませんでした。",
          "学習AIチャットを開始できませんでした。",
          error?.message ||
          String(error)
        );
      }
    }


    /*
     * =========================================
     * 開始
     * =========================================
     */

    initialize();

  </script>
