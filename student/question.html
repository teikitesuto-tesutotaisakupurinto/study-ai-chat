<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#f5f7fb"
  >

  <title>AIに質問 | 学習AIチャット</title>

  <link
    rel="stylesheet"
    href="../assets/css/common.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/student.css"
  >

  <style>
    html.auth-pending body {
      visibility: hidden;
    }

    body {
      margin: 0;
      background: #f5f7fb;
    }

    .app-shell {
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 250px;
      flex: 0 0 250px;
      min-height: 100vh;
      background: #ffffff;
      border-right: 1px solid #e2e6ee;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .main-area {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 64px;
      background: #ffffff;
      border-bottom: 1px solid #e2e6ee;
      display: flex;
      align-items: center;
      padding: 0 24px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 20px;
    }

    .chat-wrapper {
      width: 100%;
      max-width: 1050px;
      margin: 0 auto;
      padding: 28px 24px 40px;
      flex: 1;
    }

    .chat-card {
      min-height: calc(100vh - 140px);
      background: #ffffff;
      border: 1px solid #e2e6ee;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .conversation-header {
      padding: 18px 22px;
      border-bottom: 1px solid #e8ebf0;
    }

    .conversation-header h2 {
      margin: 0;
      font-size: 18px;
    }

    .conversation-id {
      margin-top: 5px;
      color: #777;
      font-size: 11px;
      word-break: break-all;
    }

    .chat-messages {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }

    .empty-chat {
      max-width: 600px;
      margin: 80px auto;
      text-align: center;
      color: #68707c;
      line-height: 1.8;
    }

    .message {
      margin-bottom: 20px;
    }

    .message.user {
      display: flex;
      justify-content: flex-end;
    }

    .message.ai {
      display: flex;
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: min(780px, 88%);
      padding: 15px 17px;
      border-radius: 12px;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.user .message-bubble {
      background: #1a73e8;
      color: #ffffff;
    }

    .message.ai .message-bubble {
      background: #f1f3f6;
      color: #202124;
    }

    .message-meta {
      margin-top: 5px;
      font-size: 10px;
      color: #858585;
    }

    .chat-input-area {
      border-top: 1px solid #e8ebf0;
      padding: 16px;
      background: #ffffff;
    }

    .chat-form {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .chat-input {
      flex: 1;
      min-height: 50px;
      max-height: 180px;
      resize: vertical;
      padding: 13px 14px;
      border: 1px solid #c8ced8;
      border-radius: 9px;
      font: inherit;
      line-height: 1.6;
    }

    .chat-input:focus {
      outline: 2px solid #1a73e8;
      outline-offset: 1px;
      border-color: #1a73e8;
    }

    .send-button {
      width: auto;
      min-width: 100px;
      margin: 0;
    }

    .status-message {
      min-height: 20px;
      margin-top: 8px;
      color: #68707c;
      font-size: 12px;
    }

    .layout-error {
      margin: 20px;
      padding: 15px;
      border: 1px solid #f0b8b8;
      border-radius: 8px;
      background: #fff4f4;
      color: #a52222;
    }

    .app-footer {
      padding: 16px;
      text-align: center;
      color: #777;
      font-size: 11px;
    }

    @media (max-width: 700px) {
      .app-shell {
        display: block;
      }

      .sidebar {
        width: 100%;
        height: auto;
        min-height: 0;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
        transition: transform .2s ease;
      }

      body.sidebar-expanded .sidebar {
        transform: translateX(0);
      }

      .main-area {
        width: 100%;
      }

      .chat-wrapper {
        padding: 15px 10px 25px;
      }

      .chat-card {
        min-height: calc(100vh - 110px);
        border-radius: 10px;
      }

      .topbar {
        padding: 0 15px;
      }

      .chat-form {
        flex-direction: column;
      }

      .chat-input {
        width: 100%;
      }

      .send-button {
        width: 100%;
      }

      .message-bubble {
        max-width: 94%;
      }
    }
  </style>
</head>

<body
  data-role="student"
  class="student-page"
>

  <div class="app-shell">

    <aside
      id="appSidebar"
      class="sidebar"
      aria-label="サイドメニュー"
    ></aside>

    <div class="main-area">

      <header class="topbar">
        <h1>AIに質問</h1>
      </header>

      <main class="chat-wrapper">

        <section class="chat-card">

          <header
            class="conversation-header"
          >
            <h2 id="conversationTitle">
              新しい会話
            </h2>

            <div
              id="conversationIdDisplay"
              class="conversation-id"
            ></div>
          </header>

          <section
            id="chatMessages"
            class="chat-messages"
            aria-live="polite"
          >
            <div
              id="emptyChat"
              class="empty-chat"
            >
              AIに質問してください。
              <br>
              学習内容について質問すると、
              この会話に回答が保存されます。
            </div>
          </section>

          <section
            class="chat-input-area"
          >

            <form
              id="chatForm"
              class="chat-form"
            >

              <textarea
                id="questionInput"
                class="chat-input"
                maxlength="5000"
                placeholder="学習について質問してください"
                required
              ></textarea>

              <button
                id="sendButton"
                class="send-button"
                type="submit"
              >
                送信
              </button>

            </form>

            <div
              id="chatStatus"
              class="status-message"
              role="status"
            ></div>

          </section>

        </section>

      </main>

      <footer class="app-footer">
        © 2026 Regular Test Preparation Worksheet Administration Office. All Rights Reserved.
      </footer>

    </div>

  </div>

  <script
    type="module"
    src="../assets/js/page.js"
  ></script>

  <script
    type="module"
  >
    import {
      auth,
      db,
      doc,
      getDoc,
      setDoc,
      updateDoc,
      addDoc,
      collection,
      serverTimestamp
    } from "../assets/js/firebase.js";

    import {
      requireRole
    } from "../assets/js/auth.js";

    let currentUser = null;
    let currentProfile = null;

    let conversationId = null;

    const params =
      new URLSearchParams(
        window.location.search
      );

    const requestedConversationId =
      params.get(
        "conversationId"
      );

    const messagesElement =
      document.getElementById(
        "chatMessages"
      );

    const emptyChat =
      document.getElementById(
        "emptyChat"
      );

    const form =
      document.getElementById(
        "chatForm"
      );

    const input =
      document.getElementById(
        "questionInput"
      );

    const sendButton =
      document.getElementById(
        "sendButton"
      );

    const statusElement =
      document.getElementById(
        "chatStatus"
      );

    const titleElement =
      document.getElementById(
        "conversationTitle"
      );

    const idElement =
      document.getElementById(
        "conversationIdDisplay"
      );

    function createId(prefix) {
      if (
        typeof crypto !==
          "undefined" &&
        crypto.randomUUID
      ) {
        return `${prefix}_${crypto.randomUUID()}`;
      }

      return (
        `${prefix}_` +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .slice(2, 12)
      );
    }

    function setStatus(
      message
    ) {
      statusElement.textContent =
        message || "";
    }

    function clearEmptyState() {
      if (emptyChat) {
        emptyChat.remove();
      }
    }

    function addMessageToScreen(
      type,
      text,
      answerId = ""
    ) {
      clearEmptyState();

      const wrapper =
        document.createElement(
          "article"
        );

      wrapper.className =
        `message ${type}`;

      if (answerId) {
        wrapper.dataset.answerId =
          answerId;
      }

      const bubble =
        document.createElement(
          "div"
        );

      bubble.className =
        "message-bubble";

      bubble.textContent =
        text;

      wrapper.append(
        bubble
      );

      if (answerId) {
        const meta =
          document.createElement(
            "div"
          );

        meta.className =
          "message-meta";

        meta.textContent =
          `回答ID: ${answerId}`;

        wrapper.append(
          meta
        );
      }

      messagesElement.append(
        wrapper
      );

      messagesElement.scrollTop =
        messagesElement.scrollHeight;
    }

    async function createConversation(
      firstQuestion
    ) {
      const newConversationId =
        createId(
          "conversation"
        );

      const conversationRef =
        doc(
          db,
          "chatHistories",
          newConversationId
        );

      await setDoc(
        conversationRef,
        {
          conversationId:
            newConversationId,

          userId:
            currentUser.uid,

          title:
            firstQuestion
              .trim()
              .slice(0, 50),

          lastQuestion:
            firstQuestion
              .trim()
              .slice(0, 200),

          messageCount: 0,

          createdAt:
            serverTimestamp(),

          updatedAt:
            serverTimestamp()
        }
      );

      return newConversationId;
    }

    async function loadConversation(
      id
    ) {
      const conversationRef =
        doc(
          db,
          "chatHistories",
          id
        );

      const snapshot =
        await getDoc(
          conversationRef
        );

      if (
        !snapshot.exists()
      ) {
        throw new Error(
          "指定された会話が見つかりません。"
        );
      }

      const data =
        snapshot.data();

      if (
        data.userId !==
        currentUser.uid
      ) {
        throw new Error(
          "この会話を開く権限がありません。"
        );
      }

      conversationId =
        id;

      titleElement.textContent =
        data.title ||
        "会話";

      idElement.textContent =
        `会話ID: ${id}`;

      /*
       * 会話の回答データは
       * chatHistories/{conversationId}/messages
       * に保存する。
       */
      const messagesRef =
        collection(
          db,
          "chatHistories",
          id,
          "messages"
        );

      const snapshot =
        await getDocs(
          query(
            messagesRef,
            orderBy(
              "createdAt",
              "asc"
            )
          )
        );

      snapshot.forEach(
        messageDoc => {
          const message =
            messageDoc.data();

          addMessageToScreen(
            message.role === "user"
              ? "user"
              : "ai",
            message.text ||
              "",
            message.answerId ||
              messageDoc.id
          );
        }
      );
    }

    async function saveMessage(
      role,
      text,
      answerId
    ) {
      if (
        !conversationId
      ) {
        throw new Error(
          "会話IDがありません。"
        );
      }

      const messagesRef =
        collection(
          db,
          "chatHistories",
          conversationId,
          "messages"
        );

      const messageRef =
        await addDoc(
          messagesRef,
          {
            answerId:
              answerId,

            conversationId:
              conversationId,

            userId:
              currentUser.uid,

            role:
              role,

            text:
              text,

            createdAt:
              serverTimestamp()
          }
        );

      return messageRef.id;
    }

    async function updateConversation(
      question
    ) {
      if (
        !conversationId
      ) {
        return;
      }

      const ref =
        doc(
          db,
          "chatHistories",
          conversationId
        );

      await updateDoc(
        ref,
        {
          lastQuestion:
            question
              .trim()
              .slice(0, 200),

          updatedAt:
            serverTimestamp()
        }
      );
    }

    async function getAIAnswer(
      question
    ) {
      /*
       * ここは後から index.ts / API側と
       * 接続するための境界。
       *
       * 現段階では学習AI側から
       * 実際のAI APIを直接呼ばず、
       * 明確なエラーとして扱う。
       */
      throw new Error(
        "AI回答APIがまだ接続されていません。"
      );
    }

    async function sendQuestion(
      question
    ) {
      if (
        !question.trim()
      ) {
        return;
      }

      if (
        !currentUser
      ) {
        throw new Error(
          "ログイン状態を確認できません。"
        );
      }

      sendButton.disabled =
        true;

      input.disabled =
        true;

      setStatus(
        "回答を生成しています..."
      );

      try {
        if (
          !conversationId
        ) {
          conversationId =
            await createConversation(
              question
            );

          const newUrl =
            `question.html?conversationId=${
              encodeURIComponent(
                conversationId
              )
            }`;

          window.history.replaceState(
            {},
            "",
            newUrl
          );

          idElement.textContent =
            `会話ID: ${conversationId}`;

          titleElement.textContent =
            question
              .trim()
              .slice(0, 50);
        }

        const answerId =
          createId(
            "answer"
          );

        await saveMessage(
          "user",
          question,
          answerId
        );

        addMessageToScreen(
          "user",
          question,
          answerId
        );

        await updateConversation(
          question
        );

        const answer =
          await getAIAnswer(
            question
          );

        await saveMessage(
          "assistant",
          answer,
          answerId
        );

        addMessageToScreen(
          "ai",
          answer,
          answerId
        );

        setStatus(
          "回答を保存しました。"
        );

      } catch (error) {
        console.error(
          "質問処理エラー:",
          error
        );

        setStatus(
          `回答を保存できませんでした。${
            error?.message
              ? ` ${error.message}`
              : ""
          }`
        );

      } finally {
        sendButton.disabled =
          false;

        input.disabled =
          false;

        input.focus();
      }
    }

    form.addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        const question =
          input.value.trim();

        if (
          !question
        ) {
          return;
        }

        input.value =
          "";

        await sendQuestion(
          question
        );
      }
    );

    async function initialize() {
      try {
        const result =
          await requireRole(
            "student"
          );

        if (!result) {
          return;
        }

        currentUser =
          result.user;

        currentProfile =
          result.profile;

        if (
          requestedConversationId
        ) {
          await loadConversation(
            requestedConversationId
          );
        } else {
          setStatus(
            "新しい会話を開始できます。"
          );
        }

      } catch (error) {
        console.error(
          "質問画面初期化エラー:",
          error
        );

        setStatus(
          "質問画面を初期化できませんでした。"
        );
      }
    }

    initialize();
  </script>

</body>
</html>
