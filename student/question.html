
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>学習AIチャット</title>

  <link
    rel="stylesheet"
    href="../assets/css/common.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;

      background: #f7f8fa;
      color: #202124;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    }

    body {
      min-height: 100vh;
    }

    button,
    textarea,
    select {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    [hidden] {
      display: none !important;
    }

    /* =========================
       全体
    ========================= */

    .student-layout {
      width: 100%;
      min-height: 100vh;

      display: flex;
    }

    .student-main {
      min-width: 0;
      flex: 1;

      min-height: 100vh;

      display: flex;
      flex-direction: column;
    }

    /* =========================
       ヘッダー
    ========================= */

    .question-header {
      flex: 0 0 auto;

      width: 100%;
      min-height: 66px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      padding: 12px 26px;

      background: #ffffff;

      border-bottom: 1px solid #e5e7eb;
    }

    .question-header-title {
      min-width: 0;
    }

    .question-header-title h1 {
      margin: 0;

      color: #111827;

      font-size: 20px;
      font-weight: 700;

      line-height: 1.4;
    }

    .question-header-title p {
      margin: 3px 0 0;

      color: #64748b;

      font-size: 12px;
      line-height: 1.5;
    }

    .new-question-button {
      flex: 0 0 auto;

      min-height: 38px;

      padding: 7px 13px;

      border: 1px solid #cbd5e1;
      border-radius: 8px;

      background: #ffffff;
      color: #334155;

      cursor: pointer;

      font-size: 13px;
      font-weight: 600;
    }

    .new-question-button:hover {
      background: #f8fafc;
    }

    .new-question-button:disabled {
      opacity: .5;
      cursor: default;
    }

    /* =========================
       コンテンツ
    ========================= */

    .question-page {
      width: min(1050px, 100%);

      flex: 1;

      display: flex;
      flex-direction: column;

      margin: 0 auto;

      padding: 18px 28px 0;
    }

    /* =========================
       教科
    ========================= */

    .subject-area {
      flex: 0 0 auto;

      display: flex;
      align-items: center;

      gap: 9px;

      margin-bottom: 4px;
    }

    .subject-area label {
      color: #475569;

      font-size: 13px;
      font-weight: 600;
    }

    #subjectSelect {
      height: 38px;

      min-width: 170px;

      padding: 5px 10px;

      border: 1px solid #cbd5e1;
      border-radius: 8px;

      outline: none;

      background: #ffffff;
      color: #202124;

      cursor: pointer;
    }

    #subjectSelect:focus {
      border-color: #2563eb;
    }

    #subjectSelect:disabled {
      opacity: .6;
      cursor: default;
    }

    /* =========================
       会話
    ========================= */

    .conversation {
      width: 100%;

      flex: 1;

      min-height: 0;

      display: flex;
      flex-direction: column;

      gap: 17px;

      overflow-y: auto;

      padding: 14px 3px 18px;
    }

    .conversation::-webkit-scrollbar {
      width: 7px;
    }

    .conversation::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    .conversation::-webkit-scrollbar-track {
      background: transparent;
    }

    /* =========================
       ウェルカム
    ========================= */

    .welcome {
      width: 100%;

      margin: auto;

      padding: 35px 20px;

      text-align: center;
    }

    .welcome h2 {
      margin: 0 0 9px;

      color: #1f2937;

      font-size: 24px;
      font-weight: 650;
    }

    .welcome p {
      max-width: 600px;

      margin: 0 auto;

      color: #64748b;

      font-size: 14px;
      line-height: 1.9;
    }

    /* =========================
       メッセージ
    ========================= */

    .message {
      width: 100%;

      display: flex;
      flex-direction: column;

      gap: 4px;
    }

    .message.user {
      align-items: flex-end;
    }

    .message.assistant {
      align-items: flex-start;
    }

    .message-role {
      padding: 0 5px;

      color: #94a3b8;

      font-size: 11px;
      line-height: 1.4;
    }

    .message-content {
      max-width: min(78%, 760px);

      padding: 11px 15px;

      border: 1px solid #e5e7eb;
      border-radius: 14px;

      background: #ffffff;

      color: #202124;

      font-size: 15px;
      line-height: 1.85;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .message.user .message-content {
      background: #e8f0fe;
      border-color: #d6e4ff;

      border-bottom-right-radius: 5px;
    }

    .message.assistant .message-content {
      background: #ffffff;

      border-bottom-left-radius: 5px;
    }

    .message.error .message-content {
      background: #fff5f5;
      border-color: #fecaca;
      color: #991b1b;
    }

    /* =========================
       AI待機
    ========================= */

    .typing {
      align-self: flex-start;

      min-width: 55px;
      height: 40px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0 13px;

      border: 1px solid #e5e7eb;
      border-radius: 14px;
      border-bottom-left-radius: 5px;

      background: #ffffff;

      color: #64748b;

      font-size: 18px;
      font-weight: 700;

      letter-spacing: 3px;

      line-height: 1;
    }

    .typing::after {
      content: "・・・";

      animation: typingAnimation 1.25s ease-in-out infinite;
    }

    @keyframes typingAnimation {
      0% {
        opacity: .2;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: .2;
      }
    }

    /* =========================
       エラー
    ========================= */

    .question-error {
      flex: 0 0 auto;

      margin: 0 0 8px;

      padding: 9px 12px;

      border: 1px solid #fecaca;
      border-radius: 8px;

      background: #fff5f5;

      color: #991b1b;

      font-size: 13px;
      line-height: 1.7;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    /* =========================
       入力
    ========================= */

    .composer {
      flex: 0 0 auto;

      width: 100%;

      padding: 7px 0 6px;
    }

    .composer-box {
      width: 100%;

      padding: 10px 12px;

      border: 1px solid #cbd5e1;
      border-radius: 15px;

      background: #ffffff;

      box-shadow:
        0 2px 10px rgba(15, 23, 42, .04);
    }

    #questionInput {
      display: block;

      width: 100%;

      min-height: 60px;
      max-height: 180px;

      margin: 0;

      padding: 3px 4px;

      border: 0;
      outline: none;

      resize: none;

      background: transparent;
      color: #202124;

      font-family: inherit;

      font-size: 15px;
      line-height: 1.7;
    }

    #questionInput::placeholder {
      color: #94a3b8;
    }

    #questionInput:disabled {
      opacity: .65;
    }

    .composer-bottom {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      padding-top: 5px;
    }

    .composer-hint {
      color: #94a3b8;

      font-size: 11px;
    }

    #sendButton {
      flex: 0 0 auto;

      min-width: 88px;
      min-height: 38px;

      padding: 7px 14px;

      border: 1px solid #2563eb;
      border-radius: 8px;

      background: #2563eb;
      color: #ffffff;

      cursor: pointer;

      font-size: 13px;
      font-weight: 650;
    }

    #sendButton:hover:not(:disabled) {
      background: #1d4ed8;
    }

    #sendButton:disabled {
      opacity: .55;
      cursor: default;
    }

    .composer-notice {
      margin: 5px 0 0;

      color: #94a3b8;

      font-size: 10px;
      line-height: 1.5;

      text-align: center;
    }

    /* =========================
       フッター
    ========================= */

    .question-footer {
      flex: 0 0 auto;

      padding: 8px 20px 12px;

      color: #94a3b8;

      font-size: 10px;

      text-align: center;
    }

    /* =========================
       スマホ
    ========================= */

    @media (max-width: 700px) {

      .question-header {
        padding: 10px 14px;
      }

      .question-header-title h1 {
        font-size: 18px;
      }

      .question-header-title p {
        font-size: 10px;
      }

      .new-question-button {
        min-height: 36px;
        padding: 6px 9px;
      }

      .question-page {
        padding: 12px 13px 0;
      }

      .subject-area {
        align-items: flex-start;
        flex-direction: column;
      }

      #subjectSelect {
        width: 100%;
      }

      .message-content {
        max-width: 90%;
        font-size: 14px;
      }

      .composer-hint {
        max-width: 65%;
      }

    }
  </style>
</head>


<body>

  <div class="student-layout">

    <!-- layout.js がここへサイドバーを描画する -->
    <aside
      id="appSidebar"
      class="sidebar"
      aria-label="メインメニュー"
    ></aside>


    <main class="student-main">

      <!-- ヘッダー -->
      <header class="question-header">

        <div class="question-header-title">

          <h1>
            学習AIチャット
          </h1>

          <p>
            中学校の学習をサポートします
          </p>

        </div>


        <button
          id="newQuestionButton"
          class="new-question-button"
          type="button"
        >
          新しい質問
        </button>

      </header>


      <!-- 本体 -->
      <section class="question-page">

        <!-- 教科 -->
        <div class="subject-area">

          <label for="subjectSelect">
            質問する教科
          </label>

          <select id="subjectSelect">

            <option value="国語">
              国語
            </option>

            <option value="数学" selected>
              数学
            </option>

            <option value="英語">
              英語
            </option>

            <option value="理科">
              理科
            </option>

            <option value="社会">
              社会
            </option>

            <option value="音楽">
              音楽
            </option>

            <option value="美術">
              美術
            </option>

            <option value="保健体育">
              保健体育
            </option>

            <option value="技術家庭">
              技術家庭
            </option>

          </select>

        </div>


        <!-- 会話 -->
        <div
          id="conversation"
          class="conversation"
          aria-live="polite"
        >

          <div
            id="welcomeMessage"
            class="welcome"
          >

            <h2>
              何を勉強していますか？
            </h2>

            <p>
              わからない問題や授業で習った内容を入力してください。
              学習内容に合わせてわかりやすく説明します。
            </p>

          </div>

        </div>


        <!-- エラー -->
        <div
          id="questionError"
          class="question-error"
          hidden
          role="alert"
        ></div>


        <!-- 入力 -->
        <form
          id="questionForm"
          class="composer"
        >

          <div class="composer-box">

            <textarea
              id="questionInput"
              maxlength="5000"
              placeholder="学習について質問してください..."
              aria-label="質問内容"
              required
            ></textarea>


            <div class="composer-bottom">

              <span class="composer-hint">
                Enterで送信・Shift+Enterで改行
              </span>


              <button
                id="sendButton"
                type="submit"
              >
                質問する
              </button>

            </div>

          </div>


          <p class="composer-notice">
            このAIは学習専用です。学習以外の質問には対応していません。
          </p>

        </form>

      </section>


      <footer class="question-footer">
        © 2026 Regular Test Preparation Worksheet Administration Office. All Rights Reserved.
      </footer>

    </main>

  </div>


  <!-- layout -->
  <script
    type="module"
    src="../assets/js/layout.js"
  ></script>


  <!-- question -->
  <script
    type="module"
    src="../assets/js/question.js"
  ></script>

</body>
</html>
