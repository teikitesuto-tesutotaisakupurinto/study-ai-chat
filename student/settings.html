<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>設定 | 学習AIチャット</title>

<link rel="stylesheet" href="../assets/css/common.css">
<link rel="stylesheet" href="../assets/css/student.css">

</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="sidebar-header">
<strong>学習AIチャット</strong>
</div>

<nav>

<a class="nav-link" href="index.html">ホーム</a>
<a class="nav-link" href="question.html">AI学習チャット</a>
<a class="nav-link" href="history.html">学習履歴</a>
<a class="nav-link" href="announcements.html">お知らせ</a>
<a class="nav-link" href="settings.html">設定</a>

</nav>

<button class="logout-button" data-logout>
ログアウト
</button>

</aside>

<main class="main-content">

<header class="topbar">
<button class="sidebar-toggle">☰</button>
<div>
<strong>設定</strong>
<small>学習AIチャット</small>
</div>
</header>

<section class="page">

<h1>設定</h1>

<div class="card">

<label>
表示名
<input id="displayName">
</label>

<label>
学年
<select id="grade">
<option value="">未設定</option>
<option>中学1年生</option>
<option>中学2年生</option>
<option>中学3年生</option>
</select>
</label>

<button id="save" class="primary-button">
保存
</button>

<p id="message"></p>

</div>

</section>

</main>

</div>

<script type="module">

import {
  auth,
  db,
  doc,
  getDoc,
  updateDoc,
  serverTimestamp,
  signOut
} from "../assets/js/firebase.js";

import {
  protectPage
} from "../assets/js/auth.js";

import {
  setupSidebar,
  setupLogout
} from "../assets/js/layout.js";

setupSidebar();
setupLogout(auth, signOut);

const result =
  await protectPage("student");

const ref =
  doc(db, "users", result.user.uid);

const snap =
  await getDoc(ref);

const data =
  snap.data();

document.getElementById("displayName").value =
  data.displayName || "";

document.getElementById("grade").value =
  data.grade || "";

document.getElementById("save")
.addEventListener("click", async () => {

  const displayName =
    document.getElementById("displayName")
      .value.trim();

  const grade =
    document.getElementById("grade").value;

  await updateDoc(ref, {
    displayName,
    grade,
    updatedAt: serverTimestamp()
  });

  document.getElementById("message")
    .textContent =
    "設定を保存しました。";

});

</script>

</body>
</html>
