<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>
    管理ダッシュボード | 学習AIチャット
  </title>


  <script>
    document.documentElement.classList.add(
      "auth-pending"
    );
  </script>


  <link
    rel="stylesheet"
    href="../assets/css/common.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/admin.css"
  >

</head>


<body data-role="admin">

  <div class="app-layout">


    <aside
      id="appSidebar"
      class="sidebar"
    ></aside>


    <main
      id="appMain"
      class="app-main"
    >


      <header class="page-header">

        <h1 class="page-title">
          運営管理コンソール
        </h1>


        <p>
          学習AIチャットの運用状況を確認します。
        </p>

      </header>


      <section class="page">


        <div class="dashboard-grid">


          <div class="admin-card">

            <span>
              サービス
            </span>

            <strong>
              学習AIチャット
            </strong>

          </div>


          <div class="admin-card">

            <span>
              AI接続先
            </span>


            <strong id="ai-status">
              Supabase / Groq
            </strong>


            <p>
              接続状態は AI 質問テストで確認してください。
            </p>

          </div>


          <div class="admin-card">

            <span>
              メンテナンス
            </span>


            <strong id="maintenance-status">
              確認中
            </strong>

          </div>


        </div>


        <section
          class="page-card"
          style="margin-top:20px"
        >

          <h2>
            管理メニュー
          </h2>


          <p>
            左側のメニューからユーザー、お知らせ、メンテナンス、
            AI設定、監査ログ、システム状態を管理できます。
          </p>


          <p
            id="dashboard-error"
            role="alert"
            style="
              color:#b42318;
              white-space:pre-wrap
            "
          ></p>

        </section>


      </section>


      <footer class="app-footer">
        © 2026 Regular Test Preparation Worksheet Administration Office. All Rights Reserved.
      </footer>


    </main>

  </div>


  <script type="module">

    import {
      db,
      doc,
      getDoc
    } from "../assets/js/firebase.js";


    const maintenanceStatus =
      document.getElementById(
        "maintenance-status"
      );


    const dashboardError =
      document.getElementById(
        "dashboard-error"
      );


    /*
     * Dashboardのデータだけ取得。
     *
     * 認証処理はlayout.jsが担当する。
     */

    async function loadDashboard() {

      try {

        const snapshot =
          await getDoc(
            doc(
              db,
              "settings",
              "system"
            )
          );


        if (
          !snapshot.exists()
        ) {

          maintenanceStatus.textContent =
            "設定なし";


          dashboardError.textContent =
            "Firestore の settings/system がありません。Firebase Console で作成してください。";


          return;
        }


        const settings =
          snapshot.data();


        maintenanceStatus.textContent =
          settings.maintenance === true
            ? "メンテナンス中"
            : "通常稼働";


      } catch (error) {

        console.error(
          "ダッシュボード取得エラー:",
          error
        );


        maintenanceStatus.textContent =
          "取得エラー";


        dashboardError.textContent =
          `${
            error.code ||
            "error"
          }: ${
            error.message ||
            String(error)
          }`;
      }
    }


    loadDashboard();

  </script>


  <!--
    layout.jsだけが
    data-role="admin" の認証・権限確認を担当する。
  -->

  <script
    type="module"
    src="../assets/js/layout.js"
  ></script>


</body>

</html>
