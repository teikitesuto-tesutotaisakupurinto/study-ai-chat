<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>メンテナンス設定 | 学習AIチャット</title>

<link rel="stylesheet" href="../assets/css/common.css">
<link rel="stylesheet" href="../assets/css/admin.css">

</head>

<body>

<div class="app">

<aside class="sidebar admin-sidebar">

<div class="sidebar-header">
<strong>運営管理コンソール</strong>
</div>

<nav>

<a class="nav-link" href="index.html">ダッシュボード</a>
<a class="nav-link" href="users.html">利用者管理</a>
<a class="nav-link" href="announcements.html">お知らせ管理</a>
<a class="nav-link" href="maintenance.html">メンテナンス</a>
<a class="nav-link" href="ai-settings.html">AI設定</a>
<a class="nav-link" href="logs.html">監査ログ</a>
<a class="nav-link" href="system.html">システム状態</a>
<a class="nav-link" href="settings.html">管理者設定</a>

</nav>

<button class="logout-button" data-logout>
ログアウト
</button>

</aside>

<main class="main-content">

<header class="topbar">
<button class="sidebar-toggle">☰</button>
<strong>メンテナンス設定</strong>
</header>

<section class="page">

<h1>メンテナンス設定</h1>

<div class="card">

<label class="switch-row">

<input
  id="enabled"
  type="checkbox"
>

メンテナンスモードを有効にする

</label>

<label>
表示タイトル

<input
  id="title"
  value="メンテナンス中です"
>
</label>

<label>
表示メッセージ

<textarea id="message"></textarea>
</label>

<button
  id="save"
  class="primary-button"
>
保存
</button>

<p id="result"></p>

</div>

</section>

</main>

</div>

<script type="module">

import {
  auth,
  db,
  doc,
  getDoc,
  setDoc,
  serverTimestamp,
  signOut
} from "../assets/js/firebase.js";

import { protectPage }
from "../assets/js/auth.js";

import {
  setupSidebar,
  setupLogout
} from "../assets/js/layout.js";

setupSidebar();
setupLogout(auth, signOut);

await protectPage("admin");

const ref =
  doc(db, "systemStatus", "main");

const snap =
  await getDoc(ref);

if (snap.exists()) {

  const data =
    snap.data();

  document.getElementById(
    "enabled"
  ).checked =
    data.maintenance === true;

  document.getElementById(
    "title"
  ).value =
    data.title || "メンテナンス中です";

  document.getElementById(
    "message"
  ).value =
    data.message || "";

}

document.getElementById("save")
.addEventListener("click", async () => {

  await setDoc(
    ref,
    {
      maintenance:
        document.getElementById("enabled").checked,

      title:
        document.getElementById("title").value,

      message:
        document.getElementById("message").value,

      updatedAt:
        serverTimestamp()
    },
    {
      merge: true
    }
  );

  document.getElementById(
    "result"
  ).textContent =
    "メンテナンス設定を保存しました。";

});

</script>

</body>
</html>
