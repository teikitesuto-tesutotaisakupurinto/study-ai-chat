<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>メンテナンス管理 | 学習AIチャット</title>
  <link rel="stylesheet" href="../assets/css/common.css">
  <style>
    .form-row {
      margin: 20px 0;
    }

    .form-row label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .form-row input[type="text"],
    .form-row textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #c8ced8;
      border-radius: 8px;
    }

    .form-row textarea {
      min-height: 130px;
      resize: vertical;
    }

    .switch-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .primary-button {
      padding: 12px 20px;
      background: #1a73e8;
      color: white;
      border: 0;
      border-radius: 8px;
    }

    #statusMessage {
      margin-top: 16px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body data-role="admin">
  <div class="app-layout">
    <aside id="appSidebar" class="sidebar"></aside>

    <main id="appMain" class="app-main">
      <header class="page-header">
        <h1 class="page-title">メンテナンス管理</h1>
        <p>システムのメンテナンス表示を設定します。</p>
      </header>

      <section class="page-card">
        <form id="maintenanceForm">
          <div class="form-row switch-row">
            <input id="maintenance" type="checkbox">
            <label for="maintenance">メンテナンスを有効にする</label>
          </div>

          <div class="form-row">
            <label for="maintenanceTitle">表示タイトル</label>
            <input id="maintenanceTitle" type="text" maxlength="100"
                   required>
          </div>

          <div class="form-row">
            <label for="maintenanceMessage">表示メッセージ</label>
            <textarea id="maintenanceMessage" maxlength="2000"
                      required></textarea>
          </div>

          <button id="saveButton" class="primary-button" type="submit">
            設定を保存
          </button>

          <p id="statusMessage" role="status"></p>
        </form>
      </section>

      <footer class="app-footer"></footer>
    </main>
  </div>

  <script type="module">
    import { db } from "../assets/js/firebase.js";

    import {
      doc,
      getDoc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

    const form = document.querySelector("#maintenanceForm");
    const checkbox = document.querySelector("#maintenance");
    const titleInput = document.querySelector("#maintenanceTitle");
    const messageInput = document.querySelector("#maintenanceMessage");
    const saveButton = document.querySelector("#saveButton");
    const statusMessage = document.querySelector("#statusMessage");

    const settingsRef = doc(db, "settings", "system");

    async function loadSettings() {
      statusMessage.textContent = "設定を読み込んでいます。";

      try {
        const snapshot = await getDoc(settingsRef);

        if (!snapshot.exists()) {
          throw new Error("settings/system がありません。");
        }

        const data = snapshot.data();

        checkbox.checked = data.maintenance === true;
        titleInput.value =
          data.maintenanceTitle || "システムメンテナンス中";
        messageInput.value =
          data.maintenanceMessage ||
          "現在、システムメンテナンスを実施しています。しばらくお待ちください。";

        statusMessage.textContent = "設定を読み込みました。";
      } catch (error) {
        console.error(error);
        statusMessage.textContent =
          "設定を読み込めませんでした。\n" +
          (error.message || String(error));
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      saveButton.disabled = true;
      statusMessage.textContent = "保存しています。";

      try {
        await setDoc(settingsRef, {
          maintenance: checkbox.checked,
          maintenanceTitle: titleInput.value.trim(),
          maintenanceMessage: messageInput.value.trim(),
          updatedAt: serverTimestamp()
        }, { merge: true });

        statusMessage.textContent = "設定を保存しました。";
      } catch (error) {
        console.error(error);
        statusMessage.textContent =
          "保存できませんでした。\n" +
          (error.message || String(error)) +
          "\n管理者の Firebase 権限設定を確認してください。";
      } finally {
        saveButton.disabled = false;
      }
    });

    loadSettings();
  </script>

  <script type="module" src="../assets/js/layout.js"></script>
</body>
</html>
