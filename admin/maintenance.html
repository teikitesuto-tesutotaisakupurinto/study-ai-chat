
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>メンテナンス管理 | 学習AIチャット</title>
  <link rel="stylesheet" href="../assets/css/common.css">
  <style>
    .form-row {
      margin: 20px 0;
    }

    .form-row label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .form-row input[type="text"],
    .form-row textarea {
      display: block;
      width: 100%;
      padding: 12px;
      border: 1px solid #c8ced8;
      border-radius: 8px;
      background: #fff;
      color: #202124;
    }

    .form-row textarea {
      min-height: 130px;
      resize: vertical;
    }

    .switch-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .switch-row label {
      margin: 0;
    }

    .switch-row input {
      width: auto;
    }

    #statusMessage {
      margin-top: 16px;
      white-space: pre-wrap;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar admin-sidebar">
      <button class="sidebar-toggle" type="button" aria-label="メニューを開閉">☰</button>
      <nav aria-label="管理者メニュー">
        <a class="nav-link" href="index.html">ダッシュボード</a>
        <a class="nav-link" href="users.html">ユーザー管理</a>
        <a class="nav-link" href="announcements.html">お知らせ管理</a>
        <a class="nav-link active" href="maintenance.html" aria-current="page">メンテナンス</a>
        <a class="nav-link" href="ai-settings.html">AI設定</a>
        <a class="nav-link" href="logs.html">操作ログ</a>
        <a class="nav-link" href="system.html">システム状態</a>
        <a class="nav-link" href="settings.html">管理者設定</a>
      </nav>
      <button class="logout-button" type="button" data-logout>ログアウト</button>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="sidebar-toggle" type="button" aria-label="メニューを開閉">☰</button>
        <div>
          <strong>メンテナンス管理</strong>
          <small>学習AIチャット</small>
        </div>
      </header>

      <section class="page">
        <h1 class="page-title">メンテナンス設定</h1>

        <p>
          メンテナンス中は生徒の利用を停止し、メンテナンス案内を表示します。
          管理者は設定画面を引き続き利用できます。
        </p>

        <section class="page-card">
          <form id="maintenanceForm">
            <div class="form-row switch-row">
              <input id="maintenance" type="checkbox">
              <label for="maintenance">メンテナンスを有効にする</label>
            </div>

            <div class="form-row">
              <label for="maintenanceTitle">表示タイトル</label>
              <input id="maintenanceTitle" type="text" maxlength="100" required>
            </div>

            <div class="form-row">
              <label for="maintenanceMessage">表示メッセージ</label>
              <textarea id="maintenanceMessage" maxlength="2000" required></textarea>
            </div>

            <button id="saveButton" class="primary-button" type="submit">
              設定を保存
            </button>

            <p id="statusMessage" role="status" aria-live="polite"></p>
          </form>
        </section>
      </section>

      <footer class="app-footer">
        © 2026 Regular Test Preparation Worksheet Administration Office. All Rights Reserved.
      </footer>
    </main>
  </div>

  <script type="module">
    import {
      db,
      doc,
      getDoc,
      setDoc,
      serverTimestamp
    } from "../assets/js/firebase.js";

    import {
      protectPage
    } from "../assets/js/auth.js";

    import {
      setupSidebar,
      setupLogout
    } from "../assets/js/layout.js";

    const form = document.getElementById("maintenanceForm");
    const checkbox = document.getElementById("maintenance");
    const titleInput = document.getElementById("maintenanceTitle");
    const messageInput = document.getElementById("maintenanceMessage");
    const saveButton = document.getElementById("saveButton");
    const statusMessage = document.getElementById("statusMessage");

    const settingsRef = doc(db, "settings", "system");

    function showError(message, error) {
      statusMessage.textContent =
        `${message}\n${error?.code || "error"}: ${error?.message || String(error)}`;
    }

    async function loadSettings() {
      statusMessage.textContent = "設定を読み込んでいます。";

      try {
        const snapshot = await getDoc(settingsRef);

        if (!snapshot.exists()) {
          throw new Error(
            "settings/system がありません。Firebase Console で作成してください。"
          );
        }

        const data = snapshot.data();

        checkbox.checked = data.maintenance === true;

        titleInput.value =
          data.maintenanceTitle ||
          "システムメンテナンス中";

        messageInput.value =
          data.maintenanceMessage ||
          "現在、システムメンテナンスを実施しています。しばらくお待ちください。";

        statusMessage.textContent = "設定を読み込みました。";
      } catch (error) {
        console.error(
          "メンテナンス設定の読み込みに失敗:",
          error
        );

        showError(
          "設定を読み込めませんでした。管理者権限と settings/system の存在を確認してください。",
          error
        );
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      if (saveButton.disabled) return;

      saveButton.disabled = true;
      statusMessage.textContent = "保存しています。";

      try {
        await setDoc(
          settingsRef,
          {
            maintenance: checkbox.checked,
            maintenanceTitle: titleInput.value.trim(),
            maintenanceMessage: messageInput.value.trim(),
            updatedAt: serverTimestamp()
          },
          { merge: true }
        );

        statusMessage.textContent = "設定を保存しました。";
      } catch (error) {
        console.error(
          "メンテナンス設定の保存に失敗:",
          error
        );

        showError(
          "保存できませんでした。管理者カスタムクレーム admin=true と Firestore ルールを確認してください。",
          error
        );
      } finally {
        saveButton.disabled = false;
      }
    });

    try {
      const result = await protectPage(
        "admin",
        { allowMaintenance: true }
      );

      setupSidebar();
      setupLogout();

      if (result) {
        await loadSettings();
      }
    } catch (error) {
      // protectPage が権限エラー画面を表示するため、
      // ここでログイン画面へリダイレクトしない。
      console.error(
        "メンテナンス画面の権限確認に失敗:",
        error
      );
    }
  </script>
</body>
</html>
