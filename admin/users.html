</head>

<body>

<div class="app">

<aside class="sidebar admin-sidebar">

<div class="sidebar-header">

<nav>

ログアウト
</button>

</aside>

<main class="main-content">

<header class="topbar">
<button class="sidebar-toggle">☰</button>
<strong>利用者管理</strong>
</header>

<section class="page">

<h1>利用者管理</h1>

<div id="users">
読み込み中...
</div>

</section>

</main>

</div>

<script type="module">

import {
  auth,
  db,
  collection,
  getDocs,
  updateDoc,
  doc,
  signOut
} from "../assets/js/firebase.js";

import { protectPage }
from "../assets/js/auth.js";

import {
  setupSidebar,
  setupLogout
} from "../assets/js/layout.js";

setupSidebar();
setupLogout(auth, signOut);

await protectPage("admin");

const container =
  document.getElementById("users");

const snap =
  await getDocs(
    collection(db, "users")
  );

container.innerHTML = "";

snap.forEach((item) => {

  const data =
    item.data();

  const card =
    document.createElement("div");

  card.className =
    "user-card";

  card.innerHTML = `
    <strong></strong>
    <span></span>

    <select class="role">
      <option value="student">student</option>
      <option value="admin">admin</option>
    </select>

    <select class="status">
      <option value="active">active</option>
      <option value="disabled">disabled</option>
    </select>

    <button>保存</button>
  `;

  card.querySelector("strong")
    .textContent =
    data.displayName ||
    data.email ||
    item.id;

  card.querySelector("span")
    .textContent =
    data.email || "";

  card.querySelector(".role").value =
    data.role || "student";

  card.querySelector(".status").value =
    data.status || "active";

  card.querySelector("button")
    .addEventListener("click", async () => {

      await updateDoc(
        doc(db, "users", item.id),
        {
          role:
            card.querySelector(".role").value,

          status:
            card.querySelector(".status").value
        }
      );

      alert("保存しました。");

    });

  container.appendChild(card);

});

</script>

</body>
</html>
