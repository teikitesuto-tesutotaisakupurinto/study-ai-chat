<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パスワード再設定｜学習AIチャット</title>
  <link rel="stylesheet" href="./assets/css/common.css">
</head>
<body data-page="reset">
  <main class="auth-page">
    <section class="auth-card">
      <h1>パスワード再設定</h1>
      <p class="muted">登録済みのメールアドレスを入力してください。</p>
      <form id="resetForm" class="auth-form">
        <label for="resetEmail">メールアドレス</label>
        <input id="resetEmail" type="email" autocomplete="email" required>
        <button id="resetButton" class="primary-button" type="submit">
          再設定メールを送信
        </button>
      </form>
      <div id="pageMessage" class="notice" hidden></div>
      <p><a href="./login.html">ログイン画面へ戻る</a></p>
      <div class="auth-footer">
        © 2026 Regular Test Preparation Worksheet Administration Office. All Rights Reserved.
      </div>
    </section>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="./assets/js/paths.js"></script>
  <script src="./assets/js/firebase.js"></script>
  <script src="./assets/js/auth.js"></script>
  <script src="./assets/js/page.js"></script>
</body>
</html>
