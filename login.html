
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="description" content="学習AIチャットのログイン">
  <title>ログイン | 学習AIチャット</title>

  <style>
    :root {
      font-family: system-ui, -apple-system, "Noto Sans JP",
        "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      color: #172033;
      background: #f4f7fb;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
    }

    button, input { font: inherit; }

    .screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 32px;
      background: #fff;
      border: 1px solid #e1e7f0;
      border-radius: 18px;
      box-shadow: 0 12px 36px #1720330d;
    }

    .brand {
      text-align: center;
      margin-bottom: 26px;
    }

    .brand h1 {
      margin: 0;
      font-size: 27px;
      letter-spacing: -.04em;
    }

    .brand p {
      margin: 10px 0 0;
      color: #64748b;
      font-size: 14px;
      line-height: 1.8;
    }

    .field { margin-top: 18px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 11px 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      background: #fff;
      color: #172033;
    }

    input:focus {
      outline: 3px solid #2563eb24;
      border-color: #2563eb;
    }

    button {
      width: 100%;
      min-height: 48px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 700;
      transition: background .15s, opacity .15s;
    }

    button:disabled {
      cursor: wait;
      opacity: .6;
    }

    .primary {
      margin-top: 22px;
      border: 0;
      background: #2563eb;
      color: #fff;
    }

    .primary:hover { background: #1d4ed8; }

    .secondary {
      margin-top: 14px;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #172033;
    }

    .secondary:hover { background: #f8fafc; }

    .link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
    }

    .link:hover { text-decoration: underline; }

    .message {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.error {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      color: #9f1239;
    }

    .message.info {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
    }

    .loading {
      text-align: center;
      color: #64748b;
      line-height: 1.8;
    }

    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 14px;
      border: 3px solid #dbeafe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .maintenance h1 {
      margin: 0 0 16px;
      font-size: 25px;
      text-align: center;
    }

    .maintenance p {
      color: #475569;
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      text-align: center;
    }

    .error-title {
      color: #991b1b;
      font-size: 22px;
    }

    .error-detail {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      background: #f8fafc;
      color: #475569;
      font-size: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    footer {
      margin-top: 26px;
      color: #94a3b8;
      text-align: center;
      font-size: 11px;
      line-height: 1.7;
    }

    @media (max-width: 480px) {
      .card { padding: 25px 20px; }
      .brand h1 { font-size: 24px; }
    }
  </style>
</head>

<body>
  <main id="loadingScreen" class="screen">
    <section class="card loading">
      <div class="spinner" aria-hidden="true"></div>
      <div id="loadingText">システムを確認しています。</div>
    </section>
  </main>

  <main id="loginScreen" class="screen" hidden>
    <section class="card">
      <header class="brand">
        <h1>学習AIチャット</h1>
        <p>
          ログインして、学習を始めましょう。<br>
          アカウント情報を入力してください。
        </p>
      </header>

      <form id="loginForm">
        <div class="field">
          <label for="email">メールアドレス</label>
          <input
            id="email"
            type="email"
            autocomplete="username"
            inputmode="email"
            required
            placeholder="メールアドレス"
          >
        </div>

        <div class="field">
          <label for="password">パスワード</label>
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="パスワード"
          >
        </div>

        <button id="loginButton" class="primary" type="submit">
          ログイン
        </button>
      </form>

      <button id="googleButton" class="secondary" type="button">
        Google でログイン
      </button>

      <a class="link" href="./reset.html">
        パスワードを忘れた場合
      </a>

      <div id="messageBox" class="message" role="status" hidden></div>

      <footer>
        © 2026 定期テスト対策プリント運営事務局. All Rights Reserved.
      </footer>
    </section>
  </main>

  <main id="maintenanceScreen" class="screen" hidden>
    <section class="card maintenance">
      <h1 id="maintenanceTitle">システムメンテナンス中</h1>
      <p id="maintenanceMessage">
        現在、システムメンテナンスを実施しています。
        しばらくお待ちください。
      </p>
      <button id="maintenanceLogoutButton" class="primary" type="button">
        別のアカウントでログイン
      </button>
      <footer>
        © 2026 定期テスト対策プリント運営事務局. All Rights Reserved.
      </footer>
    </section>
  </main>

  <main id="errorScreen" class="screen" hidden>
    <section class="card">
      <h1 class="error-title">システムを確認できません</h1>
      <p id="fatalMessage">
        設定または通信を確認してください。
      </p>
      <div id="fatalDetail" class="error-detail" hidden></div>
      <button id="retryButton" class="primary" type="button">
        再読み込み
      </button>
      <footer>
        © 2026 定期テスト対策プリント運営事務局. All Rights Reserved.
      </footer>
    </section>
  </main>

  <script type="module">
    import {
      auth,
      db,
      persistenceReady,
      onAuthStateChanged,
      signOut,
      signInWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithRedirect,
      getRedirectResult,
      sendPasswordResetEmail,
      doc,
      getDoc
    } from "./assets/js/firebase.js";

    const $ = (id) => document.getElementById(id);

    const screens = [
      "loadingScreen",
      "loginScreen",
      "maintenanceScreen",
      "errorScreen"
    ];

    let busy = false;
    let routing = false;
    let authListenerStarted = false;
    let lastHandledUid = null;

    function showScreen(id) {
      for (const screenId of screens) {
        $(screenId).hidden = screenId !== id;
      }
    }

    function showMessage(text, type = "error") {
      const box = $("messageBox");
      box.textContent = text;
      box.className = `message ${type}`;
      box.hidden = false;
    }

    function clearMessage() {
      $("messageBox").textContent = "";
      $("messageBox").hidden = true;
    }

    function showFatal(error) {
      console.error("ログイン画面エラー:", error);

      $("fatalMessage").textContent =
        "Firebaseの初期化、通信、またはアクセス権限に問題があります。";

      $("fatalDetail").textContent =
        `${error?.code ? error.code + "\n" : ""}${error?.message || String(error)}`;

      $("fatalDetail").hidden = false;
      showScreen("errorScreen");
    }

    function errorText(error) {
      const code = error?.code || "";

      const messages = {
        "auth/invalid-credential":
          "メールアドレスまたはパスワードが正しくありません。",
        "auth/invalid-email":
          "メールアドレスの形式を確認してください。",
        "auth/user-disabled":
          "このアカウントは無効になっています。",
        "auth/too-many-requests":
          "試行回数が多すぎます。しばらく待ってから再度お試しください。",
        "auth/network-request-failed":
          "通信に失敗しました。インターネット接続を確認してください。",
        "auth/popup-blocked":
          "ログインのポップアップがブロックされました。",
        "auth/popup-closed-by-user":
          "Googleログインがキャンセルされました。",
        "auth/unauthorized-domain":
          "このサイトのドメインがFirebase Authenticationの承認済みドメインに登録されていません。",
        "auth/api-key-not-valid":
          "FirebaseのAPIキーが無効です。firebase.jsとFirebase ConsoleのWebアプリ設定を確認してください。",
        "permission-denied":
          "Firestoreへのアクセスが拒否されました。Firestore Rulesを確認してください。"
      };

      return messages[code] || error?.message || String(error);
    }

    function setBusy(value, text = "ログイン") {
      busy = value;
      $("loginButton").disabled = value;
      $("googleButton").disabled = value;
      $("loginButton").textContent = value ? text : "ログイン";
      $("googleButton").textContent =
        value ? "処理中..." : "Google でログイン";
    }

    async function readProfile(user) {
      const snapshot = await getDoc(doc(db, "users", user.uid));

      if (!snapshot.exists()) {
        throw new Error(
          `ユーザープロフィールが見つかりません（users/${user.uid}）。管理者にアカウント設定を確認してもらってください。`
        );
      }

      return snapshot.data();
    }

    async function readSystemSettings() {
      const snapshot = await getDoc(doc(db, "settings", "system"));

      if (!snapshot.exists()) {
        throw new Error(
          "Firestoreの settings/system が見つかりません。システム設定を作成してください。"
        );
      }

      return snapshot.data();
    }

    async function routeUser(user) {
      if (!user || routing) return;

      // 同じログイン状態の重複処理を防ぐ
      if (lastHandledUid === user.uid) return;

      routing = true;
      lastHandledUid = user.uid;
      showScreen("loadingScreen");
      $("loadingText").textContent = "アカウントを確認しています。";

      try {
        await persistenceReady;

        const profile = await readProfile(user);

        if (profile.status !== "active") {
          await signOut(auth);
          lastHandledUid = null;
          showScreen("loginScreen");
          showMessage(
            "このアカウントは現在利用できません。管理者にお問い合わせください。"
          );
          return;
        }

        const role = profile.role;

        if (role !== "student" && role !== "admin") {
          await signOut(auth);
          lastHandledUid = null;
          showScreen("loginScreen");
          showMessage(
            "アカウントの権限が正しく設定されていません。管理者にお問い合わせください。"
          );
          return;
        }

        $("loadingText").textContent = "システム設定を取得しています。";

        // メンテナンス設定はログイン後にだけ取得
        const settings = await readSystemSettings();

        if (role === "admin") {
          location.replace("./admin/index.html");
          return;
        }

        if (settings.maintenance === true) {
          $("maintenanceTitle").textContent =
            typeof settings.maintenanceTitle === "string" &&
            settings.maintenanceTitle.trim()
              ? settings.maintenanceTitle
              : "システムメンテナンス中";

          $("maintenanceMessage").textContent =
            typeof settings.maintenanceMessage === "string" &&
            settings.maintenanceMessage.trim()
              ? settings.maintenanceMessage
              : "現在、システムメンテナンスを実施しています。しばらくお待ちください。";

          showScreen("maintenanceScreen");
          return;
        }

        location.replace("./student/index.html");
      } catch (error) {
        console.error("ログイン後の確認に失敗:", error);

        // 不用意にログアウトさせず、原因を画面に表示
        lastHandledUid = null;
        showScreen("errorScreen");
        $("fatalMessage").textContent =
          "ログイン状態は維持されていますが、プロフィールまたはシステム設定を取得できませんでした。";
        $("fatalDetail").textContent = errorText(error);
        $("fatalDetail").hidden = false;
      } finally {
        routing = false;
      }
    }

    $("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (busy) return;

      clearMessage();

      const email = $("email").value.trim();
      const password = $("password").value;

      if (!email || !password) {
        showMessage("メールアドレスとパスワードを入力してください。");
        return;
      }

      setBusy(true, "ログイン中...");

      try {
        await persistenceReady;
        await signInWithEmailAndPassword(auth, email, password);
        // 認証状態監視が routeUser() を呼び出す
      } catch (error) {
        console.error("メールログインエラー:", error);
        showScreen("loginScreen");
        showMessage(errorText(error));
      } finally {
        setBusy(false);
      }
    });

    $("googleButton").addEventListener("click", async () => {
      if (busy) return;

      clearMessage();
      setBusy(true, "Googleログイン中...");

      try {
        await persistenceReady;

        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: "select_account" });

        await signInWithPopup(auth, provider);
        // 認証状態監視が routeUser() を呼び出す
      } catch (error) {
        console.error("Googleログインエラー:", error);

        if (
          error?.code === "auth/popup-blocked" ||
          error?.code === "auth/operation-not-supported-in-this-environment"
        ) {
          try {
            const provider = new GoogleAuthProvider();
            await signInWithRedirect(auth, provider);
            return;
          } catch (redirectError) {
            console.error("Googleリダイレクトエラー:", redirectError);
            showScreen("loginScreen");
            showMessage(errorText(redirectError));
          }
        } else {
          showScreen("loginScreen");
          showMessage(errorText(error));
        }
      } finally {
        setBusy(false);
      }
    });

    $("maintenanceLogoutButton").addEventListener("click", async () => {
      try {
        await signOut(auth);
        lastHandledUid = null;
        clearMessage();
        showScreen("loginScreen");
      } catch (error) {
        showMessage(`ログアウトできませんでした。\n${errorText(error)}`);
      }
    });

    $("retryButton").addEventListener("click", () => {
      location.reload();
    });

    // reset.htmlを使わずに同じ画面から送信する場合の補助処理
    // パスワードリセットリンクを押すと、メールアドレスを利用する。
    $("email").addEventListener("dblclick", async () => {
      const email = $("email").value.trim();
      if (!email) return;

      try {
        await sendPasswordResetEmail(auth, email);
        showMessage(
          "パスワード再設定用メールを送信しました。メールを確認してください。",
          "info"
        );
      } catch (error) {
        showMessage(errorText(error));
      }
    });

    async function start() {
      try {
        await persistenceReady;

        // Google redirectから戻ってきた場合の結果を確認
        try {
          await getRedirectResult(auth);
        } catch (error) {
          console.error("リダイレクト結果の取得エラー:", error);
          showScreen("loginScreen");
          showMessage(errorText(error));
        }

        if (!authListenerStarted) {
          authListenerStarted = true;

          onAuthStateChanged(auth, (user) => {
            if (user) {
              routeUser(user);
            } else {
              lastHandledUid = null;
              if (!routing) {
                clearMessage();
                showScreen("loginScreen");
              }
            }
          });
        }
      } catch (error) {
        showFatal(error);
      }
    }

    start();
  </script>
</body>
</html>
