
<script type="module">
  import {
    auth,
    db,
    persistenceReady,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup,
    signInWithRedirect,
    getRedirectResult,
    signOut,
    doc,
    getDoc,
    setDoc,
    onSnapshot,
    serverTimestamp
  } from "./assets/js/firebase.js";

  const $ = id => document.getElementById(id);

  const gate = $("gate");
  const maintenanceScreen = $("maintenanceScreen");
  const loginScreen = $("loginScreen");
  const errorScreen = $("errorScreen");
  const errorBox = $("errorBox");

  let maintenanceReady = false;
  let maintenanceActive = false;
  let authListenerStarted = false;
  let busy = false;
  let currentUser = null;
  let routingUid = null;
  let routingPromise = null;
  let unsubscribeMaintenance = null;

  function showOnly(screen) {
    gate.hidden = screen !== gate;
    maintenanceScreen.hidden = screen !== maintenanceScreen;
    loginScreen.hidden = screen !== loginScreen;
    errorScreen.hidden = screen !== errorScreen;
  }

  function showFatal(message) {
    $("fatalMessage").textContent = message;
    showOnly(errorScreen);
  }

  function showError(message) {
    errorBox.textContent = message;
    errorBox.hidden = false;
  }

  function clearError() {
    errorBox.textContent = "";
    errorBox.hidden = true;
  }

  function firebaseErrorMessage(error) {
    const messages = {
      "auth/api-key-not-valid.-please-pass-a-valid-api-key.":
        "Firebase APIキーが無効です。assets/js/firebase.js の設定を確認してください。",
      "auth/invalid-api-key":
        "Firebase APIキーが無効です。共通設定ファイルを確認してください。",
      "auth/unauthorized-domain":
        "このサイトのドメインがFirebase Authenticationの承認済みドメインに登録されていません。",
      "auth/invalid-credential":
        "メールアドレスまたはパスワードが正しくありません。",
      "auth/invalid-email":
        "メールアドレスの形式を確認してください。",
      "auth/user-disabled":
        "このアカウントは無効になっています。",
      "auth/too-many-requests":
        "試行回数が多すぎます。しばらく待ってから再度お試しください。",
      "auth/network-request-failed":
        "通信に失敗しました。インターネット接続を確認してください。",
      "auth/popup-closed-by-user":
        "Googleログインがキャンセルされました。",
      "auth/popup-blocked":
        "ログイン画面がブラウザにブロックされました。",
      "permission-denied":
        "Firestoreへのアクセスが拒否されました。セキュリティルールを確認してください。",
      "unavailable":
        "Firestoreに接続できません。通信状態を確認して再度お試しください。"
    };

    return messages[error?.code] ||
      `処理に失敗しました。\nエラーコード: ${error?.code || "unknown"}\n${error?.message || String(error)}`;
  }

  // 応答がない場合、無期限に設定確認中にならないようにする
  function withTimeout(promise, milliseconds, label) {
    let timer;

    const timeout = new Promise((_, reject) => {
      timer = setTimeout(() => {
        reject(new Error(`${label}が${milliseconds / 1000}秒以内に完了しませんでした。通信状態とFirestoreの設定を確認してください。`));
      }, milliseconds);
    });

    return Promise.race([promise, timeout]).finally(() => {
      clearTimeout(timer);
    });
  }

  function setBusy(value) {
    busy = value;
    $("loginButton").disabled = value;
    $("googleButton").disabled = value;
    $("loginButton").textContent = value ? "処理中..." : "ログイン";
  }

  function showMaintenance(settings = {}) {
    $("maintenanceTitle").textContent =
      settings.maintenanceTitle || "システムメンテナンス中";

    $("maintenanceMessage").textContent =
      settings.maintenanceMessage ||
      "現在、システムメンテナンスを実施しています。しばらくお待ちください。";

    showOnly(maintenanceScreen);
  }

  async function routeUser(user) {
    if (!user || !maintenanceReady || maintenanceActive) return;

    if (routingPromise && routingUid === user.uid) {
      return routingPromise;
    }

    routingUid = user.uid;

    const task = (async () => {
      const profileRef = doc(db, "users", user.uid);

      const profileSnap = await withTimeout(
        getDoc(profileRef),
        12000,
        "ユーザー情報の取得"
      );

      if (maintenanceActive) return;

      if (!profileSnap.exists()) {
        // 新規ログイン利用者のプロフィールを作成
        await withTimeout(
          setDoc(profileRef, {
            uid: user.uid,
            email: user.email || "",
            displayName: user.displayName || "",
            role: "student",
            status: "active",
            grade: "中学2年生",
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          }),
          12000,
          "ユーザー情報の作成"
        );

        if (maintenanceActive) return;

        location.replace("./student/index.html");
        return;
      }

      const profile = profileSnap.data();

      if (profile.status !== "active") {
        await signOut(auth);
        showOnly(loginScreen);
        showError("このアカウントは現在利用できません。管理者にお問い合わせください。");
        return;
      }

      if (profile.role === "admin") {
        location.replace("./admin/index.html");
      } else if (profile.role === "student") {
        location.replace("./student/index.html");
      } else {
        await signOut(auth);
        showOnly(loginScreen);
        showError("アカウントの権限を確認できません。管理者にお問い合わせください。");
      }
    })();

    routingPromise = task;

    try {
      await task;
    } finally {
      if (routingPromise === task) {
        routingPromise = null;
        routingUid = null;
      }
    }
  }

  async function handleAuthState(user) {
    currentUser = user;

    if (!maintenanceReady) return;

    if (maintenanceActive) {
      showMaintenance();
      return;
    }

    if (!user) {
      showOnly(loginScreen);
      return;
    }

    try {
      await routeUser(user);
    } catch (error) {
      console.error("ユーザー振り分けエラー:", error);
      showOnly(loginScreen);
      showError(firebaseErrorMessage(error));
    }
  }

  function startAuthListener() {
    if (authListenerStarted) return;
    authListenerStarted = true;

    onAuthStateChanged(
      auth,
      user => {
        void handleAuthState(user);
      },
      error => {
        console.error("認証状態の監視エラー:", error);
        showFatal(
          "ログイン状態を確認できませんでした。\n" +
          firebaseErrorMessage(error)
        );
      }
    );
  }

  async function handleLogin(event) {
    event.preventDefault();

    if (busy || !maintenanceReady || maintenanceActive) return;

    clearError();
    setBusy(true);

    try {
      await signInWithEmailAndPassword(
        auth,
        $("email").value.trim(),
        $("password").value
      );
      // 認証成功後の画面遷移は認証状態監視に一本化
    } catch (error) {
      console.error("メールログインエラー:", error);
      showError(firebaseErrorMessage(error));
    } finally {
      setBusy(false);
    }
  }

  async function handleGoogleLogin() {
    if (busy || !maintenanceReady || maintenanceActive) return;

    clearError();
    setBusy(true);

    try {
      await signInWithPopup(auth, new GoogleAuthProvider());
    } catch (error) {
      console.error("Googleログインエラー:", error);

      if (error.code === "auth/popup-blocked") {
        try {
          await signInWithRedirect(auth, new GoogleAuthProvider());
          return;
        } catch (redirectError) {
          console.error("Googleリダイレクトエラー:", redirectError);
          showError(firebaseErrorMessage(redirectError));
        }
      } else {
        showError(firebaseErrorMessage(error));
      }
    } finally {
      setBusy(false);
    }
  }

  $("loginForm").addEventListener("submit", handleLogin);
  $("googleButton").addEventListener("click", handleGoogleLogin);
  $("email").addEventListener("input", clearError);
  $("password").addEventListener("input", clearError);

  async function initializeLogin() {
    try {
      // Firebase初期化・認証永続化の完了を待つ
      await withTimeout(
        persistenceReady,
        12000,
        "Firebaseの初期化"
      );

      // Googleリダイレクトで戻ってきた場合の結果を先に処理
      try {
        await withTimeout(
          getRedirectResult(auth),
          12000,
          "Googleログイン結果の確認"
        );
      } catch (error) {
        console.error("Googleログイン結果の取得エラー:", error);
        // リダイレクト結果のエラーを表示し、通常の認証監視は続ける
        showError(firebaseErrorMessage(error));
      }

      // 初期画面を出すため、設定をまず1回だけ取得
      const settingsSnap = await withTimeout(
        getDoc(doc(db, "settings", "system")),
        12000,
        "メンテナンス設定の取得"
      );

      if (!settingsSnap.exists()) {
        showFatal(
          "Firestoreに settings/system がありません。\n" +
          "Firebase Consoleで設定ドキュメントを作成してください。"
        );
        return;
      }

      const settings = settingsSnap.data();
      maintenanceActive = settings.maintenance === true;
      maintenanceReady = true;

      if (maintenanceActive) {
        showMaintenance(settings);

        if (auth.currentUser) {
          try {
            await signOut(auth);
          } catch (error) {
            console.error("メンテナンス中のサインアウトに失敗:", error);
          }
        }
      } else {
        showOnly(loginScreen);
      }

      // メンテナンス設定の変更は引き続き監視
      unsubscribeMaintenance = onSnapshot(
        doc(db, "settings", "system"),
        async snapshot => {
          if (!snapshot.exists()) {
            maintenanceReady = false;
            showFatal("settings/system が削除されたため、設定を確認できません。");
            return;
          }

          const liveSettings = snapshot.data();
          const wasMaintenanceActive = maintenanceActive;
          maintenanceActive = liveSettings.maintenance === true;
          maintenanceReady = true;

          if (maintenanceActive) {
            showMaintenance(liveSettings);

            if (auth.currentUser) {
              try {
                await signOut(auth);
              } catch (error) {
                console.error("メンテナンス中のサインアウトに失敗:", error);
              }
            }
            return;
          }

          if (wasMaintenanceActive) {
            // メンテナンス解除後、認証状態に応じて画面を更新
            await handleAuthState(auth.currentUser);
          }
        },
        error => {
          console.error("メンテナンス設定監視エラー:", error);
          // 初回の取得に成功していれば、取得済みの設定で画面を動かす
          if (!maintenanceReady) {
            showFatal(
              "メンテナンス設定を監視できません。\n" +
              firebaseErrorMessage(error)
            );
          }
        }
      );

      startAuthListener();
    } catch (error) {
      console.error("ログイン画面初期化エラー:", error);

      showFatal(
        "ログイン画面の初期化に失敗しました。\n" +
        firebaseErrorMessage(error)
      );
    }
  }

  window.addEventListener("pagehide", () => {
    if (unsubscribeMaintenance) {
      unsubscribeMaintenance();
    }
  });

  void initializeLogin();
</script>
