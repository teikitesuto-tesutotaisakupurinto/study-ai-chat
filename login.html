<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#f5f7fb"
  >

  <title>ログイン | 学習AIチャット</title>

  <style>
    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family:
        Arial,
        "Noto Sans JP",
        sans-serif;
      color: #172033;
      background:
        linear-gradient(
          135deg,
          #f4f7fb,
          #eef3fb
        );
    }

    .screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 34px;
      background: #ffffff;
      border: 1px solid #e1e7f0;
      border-radius: 18px;
      box-shadow:
        0 12px 35px
        rgba(15, 23, 42, .08);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 26px;
      font-weight: 700;
    }

    .subtitle {
      margin:
        0 0 28px;
      color: #64748b;
      text-align: center;
      font-size: 14px;
      line-height: 1.7;
    }

    label {
      display: block;
      margin:
        17px 0 7px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border:
        1px solid #cbd5e1;
      border-radius: 9px;
      background: #ffffff;
      color: #172033;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow:
        0 0 0 3px
        rgba(37, 99, 235, .12);
    }

    button {
      width: 100%;
      padding: 13px 16px;
      margin-top: 18px;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .google {
      background: #ffffff;
      color: #172033;
      border:
        1px solid #cbd5e1;
    }

    .google:hover:not(:disabled) {
      background: #f8fafc;
    }

    .google-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 8px;
      font-size: 18px;
      font-weight: 700;
      color: #4285f4;
    }

    .separator {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0 4px;
      color: #94a3b8;
      font-size: 13px;
    }

    .separator::before,
    .separator::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }

    .link {
      display: block;
      margin-top: 18px;
      color: #2563eb;
      text-align: center;
      text-decoration: none;
      font-size: 14px;
    }

    .link:hover {
      text-decoration: underline;
    }

    .message {
      margin-top: 17px;
      padding: 12px 14px;
      border-radius: 9px;
      background: #fff1f2;
      color: #b91c1c;
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .loading-message {
      margin: 0;
      color: #64748b;
      text-align: center;
      line-height: 1.8;
    }

    .maintenance {
      text-align: center;
    }

    .maintenance p {
      line-height: 1.9;
      white-space: pre-wrap;
    }

    .fatal-detail {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #f8fafc;
      color: #475569;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    footer {
      margin-top: 26px;
      color: #94a3b8;
      text-align: center;
      font-size: 11px;
      line-height: 1.7;
    }

    @media (max-width: 480px) {
      .screen {
        padding: 16px;
      }

      .card {
        padding: 26px 20px;
        border-radius: 14px;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <!-- 初期確認 -->
  <main
    id="gate"
    class="screen"
  >
    <section class="card">
      <p class="loading-message">
        ログイン状態を確認しています。
      </p>
    </section>
  </main>

  <!-- メンテナンス -->
  <main
    id="maintenanceScreen"
    class="screen"
    hidden
  >
    <section class="card maintenance">

      <h1>
        システムメンテナンス中
      </h1>

      <p id="maintenanceMessage">
        現在、メンテナンスを実施しています。
        しばらくお待ちください。
      </p>

      <button
        id="maintenanceAdminLogin"
        type="button"
      >
        管理者ログイン
      </button>

      <footer>
        © 2026 定期テスト対策プリント運営事務局.
        All Rights Reserved.
      </footer>

    </section>
  </main>

  <!-- ログイン -->
  <main
    id="loginScreen"
    class="screen"
    hidden
  >
    <section class="card">

      <h1>
        学習AIチャット
      </h1>

      <p class="subtitle">
        アカウントにログインしてください
      </p>

      <form id="loginForm">

        <label for="email">
          メールアドレス
        </label>

        <input
          id="email"
          type="email"
          autocomplete="username"
          required
          placeholder="メールアドレス"
        >

        <label for="password">
          パスワード
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
          placeholder="パスワード"
        >

        <button
          id="loginButton"
          type="submit"
        >
          ログイン
        </button>

      </form>

      <div class="separator">
        または
      </div>

      <button
        id="googleButton"
        class="google"
        type="button"
      >
        <span class="google-mark">
          G
        </span>
        Google でログイン
      </button>

      <a
        class="link"
        href="./reset.html"
      >
        パスワードを忘れた場合
      </a>

      <div
        id="errorBox"
        class="message"
        role="alert"
        hidden
      ></div>

      <footer>
        © 2026 定期テスト対策プリント運営事務局.
        All Rights Reserved.
      </footer>

    </section>
  </main>

  <!-- 致命的エラー -->
  <main
    id="errorScreen"
    class="screen"
    hidden
  >
    <section class="card">

      <h1>
        ログイン処理を続行できません
      </h1>

      <p
        id="fatalMessage"
        class="message"
      ></p>

      <button
        id="reloadButton"
        type="button"
      >
        再読み込み
      </button>

      <a
        class="link"
        href="./login.html"
      >
        ログイン画面を再表示
      </a>

    </section>
  </main>

  <script type="module">

    import {
      auth,
      persistenceReady,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithRedirect,
      getRedirectResult,
      signOut
    } from "./assets/js/firebase-module.js";

    import {
      getCurrentProfile,
      getSystemSettings
    } from "./assets/js/auth.js";

    const $ = id =>
      document.getElementById(id);

    const gate =
      $("gate");

    const loginScreen =
      $("loginScreen");

    const maintenanceScreen =
      $("maintenanceScreen");

    const errorScreen =
      $("errorScreen");

    const errorBox =
      $("errorBox");

    const loginButton =
      $("loginButton");

    const googleButton =
      $("googleButton");

    let busy = false;
    let redirecting = false;
    let initialized = false;

    /* =====================================================
       画面
       ===================================================== */

    function showScreen(screen) {

      gate.hidden = true;

      loginScreen.hidden = true;

      maintenanceScreen.hidden = true;

      errorScreen.hidden = true;

      screen.hidden = false;
    }

    /* =====================================================
       エラー
       ===================================================== */

    function showError(message) {

      errorBox.textContent =
        message;

      errorBox.hidden = false;
    }

    function clearError() {

      errorBox.textContent = "";

      errorBox.hidden = true;
    }

    function errorMessage(error) {

      const messages = {

        "auth/invalid-credential":
          "メールアドレスまたはパスワードが正しくありません。",

        "auth/invalid-email":
          "メールアドレスの形式が正しくありません。",

        "auth/user-disabled":
          "このアカウントは無効になっています。",

        "auth/unauthorized-domain":
          "このドメインがFirebase Authenticationの承認済みドメインに登録されていません。",

        "auth/network-request-failed":
          "通信に失敗しました。",

        "auth/popup-blocked":
          "Googleログインのポップアップがブロックされました。",

        "auth/popup-closed-by-user":
          "Googleログインがキャンセルされました。",

        "permission-denied":
          "Firestoreのアクセスが拒否されました。"
      };

      return (
        messages[error?.code] ||
        `${error?.message || String(error)}${
          error?.code
            ? "\nエラーコード: " +
              error.code
            : ""
        }`
      );
    }

    function showFatal(error) {

      console.error(
        "ログイン画面エラー:",
        error
      );

      $("fatalMessage").textContent =
        errorMessage(error);

      showScreen(errorScreen);
    }

    /* =====================================================
       Busy
       ===================================================== */

    function setBusy(value) {

      busy = value;

      loginButton.disabled =
        value;

      googleButton.disabled =
        value;

      loginButton.textContent =
        value
          ? "ログイン中..."
          : "ログイン";
    }

    /* =====================================================
       ログイン後の遷移
       ===================================================== */

    async function routeUser(user) {

      if (
        !user ||
        redirecting
      ) {
        return;
      }

      /*
        Firebaseログイン成功後、
        Firestoreプロフィールを確認。
      */

      const profile =
        await getCurrentProfile(
          user
        );

      if (
        profile.status !==
        "active"
      ) {

        await signOut(auth);

        showScreen(
          loginScreen
        );

        showError(
          "このアカウントは現在利用できません。"
        );

        return;
      }

      /*
        管理者
      */

      if (
        profile.role ===
        "admin"
      ) {

        redirecting = true;

        location.replace(
          "./admin/index.html"
        );

        return;
      }

      /*
        生徒
      */

      if (
        profile.role ===
        "student"
      ) {

        redirecting = true;

        /*
          メンテナンスはログイン後に
          判定する。
        */

        let settings;

        try {

          settings =
            await getSystemSettings();

        } catch (error) {

          console.error(
            "設定取得エラー:",
            error
          );

          showFatal(error);

          return;
        }

        if (
          settings.maintenance ===
          true
        ) {

          location.replace(
            "./maintenance.html"
          );

          return;
        }

        location.replace(
          "./student/index.html"
        );

        return;
      }

      /*
        role不正
      */

      await signOut(auth);

      showScreen(
        loginScreen
      );

      showError(
        "アカウントの権限が正しく設定されていません。"
      );
    }

    /* =====================================================
       メールログイン
       ===================================================== */

    $("loginForm")
      .addEventListener(
        "submit",
        async event => {

          event.preventDefault();

          if (
            busy ||
            !initialized
          ) {
            return;
          }

          clearError();

          setBusy(true);

          try {

            await signInWithEmailAndPassword(
              auth,
              $("email").value.trim(),
              $("password").value
            );

            /*
              onAuthStateChanged側で
              routeUser() が実行される。
            */

          } catch (error) {

            console.error(
              "メールログインエラー:",
              error
            );

            showError(
              errorMessage(error)
            );

            setBusy(false);
          }
        }
      );

    /* =====================================================
       Googleログイン
       ===================================================== */

    googleButton.addEventListener(
      "click",
      async () => {

        if (
          busy ||
          !initialized
        ) {
          return;
        }

        clearError();

        setBusy(true);

        try {

          await signInWithPopup(
            auth,
            new GoogleAuthProvider()
          );

        } catch (error) {

          if (
            error?.code ===
            "auth/popup-blocked"
          ) {

            try {

              await signInWithRedirect(
                auth,
                new GoogleAuthProvider()
              );

              return;

            } catch (
              redirectError
            ) {

              console.error(
                "Googleリダイレクトログインエラー:",
                redirectError
              );

              showError(
                errorMessage(
                  redirectError
                )
              );

            }

          } else {

            console.error(
              "Googleログインエラー:",
              error
            );

            showError(
              errorMessage(error)
            );
          }

          setBusy(false);
        }
      }
    );

    /* =====================================================
       メンテナンス中の管理者ログイン
       ===================================================== */

    $("maintenanceAdminLogin")
      .addEventListener(
        "click",
        () => {

          showScreen(
            loginScreen
          );

          clearError();

          $("email").focus();

          showError(
            "管理者アカウントでログインしてください。"
          );
        }
      );

    /* =====================================================
       再読み込み
       ===================================================== */

    $("reloadButton")
      .addEventListener(
        "click",
        () => {
          location.reload();
        }
      );

    /* =====================================================
       初期化
       ===================================================== */

    async function initialize() {

      try {

        /*
          Firebase Authenticationの
          永続化設定を待つ。
        */

        await persistenceReady;

        /*
          Google redirectから戻ってきた場合。
        */

        try {

          await getRedirectResult(
            auth
          );

        } catch (error) {

          console.error(
            "Googleリダイレクト結果取得エラー:",
            error
          );

          showError(
            errorMessage(error)
          );
        }

        initialized = true;

        /*
          ここから認証状態監視。
        */

        onAuthStateChanged(
          auth,
          async user => {

            /*
              すでに別ページへ
              遷移処理中なら何もしない。
            */

            if (
              redirecting
            ) {
              return;
            }

            /*
              未ログイン
            */

            if (!user) {

              setBusy(false);

              showScreen(
                loginScreen
              );

              return;
            }

            /*
              ログイン済み
            */

            try {

              setBusy(true);

              await routeUser(
                user
              );

            } catch (error) {

              console.error(
                "ログイン後処理エラー:",
                error
              );

              showFatal(
                error
              );

            } finally {

              /*
                遷移が始まった場合は
                login画面に戻さない。
              */

              if (
                !redirecting
              ) {
                setBusy(false);
              }
            }
          },

          error => {

            console.error(
              "認証状態監視エラー:",
              error
            );

            showFatal(
              error
            );
          }
        );

      } catch (error) {

        showFatal(
          error
        );
      }
    }

    initialize();

  </script>

</body>
</html>
