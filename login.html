<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン｜学習AIチャット</title>
  <link rel="stylesheet" href="./assets/css/common.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <div class="brand-mark">学</div>
      <h1>学習AIチャット</h1>
      <p class="muted">アカウントにログインしてください。</p>

      <form id="loginForm" class="auth-form">
        <label for="email">メールアドレス</label>
        <input id="email" type="email" autocomplete="username" required>

        <label for="password">パスワード</label>
        <input id="password" type="password"
          autocomplete="current-password" required>

        <button class="primary-button" id="loginButton" type="submit">
          ログイン
        </button>
      </form>

      <button class="secondary-button" id="googleButton"
        style="width:100%;margin-top:12px" type="button">
        Googleアカウントでログイン
      </button>

      <div id="loginMessage" class="notice" hidden aria-live="polite"></div>

      <div class="auth-links">
        <a href="./reset.html">パスワードを忘れた場合</a>
      </div>

      <div class="auth-footer">
        © 2026 Regular Test Preparation Worksheet Administration Office. All Rights Reserved.
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="./assets/js/paths.js"></script>
  <script src="./assets/js/firebase.js"></script>
  <script src="./assets/js/auth.js"></script>

  <script>
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const googleButton = document.getElementById("googleButton");
    const loginMessage = document.getElementById("loginMessage");

    function showLoginMessage(text, type) {
      loginMessage.textContent = text;
      loginMessage.className = "notice " + (type || "error");
      loginMessage.hidden = false;
    }

    function friendlyAuthError(error) {
      const messages = {
        "auth/invalid-email": "メールアドレスの形式を確認してください。",
        "auth/user-disabled": "このアカウントは停止されています。",
        "auth/user-not-found": "アカウントが見つかりません。",
        "auth/wrong-password": "メールアドレスまたはパスワードが違います。",
        "auth/invalid-credential": "メールアドレスまたはパスワードが違います。",
        "auth/too-many-requests": "試行回数が多すぎます。時間をおいてください。",
        "auth/popup-closed-by-user": "Googleログインがキャンセルされました。",
        "auth/unauthorized-domain": "Firebaseの承認済みドメイン設定を確認してください。"
      };
      return messages[error.code] || "ログインできませんでした。設定と入力内容を確認してください。";
    }

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      loginButton.disabled = true;
      googleButton.disabled = true;
      loginMessage.hidden = true;

      try {
        await auth.signInWithEmailAndPassword(
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
        // auth.js がユーザーの役割を確認して遷移します。
      } catch (error) {
        showLoginMessage(friendlyAuthError(error));
        loginButton.disabled = false;
        googleButton.disabled = false;
      }
    });

    googleButton.addEventListener("click", async function () {
      loginButton.disabled = true;
      googleButton.disabled = true;
      loginMessage.hidden = true;

      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        await auth.signInWithPopup(provider);
        // auth.js がユーザーの役割を確認して遷移します。
      } catch (error) {
        showLoginMessage(friendlyAuthError(error));
        loginButton.disabled = false;
        googleButton.disabled = false;
      }
    });
  </script>
</body>
</html>
