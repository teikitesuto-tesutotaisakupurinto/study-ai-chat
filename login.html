
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="description" content="学習AIチャットのログイン">
  <title>ログイン | 学習AIチャット</title>

  <style>
    :root {
      font-family: system-ui, -apple-system, "Noto Sans JP",
        "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      color: #172033;
      background: #f4f7fb;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
    }

    button, input { font: inherit; }

    .screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 32px;
      background: #fff;
      border: 1px solid #e1e7f0;
      border-radius: 18px;
      box-shadow: 0 12px 36px #1720330d;
    }

    .brand {
      text-align: center;
      margin-bottom: 26px;
    }

    .brand h1 {
      margin: 0;
      font-size: 27px;
      letter-spacing: -.04em;
    }

    .brand p {
      margin: 10px 0 0;
      color: #64748b;
      font-size: 14px;
      line-height: 1.8;
    }

    .field { margin-top: 18px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 11px 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      background: #fff;
      color: #172033;
    }

    input:focus {
      outline: 3px solid #2563eb24;
      border-color: #2563eb;
    }

    button {
      width: 100%;
      min-height: 48px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 700;
    }

    button:disabled {
      cursor: wait;
      opacity: .6;
    }

    .primary {
      margin-top: 22px;
      border: 0;
      background: #2563eb;
      color: #fff;
    }

    .primary:hover { background: #1d4ed8; }

    .secondary {
      margin-top: 14px;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #172033;
    }

    .secondary:hover { background: #f8fafc; }

    .link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
    }

    .link:hover { text-decoration: underline; }

    .message {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.error {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      color: #9f1239;
    }

    .message.info {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
    }

    .loading {
      text-align: center;
      color: #64748b;
      line-height: 1.8;
    }

    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 14px;
      border: 3px solid #dbeafe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .maintenance h1 {
      margin: 0 0 16px;
      font-size: 25px;
      text-align: center;
    }

    .maintenance p {
      color: #475569;
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      text-align: center;
    }

    .error-title {
      color: #991b1b;
      font-size: 22px;
    }

    .error-detail {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      background: #f8fafc;
      color: #475569;
      font-size: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    footer {
      margin-top: 26px;
      color: #94a3b8;
      text-align: center;
      font-size: 11px;
      line-height: 1.7;
    }

    @media (max-width: 480px) {
      .card { padding: 25px 20px; }
      .brand h1 { font-size: 24px; }
    }
  </style>

  <!-- モジュール起動前のエラー・タイムアウト表示 -->
  <script>
    (() => {
      let startupTimer;

      window.addEventListener("DOMContentLoaded", () => {
        startupTimer = window.setTimeout(() => {
          const loading = document.getElementById("loadingScreen");
          if (!loading || loading.hidden) return;

          showStartupError(
            "起動処理が15秒以内に完了しませんでした。APIキー、JavaScriptの読み込み、通信状態を確認してください。"
          );
        }, 15000);
      });

      window.showStartupError = (detail) => {
        const loading = document.getElementById("loadingScreen");
        const errorScreen = document.getElementById("errorScreen");
        const message = document.getElementById("fatalMessage");
        const detailBox = document.getElementById("fatalDetail");

        if (!loading || !errorScreen || !message || !detailBox) return;

        if (startupTimer) clearTimeout(startupTimer);

        message.textContent =
          "システムを起動できませんでした。以下の詳細を確認してください。";
        detailBox.textContent = detail || "原因を特定できませんでした。";
        detailBox.hidden = false;
        loading.hidden = true;
        errorScreen.hidden = false;
      };

      window.addEventListener("error", (event) => {
        if (event.target && event.target !== window) {
          const target = event.target;

          if (target.tagName === "SCRIPT") {
            window.showStartupError(
              "JavaScriptファイルを読み込めませんでした。\n" +
              (target.src || "モジュールのURLを確認してください。")
            );
          }
        }
      }, true);

      window.addEventListener("unhandledrejection", (event) => {
        console.error("非同期エラー:", event.reason);
      });
    })();
  </script>
</head>

<body>
  <main id="loadingScreen" class="screen">
    <section class="card loading">
      <div class="spinner" aria-hidden="true"></div>
      <div id="loadingText">システムを確認しています。</div>
    </section>
  </main>

  <main id="loginScreen" class="screen" hidden>
    <section class="card">
      <header class="brand">
        <h1>学習AIチャット</h1>
        <p>
          ログインして、学習を始めましょう。<br>
          アカウント情報を入力してください。
        </p>
      </header>

      <form id="loginForm">
        <div class="field">
          <label for="email">メールアドレス</label>
          <input
            id="email"
            type="email"
            autocomplete="username"
            inputmode="email"
            required
            placeholder="メールアドレス"
          >
        </div>

        <div class="field">
          <label for="password">パスワード</label>
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="パスワード"
          >
        </div>

        <button id="loginButton" class="primary" type="submit">
          ログイン
        </button>
      </form>

      <button id="googleButton" class="secondary" type="button">
        Google でログイン
      </button>

      <a class="link" href="./reset.html">
        パスワードを忘れた場合
      </a>

      <div id="messageBox" class="message" role="status" hidden></div>

      <footer>
        © 2026 定期テスト対策プリント運営事務局. All Rights Reserved.
      </footer>
    </section>
  </main>

  <main id="maintenanceScreen" class="screen" hidden>
    <section class="card maintenance">
      <h1 id="maintenanceTitle">システムメンテナンス中</h1>
      <p id="maintenanceMessage">
        現在、システムメンテナンスを実施しています。
        しばらくお待ちください。
      </p>
      <button id="maintenanceLogoutButton" class="primary" type="button">
        別のアカウントでログイン
      </button>
      <footer>
        © 2026 定期テスト対策プリント運営事務局. All Rights Reserved.
      </footer>
    </section>
  </main>

  <main id="errorScreen" class="screen" hidden>
    <section class="card">
      <h1 class="error-title">システムを確認できません</h1>
      <p id="fatalMessage">設定または通信を確認してください。</p>
      <div id="fatalDetail" class="error-detail" hidden></div>
      <button id="retryButton" class="primary" type="button">
        再読み込み
      </button>
      <footer>
        © 2026 定期テスト対策プリント運営事務局. All Rights Reserved.
      </footer>
    </section>
  </main>

  <script type="module">
    const $ = (id) => document.getElementById(id);

    function showScreen(id) {
      for (const screenId of [
        "loadingScreen",
        "loginScreen",
        "maintenanceScreen",
        "errorScreen"
      ]) {
        $(screenId).hidden = screenId !== id;
      }
    }

    function showMessage(text, type = "error") {
      const box = $("messageBox");
      box.textContent = text;
      box.className = `message ${type}`;
      box.hidden = false;
    }

    function clearMessage() {
      $("messageBox").textContent = "";
      $("messageBox").hidden = true;
    }

    function showFatal(error) {
      console.error("ログイン画面エラー:", error);
      window.showStartupError(
        `${error?.code ? error.code + "\n" : ""}${error?.message || String(error)}`
      );
    }

    function errorText(error) {
      const code = error?.code || "";

      const messages = {
        "auth/api-key-not-valid":
          "Firebase APIキーが無効です。Firebase ConsoleのWebアプリ設定と一致しているか確認してください。",
        "auth/unauthorized-domain":
          "このサイトのドメインがFirebase Authenticationの承認済みドメインに登録されていません。",
        "auth/invalid-credential":
          "メールアドレスまたはパスワードが正しくありません。",
        "auth/invalid-email":
          "メールアドレスの形式を確認してください。",
        "auth/user-disabled":
          "このアカウントは無効になっています。",
        "auth/too-many-requests":
          "試行回数が多すぎます。時間をおいて再度お試しください。",
        "auth/network-request-failed":
          "通信に失敗しました。インターネット接続を確認してください。",
        "auth/popup-blocked":
          "Googleログインのポップアップがブロックされました。",
        "auth/popup-closed-by-user":
          "Googleログインがキャンセルされました。",
        "permission-denied":
          "Firestoreへのアクセスが拒否されました。Firestore Rulesを確認してください。"
      };

      return messages[code] || error?.message || String(error);
    }

    function setBusy(value) {
      $("loginButton").disabled = value;
      $("googleButton").disabled = value;
      $("loginButton").textContent = value ? "処理中..." : "ログイン";
      $("googleButton").textContent =
        value ? "処理中..." : "Google でログイン";
    }

    // すべての待機処理にタイムアウトを設定
    function withTimeout(promise, label, ms = 12000) {
      let timer;

      const timeout = new Promise((_, reject) => {
        timer = setTimeout(() => {
          reject(new Error(`${label}がタイムアウトしました（${ms / 1000}秒）。`));
        }, ms);
      });

      return Promise.race([promise, timeout]).finally(() => {
        clearTimeout(timer);
      });
    }

    async function start() {
      try {
        $("loadingText").textContent = "Firebaseを初期化しています。";

        const firebaseModule = await withTimeout(
          import("./assets/js/firebase.js"),
          "Firebaseモジュールの読み込み"
        );

        const {
          auth,
          db,
          persistenceReady,
          onAuthStateChanged,
          signOut,
          signInWithEmailAndPassword,
          GoogleAuthProvider,
          signInWithPopup,
          getRedirectResult,
          doc,
          getDoc
        } = firebaseModule;

        if (!auth || !db || !persistenceReady) {
          throw new Error(
            "firebase.jsからauth、db、persistenceReadyを取得できませんでした。"
          );
        }

        $("loadingText").textContent = "認証状態を確認しています。";

        await withTimeout(
          persistenceReady,
          "Firebase認証の初期化"
        );

        let routing = false;
        let lastHandledUid = null;
        let authResolved = false;

        async function readDocument(collectionName, documentId) {
          const snapshot = await withTimeout(
            getDoc(doc(db, collectionName, documentId)),
            `${collectionName}/${documentId} の読み取り`
          );

          if (!snapshot.exists()) {
            throw new Error(
              `Firestoreに ${collectionName}/${documentId} が存在しません。`
            );
          }

          return snapshot.data();
        }

        async function routeUser(user) {
          if (!user || routing) return;
          if (lastHandledUid === user.uid) return;

          routing = true;
          lastHandledUid = user.uid;
          showScreen("loadingScreen");
          $("loadingText").textContent = "アカウントを確認しています。";

          try {
            const profile = await readDocument("users", user.uid);

            if (profile.status !== "active") {
              await signOut(auth);
              lastHandledUid = null;
              showScreen("loginScreen");
              showMessage(
                "このアカウントは現在利用できません。管理者にお問い合わせください。"
              );
              return;
            }

            if (profile.role !== "student" && profile.role !== "admin") {
              await signOut(auth);
              lastHandledUid = null;
              showScreen("loginScreen");
              showMessage(
                "アカウントの権限が正しく設定されていません。管理者にお問い合わせください。"
              );
              return;
            }

            $("loadingText").textContent = "システム設定を取得しています。";

            const settings = await readDocument("settings", "system");

            if (profile.role === "admin") {
              location.replace("./admin/index.html");
              return;
            }

            if (settings.maintenance === true) {
              $("maintenanceTitle").textContent =
                typeof settings.maintenanceTitle === "string" &&
                settings.maintenanceTitle.trim()
                  ? settings.maintenanceTitle
                  : "システムメンテナンス中";

              $("maintenanceMessage").textContent =
                typeof settings.maintenanceMessage === "string" &&
                settings.maintenanceMessage.trim()
                  ? settings.maintenanceMessage
                  : "現在、システムメンテナンスを実施しています。しばらくお待ちください。";

              showScreen("maintenanceScreen");
              return;
            }

            location.replace("./student/index.html");
          } catch (error) {
            lastHandledUid = null;
            console.error("ユーザー確認エラー:", error);
            $("fatalMessage").textContent =
              "プロフィールまたはシステム設定を取得できませんでした。";
            $("fatalDetail").textContent = errorText(error);
            $("fatalDetail").hidden = false;
            showScreen("errorScreen");
          } finally {
            routing = false;
          }
        }

        $("loginForm").addEventListener("submit", async (event) => {
          event.preventDefault();
          clearMessage();

          if ($("loginButton").disabled) return;

          const email = $("email").value.trim();
          const password = $("password").value;

          if (!email || !password) {
            showMessage("メールアドレスとパスワードを入力してください。");
            return;
          }

          setBusy(true);

          try {
            await withTimeout(
              signInWithEmailAndPassword(auth, email, password),
              "メールアドレスでのログイン"
            );
          } catch (error) {
            console.error("ログインエラー:", error);
            showScreen("loginScreen");
            showMessage(errorText(error));
          } finally {
            setBusy(false);
          }
        });

        $("googleButton").addEventListener("click", async () => {
          if ($("googleButton").disabled) return;

          clearMessage();
          setBusy(true);

          try {
            const provider = new GoogleAuthProvider();
            provider.setCustomParameters({ prompt: "select_account" });

            await withTimeout(
              signInWithPopup(auth, provider),
              "Googleログイン"
            );
          } catch (error) {
            console.error("Googleログインエラー:", error);
            showScreen("loginScreen");
            showMessage(errorText(error));
          } finally {
            setBusy(false);
          }
        });

        $("maintenanceLogoutButton").addEventListener("click", async () => {
          try {
            await signOut(auth);
            lastHandledUid = null;
            clearMessage();
            showScreen("loginScreen");
          } catch (error) {
            showMessage(`ログアウトに失敗しました。\n${errorText(error)}`);
          }
        });

        $("retryButton").addEventListener("click", () => {
          location.reload();
        });

        // Googleのリダイレクトログイン結果を処理
        try {
          await withTimeout(
            getRedirectResult(auth),
            "Googleログイン結果の確認"
          );
        } catch (error) {
          console.error("リダイレクト結果エラー:", error);
          showScreen("loginScreen");
          showMessage(errorText(error));
        }

        // 初回の認証状態通知を待つ
        await withTimeout(
          new Promise((resolve, reject) => {
            const unsubscribe = onAuthStateChanged(
              auth,
              (user) => {
                if (authResolved) return;
                authResolved = true;
                unsubscribe();

                if (user) {
                  routeUser(user);
                } else {
                  showScreen("loginScreen");
                }

                resolve();
              },
              (error) => {
                unsubscribe();
                reject(error);
              }
            );
          }),
          "認証状態の取得"
        );

      } catch (error) {
        showFatal(error);
      }
    }

    start();
  </script>
</body>
</html>
