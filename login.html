<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#f5f7fb"
  >

  <title>ログイン | 学習AIチャット</title>

  <style>
    *{
      box-sizing:border-box;
    }

    [hidden]{
      display:none!important;
    }

    html,
    body{
      margin:0;
      min-height:100%;
    }

    body{
      min-height:100vh;
      font-family:
        Arial,
        "Noto Sans JP",
        sans-serif;
      color:#202124;
      background:#f5f7fb;
    }

    .screen{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .card{
      width:100%;
      max-width:430px;
      padding:34px;
      background:#fff;
      border:1px solid #e1e6ef;
      border-radius:16px;
      box-shadow:
        0 8px 30px
        rgba(15,23,42,.07);
    }

    h1{
      margin:0 0 8px;
      font-size:25px;
      text-align:center;
      letter-spacing:.01em;
    }

    .subtitle{
      margin:0 0 28px;
      color:#64748b;
      text-align:center;
      font-size:14px;
      line-height:1.7;
    }

    label{
      display:block;
      margin:17px 0 7px;
      font-size:14px;
      font-weight:600;
    }

    input{
      width:100%;
      padding:13px 12px;
      border:1px solid #cbd5e1;
      border-radius:8px;
      font-size:16px;
      background:#fff;
    }

    input:focus{
      outline:2px solid #2563eb;
      outline-offset:1px;
      border-color:#2563eb;
    }

    button{
      width:100%;
      padding:13px;
      margin-top:17px;
      border:0;
      border-radius:8px;
      background:#2563eb;
      color:#fff;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
    }

    button:hover:not(:disabled){
      background:#1d4ed8;
    }

    button:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .google{
      background:#fff;
      color:#202124;
      border:1px solid #cbd5e1;
    }

    .google:hover:not(:disabled){
      background:#f8fafc;
    }

    .google-mark{
      display:inline-block;
      margin-right:8px;
      font-size:18px;
      font-weight:700;
      color:#4285f4;
    }

    .separator{
      display:flex;
      align-items:center;
      gap:12px;
      margin:21px 0 3px;
      color:#64748b;
      font-size:13px;
    }

    .separator::before,
    .separator::after{
      content:"";
      flex:1;
      height:1px;
      background:#e2e8f0;
    }

    .link{
      display:block;
      margin-top:18px;
      text-align:center;
      color:#2563eb;
      text-decoration:none;
      font-size:14px;
    }

    .link:hover{
      text-decoration:underline;
    }

    .message{
      margin-top:17px;
      padding:12px 13px;
      border-radius:8px;
      background:#fff1f2;
      color:#b42318;
      font-size:13px;
      line-height:1.7;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }

    .loading-message{
      margin:0;
      color:#64748b;
      text-align:center;
      line-height:1.8;
    }

    .maintenance{
      text-align:center;
      max-width:600px;
    }

    .maintenance h1{
      margin-bottom:16px;
    }

    .maintenance p{
      color:#475569;
      line-height:1.9;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }

    .fatal{
      margin-top:18px;
      padding:14px;
      background:#fff1f2;
      border-radius:8px;
      color:#b42318;
      font-size:13px;
      line-height:1.7;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
      text-align:left;
    }

    footer{
      margin-top:24px;
      color:#94a3b8;
      text-align:center;
      font-size:11px;
      line-height:1.7;
    }

    @media(max-width:480px){
      .screen{
        padding:16px;
      }

      .card{
        padding:25px 20px;
      }

      h1{
        font-size:23px;
      }
    }
  </style>
</head>

<body>

  <!-- 初期化中 -->
  <main
    id="gate"
    class="screen"
  >
    <section class="card">
      <p class="loading-message">
        システムを確認しています。
      </p>
    </section>
  </main>


  <!-- ログイン画面 -->
  <main
    id="loginScreen"
    class="screen"
    hidden
  >
    <section class="card">

      <h1>
        学習AIチャット
      </h1>

      <p class="subtitle">
        アカウントにログインしてください
      </p>

      <form id="loginForm">

        <label for="email">
          メールアドレス
        </label>

        <input
          id="email"
          type="email"
          autocomplete="username"
          required
          placeholder="メールアドレス"
        >

        <label for="password">
          パスワード
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
          placeholder="パスワード"
        >

        <button
          id="loginButton"
          type="submit"
        >
          ログイン
        </button>

      </form>


      <div class="separator">
        または
      </div>


      <button
        id="googleButton"
        class="google"
        type="button"
      >
        <span class="google-mark">G</span>
        Google でログイン
      </button>


      <a
        class="link"
        href="./reset.html"
      >
        パスワードを忘れた場合
      </a>


      <div
        id="errorBox"
        class="message"
        role="alert"
        hidden
      ></div>


      <footer>
        © 2026 Regular Test Preparation Worksheet Administration Office. All Rights Reserved.
      </footer>

    </section>
  </main>


  <!-- メンテナンス画面 -->
  <main
    id="maintenanceScreen"
    class="screen"
    hidden
  >
    <section class="card maintenance">

      <h1 id="maintenanceTitle">
        システムメンテナンス中
      </h1>

      <p id="maintenanceMessage">
        現在、メンテナンスを実施しています。
        しばらくお待ちください。
      </p>

      <button
        id="maintenanceAdminLogin"
        type="button"
      >
        管理者ログイン
      </button>

      <footer>
        © 2026 Regular Test Preparation Worksheet Administration Office. All Rights Reserved.
      </footer>

    </section>
  </main>


  <!-- 致命的エラー -->
  <main
    id="errorScreen"
    class="screen"
    hidden
  >
    <section class="card">

      <h1>
        システムエラー
      </h1>

      <p
        id="fatalMessage"
        class="fatal"
      ></p>

      <button
        id="reloadButton"
        type="button"
      >
        再読み込み
      </button>

      <a
        class="link"
        href="./login.html"
      >
        ログイン画面を再表示
      </a>

    </section>
  </main>


  <!-- Firebase -->
  <script type="module">

    import {
      auth,
      db,
      persistenceReady,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithRedirect,
      getRedirectResult,
      signOut,
      doc,
      getDoc
    } from "./assets/js/firebase.js";


    /* =====================================================
       DOM
       ===================================================== */

    const $ =
      id =>
        document.getElementById(id);

    const gate =
      $("gate");

    const loginScreen =
      $("loginScreen");

    const maintenanceScreen =
      $("maintenanceScreen");

    const errorScreen =
      $("errorScreen");

    const errorBox =
      $("errorBox");


    /* =====================================================
       状態
       ===================================================== */

    let initialized =
      false;

    let busy =
      false;

    let redirecting =
      false;


    /* =====================================================
       画面切り替え
       ===================================================== */

    function showScreen(
      screen
    ) {
      gate.hidden =
        true;

      loginScreen.hidden =
        true;

      maintenanceScreen.hidden =
        true;

      errorScreen.hidden =
        true;

      screen.hidden =
        false;
    }


    /* =====================================================
       エラー
       ===================================================== */

    function showError(
      message
    ) {
      errorBox.textContent =
        message;

      errorBox.hidden =
        false;
    }


    function clearError() {
      errorBox.textContent =
        "";

      errorBox.hidden =
        true;
    }


    function showFatal(
      error
    ) {
      console.error(
        "ログイン画面初期化エラー:",
        error
      );

      $("fatalMessage").textContent =
        `${error?.code || "error"}\n${
          error?.message ||
          String(error)
        }`;

      showScreen(
        errorScreen
      );
    }


    /* =====================================================
       Timeout
       ===================================================== */

    function withTimeout(
      promise,
      ms,
      description
    ) {
      let timer;

      return Promise.race([
        promise,

        new Promise(
          (_, reject) => {
            timer =
              setTimeout(
                () => {
                  reject(
                    new Error(
                      `${description}がタイムアウトしました。`
                    )
                  );
                },
                ms
              );
          }
        )
      ]).finally(
        () =>
          clearTimeout(
            timer
          )
      );
    }


    /* =====================================================
       Firebaseエラー
       ===================================================== */

    function getErrorMessage(
      error
    ) {

      const messages = {

        "auth/invalid-credential":
          "メールアドレスまたはパスワードが正しくありません。",

        "auth/invalid-email":
          "メールアドレスの形式が正しくありません。",

        "auth/user-disabled":
          "このアカウントは無効になっています。",

        "auth/user-not-found":
          "このメールアドレスのアカウントが見つかりません。",

        "auth/wrong-password":
          "パスワードが正しくありません。",

        "auth/unauthorized-domain":
          "このサイトのドメインがFirebase Authenticationの承認済みドメインに登録されていません。",

        "auth/network-request-failed":
          "通信に失敗しました。インターネット接続を確認してください。",

        "auth/popup-blocked":
          "Googleログインのポップアップがブロックされました。",

        "auth/popup-closed-by-user":
          "Googleログインがキャンセルされました。",

        "auth/api-key-not-valid":
          "FirebaseのAPIキーが無効です。Firebase ConsoleのWebアプリ設定を確認してください。",

        "permission-denied":
          "Firebase Firestoreへのアクセスが拒否されました。Firestore Rulesを確認してください。"
      };

      return (
        messages[
          error?.code
        ] ||
        `${
          error?.message ||
          String(error)
        }${
          error?.code
            ? `\nエラーコード: ${error.code}`
            : ""
        }`
      );
    }


    /* =====================================================
       Busy
       ===================================================== */

    function setBusy(
      value
    ) {
      busy =
        value;

      $("loginButton")
        .disabled =
        value;

      $("googleButton")
        .disabled =
        value;

      $("loginButton")
        .textContent =
        value
          ? "ログイン中..."
          : "ログイン";
    }


    /* =====================================================
       ユーザープロフィール
       ===================================================== */

    async function getProfile(
      user
    ) {

      const snapshot =
        await withTimeout(
          getDoc(
            doc(
              db,
              "users",
              user.uid
            )
          ),
          15000,
          "ユーザー情報取得"
        );


      if (
        !snapshot.exists()
      ) {
        throw new Error(
          `ユーザープロフィールがありません。\nusers/${user.uid}`
        );
      }


      return snapshot.data();
    }


    /* =====================================================
       Firebaseからメンテナンス表示を取得
       ===================================================== */

    async function getMaintenanceSettings() {

      const snapshot =
        await withTimeout(
          getDoc(
            doc(
              db,
              "settings",
              "system"
            )
          ),
          15000,
          "システム設定取得"
        );


      if (
        !snapshot.exists()
      ) {
        throw new Error(
          "Firestoreに settings/system がありません。"
        );
      }


      return snapshot.data();
    }


    /* =====================================================
       ログイン後のルーティング
       ===================================================== */

    async function routeUser(
      user
    ) {

      if (
        !user ||
        redirecting
      ) {
        return;
      }


      /* -----------------------------------------------
         ① ユーザープロフィール
         ----------------------------------------------- */

      const profile =
        await getProfile(
          user
        );


      /* -----------------------------------------------
         ② status
         ----------------------------------------------- */

      if (
        profile.status !==
        "active"
      ) {

        await signOut(
          auth
        );

        showScreen(
          loginScreen
        );

        showError(
          "このアカウントは現在利用できません。管理者にお問い合わせください。"
        );

        return;
      }


      /* -----------------------------------------------
         ③ role
         ----------------------------------------------- */

      if (
        profile.role !==
          "student" &&
        profile.role !==
          "admin"
      ) {

        await signOut(
          auth
        );

        showScreen(
          loginScreen
        );

        showError(
          "アカウントの権限が正しく設定されていません。"
        );

        return;
      }


      /* -----------------------------------------------
         ④ ここで初めてFirebaseから
            settings/systemを取得
         ----------------------------------------------- */

      const settings =
        await getMaintenanceSettings();


      /* -----------------------------------------------
         ⑤ 管理者
         ----------------------------------------------- */

      if (
        profile.role ===
        "admin"
      ) {

        redirecting =
          true;

        location.replace(
          "./admin/index.html"
        );

        return;
      }


      /* -----------------------------------------------
         ⑥ 生徒 + メンテナンス
         ----------------------------------------------- */

      if (
        profile.role ===
          "student" &&
        settings.maintenance ===
          true
      ) {

        /*
          Firebaseから表示文言を取得
        */

        const title =
          String(
            settings.maintenanceTitle ||
            "システムメンテナンス中"
          );

        const message =
          String(
            settings.maintenanceMessage ||
            "現在、メンテナンスを実施しています。しばらくお待ちください。"
          );


        $("maintenanceTitle")
          .textContent =
          title;

        $("maintenanceMessage")
          .textContent =
          message;


        showScreen(
          maintenanceScreen
        );

        return;
      }


      /* -----------------------------------------------
         ⑦ 生徒 → 学習画面
         ----------------------------------------------- */

      if (
        profile.role ===
        "student"
      ) {

        redirecting =
          true;

        location.replace(
          "./student/index.html"
        );

        return;
      }
    }


    /* =====================================================
       メールログイン
       ===================================================== */

    $("loginForm")
      .addEventListener(
        "submit",
        async event => {

          event.preventDefault();

          if (
            busy ||
            !initialized
          ) {
            return;
          }


          clearError();

          setBusy(
            true
          );


          try {

            await signInWithEmailAndPassword(
              auth,

              $("email")
                .value
                .trim(),

              $("password")
                .value
            );

          } catch (
            error
          ) {

            console.error(
              "メールログインエラー:",
              error
            );

            showError(
              getErrorMessage(
                error
              )
            );

          } finally {

            setBusy(
              false
            );
          }
        }
      );


    /* =====================================================
       Googleログイン
       ===================================================== */

    $("googleButton")
      .addEventListener(
        "click",
        async () => {

          if (
            busy ||
            !initialized
          ) {
            return;
          }


          clearError();

          setBusy(
            true
          );


          const provider =
            new GoogleAuthProvider();


          try {

            await signInWithPopup(
              auth,
              provider
            );

          } catch (
            error
          ) {

            console.error(
              "Googleログインエラー:",
              error
            );


            if (
              error?.code ===
              "auth/popup-blocked"
            ) {

              try {

                await signInWithRedirect(
                  auth,
                  provider
                );

                return;

              } catch (
                redirectError
              ) {

                showError(
                  getErrorMessage(
                    redirectError
                  )
                );
              }

            } else {

              showError(
                getErrorMessage(
                  error
                )
              );
            }

          } finally {

            setBusy(
              false
            );
          }
        }
      );


    /* =====================================================
       管理者ログイン
       ===================================================== */

    $("maintenanceAdminLogin")
      .addEventListener(
        "click",
        () => {

          showScreen(
            loginScreen
          );

          clearError();

          showError(
            "管理者アカウントでログインしてください。"
          );
        }
      );


    /* =====================================================
       再読み込み
       ===================================================== */

    $("reloadButton")
      .addEventListener(
        "click",
        () => {
          location.reload();
        }
      );


    /* =====================================================
       初期化
       ===================================================== */

    async function initialize() {

      try {

        /* -----------------------------------------------
           Firebase Persistence
           ----------------------------------------------- */

        await withTimeout(
          persistenceReady,
          15000,
          "Firebase初期化"
        );


        /* -----------------------------------------------
           Redirect結果
           ----------------------------------------------- */

        try {

          await withTimeout(
            getRedirectResult(
              auth
            ),
            15000,
            "Googleログイン結果の確認"
          );

        } catch (
          error
        ) {

          console.error(
            "Googleログイン結果確認エラー:",
            error
          );
        }


        /* -----------------------------------------------
           Firebase Auth
           ----------------------------------------------- */

        onAuthStateChanged(
          auth,

          async user => {

            try {

              /*
                未ログイン
                ↓
                ログイン画面

                ここではFirestoreの
                settings/systemを読まない
              */

              if (!user) {

                initialized =
                  true;

                redirecting =
                  false;

                showScreen(
                  loginScreen
                );

                return;
              }


              /*
                ログイン済み
                ↓
                routeUser
              */

              initialized =
                true;

              await routeUser(
                user
              );

            } catch (
              error
            ) {

              console.error(
                "ログイン後ルーティングエラー:",
                error
              );

              showFatal(
                error
              );
            }
          },

          error => {
            showFatal(
              error
            );
          }
        );

      } catch (
        error
      ) {

        showFatal(
          error
        );
      }
    }


    initialize();

  </script>

</body>
</html>
