
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ログイン | 学習AIチャット</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f6fa;
      color: #172033;
      font-family: Arial, "Noto Sans JP", sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .55; cursor: not-allowed; }

    #loginApp {
      display: none;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 34px 30px;
      background: #fff;
      border: 1px solid #e1e6ef;
      border-radius: 14px;
      box-shadow: 0 12px 38px rgba(28, 43, 70, .07);
    }
    .brand {
      margin: 0;
      text-align: center;
      font-size: 25px;
      font-weight: 750;
      letter-spacing: -.5px;
    }
    .subtitle {
      margin: 10px 0 27px;
      text-align: center;
      color: #667085;
      font-size: 13px;
      line-height: 1.8;
    }
    .field-label {
      display: block;
      margin: 16px 0 7px;
      font-size: 13px;
      font-weight: 650;
    }
    .field {
      width: 100%;
      min-height: 45px;
      padding: 11px 12px;
      border: 1px solid #cfd6e2;
      border-radius: 7px;
      outline: none;
      background: #fff;
    }
    .field:focus {
      border-color: #245ac7;
      box-shadow: 0 0 0 3px rgba(36, 90, 199, .12);
    }
    .primary, .google-button {
      width: 100%;
      min-height: 46px;
      border-radius: 7px;
      font-weight: 650;
    }
    .primary {
      margin-top: 21px;
      border: 0;
      color: #fff;
      background: #245ac7;
    }
    .primary:hover { background: #1948a9; }
    .google-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
      background: #fff;
      color: #273246;
      border: 1px solid #cfd6e2;
    }
    .google-button:hover { background: #f8faff; }
    .google-logo { width: 19px; height: 19px; flex: none; }
    .separator {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 21px 0 5px;
      color: #8791a2;
      font-size: 12px;
    }
    .separator::before, .separator::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #e3e7ee;
    }
    .reset-link {
      display: block;
      margin-top: 15px;
      text-align: right;
      color: #245ac7;
      border: 0;
      background: none;
      padding: 3px 0;
      font-size: 13px;
    }
    #loginStatus {
      margin: 14px 0 0;
      color: #b42318;
      font-size: 13px;
      line-height: 1.8;
      white-space: pre-wrap;
    }
    .footer {
      margin-top: 28px;
      text-align: center;
      color: #7c8799;
      font-size: 10px;
      line-height: 1.7;
    }

    /* メンテナンス画面 */
    #maintenanceGate {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: #f4f6fa;
    }
    .maintenance-card {
      width: 100%;
      max-width: 500px;
      padding: 38px 28px;
      text-align: center;
      background: #fff;
      border: 1px solid #e1e6ef;
      border-radius: 14px;
      box-shadow: 0 12px 38px rgba(28, 43, 70, .07);
    }
    .maintenance-symbol {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #edf1f7;
      color: #344054;
      font-size: 25px;
      font-weight: 700;
    }
    #maintenanceTitle {
      margin: 0;
      font-size: 23px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
    #maintenanceMessage {
      margin: 17px 0 0;
      color: #667085;
      font-size: 14px;
      line-height: 2;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .maintenance-footer {
      margin-top: 27px;
      color: #98a2b3;
      font-size: 10px;
      line-height: 1.7;
    }
    @media (max-width: 420px) {
      .login-card, .maintenance-card { padding: 28px 20px; }
      .brand { font-size: 22px; }
      #maintenanceTitle { font-size: 21px; }
    }
  </style>
</head>
<body>

  <!-- 初期状態ではログイン画面を出さず、先にメンテナンスを確認 -->
  <section id="maintenanceGate" aria-live="polite">
    <div class="maintenance-card">
      <div class="maintenance-symbol" aria-hidden="true">!</div>
      <h1 id="maintenanceTitle">システム確認中</h1>
      <p id="maintenanceMessage">メンテナンス状況を確認しています。</p>
      <div class="maintenance-footer">
        © 2026 Regular Test Preparation Worksheet Administration Office. All Rights Reserved.
      </div>
    </div>
  </section>

  <!-- メンテナンスが解除されるまで、この画面は表示しない -->
  <main id="loginApp">
    <section class="login-card">
      <h1 class="brand">学習AIチャット</h1>
      <p class="subtitle">
        学習をサポートするAIチャットサービス<br>
        登録済みアカウントでログインしてください。
      </p>

      <button id="googleLogin" class="google-button" type="button" disabled>
        <svg class="google-logo" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" transform="translate(0 4)"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.75 7.18l7.73 6C44.42 37.96 46.98 31.85 46.98 24.55z"/>
          <path fill="#FBBC05" d="M10.53 28.59a14.4 14.4 0 0 1 0-9.18l-7.98-6.19a23.9 23.9 0 0 0 0 21.56l7.98-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.14 1.44-4.89 2.3-8.18 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Googleアカウントでログイン
      </button>

      <div class="separator">または</div>

      <form id="emailLoginForm">
        <label class="field-label" for="email">メールアドレス</label>
        <input
          class="field"
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          placeholder="example@example.com"
          required
          disabled
        >

        <label class="field-label" for="password">パスワード</label>
        <input
          class="field"
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="パスワードを入力"
          required
          disabled
        >

        <button class="primary" id="emailLogin" type="submit" disabled>
          ログイン
        </button>
      </form>

      <button class="reset-link" id="resetPassword" type="button" disabled>
        パスワードを忘れた場合
      </button>

      <p id="loginStatus" role="status" aria-live="polite"></p>

      <footer class="footer">
        Supported by 定期テスト対策プリント運営事務局<br>
        © 2026 Regular Test Preparation Worksheet Administration Office. All Rights Reserved.
      </footer>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      updateDoc,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyByt8kGALyS8AU8SR8P6zWFEPXfgHY5iynk",
      authDomain: "studychat-1b39d.firebaseapp.com",
      projectId: "studychat-1b39d",
      storageBucket: "studychat-1b39d.firebasestorage.app",
      messagingSenderId: "982302014286",
      appId: "1:982302014286:web:abf319aadb1ed919727c1f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    const gate = document.getElementById("maintenanceGate");
    const maintenanceTitle = document.getElementById("maintenanceTitle");
    const maintenanceMessage = document.getElementById("maintenanceMessage");
    const loginApp = document.getElementById("loginApp");
    const googleButton = document.getElementById("googleLogin");
    const emailForm = document.getElementById("emailLoginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const emailButton = document.getElementById("emailLogin");
    const resetButton = document.getElementById("resetPassword");
    const statusElement = document.getElementById("loginStatus");

    let maintenanceReady = false;
    let maintenanceEnabled = true;
    let authUser = null;
    let processing = false;
    let redirecting = false;

    function showMaintenance(title, message) {
      maintenanceEnabled = true;
      loginApp.style.display = "none";
      gate.style.display = "flex";

      maintenanceTitle.textContent =
        title || "メンテナンス中です";

      maintenanceMessage.textContent =
        message ||
        "ただいまメンテナンスを実施しています。\n終了までしばらくお待ちください。";

      setLoginEnabled(false);
    }

    function showLogin() {
      maintenanceEnabled = false;
      gate.style.display = "none";
      loginApp.style.display = "flex";
      setLoginEnabled(true);
    }

    function setLoginEnabled(enabled) {
      const canUse = enabled && !processing;
      googleButton.disabled = !canUse;
      emailInput.disabled = !canUse;
      passwordInput.disabled = !canUse;
      emailButton.disabled = !canUse;
      resetButton.disabled = !canUse;
    }

    function setStatus(message, isError = true) {
      statusElement.textContent = message;
      statusElement.style.color = isError ? "#b42318" : "#067647";
    }

    function normalizeError(error) {
      const messages = {
        "auth/invalid-credential":
          "メールアドレスまたはパスワードが正しくありません。",
        "auth/user-disabled":
          "このアカウントは無効化されています。",
        "auth/too-many-requests":
          "試行回数が多すぎます。時間をおいて再度お試しください。",
        "auth/popup-closed-by-user":
          "Googleログインがキャンセルされました。",
        "auth/popup-blocked":
          "ポップアップがブロックされました。ブラウザの設定を確認してください。",
        "auth/network-request-failed":
          "ネットワークに接続できません。通信環境を確認してください。",
        "auth/unauthorized-domain":
          "このサイトのドメインがFirebase Authenticationで許可されていません。",
        "auth/operation-not-allowed":
          "このログイン方法がFirebase Authenticationで有効になっていません。"
      };

      return messages[error.code] ||
        "処理に失敗しました。設定と通信環境を確認してください。";
    }

    function showMaintenanceError() {
      maintenanceReady = true;
      showMaintenance(
        "システムを利用できません",
        "メンテナンス状況を確認できませんでした。\nログインを停止しています。\n時間をおいて再度アクセスしてください。"
      );
    }

    // 管理者が設定したメンテナンス情報を監視する
    onSnapshot(
      doc(db, "settings", "system"),
      async (snapshot) => {
        maintenanceReady = true;

        if (!snapshot.exists()) {
          showLogin();
          if (authUser) await routeAuthenticatedUser(authUser);
          return;
        }

        const settings = snapshot.data();

        if (settings.maintenance === true) {
          showMaintenance(
            settings.maintenanceTitle || settings.title ||
              "メンテナンス中です",
            settings.maintenanceMessage || settings.message ||
              "ただいまメンテナンスを実施しています。"
          );
          return;
        }

        showLogin();
        if (authUser) await routeAuthenticatedUser(authUser);
      },
      (error) => {
        console.error("Maintenance status check failed:", error);
        showMaintenanceError();
      }
    );

    async function routeAuthenticatedUser(user) {
      if (!user || !maintenanceReady || maintenanceEnabled || redirecting) {
        return;
      }

      redirecting = true;
      processing = true;
      setLoginEnabled(false);

      try {
        const userRef = doc(db, "users", user.uid);
        let userSnapshot = await getDoc(userRef);

        // 新規Googleログインなどの場合、一般ユーザーとして登録する
        if (!userSnapshot.exists()) {
          await setDoc(userRef, {
            uid: user.uid,
            email: user.email || "",
            displayName: user.displayName || "",
            role: "student",
            status: "active",
            grade: "",
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp(),
            lastLoginAt: serverTimestamp()
          });

          userSnapshot = await getDoc(userRef);
        } else {
          await updateDoc(userRef, {
            lastLoginAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          });
          userSnapshot = await getDoc(userRef);
        }

        if (!userSnapshot.exists()) {
          throw new Error("ユーザー情報を取得できませんでした。");
        }

        const profile = userSnapshot.data();

        if (profile.status !== "active") {
          await signOut(auth);
          setStatus("このアカウントは現在利用できません。管理者にお問い合わせください。");
          return;
        }

        if (profile.role === "admin") {
          location.replace("./admin/index.html");
        } else if (profile.role === "student") {
          location.replace("./student/index.html");
        } else {
          await signOut(auth);
          setStatus("アカウントの権限を確認できません。管理者にお問い合わせください。");
        }
      } catch (error) {
        console.error("User profile check failed:", error);
        setStatus(
          "アカウント情報を確認できませんでした。Firestoreルールとユーザー登録状態を確認してください。"
        );
        redirecting = false;
      } finally {
        processing = false;
        if (!maintenanceEnabled) setLoginEnabled(true);
      }
    }

    onAuthStateChanged(auth, async (user) => {
      authUser = user;
      if (user && maintenanceReady && !maintenanceEnabled) {
        await routeAuthenticatedUser(user);
      }
    });

    async function runLogin(action) {
      if (!maintenanceReady || maintenanceEnabled || processing) {
        return;
      }

      processing = true;
      setLoginEnabled(true);
      setLoginEnabled(false);
      setStatus("", false);

      try {
        await action();
        // ログイン後の振り分けは onAuthStateChanged が行う
      } catch (error) {
        console.error("Login failed:", error);
        setStatus(normalizeError(error));
      } finally {
        processing = false;
        if (!maintenanceEnabled) setLoginEnabled(true);
      }
    }

    googleButton.addEventListener("click", () => {
      runLogin(() => signInWithPopup(auth, googleProvider));
    });

    emailForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        setStatus("メールアドレスとパスワードを入力してください。");
        return;
      }

      runLogin(() =>
        signInWithEmailAndPassword(auth, email, password)
      );
    });

    resetButton.addEventListener("click", async () => {
      if (!maintenanceReady || maintenanceEnabled || processing) return;

      const email = emailInput.value.trim();

      if (!email) {
        setStatus("先にメールアドレスを入力してください。");
        emailInput.focus();
        return;
      }

      processing = true;
      setLoginEnabled(false);

      try {
        await sendPasswordResetEmail(auth, email);
        setStatus(
          "パスワード再設定用のメールを送信しました。受信箱をご確認ください。",
          false
        );
      } catch (error) {
        console.error("Password reset failed:", error);
        setStatus(normalizeError(error));
      } finally {
        processing = false;
        if (!maintenanceEnabled) setLoginEnabled(true);
      }
    });
  </script>
</body>
</html>
