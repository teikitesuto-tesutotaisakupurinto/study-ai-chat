<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="description" content="学習AIチャットのログイン">
  <title>ログイン | 学習AIチャット</title>

  <style>
    :root {
      font-family:
        system-ui,
        -apple-system,
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;

      color: #172033;
      background: #f4f7fb;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(
          180deg,
          #f4f7fb 0%,
          #eef3f9 100%
        );
    }

    button,
    input {
      font: inherit;
    }

    .screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 32px;
      background: #ffffff;
      border: 1px solid #e1e7f0;
      border-radius: 18px;
      box-shadow:
        0 16px 45px rgb(15 23 42 / 8%);
    }

    .brand {
      text-align: center;
      margin-bottom: 26px;
    }

    .brand h1 {
      margin: 0;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -.04em;
    }

    .brand p {
      margin: 10px 0 0;
      color: #64748b;
      font-size: 14px;
      line-height: 1.8;
    }

    .field {
      margin-top: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 50px;
      padding: 11px 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #ffffff;
      color: #172033;
      transition:
        border-color .15s,
        box-shadow .15s;
    }

    input::placeholder {
      color: #94a3b8;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow:
        0 0 0 4px rgb(37 99 235 / 12%);
    }

    button {
      width: 100%;
      min-height: 50px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      transition:
        background .15s,
        opacity .15s,
        transform .05s;
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      cursor: wait;
      opacity: .6;
      transform: none;
    }

    .primary {
      margin-top: 22px;
      border: 0;
      background: #2563eb;
      color: #ffffff;
    }

    .primary:hover:not(:disabled) {
      background: #1d4ed8;
    }

    .secondary {
      margin-top: 14px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #172033;
    }

    .secondary:hover:not(:disabled) {
      background: #f8fafc;
    }

    .link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .link:hover {
      text-decoration: underline;
    }

    .message {
      margin-top: 18px;
      padding: 13px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.error {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      color: #9f1239;
    }

    .message.info {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
    }

    .loading {
      text-align: center;
      color: #64748b;
      line-height: 1.8;
    }

    .spinner {
      width: 30px;
      height: 30px;
      margin: 0 auto 14px;
      border: 3px solid #dbeafe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .maintenance h1 {
      margin: 0 0 16px;
      font-size: 25px;
      text-align: center;
    }

    .maintenance p {
      margin: 0;
      color: #475569;
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      text-align: center;
    }

    .error-title {
      margin: 0;
      color: #991b1b;
      font-size: 22px;
      text-align: center;
    }

    .error-description {
      color: #475569;
      line-height: 1.8;
      text-align: center;
    }

    .error-detail {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      background: #f8fafc;
      color: #475569;
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    footer {
      margin-top: 26px;
      color: #94a3b8;
      text-align: center;
      font-size: 11px;
      line-height: 1.7;
    }

    @media (max-width: 480px) {
      .card {
        padding: 25px 20px;
      }

      .brand h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       読み込み中
       ===================================================== -->

  <main id="loadingScreen" class="screen">
    <section class="card loading">

      <div
        class="spinner"
        aria-hidden="true"
      ></div>

      <div id="loadingText">
        システムを確認しています。
      </div>

    </section>
  </main>


  <!-- =====================================================
       ログイン
       ===================================================== -->

  <main
    id="loginScreen"
    class="screen"
    hidden
  >
    <section class="card">

      <header class="brand">

        <h1>
          学習AIチャット
        </h1>

        <p>
          ログインして、学習を始めましょう。<br>
          アカウント情報を入力してください。
        </p>

      </header>


      <form id="loginForm">

        <div class="field">

          <label for="email">
            メールアドレス
          </label>

          <input
            id="email"
            type="email"
            autocomplete="username"
            inputmode="email"
            required
            placeholder="メールアドレス"
          >

        </div>


        <div class="field">

          <label for="password">
            パスワード
          </label>

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="パスワード"
          >

        </div>


        <button
          id="loginButton"
          class="primary"
          type="submit"
        >
          ログイン
        </button>

      </form>


      <button
        id="googleButton"
        class="secondary"
        type="button"
      >
        Google でログイン
      </button>


      <a
        class="link"
        href="./reset.html"
      >
        パスワードを忘れた場合
      </a>


      <div
        id="messageBox"
        class="message"
        role="status"
        hidden
      ></div>


      <footer>
        © 2026 定期テスト対策プリント運営事務局.
        All Rights Reserved.
      </footer>

    </section>
  </main>


  <!-- =====================================================
       メンテナンス
       ※ログイン成功後のみ表示
       ===================================================== -->

  <main
    id="maintenanceScreen"
    class="screen"
    hidden
  >
    <section class="card maintenance">

      <h1 id="maintenanceTitle">
        システムメンテナンス中
      </h1>

      <p id="maintenanceMessage">
        現在、システムメンテナンスを実施しています。
        しばらくお待ちください。
      </p>


      <button
        id="maintenanceLogoutButton"
        class="primary"
        type="button"
      >
        別のアカウントでログイン
      </button>


      <footer>
        © 2026 定期テスト対策プリント運営事務局.
        All Rights Reserved.
      </footer>

    </section>
  </main>


  <!-- =====================================================
       エラー
       ===================================================== -->

  <main
    id="errorScreen"
    class="screen"
    hidden
  >
    <section class="card">

      <h1 class="error-title">
        システムを確認できません
      </h1>

      <p
        id="fatalMessage"
        class="error-description"
      >
        設定または通信を確認してください。
      </p>

      <div
        id="fatalDetail"
        class="error-detail"
        hidden
      ></div>


      <button
        id="retryButton"
        class="primary"
        type="button"
      >
        再読み込み
      </button>


      <footer>
        © 2026 定期テスト対策プリント運営事務局.
        All Rights Reserved.
      </footer>

    </section>
  </main>


  <!-- =====================================================
       Firebase
       ===================================================== -->

  <script type="module">

    import {
      auth,
      db,
      persistenceReady,
      onAuthStateChanged,
      signOut,
      signInWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithRedirect,
      getRedirectResult,
      doc,
      getDoc
    } from "./assets/js/firebase.js";


    /* =====================================================
       DOM
       ===================================================== */

    const $ = (id) =>
      document.getElementById(id);


    const screens = [
      "loadingScreen",
      "loginScreen",
      "maintenanceScreen",
      "errorScreen"
    ];


    let busy = false;
    let routing = false;
    let authListenerStarted = false;


    /* =====================================================
       画面切り替え
       ===================================================== */

    function showScreen(id) {

      for (const screenId of screens) {

        const element =
          $(screenId);

        if (!element) {
          continue;
        }

        element.hidden =
          screenId !== id;
      }

    }


    /* =====================================================
       メッセージ
       ===================================================== */

    function showMessage(
      text,
      type = "error"
    ) {

      const box =
        $("messageBox");

      box.textContent =
        text;

      box.className =
        `message ${type}`;

      box.hidden = false;

    }


    function clearMessage() {

      const box =
        $("messageBox");

      box.textContent = "";

      box.hidden = true;

    }


    /* =====================================================
       エラー表示
       ===================================================== */

    function showFatal(error) {

      console.error(
        "ログイン画面エラー:",
        error
      );


      $("fatalMessage").textContent =
        "Firebaseの初期化、通信、またはアクセス権限に問題があります。";


      $("fatalDetail").textContent =
        errorText(error);


      $("fatalDetail").hidden =
        false;


      showScreen(
        "errorScreen"
      );

    }


    /* =====================================================
       Firebaseエラー
       ===================================================== */

    function errorText(error) {

      const code =
        error?.code || "";


      const messages = {

        "auth/invalid-credential":
          "メールアドレスまたはパスワードが正しくありません。",

        "auth/wrong-password":
          "メールアドレスまたはパスワードが正しくありません。",

        "auth/user-not-found":
          "このメールアドレスのアカウントが見つかりません。",

        "auth/invalid-email":
          "メールアドレスの形式を確認してください。",

        "auth/user-disabled":
          "このアカウントは無効になっています。",

        "auth/too-many-requests":
          "試行回数が多すぎます。しばらく待ってから再度お試しください。",

        "auth/network-request-failed":
          "通信に失敗しました。インターネット接続を確認してください。",

        "auth/popup-blocked":
          "ログインのポップアップがブロックされました。",

        "auth/popup-closed-by-user":
          "Googleログインがキャンセルされました。",

        "auth/unauthorized-domain":
          "このサイトのドメインがFirebase Authenticationの承認済みドメインに登録されていません。",

        "auth/api-key-not-valid":
          "FirebaseのAPIキーが無効です。assets/js/firebase.js のFirebase設定を確認してください。",

        "permission-denied":
          "Firestoreへのアクセスが拒否されました。Firestore Rulesを確認してください。",

        "failed-precondition":
          "Firestoreのインデックスまたはデータベース設定に問題があります。",

        "auth/internal-error":
          "Firebase Authenticationで内部エラーが発生しました。"

      };


      return (
        messages[code] ||
        error?.message ||
        String(error)
      );

    }


    /* =====================================================
       ボタン状態
       ===================================================== */

    function setBusy(
      value,
      text = "ログイン"
    ) {

      busy = value;


      $("loginButton").disabled =
        value;


      $("googleButton").disabled =
        value;


      $("loginButton").textContent =
        value
          ? text
          : "ログイン";


      $("googleButton").textContent =
        value
          ? "処理中..."
          : "Google でログイン";

    }


    /* =====================================================
       users/{uid}
       ===================================================== */

    async function readProfile(user) {

      if (!user?.uid) {

        throw new Error(
          "Firebaseユーザー情報を取得できません。"
        );

      }


      const snapshot =
        await getDoc(
          doc(
            db,
            "users",
            user.uid
          )
        );


      if (!snapshot.exists()) {

        throw new Error(
          `ユーザープロフィールが見つかりません。\n\nusers/${user.uid}\n\nFirestoreのusersコレクションに、このユーザーのプロフィールを作成してください。`
        );

      }


      return snapshot.data();

    }


    /* =====================================================
       settings/system
       ===================================================== */

    async function readSystemSettings() {

      const snapshot =
        await getDoc(
          doc(
            db,
            "settings",
            "system"
          )
        );


      if (!snapshot.exists()) {

        throw new Error(
          "Firestoreの settings/system が見つかりません。"
        );

      }


      return snapshot.data();

    }


    /* =====================================================
       ログイン後処理
       ===================================================== */

    async function routeUser(user) {

      if (!user) {
        return;
      }


      if (routing) {
        return;
      }


      routing = true;


      try {

        showScreen(
          "loadingScreen"
        );


        $("loadingText").textContent =
          "アカウントを確認しています。";


        /*
         * Firebase Authの永続化が
         * 完了していることを確認
         */

        await persistenceReady;


        /*
         * users/{uid}
         */

        const profile =
          await readProfile(
            user
          );


        console.log(
          "Firebase profile:",
          profile
        );


        /*
         * アカウント状態
         */

        if (
          profile.status !==
          "active"
        ) {

          await signOut(auth);

          showScreen(
            "loginScreen"
          );

          showMessage(
            "このアカウントは現在利用できません。管理者にお問い合わせください。"
          );

          return;

        }


        /*
         * 権限
         */

        const role =
          profile.role;


        if (
          role !== "student" &&
          role !== "admin"
        ) {

          await signOut(auth);

          showScreen(
            "loginScreen"
          );

          showMessage(
            "アカウントの権限が正しく設定されていません。管理者にお問い合わせください。"
          );

          return;

        }


        /*
         * ここで初めて
         * システム設定を取得
         *
         * ログイン前には取得しない
         */

        $("loadingText").textContent =
          "システム設定を取得しています。";


        const settings =
          await readSystemSettings();


        console.log(
          "Firebase system settings:",
          settings
        );


        /*
         * 管理者
         */

        if (
          role === "admin"
        ) {

          location.replace(
            "./admin/index.html"
          );

          return;

        }


        /*
         * 生徒のメンテナンス判定
         *
         * ここまで来た時点で
         * Firebaseログイン済み
         */

        if (
          settings.maintenance === true
        ) {

          const title =
            typeof settings.maintenanceTitle ===
            "string" &&
            settings.maintenanceTitle.trim()
              ? settings.maintenanceTitle
              : "システムメンテナンス中";


          const message =
            typeof settings.maintenanceMessage ===
            "string" &&
            settings.maintenanceMessage.trim()
              ? settings.maintenanceMessage
              : "現在、システムメンテナンスを実施しています。しばらくお待ちください。";


          $("maintenanceTitle").textContent =
            title;


          $("maintenanceMessage").textContent =
            message;


          showScreen(
            "maintenanceScreen"
          );


          return;

        }


        /*
         * 正常ログイン
         */

        location.replace(
          "./student/index.html"
        );

      } catch (error) {

        console.error(
          "ログイン後の初期化エラー:",
          error
        );


        showScreen(
          "errorScreen"
        );


        $("fatalMessage").textContent =
          "ログイン後のアカウント情報またはシステム設定を取得できませんでした。";


        $("fatalDetail").textContent =
          errorText(error);


        $("fatalDetail").hidden =
          false;

      } finally {

        routing = false;

      }

    }


    /* =====================================================
       メールログイン
       ===================================================== */

    $("loginForm")
      .addEventListener(
        "submit",
        async (event) => {

          event.preventDefault();


          if (busy) {
            return;
          }


          clearMessage();


          const email =
            $("email")
              .value
              .trim();


          const password =
            $("password")
              .value;


          if (
            !email ||
            !password
          ) {

            showMessage(
              "メールアドレスとパスワードを入力してください。"
            );

            return;

          }


          setBusy(
            true,
            "ログイン中..."
          );


          try {

            await persistenceReady;


            /*
             * ここでは
             * メンテナンス判定をしない。
             *
             * Firebase Authenticationへ
             * ログインするだけ。
             */

            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


            /*
             * onAuthStateChanged が
             * routeUser() を呼び出す。
             */

          } catch (error) {

            console.error(
              "メールログインエラー:",
              error
            );


            showScreen(
              "loginScreen"
            );


            showMessage(
              errorText(error)
            );

          } finally {

            setBusy(
              false
            );

          }

        }
      );


    /* =====================================================
       Googleログイン
       ===================================================== */

    $("googleButton")
      .addEventListener(
        "click",
        async () => {

          if (busy) {
            return;
          }


          clearMessage();


          setBusy(
            true,
            "Googleログイン中..."
          );


          try {

            await persistenceReady;


            const provider =
              new GoogleAuthProvider();


            provider.setCustomParameters({
              prompt:
                "select_account"
            });


            await signInWithPopup(
              auth,
              provider
            );


          } catch (error) {

            console.error(
              "Googleログインエラー:",
              error
            );


            /*
             * ポップアップが使えない
             * 環境ではリダイレクトへ
             */

            if (
              error?.code ===
                "auth/popup-blocked" ||
              error?.code ===
                "auth/operation-not-supported-in-this-environment"
            ) {

              try {

                const provider =
                  new GoogleAuthProvider();


                await signInWithRedirect(
                  auth,
                  provider
                );


                return;

              } catch (
                redirectError
              ) {

                console.error(
                  "Googleリダイレクトエラー:",
                  redirectError
                );


                showScreen(
                  "loginScreen"
                );


                showMessage(
                  errorText(
                    redirectError
                  )
                );

              }

            } else {

              showScreen(
                "loginScreen"
              );


              showMessage(
                errorText(error)
              );

            }

          } finally {

            setBusy(
              false
            );

          }

        }
      );


    /* =====================================================
       メンテナンス中のログアウト
       ===================================================== */

    $("maintenanceLogoutButton")
      .addEventListener(
        "click",
        async () => {

          if (busy) {
            return;
          }


          try {

            await signOut(
              auth
            );


            clearMessage();


            showScreen(
              "loginScreen"
            );

          } catch (error) {

            showMessage(
              `ログアウトできませんでした。\n${errorText(error)}`
            );

          }

        }
      );


    /* =====================================================
       再読み込み
       ===================================================== */

    $("retryButton")
      .addEventListener(
        "click",
        () => {

          location.reload();

        }
      );


    /* =====================================================
       起動
       ===================================================== */

    async function start() {

      try {

        /*
         * Firebase初期化・
         * Auth永続化を待つ
         */

        await persistenceReady;


        /*
         * Google redirectから
         * 戻ってきた場合
         */

        try {

          await getRedirectResult(
            auth
          );

        } catch (error) {

          console.error(
            "Googleリダイレクト結果取得エラー:",
            error
          );


          showScreen(
            "loginScreen"
          );


          showMessage(
            errorText(error)
          );

        }


        /*
         * 認証状態監視
         */

        if (
          authListenerStarted
        ) {

          return;

        }


        authListenerStarted =
          true;


        onAuthStateChanged(
          auth,
          async (user) => {

            console.log(
              "Firebase Auth state:",
              user
                ? `ログイン済み: ${user.uid}`
                : "未ログイン"
            );


            if (!user) {

              /*
               * 未ログインなら
               * ログイン画面
               */

              if (!routing) {

                clearMessage();

                showScreen(
                  "loginScreen"
                );

              }

              return;

            }


            /*
             * ログイン済みなら
             * 必ずここを通る
             */

            await routeUser(
              user
            );

          }
        );


      } catch (error) {

        showFatal(
          error
        );

      }

    }


    start();

  </script>

</body>
</html>
