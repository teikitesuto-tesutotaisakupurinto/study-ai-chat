<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fb">
  <title>システムメンテナンス｜学習AIチャット</title>
  <link rel="stylesheet" href="./assets/css/common.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #f6f8fb; }
    .maintenance-card { width: min(100%, 560px); padding: 32px; border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; box-shadow: 0 4px 18px rgb(15 23 42 / 5%); }
    .maintenance-title { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; color: #1f2937; font-size: 24px; }
    .maintenance-title svg { flex: 0 0 auto; color: #475569; }
    .maintenance-card p { color: #475569; line-height: 1.8; }
    .maintenance-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    @media (max-width: 480px) { .maintenance-card { padding: 22px; } .maintenance-title { font-size: 21px; } }
  </style>
</head>
<body>
  <main class="maintenance-card" aria-labelledby="maintenance-title">
    <h1 id="maintenance-title" class="maintenance-title">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a5 5 0 0 0-6.4 6.4L3 18l3 3 5.3-5.3a5 5 0 0 0 6.4-6.4L14 13l-3-3 3.7-3.7Z"/></svg>
      システムメンテナンス中
    </h1>
    <p>現在、システムのメンテナンスを行っています。</p>
    <p>ご不便をおかけしますが、時間をおいてからもう一度アクセスしてください。</p>
    <div class="maintenance-actions">
      <button class="secondary-button" type="button" onclick="location.reload()">再読み込み</button>
      <a class="secondary-button" href="./login.html">ログイン画面へ</a>
    </div>
  </main>
</body>
</html>
