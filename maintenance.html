<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>メンテナンス中｜学習AIチャット</title>
  <link rel="stylesheet" href="./assets/css/common.css">

  <style>
    body {
      background: #f5f7fb;
    }

    .maintenance-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .maintenance-card {
      width: min(100%, 680px);
      padding: 36px;
      background: #fff;
      border: 1px solid #e2e6ee;
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .06);
      text-align: center;
    }

    .maintenance-card h1 {
      margin: 0 0 18px;
      font-size: clamp(24px, 4vw, 34px);
      color: #202124;
    }

    .maintenance-card p {
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #4b5563;
    }

    .maintenance-status {
      font-size: 13px;
      color: #6b7280;
      margin-top: 22px;
    }

    .maintenance-card button {
      margin-top: 18px;
      padding: 11px 20px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      background: #fff;
      color: #1f2937;
      cursor: pointer;
    }

    footer {
      margin-top: 28px;
      font-size: 11px;
      color: #777;
      line-height: 1.7;
    }
  </style>
</head>

<body>
  <main class="maintenance-wrap">
    <section class="maintenance-card" aria-live="polite">
      <h1 id="maintenanceTitle">システムメンテナンス中</h1>

      <p id="maintenanceMessage">
        メンテナンス設定を確認しています。
      </p>

      <p id="maintenanceStatus" class="maintenance-status">
        接続中...
      </p>

      <button id="reloadButton" type="button">
        再読み込み
      </button>

      <p>
        <a href="./login.html">ログイン画面へ</a>
      </p>

      <footer>
        © 2026 Regular Test Preparation Worksheet Administration Office. All Rights Reserved.
      </footer>
    </section>
  </main>

  <script type="module">
    import {
      db,
      doc,
      getDoc,
      onSnapshot
    } from "./assets/js/firebase-module.js";

    const title = document.getElementById("maintenanceTitle");
    const message = document.getElementById("maintenanceMessage");
    const status = document.getElementById("maintenanceStatus");

    const ref = doc(db, "settings", "system");

    let unsubscribe = null;

    function render(settings) {
      title.textContent =
        settings.maintenanceTitle ||
        "システムメンテナンス中";

      message.textContent =
        settings.maintenanceMessage ||
        settings.message ||
        "現在、メンテナンスを実施しています。しばらくお待ちください。";

      status.textContent = "メンテナンス設定を確認しました。";
    }

    async function initialize() {
      try {
        const snapshot = await getDoc(ref);

        if (!snapshot.exists()) {
          throw new Error(
            "Firestore の settings/system が見つかりません。"
          );
        }

        const settings = snapshot.data() || {};

        if (settings.maintenance !== true) {
          location.replace("./login.html");
          return;
        }

        render(settings);

        unsubscribe = onSnapshot(
          ref,
          liveSnapshot => {
            if (!liveSnapshot.exists()) {
              status.textContent =
                "設定が見つかりません。管理者にお問い合わせください。";
              return;
            }

            const liveSettings = liveSnapshot.data() || {};

            if (liveSettings.maintenance !== true) {
              location.replace("./login.html");
              return;
            }

            render(liveSettings);
          },
          error => {
            console.error(
              "メンテナンス設定の監視に失敗:",
              error
            );

            status.textContent =
              "設定の更新を確認できません。通信状態を確認してください。";
          }
        );
      } catch (error) {
        console.error(
          "メンテナンス画面の初期化エラー:",
          error
        );

        message.textContent =
          "メンテナンス設定を読み込めませんでした。通信状態とFirestoreの settings/system の読み取り権限を確認してください。";

        status.textContent =
          error.message || String(error);
      }
    }

    document
      .getElementById("reloadButton")
      .addEventListener("click", () => location.reload());

    window.addEventListener("pagehide", () => {
      unsubscribe?.();
    });

    void initialize();
  </script>
</body>
</html>
