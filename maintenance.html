<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>システムメンテナンス中 | 学習AIチャット</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: #101827;
      color: #f8fafc;
      font-family: Arial, "Noto Sans JP", sans-serif;
    }

    [hidden] { display: none !important; }

    .maintenance-screen {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      text-align: center;
      background:
        radial-gradient(ellipse at 50% 35%, #24334b 0%, #101827 65%);
    }

    .maintenance-content {
      width: 100%;
      max-width: 680px;
      margin: auto;
    }

    .repair-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 124px;
      height: 124px;
      margin: 0 auto 32px;
      color: #93c5fd;
      background: rgba(147, 197, 253, 0.10);
      border: 1px solid rgba(147, 197, 253, 0.25);
      border-radius: 30px;
    }

    .repair-icon svg {
      width: 76px;
      height: 76px;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .eyebrow {
      margin: 0 0 16px;
      color: #93c5fd;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .2em;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.45;
      letter-spacing: .02em;
    }

    .description {
      max-width: 540px;
      margin: 24px auto 0;
      color: #cbd5e1;
      font-size: 15px;
      line-height: 2;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .status-line {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 36px;
      padding: 12px 18px;
      border: 1px solid rgba(148, 163, 184, .25);
      border-radius: 999px;
      background: rgba(15, 23, 42, .5);
      color: #e2e8f0;
      font-size: 13px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #60a5fa;
      box-shadow: 0 0 12px rgba(96, 165, 250, .6);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .35; }
    }

    .footer {
      width: 100%;
      margin-top: 48px;
      padding-top: 20px;
      border-top: 1px solid rgba(148, 163, 184, .15);
      color: #94a3b8;
      font-size: 11px;
      line-height: 1.8;
    }

    .loading {
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.8;
    }

    .error {
      max-width: 560px;
      margin: 20px auto 0;
      color: #fecaca;
      font-size: 13px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    @media (max-width: 480px) {
      .maintenance-screen { padding: 24px 18px; }
      .repair-icon {
        width: 100px;
        height: 100px;
        margin-bottom: 26px;
        border-radius: 24px;
      }
      .repair-icon svg { width: 62px; height: 62px; }
      .description { font-size: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .status-dot { animation: none; }
    }
  </style>
</head>

<body>
  <main id="maintenanceScreen" class="maintenance-screen">
    <section class="maintenance-content">
      <div class="repair-icon" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <path d="M38 12a17 17 0 0 0-22 22L8 42a6 6 0 0 0 8 8l8-8a17 17 0 0 0 22-22L35 31l-8-8z"/>
          <path d="M39 41l10 10"/>
          <path d="M44 36l12 12a5 5 0 0 1-7 7L37 43"/>
        </svg>
      </div>

      <p class="eyebrow">SYSTEM MAINTENANCE</p>

      <h1 id="maintenanceTitle">システムメンテナンス中</h1>

      <p id="maintenanceMessage" class="description">
現在、システムのメンテナンスを行っています。
しばらくお待ちください。
      </p>

      <div class="status-line">
        <span class="status-dot"></span>
        <span>システムを復旧しています</span>
      </div>

      <p id="errorMessage" class="error" hidden></p>
      <p id="loadingMessage" class="loading">システムの状態を確認しています。</p>
    </section>

    <footer class="footer">
      © 2026 Regular Test Preparation Worksheet Administration Office. All Rights Reserved.
    </footer>
  </main>

  <script type="module">
    import {
      auth,
      db,
      persistenceReady,
      onAuthStateChanged,
      signOut,
      doc,
      getDoc,
      onSnapshot
    } from "./assets/js/firebase-module.js";

    const title = document.getElementById("maintenanceTitle");
    const message = document.getElementById("maintenanceMessage");
    const loading = document.getElementById("loadingMessage");
    const errorBox = document.getElementById("errorMessage");

    const settingsRef = doc(db, "settings", "system");

    let settingsListener = null;
    let currentUser = null;
    let checking = false;
    let redirecting = false;

    function showError(text) {
      errorBox.textContent = text;
      errorBox.hidden = false;
    }

    function hideError() {
      errorBox.textContent = "";
      errorBox.hidden = true;
    }

    function showMaintenance(settings) {
      title.textContent =
        settings.maintenanceTitle || "システムメンテナンス中";

      message.textContent =
        settings.maintenanceMessage ||
        "現在、システムのメンテナンスを行っています。\nしばらくお待ちください。";

      loading.hidden = true;
    }

    function getUserOnce() {
      return new Promise((resolve, reject) => {
        const unsubscribe = onAuthStateChanged(
          auth,
          user => {
            unsubscribe();
            resolve(user);
          },
          error => {
            unsubscribe();
            reject(error);
          }
        );
      });
    }

    async function routeUserAway(path) {
      if (redirecting) return;
      redirecting = true;

      if (settingsListener) {
        settingsListener();
        settingsListener = null;
      }

      location.replace(path);
    }

    async function initialize() {
      try {
        await persistenceReady;

        currentUser = await getUserOnce();

        // ログインしていない場合は、通常のログイン画面へ。
        if (!currentUser) {
          location.replace("./login.html");
          return;
        }

        const profileSnapshot = await getDoc(
          doc(db, "users", currentUser.uid)
        );

        if (!profileSnapshot.exists()) {
          await signOut(auth);
          location.replace("./login.html");
          return;
        }

        const profile = profileSnapshot.data();

        if (profile.status !== "active") {
          await signOut(auth);
          location.replace("./login.html");
          return;
        }

        // 管理者はメンテナンス画面ではなく管理画面へ。
        if (profile.role === "admin") {
          location.replace("./admin/index.html");
          return;
        }

        if (profile.role !== "student") {
          await signOut(auth);
          location.replace("./login.html");
          return;
        }

        const settingsSnapshot = await getDoc(settingsRef);

        if (!settingsSnapshot.exists()) {
          throw new Error("settings/system が見つかりません。");
        }

        const settings = settingsSnapshot.data();

        // メンテナンスが終了していたら通常の学習画面へ。
        if (settings.maintenance !== true) {
          location.replace("./student/index.html");
          return;
        }

        showMaintenance(settings);

        // 管理者が設定を変更したら、画面を自動更新する。
        settingsListener = onSnapshot(
          settingsRef,
          snapshot => {
            if (!snapshot.exists()) {
              showError("システム設定を確認できません。");
              return;
            }

            const liveSettings = snapshot.data();

            if (liveSettings.maintenance !== true) {
              location.replace("./student/index.html");
              return;
            }

            showMaintenance(liveSettings);
          },
          error => {
            console.error("メンテナンス状態の監視エラー:", error);
            showError(
              "最新のメンテナンス状態を取得できません。通信状態を確認してください。"
            );
          }
        );
      } catch (error) {
        console.error("メンテナンス画面の初期化エラー:", error);
        loading.hidden = true;
        showError(
          "システムの状態を確認できませんでした。Firebaseの設定とFirestoreのアクセスルールを確認してください。"
        );
      }
    }

    window.addEventListener("pagehide", () => {
      if (settingsListener) settingsListener();
    });

    void initialize();
  </script>
</body>
</html>
