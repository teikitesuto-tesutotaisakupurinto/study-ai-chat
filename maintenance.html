<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>メンテナンス中 | 学習AIチャット</title>
  <style>
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    body{margin:0;min-height:100vh;font-family:Arial,"Noto Sans JP",sans-serif;color:#202124;background:#f5f7fb}
    main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:100%;max-width:680px;padding:36px;background:#fff;border:1px solid #e2e6ee;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.06);text-align:center}
    h1{font-size:30px;margin:0 0 20px}
    p{line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}
    .status{font-size:13px;color:#6b7280;margin-top:24px}
    button{margin-top:16px;padding:11px 20px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;color:#202124;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}
    footer{margin-top:28px;color:#777;font-size:11px;line-height:1.7}
    @media(max-width:480px){.card{padding:26px 20px}h1{font-size:24px}}
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1 id="title">システムメンテナンス中</h1>
      <p id="message">ログイン状態を確認しています。</p>
      <p id="status" class="status">確認中...</p>
      <button id="reloadButton" type="button">再確認</button>
      <button id="logoutButton" type="button" hidden>ログアウト</button>
      <footer>© 2026 定期テスト対策プリント運営事務局. All Rights Reserved.</footer>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="./assets/js/firebase.js"></script>

  <script type="module">
    import {
      auth, db, persistenceReady, onAuthStateChanged,
      signOut, doc, getDoc, onSnapshot
    } from "./assets/js/firebase-module.js";

    const title = document.getElementById("title");
    const message = document.getElementById("message");
    const status = document.getElementById("status");
    const logoutButton = document.getElementById("logoutButton");

    const settingsRef = doc(db, "settings", "system");

    let currentUser = null;
    let authReady = false;
    let redirecting = false;
    let settingsUnsubscribe = null;
    let authUnsubscribe = null;

    function setStatus(text) {
      status.textContent = text;
    }

    function showSettings(settings) {
      title.textContent =
        settings.maintenanceTitle || "システムメンテナンス中";

      message.textContent =
        settings.maintenanceMessage ||
        settings.message ||
        "現在、メンテナンスを実施しています。しばらくお待ちください。";

      setStatus("メンテナンス終了後、自動的に学習画面へ戻ります。");
    }

    function go(url) {
      if (redirecting) return;
      redirecting = true;
      location.replace(url);
    }

    async function checkUser(user) {
      if (!user) {
        go("./login.html");
        return;
      }

      currentUser = user;
      logoutButton.hidden = false;

      try {
        const profileSnapshot = await getDoc(
          doc(db, "users", user.uid)
        );

        if (!profileSnapshot.exists()) {
          await signOut(auth);
          go("./login.html");
          return;
        }

        const profile = profileSnapshot.data();

        if (profile.status !== "active") {
          await signOut(auth);
          go("./login.html");
          return;
        }

        if (profile.role === "admin") {
          go("./admin/index.html");
          return;
        }

        if (profile.role !== "student") {
          setStatus("アカウントの権限が正しくありません。管理者にお問い合わせください。");
          return;
        }

        const settingsSnapshot = await getDoc(settingsRef);

        if (!settingsSnapshot.exists()) {
          throw new Error("Firestoreの settings/system がありません。");
        }

        const settings = settingsSnapshot.data();

        if (settings.maintenance !== true) {
          go("./student/index.html");
          return;
        }

        showSettings(settings);
      } catch (error) {
        console.error("メンテナンス画面の確認エラー:", error);
        setStatus(
          "設定を確認できませんでした。\n" +
          (error.code || "error") + ": " +
          (error.message || String(error))
        );
      }
    }

    async function initialize() {
      try {
        await persistenceReady;

        authUnsubscribe = onAuthStateChanged(
          auth,
          user => {
            authReady = true;
            checkUser(user);
          },
          error => {
            console.error("認証状態の確認エラー:", error);
            setStatus("ログイン状態を確認できません。再確認してください。");
          }
        );

        settingsUnsubscribe = onSnapshot(
          settingsRef,
          snapshot => {
            if (!snapshot.exists()) {
              setStatus("Firestoreの settings/system が見つかりません。");
              return;
            }

            const settings = snapshot.data() || {};

            if (!authReady || redirecting) return;

            if (settings.maintenance !== true) {
              if (currentUser) {
                go("./student/index.html");
              } else {
                go("./login.html");
              }
              return;
            }

            showSettings(settings);
          },
          error => {
            console.error("メンテナンス設定監視エラー:", error);
            setStatus("設定を取得できません。通信状態を確認してください。");
          }
        );
      } catch (error) {
        console.error("初期化エラー:", error);
        setStatus(
          "画面を初期化できませんでした。\n" +
          (error.code || "error") + ": " +
          (error.message || String(error))
        );
      }
    }

    document.getElementById("reloadButton").addEventListener(
      "click",
      () => location.reload()
    );

    logoutButton.addEventListener("click", async () => {
      logoutButton.disabled = true;

      try {
        await signOut(auth);
        go("./login.html");
      } catch (error) {
        logoutButton.disabled = false;
        setStatus("ログアウトに失敗しました: " + (error.message || String(error)));
      }
    });

    window.addEventListener("pagehide", () => {
      settingsUnsubscribe?.();
      authUnsubscribe?.();
    });

    initialize();
  </script>
</body>
</html>
